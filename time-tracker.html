<style id="app-style">
:root{
  --bg:#eaeef2;
  --surface:#ffffff;
  --surface-2:#f3f6f9;
  --ink:#17202b;
  --muted:#59636f;
  --faint:#93a0ac;
  --line:#dde3ea;
  --line-strong:#cfd7e0;
  --accent:#4c5fd5;
  --accent-ink:#ffffff;
  --accent-soft:#e9ebfb;
  --good:#2f9e44;
  --good-soft:#e6f4ea;
  --warn:#d98207;
  --warn-soft:#fbeed8;
  --bad:#dc4a4f;
  --bad-soft:#fbe7e8;
  --shadow:0 1px 2px rgba(23,32,43,.05),0 8px 28px -18px rgba(23,32,43,.28);
  --radius:15px;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme:dark){
    --bg:#0e1319;
    --surface:#161d26;
    --surface-2:#1e2732;
    --ink:#e8edf3;
    --muted:#9aa6b3;
    --faint:#69747f;
    --line:#28313d;
    --line-strong:#333f4d;
    --accent:#8091ff;
    --accent-ink:#0e1319;
    --accent-soft:#232a4a;
    --good:#54c775;
    --good-soft:#182a1f;
    --warn:#e7a53a;
    --warn-soft:#2e2515;
    --bad:#ff6f74;
    --bad-soft:#301a1c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1319;
  --surface:#161d26;
  --surface-2:#1e2732;
  --ink:#e8edf3;
  --muted:#9aa6b3;
  --faint:#69747f;
  --line:#28313d;
  --line-strong:#333f4d;
  --accent:#8091ff;
  --accent-ink:#0e1319;
  --accent-soft:#232a4a;
  --good:#54c775;
  --good-soft:#182a1f;
  --warn:#e7a53a;
  --warn-soft:#2e2515;
  --bad:#ff6f74;
  --bad-soft:#301a1c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
#root,.wrap{max-width:780px;margin:0 auto;padding:20px 18px 64px;}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:600;text-wrap:balance;letter-spacing:-.01em}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 22px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand svg{flex:none;color:var(--accent)}
.brand h1{font-size:clamp(20px,5.4vw,26px);line-height:1.05}
.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.chip-sync{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  font-size:12.5px;font-weight:500;padding:7px 11px;border-radius:999px;line-height:1}
.chip-sync .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.chip-sync.is-sync .dot{background:var(--good)}
.chip-sync.is-local .dot{background:var(--warn)}
.chip-sync.is-error .dot{background:var(--bad)}
.chip-sync.is-check .dot{background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);font-size:16px;line-height:1;transition:background .15s,color .15s,border-color .15s}
.icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.icon-btn.danger:hover{color:var(--bad);border-color:var(--bad)}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn[data-arm]{position:relative}
.icon-btn.armed{z-index:2;background:var(--bad);border-color:var(--bad);color:#fff}
.icon-btn.armed:hover{color:#fff;border-color:var(--bad)}
.icon-btn.armed::after{content:"Delete?";position:absolute;top:-1px;right:-1px;bottom:-1px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;min-width:83px;padding:0 12px;
  border-radius:10px;background:var(--bad);color:#fff;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 4px 14px -4px rgba(0,0,0,.45)}
.tr-actions:has(.icon-btn.armed)>:not(.armed){visibility:hidden}   /* armed row: just "Delete?", same layout */

/* cards + sections */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.sec{margin-top:26px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 12px}
.sec-head h2{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

/* NOW card */
.now{padding:20px}
.now-idle .now-idle-label{font-family:var(--font-display);font-size:19px;margin-bottom:14px}
.quick{display:flex;flex-wrap:wrap;gap:9px}
.field{flex:1 1 100%;min-width:0;padding:13px 14px;border:1px solid var(--line-strong);border-radius:11px;background:var(--surface-2);
  color:var(--ink);font-family:inherit;font-size:16px;transition:border-color .15s,box-shadow .15s}
.field::placeholder{color:var(--faint)}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field-cat{flex:1 1 46%}
.field-est{flex:1 1 30%}
.quick .btn-primary{flex:1 1 46%}
.hint{margin:12px 2px 0;color:var(--muted);font-size:13.5px;line-height:1.5}
.recents{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
.recents-lbl{font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-right:1px}
.rchip{display:inline-flex;align-items:stretch;max-width:100%;border:1px solid var(--line-strong);background:var(--surface-2);
  border-radius:999px;transition:border-color .15s,background .15s}
.rchip:hover{border-color:var(--accent)}
.rchip.is-pinned{border-color:var(--accent);background:var(--accent-soft)}
.rchip-go{display:inline-flex;align-items:center;gap:7px;min-width:0;border:none;background:transparent;color:var(--ink);
  font-family:inherit;font-size:13.5px;font-weight:500;line-height:1;padding:0 3px 0 13px;min-height:40px;border-radius:999px 0 0 999px}
.rchip.is-pinned .rchip-go{color:var(--accent)}
.rchip-go .cdot{width:8px;height:8px;border-radius:50%;flex:none}
.rchip-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rchip-pin{display:inline-flex;align-items:center;border:none;background:transparent;color:var(--faint);font-size:14px;line-height:1;
  padding:0 11px 0 5px;min-height:40px;border-radius:0 999px 999px 0}
.rchip-pin:hover{color:var(--accent)}
.rchip.is-pinned .rchip-pin{color:var(--accent)}
.now-pin{margin-left:auto;flex:none;border:1px solid var(--line-strong);background:transparent;color:var(--faint);
  font-family:inherit;font-size:12px;font-weight:600;line-height:1;padding:6px 11px;border-radius:999px}
.now-pin:hover{color:var(--accent);border-color:var(--accent)}
.now-pin.is-on{color:var(--accent);border-color:transparent;background:var(--accent-soft)}
.icon-btn.pin.is-on{color:var(--accent);border-color:var(--accent)}
.now-swipe-hint{margin-top:12px;text-align:center;font-size:12px;color:var(--faint)}
.now-active{touch-action:pan-y;transition:transform .22s cubic-bezier(.2,.7,.3,1)}
.now-active.swiping{transition:none}
.now-active.swipe-armed{border-color:var(--bad)}

.now-active{position:relative;overflow:hidden;border-color:var(--accent);background:
  linear-gradient(180deg,var(--accent-soft),transparent 62%),var(--surface)}
.now-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.live-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent)}
.live-pill .bl{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.5s ease-in-out infinite}
.now-name{font-family:var(--font-display);font-size:clamp(21px,5.6vw,27px);line-height:1.15;margin:2px 0 4px}
.now-clock{font-family:var(--font-mono);font-size:clamp(44px,15vw,68px);font-weight:500;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;margin:6px 0 4px}
.now-est{color:var(--muted);font-size:14px;margin-bottom:16px}
.now-est b{color:var(--ink);font-weight:600}
.diff{font-weight:600}
.diff.is-under{color:var(--good)}
.diff.is-over{color:var(--bad)}
.now-btns{display:flex;gap:10px;margin-top:6px}
/* paused: the task waits on the Now card with Continue; what you do meanwhile is the in-between */
.now-paused{position:relative;overflow:hidden;border-color:var(--warn);background:linear-gradient(180deg,var(--warn-soft),transparent 62%),var(--surface)}
.now-paused .live-pill{color:var(--warn)}
.now-paused .now-clock{color:var(--muted)}
.now-pausefor b{color:var(--warn);font-weight:600}
.pause-strip{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:11px;background:var(--surface)}
.pause-strip-t{flex:1;min-width:0;font-size:13px;line-height:1.4;color:var(--muted)}
.pause-strip-t b{color:var(--ink);font-weight:600}
.pause-strip .btn{flex:none}

/* buttons */
.btn{border:1px solid transparent;border-radius:11px;padding:12px 18px;font-size:15px;font-weight:600;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;transition:transform .06s,filter .15s,background .15s}
.btn:active{transform:translateY(1px)}
.btn svg{flex:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-stop{background:var(--bad);color:#fff}
.btn-stop:hover{filter:brightness(1.05)}
.btn-lg{flex:1;min-height:54px;font-size:16px}
.btn-ghost{background:transparent;border-color:var(--line-strong);color:var(--muted)}
.btn-ghost:hover{color:var(--ink);border-color:var(--faint)}
.btn-sm{min-height:38px;padding:8px 14px;font-size:13.5px;border-radius:9px}

/* planned form */
.planned-form{display:flex;flex-wrap:wrap;gap:8px;padding:14px;margin-bottom:12px;background:var(--surface-2);
  border:1px dashed var(--line-strong);border-radius:13px}
.planned-form .field{background:var(--surface)}
.planned-form .btn{flex:1 1 100%}
.capture-form{display:flex;gap:9px;padding:13px;margin-bottom:12px;align-items:center}
.capture-form .field{flex:1}
.capture-form .btn{flex:none}
@media (max-width:460px){.capture-form{flex-wrap:wrap}.capture-form .btn{flex:1 1 100%}}

/* goals */
.goal-list{display:flex;flex-direction:column;gap:12px}
.goal-card{padding:16px 16px 14px}
.goal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.goal-name{font-family:var(--font-display);font-size:18px;font-weight:600;line-height:1.2}
.goal-meta{margin-top:6px}
.goal-stat{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:13px 0 2px;font-size:13px;color:var(--muted)}
.goal-stat b{color:var(--ink);font-weight:600;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:block}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.actions-head{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;margin:15px 0 2px}
.action-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.action-row:first-child{border-top:0}
.action-main{flex:1;min-width:0}
.action-name{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.action-sub{font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.action-empty{font-size:13px;color:var(--muted);padding:9px 0 2px}
.action-add{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.action-add .field{flex:1 1 140px}
.action-add .btn{flex:1 1 100%}
.act-add-btn{margin-top:11px}
.goal-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.step{margin-top:12px;padding:12px 13px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.step-head{display:flex;align-items:center;gap:10px}
.step-check{flex:none;width:24px;height:24px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--accent-ink);font-size:14px;line-height:1;display:inline-grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.step-check.on{background:var(--accent);border-color:var(--accent)}
.step-name{flex:1;min-width:0;font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.25}
.step-name.is-done{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.step-actions{margin-top:2px}
.step .action-row{padding:8px 0}
.ai-loading{margin-top:10px;display:flex;align-items:center;gap:8px;color:var(--accent);font-size:13.5px;font-weight:600}
.ai-loading svg{animation:pulse 1.2s ease-in-out infinite}
.proposal{margin-top:12px;padding:14px;background:var(--surface-2);border:1px solid var(--accent);border-radius:12px}
.prop-title{display:flex;align-items:center;gap:7px;color:var(--accent);font-size:12.5px;font-weight:600;margin-bottom:11px;line-height:1.4}
.prop-step{margin-bottom:11px}
.prop-step-h{display:flex;align-items:flex-start;gap:9px;font-size:14.5px;line-height:1.35}
.prop-sub{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;color:var(--muted);margin:5px 0 0 22px;line-height:1.35}
.prop-ladder{margin-top:4px;border-top:1px solid var(--line);padding-top:11px}
.prop-rung{display:flex;gap:9px;font-size:13px;color:var(--muted);margin:5px 0 0 22px;line-height:1.35}
.prop-rung-n{color:var(--accent);font-weight:600;font-family:var(--font-mono);flex:none}
.proposal input[type=checkbox]{width:16px;height:16px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.prop-btns{display:flex;gap:8px;margin-top:12px}
.proj-repo{display:inline-block;margin-top:5px;font-family:var(--font-mono);font-size:12.5px;color:var(--accent);text-decoration:none;word-break:break-all}
.proj-repo:hover{text-decoration:underline}
.proj-upd{font-size:11.5px;color:var(--faint);margin-top:10px}
.proj-body{margin:2px 0 10px}
.proj-row{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.proj-row:first-child{border-top:0}
.proj-k{flex:none;width:64px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;padding-top:3px}
.proj-v{flex:1;min-width:0;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.proj-edit{display:flex;flex-direction:column;gap:7px;margin:4px 0 2px}
.dbtn.on-good{background:var(--good);border-color:var(--good);color:#fff}
.dbtn.on-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.proj-chat{margin-top:13px;padding:12px 13px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.adv-sec{margin-top:11px}
.adv-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;margin-bottom:4px}
.adv-item{display:flex;align-items:flex-start;gap:9px;padding:5px 0;font-size:13.5px;line-height:1.45}
.adv-dot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:6px}
.adv-next{background:var(--accent)}
.adv-missing{background:var(--warn)}
.adv-research{background:var(--good)}
.adv-risks{background:var(--bad)}
.adv-txt{flex:1;min-width:0}
.adv-cap{flex:none;align-self:center;border:1px solid var(--line-strong);background:transparent;color:var(--muted);font-family:inherit;font-size:11px;font-weight:600;line-height:1;padding:5px 9px;border-radius:99px;white-space:nowrap;cursor:pointer;transition:color .15s,border-color .15s}
.adv-cap:hover{color:var(--accent);border-color:var(--accent)}
.adv-when{font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint)}
.adv-hint{font-size:11.5px;color:var(--faint);margin-top:9px;font-style:italic}
/* collapsed project row (the "which project pulls me today?" board) */
.proj-mini{padding:13px 15px;cursor:pointer;transition:border-color .15s,background .15s}
.proj-mini:hover{border-color:var(--line-strong)}
.proj-mini-head{display:flex;align-items:center;gap:10px;min-width:0}
.proj-mini-dot{width:9px;height:9px;border-radius:50%;flex:none}
.proj-mini-name{flex:1;min-width:0;font-family:var(--font-display);font-size:16px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-mini-chev{flex:none;color:var(--faint);display:inline-flex;align-items:center}
.proj-mini-chev svg{transition:transform .15s}
.proj-mini-chev.open svg{transform:rotate(90deg)}
.proj-mini-next{font-size:13px;color:var(--muted);line-height:1.45;margin:6px 0 0 19px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.proj-mini-next.is-empty{color:var(--faint);font-style:italic}
.goal-name.proj-open-name{display:flex;align-items:center;gap:8px;cursor:pointer}
.goal-name.proj-open-name .proj-mini-chev{color:var(--faint)}
.proj-chat-h{display:flex;align-items:center;gap:7px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;margin-bottom:10px}
.pc-log{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.pc-msg{font-size:13.5px;line-height:1.5;padding:9px 11px;border-radius:11px;white-space:pre-wrap;word-break:break-word}
.pc-u{background:var(--accent-soft);color:var(--ink);align-self:flex-end;border-bottom-right-radius:3px;max-width:88%}
.pc-a{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:3px;max-width:92%}
.pc-form{display:flex;gap:8px}
.pc-form .field{flex:1}
.pc-form .btn{flex:none}
@media (max-width:460px){.pc-form{flex-wrap:wrap}.pc-form .btn{flex:1 1 100%}}
.proj-gh{margin-top:13px;padding:12px 13px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.proj-log{margin-top:13px;padding:12px 13px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.plog-list{margin-top:2px}
.plog-row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.45}
.plog-list .plog-row:first-child{border-top:0}
.plog-date{flex:none;font-family:var(--font-mono);font-size:11.5px;color:var(--faint);padding-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.plog-txt{flex:1;min-width:0;word-break:break-word}
.icon-btn.plog-del{width:26px;height:26px;flex:none;font-size:13px}
.plog-form{display:flex;gap:8px;margin-top:11px}
.plog-form .field{flex:1}
.plog-form .btn{flex:none}
@media (max-width:460px){.plog-form{flex-wrap:wrap}.plog-form .btn{flex:1 1 100%}}
.goal-form{display:flex;flex-wrap:wrap;gap:8px;padding:14px;margin-bottom:12px;background:var(--surface-2);
  border:1px dashed var(--line-strong);border-radius:13px}
.goal-form .field{flex:1 1 100%;background:var(--surface)}
.goal-form .field-est{flex:1 1 40%}
.goal-form .btn{flex:1 1 100%}
.chip-goal{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.gb-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.gb-row:first-child{border-top:0}
.gb-name{font-size:14px;display:flex;align-items:center;gap:9px;min-width:0}
.gb-name .cdot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.gb-name.is-none .cdot{background:var(--faint)}
.gb-nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb-time{font-family:var(--font-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.goal-note{margin-top:13px;padding:12px 13px;background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;font-size:13.5px;line-height:1.55;color:var(--muted)}
.goal-note .note-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;margin-bottom:6px}
.goal-note .note-body{white-space:pre-wrap;word-break:break-word}
.note-edit{margin-top:12px}
.note-area{width:100%;min-height:104px;resize:vertical;line-height:1.5;font-size:14px;background:var(--surface-2);font-family:inherit}
.note-btns{display:flex;gap:8px;margin-top:8px}
.note-add-btn{margin-top:12px}
/* deep/shallow + streak + cue + identity */
.depth-tog{display:flex;align-items:center;gap:7px;margin:2px 0 16px;flex-wrap:wrap}
.depth-lbl{font-size:12px;color:var(--muted);margin-right:2px}
.dbtn{border:1px solid var(--line-strong);background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;
  padding:7px 14px;border-radius:99px;line-height:1;font-family:inherit}
.dbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dbtn.on-sh{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.depth-pill{border:1px dashed var(--line-strong);background:transparent;color:var(--faint);font-family:var(--font-sans);
  font-size:11px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:99px;line-height:1.3}
.depth-pill.deep{border-style:solid;border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.depth-pill.shallow{border-style:solid;border-color:var(--line);background:var(--surface-2);color:var(--muted)}
.cue-btn{border:none;background:transparent;color:var(--accent);font-size:12px;font-weight:600;padding:0;font-family:inherit;cursor:pointer}
.cue-btn.tiny{font-size:11px;margin-left:6px;color:var(--faint)}
.cue-edit,.id-edit{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.cue-edit .field,.id-edit .field{flex:1 1 100%}
.streak{font-family:var(--font-sans);font-size:12.5px;font-weight:600;color:var(--accent)}
.streak.warn{color:var(--warn)}
.streak.bad{color:var(--bad)}
.goal-identity{font-family:var(--font-display);font-style:italic;font-size:15px;color:var(--muted);margin:1px 0 4px;cursor:pointer;line-height:1.35}
.id-add{margin:2px 0 4px}
.deep-card{padding:16px 16px 15px;margin-bottom:16px;border-color:var(--accent)}
.deep-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.deep-k{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.deep-week{font-size:12.5px;color:var(--muted);font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.deep-v{font-family:var(--font-mono);font-size:30px;font-weight:500;margin:8px 0 11px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.deep-bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.deep-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .35s}
.deep-sub{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.5}
/* progression / Bloom's ladder */
.prog-add{margin-top:12px}
.prog{margin-top:14px;padding:13px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.prog-head{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;margin-bottom:10px}
.rungs{display:flex;gap:4px;margin-bottom:11px}
.rung{flex:1;height:9px;border-radius:3px;background:var(--surface);border:1px solid var(--line)}
.rung.done{background:var(--accent);border-color:var(--accent);opacity:.5}
.rung.cur{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.prog-now{font-size:14px;margin-bottom:3px}
.prog-now b{font-family:var(--font-display);font-weight:600}
.prog-sub{font-size:12.5px;color:var(--muted);line-height:1.5}
.prog-up{color:var(--good);font-weight:600}
.prog-held{color:var(--warn);font-weight:600}
.rep-log{margin:12px 0 2px;display:flex;flex-direction:column;gap:7px}
.rep-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.rep-dot{width:8px;height:8px;border-radius:50%;flex:none}
.rep-dot.nailed{background:var(--good)}
.rep-dot.shaky{background:var(--warn)}
.rep-dot.lost{background:var(--bad)}
.rep-grade{color:var(--faint);font-size:12px;text-transform:capitalize}
.rep-date{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.rep-form{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.rep-form .field{width:100%}
.rep-lbl{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:-3px}
.rep-btns{display:flex;gap:8px;margin-top:3px}

/* valuation curriculum */
.curr{margin-top:14px;padding:13px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.curr-head{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.curr-count{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--faint);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.curr-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 13px}
.curr-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.curr-badge{font-size:11px;font-weight:600;padding:2px 10px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.curr-pos{font-size:12px;color:var(--muted)}
.curr-time{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.curr-stage{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600}
.curr-concept{font-family:var(--font-display);font-weight:600;font-size:15.5px;margin:2px 0 5px;line-height:1.3}
.curr-task{font-size:13.5px;color:var(--ink);line-height:1.55}
.curr-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.curr-tag{font-family:var(--font-mono);font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.curr-refs-btn{display:block;margin-top:9px;background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:500;cursor:pointer;padding:0}
.curr-refs{margin-top:8px;padding:9px 11px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--muted);line-height:1.5}
.curr-refs ul{margin:3px 0 0;padding-left:18px}
.curr-refs b{color:var(--ink)}
.curr-ex{margin-top:6px}
.curr-note{margin-top:7px;font-size:11.5px;color:var(--faint);font-style:italic}
.curr-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.curr-next{font-size:12px;color:var(--faint);margin-top:9px;padding-left:2px}
.curr-done-all{font-size:13.5px;color:var(--good);font-weight:500;line-height:1.5}

/* task rows */
.task-list{display:flex;flex-direction:column;gap:10px}
.task-row{display:flex;gap:14px;align-items:center;padding:15px 16px}
@media (max-width:460px){   /* phone: a long title gets the full width, its buttons drop to their own line */
  .task-row{flex-wrap:wrap;row-gap:12px}
  .task-row .tr-main{flex:1 1 auto}
  .task-row .tr-actions{margin-left:auto}
}
.tr-main{flex:1;min-width:0}
.tr-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--font-display);font-size:16.5px;font-weight:600}
.tr-sub{color:var(--muted);font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
.tr-actions{display:flex;align-items:center;gap:7px;flex:none}
.bar{height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);margin-top:9px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .35s}
.bar-fill.is-over{background:var(--bad)}
.is-done .tr-name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.mini-run{font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:99px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-sans);font-size:11.5px;font-weight:500;
  color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip .cdot{width:8px;height:8px;border-radius:50%;flex:none}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

/* review */
.review-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 14px}
.daynav{display:flex;align-items:center;gap:8px}
.day-label{font-family:var(--font-display);font-size:18px;font-weight:600;min-width:96px;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tile{padding:14px 14px 15px}
.tile .t-k{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.tile .t-v{font-family:var(--font-mono);font-size:23px;font-weight:500;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .t-sub{font-size:12px;color:var(--muted);margin-top:3px}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:9px;background:var(--surface-2);border:1px solid var(--line)}
.split i{display:block;height:100%}

.breakdown{padding:16px 16px 6px}
.bd-row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.bd-row:first-child{border-top:0}
.bd-label{display:flex;align-items:center;gap:9px;font-size:14px;min-width:0}
.bd-label .cdot{width:10px;height:10px;border-radius:50%;flex:none}
.bd-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-time{font-family:var(--font-mono);font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bd-track{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bd-fill{height:100%;border-radius:99px;transition:width .35s}

.timeline{padding:6px 16px 16px}
.tl-row{display:flex;gap:13px;padding:11px 0;border-top:1px solid var(--line)}
.tl-time{display:flex;flex-direction:column;gap:1px;font-family:var(--font-mono);font-size:12px;line-height:1.25;
  white-space:nowrap;padding-top:2px;font-variant-numeric:tabular-nums;flex:none;width:78px;color:var(--faint)}
.tl-time .tl-start{color:var(--muted)}
.tl-body{flex:1;min-width:0}
.tl-name{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-dur{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.tl-dur .is-over{color:var(--bad);font-weight:600}
.tl-dur .is-under{color:var(--good);font-weight:600}
.tl-row.tl-gap{padding:7px 0;border-top-style:dashed}
.tl-gap .tl-body{font-size:12.5px;line-height:1.4;color:var(--faint);font-style:italic}
.tl-gap.is-pause .tl-body{color:var(--warn);font-style:normal;font-weight:600}
.tl-gap svg,.tl-tag svg{width:10px;height:10px;margin-right:4px;vertical-align:-1px}
.tl-tag{font-family:var(--font-sans);font-size:11.5px;font-weight:600;color:var(--warn);white-space:nowrap}
.tl-tag.is-cont{color:var(--accent)}

.review-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding:0 2px}
.foot-note{color:var(--faint);font-size:12.5px;line-height:1.5;margin-top:30px;text-align:center;padding:0 8px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);
  font-size:13.5px;font-weight:500;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:460px){
  .tiles{grid-template-columns:1fr 1fr}
  .tile.tile-wide{grid-column:1/-1}
  .tl-time{width:70px}
  .field-cat,.quick .btn-primary{flex:1 1 100%}
}

/* ---- one-screen home + bottom tab nav ---- */
.view{animation:viewin .18s ease}
@keyframes viewin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.home{display:flex;flex-direction:column;gap:16px}
.home-next{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
.home-next-eye{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:600;margin-bottom:9px}
.home-next-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.home-next-label{flex:1 1 auto;min-width:0;font-family:var(--font-display);font-size:16.5px;font-weight:600;line-height:1.25}
.home-next-row .btn{flex:none}
.home-next-more{margin-top:11px;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;padding:0;cursor:pointer}
.home-next-more:hover{color:var(--accent)}
.home-glance{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:13px 15px;
  font-size:13.5px;color:var(--muted);font-family:inherit;cursor:pointer;text-align:left;transition:border-color .15s}
.home-glance:hover{border-color:var(--line-strong)}
.home-glance b{color:var(--ink);font-family:var(--font-mono);font-weight:600}
.home-glance-go{flex:none;color:var(--accent);font-weight:600;font-size:12.5px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;gap:2px;
  background:var(--surface);border-top:1px solid var(--line);
  padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 14px -10px rgba(0,0,0,.35)}
.tab{position:relative;flex:1 1 0;max-width:190px;display:flex;flex-direction:column;align-items:center;gap:4px;
  border:none;background:transparent;color:var(--faint);font-family:var(--font-sans);font-size:11px;font-weight:600;
  padding:6px 4px;border-radius:11px;line-height:1;transition:color .15s,background .15s}
.tab svg{width:22px;height:22px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);background:var(--accent-soft)}
.tab-live{position:absolute;top:5px;right:calc(50% - 17px);width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.5s ease-in-out infinite}
.tab-live.is-paused{background:var(--warn);animation:none}
/* collapsible goal sub-sections */
.gsec{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);overflow:hidden}
.gsec-head{display:flex;align-items:center;gap:9px;width:100%;border:none;background:transparent;
  font-family:inherit;text-align:left;padding:12px 13px;cursor:pointer;color:var(--ink);min-width:0}
.gsec-head:hover{background:var(--surface)}
.gsec-chev{flex:none;color:var(--faint);display:inline-flex;align-items:center}
.gsec-chev svg{transition:transform .15s}
.gsec-chev.open svg{transform:rotate(90deg)}
.gsec-title{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;flex:none}
.gsec-sum{flex:1;min-width:0;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.gsec-body{padding:0 13px 13px}
.gsec-body .curr,.gsec-body .prog{margin-top:0;border:none;background:transparent;padding:0}
.gsec-body .note-edit,.gsec-body .goal-note{margin-top:0}
.gsec-body .goal-note{border:none;background:transparent;padding:0;border-left:0}
/* guided goal shaper */
.gm-tabs{display:flex;gap:6px;margin-bottom:10px}
.gm-tab{flex:1;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;padding:10px 10px;border-radius:11px;line-height:1.2;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.gm-tab:hover{color:var(--ink);border-color:var(--faint)}
.gm-tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.shaper-lead{font-size:13px;color:var(--muted);line-height:1.5;flex:1 1 100%}
.lvl-row{display:flex;flex-wrap:wrap;align-items:center;gap:7px;flex:1 1 100%}
.lvl-lbl{font-size:12px;color:var(--muted);width:100%}
.lvl{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;padding:7px 13px;border-radius:99px;line-height:1;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.lvl:hover{color:var(--ink);border-color:var(--faint)}
.lvl.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.shape-panel .prop-title{flex:1 1 100%;margin-bottom:2px}
.shape-badge{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:8px}
.shape-badge.out{background:var(--good-soft);color:var(--good)}
.shape-why{font-size:12.5px;color:var(--muted);font-style:italic;line-height:1.5;flex:1 1 100%;margin-bottom:2px}
.shape-woop{flex:1 1 100%;margin-top:4px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--ink);line-height:1.5}
.shape-woop b{font-weight:600}
.shape-woop-note{font-size:11px;color:var(--faint);margin-top:5px}
.shape-panel .rep-lbl{flex:1 1 100%}
/* Aswath's method — prominent and open by default on the investing goal */
.asw{margin-top:14px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;background:linear-gradient(180deg,var(--accent-soft),transparent 150px),var(--surface-2);overflow:hidden}
.asw-head{display:flex;align-items:baseline;gap:9px;width:100%;border:none;background:transparent;font-family:inherit;text-align:left;padding:13px 14px 11px;cursor:pointer;color:var(--ink);min-width:0}
.asw-title{flex:none;font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--accent)}
.asw-sub{flex:1;min-width:0;font-size:12px;color:var(--muted)}
.asw-chev{flex:none;align-self:center;color:var(--faint);display:inline-flex}
.asw-chev svg{transition:transform .15s}
.asw-chev.open svg{transform:rotate(90deg)}
.asw-chev.sm svg{width:12px;height:12px}
.asw-body{padding:0 14px 14px}
.asw-quote{margin:0 0 6px;font-family:var(--font-display);font-size:19px;line-height:1.3;color:var(--ink)}
.asw-quote cite{display:block;margin-top:4px;font-family:var(--font-sans);font-style:normal;font-size:11.5px;color:var(--faint)}
.asw-lead{margin:0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.asw-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;margin:14px 0 7px}
.asw-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.asw-step{display:grid;grid-template-columns:18px 50px 1fr auto;gap:0 8px;align-items:baseline;font-size:13px;line-height:1.45}
.asw-n{font-family:var(--font-mono);font-size:11px;color:var(--accent);font-weight:600}
.asw-sk{font-weight:600;color:var(--ink)}

  var ASWATH_TAKES=[{"tk":"INTC","when":"2024","v":"Undervalued","vc":"good","did":"bought","preSplit":false,"hook":null,"title":"Dealing with Decline: Intel, Walgreens and Starbucks put to the test!","url":"https://www.youtube.com/watch?v=g3VT_cclr4U","date":"2024","value":"~$23.70","price":"$18.89","story":"Intel as a company <b>in decline</b> (his D-44 route) &mdash; but decline is a <em>process</em>, not a death sentence. The bar to clear the price is low: even at just 3% revenue growth and a 25% margin (below what Intel earned last decade), he gets ~$23.70/share, above the ~$18.89 price. &ldquo;I&rsquo;m not asking for much.&rdquo;","action":"He <b>bought Intel at $18.89</b>: &ldquo;the odds are in my favour.&rdquo; A fallen tech superstar, but the core business is still healthy even as NVIDIA takes share.","note":"2024. A worked example of valuing <em>decline</em> honestly &mdash; a low, defensible bar that the price still failed to clear.","drivers":[["Revenue growth","~3%"],["Operating margin","~25% (below its own history)"]]},{"tk":"NVDA","when":"Jun 2023","v":"Overvalued","vc":"bad","did":"sold half","preSplit":true,"hook":null,"title":"AI Winners, Losers and Wannabes: Valuing AI's Boost to NVIDIA's Value!","url":"https://www.youtube.com/watch?v=2N0IDShsTyc","date":"June 2023","value":"~$240","price":"$410","story":"An <em>opportunistic growth company</em> that keeps getting ahead of the crowd into profitable niches &mdash; gaming, then crypto, now AI chips and automotive. His story had revenues rising roughly tenfold over the decade (~$26bn &rarr; ~$266bn), led by AI chips (its ~75% share fading toward 60% as rivals arrive) and auto chips (~3% &rarr; ~15%); premium operating margins edging up toward a 40% target; and its heavy up-front reinvestment finally paying off as efficiency climbs toward the industry norm.","action":"As a value investor he judged the stock overvalued (his simulation put only a ~5% chance it was worth the price) &mdash; so he <b>sol   /* ---------- swipe the running card sideways to stop ---------- */
  function initSwipeToStop(){
    var sw=null, THRESH=110, MAX=170;
    root.addEventListener("touchstart",function(e){
      if(e.touches.length!==1)return;
      var card=e.target.closest(".now-active"); if(!card)return;
      sw={card:card,x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0,active:false};
    },{passive:true});
    root.addEventListener("touchmove",function(e){
      if(!sw)return;
      var dx=e.touches[0].clientX-sw.x, dy=e.touches[0].clientY-sw.y;
      if(!sw.active){
        if(Math.abs(dx)<10)return;
        if(Math.abs(dy)>Math.abs(dx)){sw=null;return;}   // vertical scroll — let it be
        sw.active=true; sw.card.classList.add("swiping");
      }
      sw.dx=dx; e.preventDefault();
      var mag=Math.min(Math.abs(dx),MAX)*(dx<0?-1:1);
      sw.card.style.transform="translateX("+mag+"px)";
      sw.card.classList.toggle("swipe-armed",Math.abs(dx)>=THRESH);
    },{passive:false});
    function end(){
      if(!sw)return;
      var card=sw.card, fire=sw.active&&Math.abs(sw.dx)>=THRESH; sw=null;
      card.classList.remove("swiping"); card.style.transform="";
      card.classList.remove("swipe-armed");
      if(fire)stopTask();
    }
    root.addEventListener("touchend",end);
    root.addEventListener("touchcancel",end);
  }

  /* ---------- export ---------- */
  function exportCsv(){
    var rows=[["task","category","planned","estimate_min","date","start","end","duration_min"]];
    state.tasks.forEach(function(t){(t.sessions||[]).forEach(function(se){if(se.end==null)return;rows.push([t.name,t.category||"",t.planned?"yes":"no",t.estimateMin||"",dayKey(se.start),new Date(se.start).toLocaleTimeString(),new Date(se.end).toLocaleTimeString(),Math.round((se.end-se.start)/60000)]);});});
    if(rows.length<2){toast("No completed sessions yet");return;}
    var csv=rows.map(function(r){return r.map(function(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",");}).join("\n");
    Promise.resolve(window.claude&&window.claude.use?window.claude.use("downloads"):null).then(function(dl){
      if(!dl){toast("Export isn't available here");return;}
      dl.save({filename:"time-log-"+dayKey(Date.now())+".csv",data:csv}).then(function(){toast("CSV saved");},function(err){if(err&&err.code==="declined")return;toast("Couldn't save the file");});
    },function(){toast("Export isn't available here");});
  }

      var base=+el.getAttribute("data-run-base")||0, start=+el.getAttribute("data-run-start");

      el.textContent=el.getAttribute("data-run-fmt")==="clock"?fmtClock(sec):fmtDur(sec);
    });
    var sb=document.getElementById("ses-bar"),st=state.activeId&&findTask(state.activeId);
    if(sb&&isLessonTask(st)&&ui.ses){var ssec=lessonSecToday(st),si=sesStageAt(ssec),mk=document.getElementById("ses-mark"),sg=document.getElementById("ses-sug");

  }

  /* ---------- home: the single "what now?" screen ---------- */
  function homeNext(){
    var pick=null,goals=state.goals||[],i,j,k;
    for(i=0;i<goals.length&&!pick;i++){
      var g=goals[i],c=valCurrFor(g);
      if(c){var plan=todayPlan(g),dn=currDone(g);for(var q=0;q<plan.length&&!pick;q++){if(dn[plan[q]])continue;var L=lessonById(plan[q]);pick={type:"lesson",gid:g.id,lid:L.id,goal:g.name,label:L.concept,rung:L.rung,when:(g.curr&&g.curr.when)||"",min:lessonLeftMin(g,L),tid:lessonTid(g.id,L.id),cont:lessonLoggedMin(g.id,L.id)>0};}}
    }
    if(!pick){
      var today=dayKey(Date.now());
      for(j=0;j<goals.length&&!pick;j++){
        var acts=goalActions(goals[j].id);
        for(k=0;k<acts.length;k++){
          var t=acts[k];if(t.done)continue;
          var doneToday=(t.sessions||[]).some(function(se){return dayKey(se.start)===today;});
          if(!doneToday){pick={type:"action",gid:goals[j].id,goal:goals[j].name,label:t.name,tid:t.id};break;}
        }
      }
    }
    if(!pick)return "";
    if(state.activeId===pick.tid)return "";               // it's the running hero already
    if(!state.activeId&&state.paused&&state.paused.id===pick.tid)return "";   // …or the paused card
    var start=pick.type==="lesson"
      ?'<button class="btn btn-primary btn-sm" data-action="cur-start" data-id="'+pick.gid+'" data-lid="'+pick.lid+'" type="button">'+(pick.cont?'Continue':'Start')+' · ~'+pick.min+'m</button>'
      :(pick.tid==="act_journal"?'<button class="btn btn-primary btn-sm" data-action="dec-open" data-id="'+pick.gid+'" type="button">Log a decision</button>'
        :'<button class="btn btn-primary btn-sm" data-action="start" data-id="'+pick.tid+'" type="button">Start</button>');
    var eye=pick.type==="lesson"?'Today’s '+DAILY_MIN+' min · '+esc(pick.rung)+(pick.when?' · '+esc(pick.when):''):esc(pick.goal);
    return '<div class="home-next">'+
      '<div class="home-next-eye">Next up · '+eye+'</div>'+
      '<div class="home-next-row"><div class="home-next-label">'+esc(pick.label)+'</div>'+start+'</div>'+
      '<button class="home-next-more" data-action="set-view" data-view="goals" type="button">Open Goals →</button>'+
    '</div>';
  }
  function homeGlance(){
    var now=Date.now(),key=dayKey(now),total=0,deep=0,sessions=0;
    state.tasks.forEach(function(t){(t.sessions||[]).forEach(function(se){
      if(dayKey(se.start)!==key)return;
      var end=se.end==null?now:se.end,dur=(end-se.start)/1000;

    return '<button class="home-glance" data-action="set-view" data-view="review" type="button">'+body+'<span class="home-glance-go">Review →</span></button>';

  function lastUsed(t){var m=t.createdAt||0;(t.sessions||[]).forEach(function(se){if(se.start>m)m=se.start;});return m;}
  function recentQuick(){
    var seen={},pins=[],rest=[];
    state.tasks.filter(function(t){
      if(t.done||t.daily)return false;                    // goal actions live in Goals; skip finished
      if(state.paused&&state.paused.id===t.id)return false; // paused: it has its own Continue
      if(t.pinned)return true;                             // anything pinned surfaces here
      return !t.planned&&!t.later&&(t.sessions||[]).length; // otherwise only recent ad-hoc
    })
      .sort(function(a,b){return lastUsed(b)-lastUsed(a);})
      .forEach(function(t){var k=(t.name||"").toLowerCase();if(!k||seen[k])return;seen[k]=1;(t.pinned?pins:rest).push(t);});
    return pins.concat(rest).slice(0,8);
  }

  /* ---------- valuation curriculum (laddered lessons) ---------- */
  function valCurrFor(g){return g&&VAL_CURRICULUM.goal_id===g.id?VAL_CURRICULUM:null;}
  function ladderNames(g){var p=g.progression;return (valCurrFor(g)&&p&&p.ladder.length===VAL_RUNGS.length)?VAL_RUNGS:p.ladder;}
  function ladderDescs(g){return ladderNames(g)===VAL_RUNGS?VAL_RUNG_DESC:BLOOM.map(function(x){return x.d;});}
  function isLessonTask(t){return !!t&&String(t.id).indexOf("lesson_")===0;}
  function lessonOfTask(t){var m=String(t&&t.id||"").match(/^lesson_(.+)_(L\d+)$/);if(!m)return null;var g=findGoal(m[1]),l=lessonById(m[2]);return (g&&l)?{g:g,l:l}:null;}
  function lessonCo(l){return l.co||l.call||"the company";}
  function lessonN(l){return "L"+(l.order<10?"0":"")+l.order;}
  function lessonRungIdx(l){var i=VAL_RUNGS.indexOf(l.rung);return i<0?0:i;}
  function currDone(g){return (g.curr&&g.curr.done)||{};}
  function currentLesson(g){
    var c=valCurrFor(g);if(!c)return null;var done=currDone(g);

  /* each lesson gets its own timer task, so time and history stay per lesson even when you pick out of order */
  function lessonById(lid){var ls=VAL_CURRICULUM.lessons;for(var i=0;i<ls.length;i++)if(ls[i].id===lid)return ls[i];return null;}
  function lessonTid(gid,lid){return "lesson_"+gid+"_"+lid;}
  function lessonLoggedMin(gid,lid){var t=findTask(lessonTid(gid,lid));return t?Math.floor(taskSec(t)/60):0;}
  function lessonLeftMin(g,l){if(currDone(g)[l.id])return 0;return Math.max(5,(l.estimateMin||15)-lessonLoggedMin(g.id,l.id));}
  /* today's ~30 min: today's own pick if you made one; otherwise yesterday's unfinished picks, topped up with the next lessons in line */
  function todayPlan(g){
    if(!valCurrFor(g))return [];
    var done=currDone(g),t=g.curr&&g.curr.today;
    if(t&&t.day===dayKey(Date.now()))return (t.ids||[]).filter(lessonById);
    return suggestPlan(g,((t&&t.ids)||[]).filter(function(id){return lessonById(id)&&!done[id];}));
  }
  function suggestPlan(g,ids){
    var ls=valCurrFor(g).lessons,done=currDone(g),total=0;ids=ids.slice();
    ids.forEach(function(id){total+=lessonLeftMin(g,lessonById(id));});
    for(var i=0;i<ls.length&&total<DAILY_MIN;i++){
      var l=ls[i];if(done[l.id]||ids.indexOf(l.id)>=0)continue;
      var m=lessonLeftMin(g,l);

  }
  function saveToday(gid,ids){commit(function(){var g=findGoal(gid);if(!g)return;g.curr=g.curr||{};g.curr.today={day:dayKey(Date.now()),ids:ids};});}
  function toggleToday(gid,lid){var g=findGoal(gid);if(!g||!lessonById(lid))return;var ids=todayPlan(g),i=ids.indexOf(lid);if(i>=0)ids.splice(i,1);else ids.push(lid);saveToday(gid,ids);}

  function startLesson(gid,lid){

  /* priming (Justin Sung): read tomorrow's question, guess, sleep on it — 3 minutes, gist only. The guess is waiting when the sitting starts. */

  /* ---------- your calls: a decision log that walks his 4 steps — story, value (before the price), gap, doubt ---------- */
  function decNum(v){   // "150", "$150", "23,70", "1.234,56", "1,234.56", "3,068" (thousands) — a comma + 1–2 digits is a decimal
    var s=String(v==null?"":v).replace(/[^0-9.,]/g,""),lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");
    if(lc>=0&&ld>=0)s=lc>ld?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");
    else if(lc>=0)s=/^\d*,\d{1,2}$/.test(s)?s.replace(",","."):s.replace(/,/g,"");
    var n=parseFloat(s);return isFinite(n)?n:NaN;
  }
  function fmtNum(n){return (+n).toLocaleString(undefined,{maximumFractionDigits:2});}
  function decGapOf(v,p){return (v>0&&p>0)?(v-p)/p:null;}
  function decVerdict(g){if(g==null)return null;return g>=EDGE?{k:"good",t:"Undervalued"}:(g<=-EDGE?{k:"bad",t:"Overvalued"}:{k:"mid",t:"About fair"});}
  function fmtGap(g){var p=Math.round(g*100);return (p>0?"+":(p<0?"−":""))+Math.abs(p)+"%";}
  function decAgainst(d){var g=decGapOf(+d.value,+d.price);return g!=null&&((d.act==="buy"&&g<=-EDGE)||(d.act==="sell"&&g>=EDGE));}
  function isDecisionTask(t){return !!t&&t.id==="act_journal"&&!!valCurrFor(findGoal(t.goalId));}
  function saveDecDraft(){try{if(ui.dec)localStorage.setItem(DEC_KEY,JSON.stringify(ui.dec));else localStorage.removeItem(DEC_KEY);}catch(e){}}
  function openDecision(gid){
    var g=findGoal(gid);if(!g||!valCurrFor(g))g=(state.goals||[]).filter(function(x){return valCurrFor(x);})[0];if(!g)return;
    if(!ui.dec||ui.dec.gid!==g.id)ui.dec={gid:g.id,step:1,t0:Date.now(),d:{tk:"",story:"",p3:"",value:"",basis:"",price:"",doubt:"",act:""}};   // an open draft resumes
    if(ui.view!=="goals"){ui.view="goals";try{localStorage.setItem(VIEW_KEY,"goals");}catch(e){}}
    saveDecDraft();render();
    var s=document.getElementById("dec-sec");if(s&&s.scrollIntoView)s.scrollIntoView({block:"start",behavior:"smooth"});
  }
  function decCapture(){   // pull the fields on screen into the draft, so a re-render never loses typing
    if(!ui.dec)return;var d=ui.dec.d;
    [["dec-tk","tk"],["dec-story","story"],["dec-value","value"],["dec-price","price"],["dec-doubt","doubt"]].forEach(function(f){var e=document.getElementById(f[0]);if(e)d[f[1]]=e.value;});
  }
  function decNext(){
    decCapture();var w=ui.dec;if(!w)return;var d=w.d;
    if(w.step===1){if(!d.tk.trim()||!d.story.trim()){toast("Name the company and tell its story first");return;}if(!d.p3){toast("How far does your story get? Pick one");return;}}
    if(w.step===2){if(!(decNum(d.value)>0)){toast("Put a value per share on it — a rough one is fine");return;}if(!d.basis){toast("How solid is that number? Pick one");return;}}
    if(w.step===3&&!(decNum(d.price)>0)){toast("Enter the price it trades at");return;}
    w.step=Math.min(4,w.step+1);saveDecDraft();render();
  }
  function decBack(){decCapture();if(!ui.dec)return;ui.dec.step=Math.max(1,ui.dec.step-1);saveDecDraft();render();}
  function decSave(){
    decCapture();var w=ui.dec;if(!w)return;var d=w.d;
    if(!d.doubt.trim()){toast("Name what would make the market right — that’s the check");return;}
    if(!d.act){toast("Pick what you’re doing");return;}
    var rec={id:uid(),at:Date.now(),tk:d.tk.trim().slice(0,40),story:d.story.trim().slice(0,800),p3:d.p3,value:decNum(d.value),basis:d.basis,price:decNum(d.price),doubt:d.doubt.trim().slice(0,600),act:d.act};
    var gid=w.gid,t0=w.t0;ui.dec=null;saveDecDraft();
    commit(function(){
      var g=findGoal(gid);if(!g)return;g.decisions=g.decisions||[];g.decisions.push(rec);
      var t=findTask("act_journal");                     // logging a call is doing today's "log my investment decisions"
      if(t&&t.goalId===gid&&state.activeId!==t.id){var end=Date.now(),start=Math.max(t0||end,end-30*60000);if(end-start<60000)start=end-60000;t.sessions=t.sessions||[];t.sessions.push({start:start,end:end});}
    });
    toast(decAgainst(rec)?"Logged — note it goes against your own value":"Call logged ✓");
  }
  function deleteDecision(gid,did){commit(function(){var g=findGoal(gid);if(g)g.decisions=(g.decisions||[]).filter(function(x){return x.id!==did;});});}
  function onInput(e){
    var id=e.target&&e.target.id;

    if(id==="dec-price"){var el=document.getElementById("dec-gap");if(el)el.innerHTML=decGapHtml(decNum(ui.dec.d.value),decNum(e.target.value));}

  function decGapHtml(v,p){
    var g=decGapOf(v,p);if(g==null)return '<span class="dec-muted">Enter the price to see your gap.</span>';
    var vd=decVerdict(g);
    return '<span class="asw-v asw-'+vd.k+'">'+vd.t+'</span> <b>'+fmtGap(g)+'</b> <span class="dec-muted">· your value '+fmtNum(v)+' vs price '+fmtNum(p)+(vd.k==="mid"?' · within '+Math.round(EDGE*100)+'%, no clear edge':'')+'</span>'+
      (Math.abs(g)>=0.5?'<div class="dec-warn">A gap this big usually means an input is off — he’d suspect the model first. (D-42)</div>':'');
  }
  function renderDecisions(g){
    if(!valCurrFor(g))return "";
    var list=(g.decisions||[]).slice().sort(function(a,b){return b.at-a.at;}),n=list.length,wiz=!!(ui.dec&&ui.dec.gid===g.id);
    var backed=list.filter(function(d){return d.basis!=="guess";}).length,against=list.filter(decAgainst).length;
    var stat=n?'<div class="dec-stat">'+n+' call'+(n===1?'':'s')+' · '+backed+' backed by a model'+(n-backed?' · '+(n-backed)+' on a rough guess':'')+(against?' · <span class="dec-bad">'+against+' against your own value</span>':'')+'</div>':'';
    var rows=n?'<div class="asw-calls">'+(ui.decAll?list:list.slice(0,3)).map(function(d){return decRow(g,d);}).join("")+'</div>'+

  function buildAdvicePrompt(p){

    if(healthLabel(p.health))L.push("Health: "+healthLabel(p.health));
    if(p.status)L.push("Current status: "+p.status);
    if(p.next)L.push("Their planned next step: "+p.next);
    if(p.blockers)L.push("Known blockers: "+p.blockers);
    if(p.gh){
      var g=p.gh;
      if(g.prs&&g.prs.length){L.push("Open pull requests ("+g.prs.length+"):");g.prs.forEach(function(pr){L.push("  #"+pr.n+" "+pr.title+(pr.draft?" [draft]":"")+" — "+ciLabel(pr.ci||"none"));});}
      else L.push("Open pull requests: none");
      if(g.commits&&g.commits.length){L.push("Recent commits (newest first):");g.commits.forEach(function(c){L.push("  "+c.sha+" "+c.msg+(c.date?(" ("+relDate(c.date)+")"):""));});}
      L.push("(GitHub last synced "+ago(g.syncedAt)+".)");
    } else {

    }

    L.push("Be honest about what you actually know: you have NOT seen the code — only the text above. Do not state inferences as if they were facts.");
    L.push('Return ONLY JSON of the form {"next":[{"t":"...","b":"grounded","w":"..."}],"missing":[...],"research":[...],"risks":[...]}. 2-4 items per list. For every item: "t" = one short, concrete sentence ("next" = do now to move it forward; "missing" = a gap such as tests, docs, error handling, an undecided design point; "research" = something specific to look into; "risks" = what could bite them). "b" = "grounded" ONLY if the item is based on specific evidence above (the status text, a named PR/commit, or the discussion); otherwise "guess" — a common pattern for this kind of project that you are inferring without specific evidence. "w" = a few words naming what it is based on (e.g. "from your status", "PR #2 failing CI", "common gap for engines like this"). If you were given no GitHub data and only a thin status, most items should honestly be "guess". Omit a list only if you genuinely have nothing real for it.');

  function normalizeAdvice(res){

        else {t=String(v||"").trim();}
        if(!t)return;
        b=(String(b||"").toLowerCase().indexOf("ground")>=0)?"grounded":"guess"; // default honest: unmarked = guess
        out.push({t:t.slice(0,240),b:b,w:w?w.slice(0,90):""});
      });
      return out;
    }
    var a={at:Date.now(),next:arr(res.next||res.do||res.do_next),missing:arr(res.missing||res.gaps),research:arr(res.research),risks:arr(res.risks||res.watch)};

  function buildGradePrompt(finding,diff,ref,source){
    var L=[];
    L.push("You are a skeptical senior engineer checking whether a code change actually resolves ONE specific finding. Be adversarial and specific: your job is to catch what is missing or wrong, not to praise. Ground every point in the diff below — if the diff does not show something, say you cannot tell rather than assuming it. Judge the CHANGE against the FINDING, never who wrote it. Do not be agreeable.");
    L.push("THE FINDING (what was supposed to be addressed):");
    L.push(finding);
    L.push("THE CHANGE"+(ref?(" ("+ref+")"):"")+(source==="github"?" [fetched from GitHub]":" [pasted by the user]")+":");
    L.push(diff);
    L.push("You cannot run anything, so never claim tests pass or that it works — instead give the concrete checks the USER should run to confirm (specific commands or behaviours). Prefer 'partial' or 'no' unless the diff clearly shows the finding resolved.");
    L.push('Return ONLY JSON: {"addresses":"yes|partial|no","covers":["what it genuinely does, grounded in the diff"],"gaps":["what it does NOT cover or leaves open"],"risks":["anything it might break or introduce"],"confirm":["a specific check the user runs to verify"],"summary":"one honest sentence"}. Omit a list only if truly empty.');
    return L.join("\n");
  }
  function normalizeVerdict(res){
    if(!res||typeof res!=="object")return null;
    function arr(x){var o=[];if(Array.isArray(x))x.slice(0,6).forEach(function(v){v=String((v&&(v.text||v.item))||v||"").trim();if(v)o.push(v.slice(0,240));});return o;}
    var a=String(res.addresses||res.verdict||"").toLowerCase();
    a=(a.indexOf("partial")>=0||a.indexOf("part")>=0)?"partial":(a.indexOf("yes")>=0?"yes":(a.indexOf("no")>=0?"no":"partial"));
    var v={addresses:a,covers:arr(res.covers||res.covered),gaps:arr(res.gaps||res.missing||res.open||res.not_covered),risks:arr(res.risks||res.watch),confirm:arr(res.confirm||res.checks||res.verify),summary:String(res.summary||"").trim().slice(0,240)};
    if(!(v.covers.length||v.gaps.length||v.risks.length||v.confirm.length||v.summary))return null;

  function renderReview(){

    '</div>';
    if(!entries.length){

        exp+
      '</section>';
    }
    var total=0,plannedSec=0,byCat={},runBase=0,runStart=null;
    entries.forEach(function(e){
      var end=e.se.end==null?now:e.se.end, dur=(end-e.se.start)/1000;
      total+=dur; if(e.t.planned)plannedSec+=dur;
      var k=e.t.category||"";byCat[k]=(byCat[k]||0)+dur;
      if(e.se.end==null){runStart=e.se.start;} else {runBase+=dur;}
    });
    var closedTotal=total-(runStart?(now-runStart)/1000:0);
    var unplannedSec=total-plannedSec;
    var pPct=total>0?(plannedSec/total*100):0;

    var totalCell=runStart?'<div class="t-v" data-run-base="'+closedTotal.toFixed(0)+'" data-run-start="'+runStart+'" data-run-fmt="dur">'+fmtDur(total)+'</div>':'<div class="t-v">'+fmtDur(total)+'</div>';
    var tiles='<div class="tiles">'+
      '<div class="card tile"><div class="t-k">Total tracked</div>'+totalCell+'<div class="t-sub">'+entries.length+' session'+(entries.length===1?"":"s")+'</div></div>'+
      '<div class="card tile"><div class="t-k">Planned</div><div class="t-v">'+fmtDur(plannedSec)+'</div><div class="t-sub">'+Math.round(pPct)+'% of your time</div></div>'+
      '<div class="card tile"><div class="t-k">Unplanned</div><div class="t-v">'+fmtDur(unplannedSec)+'</div><div class="t-sub">'+(100-Math.round(pPct))+'% of your time</div></div>'+
    '</div>';
    if(total>0)tiles+='<div class="split" title="Planned vs unplanned"><i style="width:'+pPct+'%;background:var(--accent)"></i><i style="width:'+(100-pPct)+'%;background:var(--faint)"></i></div>';

    // toward goals
    var byGoal={},noGoal=0;
    entries.forEach(function(e){var dur=((e.se.end==null?now:e.se.end)-e.se.start)/1000;if(e.t.goalId){byGoal[e.t.goalId]=(byGoal[e.t.goalId]||0)+dur;}else noGoal+=dur;});
    var gkeys=Object.keys(byGoal).sort(function(a,b){return byGoal[b]-byGoal[a];});
    var gb="";
    if(gkeys.length){
      var grows=gkeys.map(function(k){var sec=byGoal[k],w=total>0?sec/total*100:0;
        return '<div class="gb-row"><div class="gb-name"><span class="cdot"></span><span class="gb-nm">'+esc(goalName(k)||"Goal")+'</span></div><div class="gb-time">'+fmtDur(sec)+' · '+Math.round(w)+'%</div></div>';}).join("");
      if(noGoal>0.9)grows+='<div class="gb-row"><div class="gb-name is-none"><span class="cdot"></span><span class="gb-nm">Not tied to a goal</span></div><div class="gb-time">'+fmtDur(noGoal)+' · '+Math.round(noGoal/total*100)+'%</div></div>';
      gb='<div class="actions-head" style="margin:2px 2px 8px">Toward your goals</div><div class="card breakdown">'+grows+'</div>';
    }

    // deep work scoreboard
    var hasDeep=state.tasks.some(function(t){return t.depth==="deep";});
    var deepCard="";
    if(hasDeep){
      var deepTodaySec=0,deepRunStart=null,deepRunBase=0;
      entries.forEach(function(e){if(e.t.depth!=="deep")return;var end=e.se.end==null?now:e.se.end,dur=(end-e.se.start)/1000;deepTodaySec+=dur;if(e.se.end==null){deepRunStart=e.se.start;}else{deepRunBase+=dur;}});
      var deepWeekSec=0,wk7=startOfToday()-6*86400000;
      state.tasks.forEach(function(t){if(t.depth!=="deep")return;(t.sessions||[]).forEach(function(se){if(se.start>=wk7){var end=se.end==null?now:se.end;deepWeekSec+=(end-se.start)/1000;}});});
      var dpct=Math.min(deepTodaySec/(DEEP_TARGET_MIN*60),1)*100;
      var dv=deepRunStart?'<div class="deep-v" data-run-base="'+deepRunBase.toFixed(0)+'" data-run-start="'+deepRunStart+'" data-run-fmt="dur">'+fmtDur(deepTodaySec)+'</div>':'<div class="deep-v">'+fmtDur(deepTodaySec)+'</div>';
      deepCard='<div class="card deep-card"><div class="deep-top"><span class="deep-k">Deep work'+(isToday?" today":"")+'</span><span class="deep-week">'+fmtDur(deepWeekSec)+' this week</span></div>'+dv+
        '<div class="deep-bar"><div class="deep-fill" style="width:'+dpct.toFixed(0)+'%"></div></div>'+
        '<div class="deep-sub">Target '+fmtDur(DEEP_TARGET_MIN*60)+' focused'+(isToday?" today":"")+' · even pros rarely sustain more than ~4h of deep work a day.</div></div>';
    }

    // breakdown
    var cats=Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a];});
    var bd="";
    if(cats.length){
      bd='<div class="card breakdown">'+cats.map(function(k){
        var sec=byCat[k],w=total>0?sec/total*100:0,col=catColor(k);
        return '<div class="bd-row">'+
          '<div class="bd-label"><span class="cdot" style="background:'+col+'"></span><span class="bd-name">'+esc(k||"Uncategorized")+'</span></div>'+
          '<div class="bd-time">'+fmtDur(sec)+' · '+Math.round(w)+'%</div>'+
          '<div class="bd-track"><div class="bd-fill" style="width:'+w.toFixed(0)+'%;background:'+col+'"></div></div>'+
        '</div>';
      }).join("")+'</div>';
    }

    // timeline — with the in-between spelled out: gaps between stretches, pauses, and where you picked a task back up
    var tl="";
    if(entries.length){
      var GAP_MIN=120,prev=null,pzt=(isToday&&!state.activeId)?pausedTask():null;
      tl='<div class="card timeline">'+entries.map(function(e){
        var live=e.se.end==null, end=live?now:e.se.end, dur=(end-e.se.start)/1000;
        var gapRow="";
        if(prev&&prev.se.end!=null){
          var gap=(e.se.start-prev.se.end)/1000, pzGap=!!prev.se.pause&&prev.t.id===e.t.id;
          if(gap>=GAP_MIN)gapRow=tlGap(pzGap,pzGap?pauseSvg()+'Paused '+fmtDur(gap)+' · nothing else tracked':fmtDur(gap)+' not tracked');
        }
        prev=e;
        var cont=pausedGap(e.t,e.se);
        var tags=(e.se.pause?' · <span class="tl-tag">'+pauseSvg()+'paused</span>':'')+(cont!=null?' · <span class="tl-tag is-cont">'+playSvg()+'continued after '+fmtDur(cont)+'</span>':'');
        var extra="";
        if(e.t.planned&&e.t.estimateMin){var d=taskSec(e.t)-e.t.estimateMin*60;extra=' <span class="'+(d>0?"is-over":"is-under")+'">'+(d>0?"+"+fmtDur(d)+" vs est":fmtDur(-d)+" under")+'</span>';}
        var durCell=(live?'<span data-run-start="'+e.se.start+'" data-run-base="0" data-run-fmt="dur">'+fmtDur(dur)+'</span> · running':fmtDur(dur)+extra)+tags;
        return gapRow+'<div class="tl-row">'+
          '<div class="tl-time"><span class="tl-start">'+hhmm(e.se.start)+'</span><span>'+(live?"now":hhmm(end))+'</span></div>'+
          '<div class="tl-body"><div class="tl-name">'+esc(e.t.name)+chip(e.t.category)+'</div><div class="tl-dur">'+durCell+'</div></div>'+
        '</div>';
      }).join("")+
      (pzt?tlGap(true,pauseSvg()+esc(pzt.name)+' paused · '+pausedSince()+' so far',state.paused.at):'')+
      '</div>';
    } else {
      tl='<div class="card empty">Nothing tracked '+(isToday?"yet today":"on this day")+'. '+(isToday?"Start a timer above to begin.":"")+'</div>';
    }

    return '<section class="sec review">'+
      '<div class="review-head">'+
        '<div class="daynav">'+
          '<button class="icon-btn" data-action="prev-day" aria-label="Previous day">&#8249;</button>'+
          '<div class="day-label">'+esc(dayLabel(key))+'</div>'+
          '<button class="icon-btn" data-action="next-day" aria-label="Next day"'+(isToday?" disabled":"")+'>&#8250;</button>'+
        '</div>'+
        (isToday?'':'<button class="btn btn-ghost btn-sm" data-action="today" type="button">Jump to today</button>')+
      '</div>'+
      tiles+deepCard+gb+bd+tl+
      '<div class="review-foot"><span></span><button class="btn btn-ghost btn-sm" data-action="export" type="button">Export CSV</button></div>'+
    '</section>';
  }

  /* ---------- inline icons ---------- */
  function backSvg(){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>';}
  function chevronSvg(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>';}
  function goalIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="3.4"></circle></svg>';}
  function projIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="7" height="7" rx="1.6"></rect><rect x="13.5" y="4.5" width="7" height="7" rx="1.6"></rect><rect x="3.5" y="14.5" width="7" height="5" rx="1.6"></rect><rect x="13.5" y="14.5" width="7" height="5" rx="1.6"></rect></svg>';}
  function reviewIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16"></path><path d="M7 19v-6"></path><path d="M12 19V6"></path><path d="M17 19v-9"></path></svg>';}
  function handoffSvg(){return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h13"></path><path d="M13 6l6 6-6 6"></path></svg>';}
  function clockSvg(){return '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg>';}
  function playSvg(){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5.5v13a1 1 0 0 0 1.53.85l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 7 5.5Z"></path></svg>';}
  function sparkSvg(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.7 5.6L19 9l-5.3 1.4L12 16l-1.7-5.6L5 9l5.3-1.4L12 2z"></path></svg>';}
  function logSvg(){return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>';}
  function pauseSvg(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"></rect><rect x="14" y="5" width="4" height="14" rx="1.2"></rect></svg>';}
  function stopSvg(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>';}
})();
</script>
