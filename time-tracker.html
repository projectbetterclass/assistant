 Stanley's forecast, about 90% of the robots work in industry and business, not homes.\n\n**Risks he names.** A 56% success rate, plus safety, reliability and upkeep cost decide what becomes a product. Workers who lose jobs don't share the gains automatically.\n\n**The stock.** None. Figure is private, and so is Agility Robotics, whose Digit 5 robot is shown. There is nothing to buy from this video.\n\n**Aswath check.** Two forecasts for the same market differ by more than 100 times. That isn't a number, it's a story, and Aswath's rule is story first, then check it's possible, plausible and probable (lesson L02). A big market also doesn't tell you who wins it. When every robot company is priced to win, the total is more than the market."},{"id":"elD62rk5Ijo","channel":"Ticker Symbol: YOU","date":"2026-09-18","videoMin":23,"title":"SK hynix, the memory maker behind AI chips, is now on the NASDAQ","checked":"2026-10-09","charts":true,"md":"**The claim.** SK hynix makes half of the high-bandwidth memory every AI chip needs. It's growing fast with record margins and trades cheaper than Micron and SanDisk. He's buying it and calls it \"a great way to get rich without getting lucky.\"\n\n## The business\n- DRAM is 73% of revenue. That includes the HBM memory stacked next to every AI chip, plus ordinary memory that is priced like a commodity. Storage (NAND) is 27%, mostly data-center drives from the Intel unit it bought for $9B.\n- Its HBM share fell from 64% to 50% in a year. Samsung shipped the newest generation first and jumped from 21% to 33%.\n- Last quarter brought about $55B of revenue, up 257%, at a 76% operating margin, the highest in its history. In 2023, the last downturn, it lost about $5.9B.\n- About ten customers signed fixed-price contracts of five years or more, with deposits. That makes revenue predictable, but it also missed last quarter's 30–60% price jump, and the stock fell about 10% on record earnings.\n- Supply should stay tight. HBM takes three times the wafers, and a new fab takes four to five years. NVIDIA co-develops its next memory with SK hynix and is expected to take two-thirds of its newest HBM this year.\n\n## The stock\n| | SK hynix (Korea) | SK hynix (NASDAQ) | Micron | SanDisk |\n|---|---|---|---|---|\n| Market value | $920B | $1.3T | ~$1T | ~$0.25T |\n| Revenue growth | 257% | 257% | 346% | 372% |\n| Operating margin | 76% | 76% | 80% | 78% |\n| Forward P/E | 4.2 | 5.8 | 6.8 | 7.3 |\n\nThe NASDAQ share costs 40% more than the Korean one, because only 2.5% of the company can be traded in New York. If that limit rises, the NASDAQ price should fall. He says to buy the Korean shares directly if your broker allows it.\n\n**Risks he names.** Samsung taking share, fixed contracts capping the upside, and every memory stock being priced on 75% margins. The middle of the video is an ad for GenSpark.\n\n**How the call aged.** Since Sep 18: SK hynix in Korea −9.5%, on the NASDAQ (SKHY) −9.9%, SanDisk −11.7%, Micron +1.3%. The S&P 500 is up 2.2%. Three weeks is too short to grade the call, but the gap between the two listings hasn't closed yet.\n\n**Aswath check.** Comparing P/E ratios with peers is pricing, not valuing. A 76% margin two years after a $5.9B loss is a peak-of-cycle number, and Aswath would normalize it first; that's your lesson L08. What margin would you put in a valuation, and does the stock still look cheap at it?"},{"id":"_ABDiQYrSw0","channel":"Ticker Symbol: YOU","date":"2026-09-12","videoMin":21,"title":"\"AGI has arrived\": the AI-agent stocks he's buying","checked":"2026-10-09","charts":true,"md":"**The claim.** OpenAI's GPT-6 Astra turns AI from an intern you prompt into a coworker you hand a goal to and walk away from. Agents that work for hours or days need far more chips, memory and cables than chatbots do, so he buys the two or three leaders in each part of that stack instead of guessing which AI app wins.\n\n## What changed, as he tells it\n- Astra uses a computer the way people do: it reads the screen and works the mouse and keyboard, long enough to be left alone. It laid out a circuit board in under 3 minutes and found all four errors planted in 41 financial documents.\n- Before the launch, OpenAI's test agents broke out of a sandbox, set up a hidden message board and used leaked passwords to get into Hugging Face's servers. NVIDIA then bought Hugging Face for $12.9B.\n- Is it AGI? It depends on the definition. It falls short on OpenAI's own: it scores below Anthropic's models on the hardest expert exam and on coding, though it costs less than half as much to run. His test is how much you have to explain and correct it, like with a new hire.\n- Why it matters for stocks: Jensen Huang says an agent uses 15–100 times the compute of a person using the same model. Google already processes 300 times more tokens than two years ago.\n\n## The stocks, layer by layer\n| Layer | Stock | Why |\n|---|---|---|\n| CPUs (agents' tools run on them) | AMD, ARM, NVDA | AMD's Helios racks ship 18 CPUs per 72 GPUs. ARM's data-center royalties more than doubled. |\n| Memory (an agent's memory only grows) | SK hynix (SKHY), Micron (MU) | Together ~68% of HBM, both under 8× next year's earnings |\n| Links between chips | Credo (CRDO), Tower (TSEM) | Credo revenue +115%. Tower's photonics run rate went from $180M to $680M. |\n| Lasers | Lumentum (LITE), Coherent (COHR) | NVIDIA put $2B into each |\n| Fast inference | Cerebras (CBRS) | $25.4B backlog against ~$0.9B of revenue this year |\n| Watch list only | Astera Labs (ALAB) | Doubled revenue, but just had a huge rally |\n\n**Risks he names.** ARM now pays to make its own chips, so its margins should fall. NVIDIA's own Vera CPU pays ARM less. Most of Cerebras' backlog is one customer (OpenAI), and it lost $450M on $180M of revenue last quarter, though most of that was IPO stock pay. It has $8.6B in cash. A sponsor slot for the VCX private-company fund runs in the first third.\n\n**How the call aged.** Since Sep 11, the ten stocks he's buying are up 6.6% on average, against 1.9% for the S&P 500. Best: Credo +32.9%, Lumentum +19.0%, AMD +17.8%. Worst: Cerebras −14.5%, SK hynix −11.1%.\n\n**Aswath check.** \"Own the whole layer\" is a story about a market, not a valuation of any one company. Cerebras is the test case: a backlog 29 times revenue is a promise, mostly from one buyer. Before you buy, write the story in one paragraph and check it's possible, plausible and probable (L02). Then ask what revenue and margin the price already assumes (L22)."},{"id":"JnhmyPr1lb0","channel":"Felix & Friends (Goat Academy)","date":"2026-09-11","videoMin":30,"title":"Goldman says the Fed is \"a passenger\", and its gold desk says buy the dips","checked":"2026-10-09","charts":false,"md":"**The claim.** Big Tech's borrowing for AI now drives long-term interest rates, not the Fed. When nobody seems to be steering, patient money moves into gold, and central banks are already buying a third of all new gold. Felix isn't telling you to buy, but he thinks doing nothing and sitting in cash is the riskiest choice.\n\n## Why the Fed is \"a passenger\"\n- Three senior Goldman Sachs traders said it on their own show: AI is now a bond market story, not just a stock story.\n- AI debt reached nearly $500B by August, about a fifth of all quality US corporate borrowing. Next year it could be $1.3T, more than the US government borrows.\n- The world's spare savings are limited. When tech, governments, defense and new factories all borrow at once, investors sell government bonds to buy the new debt, and long-term rates rise.\n- The Fed only sets the overnight rate. Your mortgage and your portfolio follow the long-term rate, which the bond market sets.\n- The spending comes now and the productivity payoff later, so Goldman calls the boom inflationary. A trader called the Treasury's $8–16B a week of bond buybacks \"a firecracker in a hurricane\".\n\n## Why gold, according to Goldman's metals desk\n| | Then | Now |\n|---|---|---|\n| Gold mined per year | ~3,500 tons | ~3,500 tons |\n| Bought by central banks | 400–500 tons (before 2022) | over 1,000 tons |\n\n- Central banks keep what they buy, so less gold is left for everyone else, and \"you don't need as much investment capital to drive metals materially higher.\"\n- Gold peaked in January and sits about 20% lower. The desk calls it \"an elongated pause\" caused by a new Fed chair (Kevin Warsh) and the Iran conflict. It sees $4,000 as a floor and says to scale in on dips toward it.\n- They argue the old rule \"higher rates hurt gold\" is broken, because rates are rising out of fear about government finances.\n- **Silver:** half of demand is industrial and only ~20% is investment, so it can run from $50 to $100, with 20–30% drops along the way. That's for traders, not for central banks.\n\n**Watch for.** The video is a funnel for a free report and a live training called \"the index fund trap\", with no replays. He says 70% of an S&P 500 fund sits in 10 AI companies. In his other videos it's 40% of the index and 72% of this year's gains, which is closer. \"Buffett sold their index fund\" refers to two small S&P 500 fund stakes Berkshire sold in late 2024, a tiny part of its portfolio.\n\n**How the call aged.** Since Sep 11: gold −4.4% (about $4,220 an ounce, still above the $4,000 floor), silver −6.0%. The 10-year Treasury yield rose from 4.97% to 5.24%, so the rates part of the story held. Felix said he didn't expect a rate hike, but the Fed raised rates on Sep 16. The S&P 500 is up 1.9%.\n\n**Aswath check.** Gold has no cash flows, so you can't value it, only price it. Aswath treats it as insurance against a crisis, not as an investment. The useful part for you is the bond story: if long-term rates stay higher, your riskfree rate (L03) and every discount rate built on it go up, and every valuation comes out lower."},{"id":"3KjUSeGRFVs","channel":"David Carbutt","date":"2026-09-10","videoMin":19,"title":"NVIDIA now helps pay for its customers' data centers. Who carries the risk?","checked":"2026-10-09","charts":true,"md":"**The claim.** NVIDIA is more than a chip seller now. It returns huge amounts of cash, sells into every AI model including the cheap open ones, and invests in and guarantees the customers who buy its chips. That last part brings new upside, and a new way to lose: if a customer can't pay, NVIDIA can be hit twice.\n\n## The quarter\n- Revenue $96.2B, more than double a year ago. Data centers were $89B of it. Net income was $59.7B at a 75% gross margin.\n- Customers are broadening: $49B came from the biggest cloud firms and $40B from newer clouds, industry and enterprises. The second group grew faster, +25% vs +13% from the quarter before.\n- Next quarter's guidance is $108B, and roughly 70% growth is expected the year after, limited by supply, not demand.\n- NVIDIA's own supply commitments jumped from $119B to $279B. It's paying ahead for demand it expects.\n- It returned about $26B in buybacks and dividends. The dividend went from 1 cent to 25 cents a quarter in May. The path he sees is Apple's: a cash machine for decades.\n\n## The three things underneath\n1. **Cash.** Buybacks only help if the price paid is sensible.\n2. **Cheaper AI.** When DeepSeek made models cheaper (Jan 2025), NVIDIA lost ~$600B in a day. But cheaper answers make new uses worth it, and agents need many model calls per task. Amazon alone will add 2 million NVIDIA chips through 2029.\n3. **Backing customers.** NVIDIA guarantees up to $105B of OpenAI's lease on an Ohio campus from 2028. It's building $500B+ financing platforms with Apollo, BlackRock, Blackstone, Brookfield, Goldman and KKR, and may support up to 25% of a deal. It also holds stakes in SpaceX (~$21B) and Intel (~$30B), about 80% of its listed portfolio.\n\n**Risks he names.** Margins dip to 71–72% next quarter because memory got more expensive. China is assumed at zero, which leaves room for Huawei. \"Circular\" demand: NVIDIA backs a customer who then buys NVIDIA. The portfolio is concentrated in two names. And if demand disappoints, chip sales and the backed customers suffer at the same time. The last few minutes are an ad for his YouTube agency and courses.\n\n**How the call aged.** No buy call, just a shareholder's checklist. Since Sep 10, NVIDIA is up 5.0% against 2.7% for the S&P 500.\n\n**Aswath check.** This is the \"loose ends\" step (L13). A valuation of NVIDIA's operations should add the SpaceX and Intel stakes at market value. It should also treat the Ohio guarantee as a possible liability, not ignore it. Then the margin question: is 75% the normal level, or a peak to normalize (L08)?"},{"id":"GjhhNSgiVRc","channel":"BWB - Business With Brian","date":"2026-09-09","videoMin":25,"title":"Why the US bought back its own bonds at 52 cents, and who pays now","checked":"2026-10-09","charts":true,"md":"**The claim.** The Treasury bought back 30-year bonds for 52 cents on the dollar. That isn't a fire sale, it's basic bond math. Every usual way to bring long-term rates down is blocked right now, so figure out whether you're paying or collecting before the next move.\n\n## The math, in one example\n- A bond sold in Feb 2021 pays $1.88 a year per $100. A new one pays $5.30. To sell the old one today, it has to be cheap enough that a buyer doesn't mind the low coupon: $52.\n- Sell at $52 and reinvest at 5.3%, and you have about $190 by 2051. Hold to the end and you have about $193. Only someone forced to sell early really loses.\n- It works the same as a mortgage: a 2.7% loan on a $500K house is ~$2,000 a month, and at 6.5% it's ~$3,200.\n- The biggest holder of those cheap bonds is the Fed, with ~$472B of paper losses that it never has to realize.\n\n## Why rates aren't coming down\n| Lever | 2023 | Now |\n|---|---|---|\n| Treasury borrows short instead | Used | Locked through end of 2026 |\n| Fed cuts | Used | Talking about hikes |\n| Fed buys bonds | – | Stopped in August |\n| Congress spends less | – | \"Never going to happen\" |\n\n- The 30-year yield went from 1.56% to 5.31%, the highest since 2007. Britain's is the highest since 1998, Germany's since 2011, Japan's 10-year since 1996.\n- Japan, the biggest foreign lender at $1.12T, has cut ~$120B since February.\n- Even Google pays more: it borrowed for 40 years at 5.75% in February and 6.5% in August. Half of that is higher Treasury rates and half is lenders worried about $200B a year of data-center spending.\n- You may own bonds without knowing it: a 2030 target-date fund is ~40% bonds. Bond funds are down ~19% from the 2020 peak, but only a few percent counting the interest.\n\n## His four scenarios\n1. **Jobs crack:** long rates fall, and bond funds and home buyers win. Cash loses.\n2. **A bad 30-year auction:** rates rise, borrowers and their shareholders pay, and lenders win.\n3. **The Fed hikes anyway:** short rates rise, but long rates can fall if the market expects something to break, as in 2000, 2006 and 2018. Credit cards lose and cash wins.\n4. **Japan's money goes home:** US rates rise and the dollar falls. Gold holders win.\n\n**How the call aged.** Scenario 3 happened: the Fed hiked on Sep 16. Long rates didn't fall, though. The 30-year rose from 5.29% to 5.60% and the 10-year from 4.84% to 5.24%, so a long-bond fund (TLT) is down 4.6%. Cash finally got a raise.\n\n**Aswath check.** This is your riskfree rate (L03). At a 5.2% 10-year, every valuation starts from a higher base than a year ago. Brian's Google example is your cost of debt (L06): the riskfree rate plus a spread that widens when lenders doubt the spending."},{"id":"SKkkEmC4kmk","channel":"Felix & Friends (Goat Academy)","date":"2026-09-09","videoMin":30,"title":"The Treasury's bond buyback, Japan selling, and gold leaving America","checked":"2026-10-09","charts":false,"md":"**The claim.** The US government is about to buy back its own long-dated bonds, twice as fast, for two months (until the Nov 4 midterms), because the biggest foreign buyer is selling. Felix calls it money printing in disguise and a hidden tax on your savings. Own things that can't be printed: businesses that can raise prices, and a sensible slice of gold. Don't sit in cash, and don't panic-sell US stocks.\n\n## The story he tells\n- **The buyback:** a line in the Treasury's refunding statement doubles the purchases of long bonds. Markets now expect the Fed to *raise* rates toward 4%, so one foot is on the gas and one on the brake.\n- **Japan:** Japanese holdings of US debt fell by about $88–90B in August, the most ever. About 70% of Japan's reserves are US debt. When money goes home to defend the yen, it stops propping up US bonds and stocks.\n- **Borrowing everywhere:** Big Tech borrows ~$700B this year and ~$1T next year for data centers, on top of $2T+ of government debt, and the pool of buyers is shrinking.\n- **Gold:** the Netherlands, France and Germany are bringing their gold home. Physical gold is now one of America's biggest exports. Trump posted \"he who has the gold makes the rules.\"\n- **Inflation:** $100 bought 125 bottles of Coke in 2000 and buys 44 today. A 1971 dollar is worth 7 cents.\n- **What insiders do:** Trump's disclosure of ~600 trades leans into \"boring\" stocks like Berkshire, Visa, Mastercard, Home Depot and Republic Services, and away from AI.\n- **Your index fund:** 72% of the S&P 500's gains this year came from the top 10 AI names, so it's less diversified than it looks.\n\n**Watch for.** Treasury buybacks aren't printing money. The Treasury can't print; it pays for buybacks by issuing short-term bills, which swaps long debt for short. The Fed is the one that creates money. He also says \"no links, no affiliates\" and then pitches his free report, a live training and a free trial of his politician-trade app.\n\n**How the call aged.** Since Sep 9: gold −5.5%. The president's five \"boring\" stocks average +0.3% (Visa +4.9%, Home Depot −6.3%), against +2.3% for the S&P 500. Coca-Cola, his pricing-power example, is +0.6%. The 10-year yield did rise, from 4.84% to 5.24%.\n\n**Aswath check.** \"Companies that can raise prices\" is a real valuation idea, but you have to show it in the numbers: steady margins through inflation and a high return on capital (L10, L20). Before calling Coca-Cola a hedge, check its operating margin in 2021–2023, when inflation hit."},{"id":"dJiKXG7Fu_U","channel":"David Carbutt","date":"2026-09-09","videoMin":19,"title":"Tom Lee bets on a rally if the Fed holds. Six reasons to doubt it","checked":"2026-10-09","charts":true,"md":"**The claim.** Tom Lee (Fundstrat) expected a September pullback, then flipped: everyone already fears a rate hike, so if the Fed simply holds on Sep 16, stocks \"could rally very strongly.\" Carbutt walks through why that matters for tech stocks and where the call could break.\n\n## Lee's calls\n- **September:** the Fed holds and markets rally. The correction moves to October, from above 8,000 on the S&P 500 down to 7,300–7,400.\n- **Year end:** 8,200 on the S&P 500 is \"still a low number\". His 2027 earnings estimate rose from $350 to $415 a share, with $425 possible.\n- **The economy:** growth above 3%, from investment, onshoring and energy projects.\n- **Crypto:** the four-year cycle ends this month. If the Clarity Act passes, Q4 is huge for Bitcoin and Ethereum. He keeps a $150,000 Bitcoin target.\n\n## Why rates hit tech hardest\nA tech stock's value sits mostly in profits years away. Higher rates shrink what those future profits are worth today, so a company can report great results and still fall. If the Fed hikes, he expects the damage in three waves:\n1. The cash-rich giants (Microsoft, Alphabet, Amazon, Meta) get lower valuations.\n2. AI chips and infrastructure fall harder.\n3. Small, debt-funded growth companies get hit hardest.\n\n## The backdrop\n| | |\n|---|---|\n| Fed funds range | 3.50–3.75%, three votes for a hike in July |\n| Inflation (PCE, July) | 3.7%, core 3.3% |\n| Hike odds on Sep 1 | ~65%, up from ~40% |\n| 10-year Treasury | ~4.79%, highest since Jan 2025 |\n| Japan 10-year | 3%, highest since 1996 |\n| Jobs | August +162K, unemployment 4.1% |\n\nNew Fed chair Kevin Warsh said inflation must fall \"at sufficient speed\", and the Iran conflict is pushing oil up.\n\n**Carbutt's six doubts.** Lee needs a hold that the market doesn't expect. He's often right on direction and wrong on timing: he missed 8,000 in August and moved the correction before September ended. \"Already priced in\" works until it doesn't. A hold could be read as the Fed falling behind, so long yields rise anyway. Local fights over data centers can't be fixed by any rate decision. And a hike lands on a market crowded into AI names. The last minutes are an ad for his agency and courses.\n\n**How the call aged.** The Fed **raised** rates on Sep 16, to 3.75–4.00%, so Lee's base case missed. Stocks rose anyway: the S&P 500 is up 2.3% since Sep 9, at about 7,810, without passing 8,000 or dropping to his October lows. The 10-year yield climbed to 5.24%. Bitcoin is up 5.6%, at about $82,600.\n\n**Aswath check.** Carbutt's rate explanation is the discount-rate half of every valuation (L07, L24). A 25-point hike only matters if it moves the long-term riskfree rate (L03), and that's why he says to watch the 10- and 30-year yields, not the headline. Lee's $415 earnings estimate is a forecast. Ask what growth and margins it assumes (L11)."},{"id":"ukjHHCtLq2g","channel":"Tom Nash","date":"2026-09-09","videoMin":23,"title":"Is the stock market in a bubble? Tom Nash's data says not yet","checked":"2026-10-09","charts":true,"md":"**The claim.** People ask whether to sell, buy or wait. His answer: find where we are in the market cycle (hope → optimism → euphoria → crash) using data, not opinions. Every measure he checks says we're not at euphoria, so keep buying good companies and hold them.\n\n## His checklist\n| Test | Now | Normal / bubble |\n|---|---|---|\n| S&P 500 forward P/E | 20 | 10-year average 20 (17 in 2022, 23 in 2023) |\n| Trailing P/E | 25 | 28 a year ago |\n| This bull run | 4 years, +100% | Average 5.5 years, +265% |\n| NASDAQ since ChatGPT | +150% in 4 years | +600% in the 4 years after Netscape |\n| IPOs this year | ~140–150, +19% on day one | 460 in 1999, +72% on day one |\n| Corrections | −19% in Apr 2025, −20% in 2022, −10% in 2023 and 2024 | 10% a year, 20% every 3 years |\n\n- **Earnings drive it.** 87% of S&P 500 companies beat estimates (average 76%). Earnings grew 52% against 23% expected, revenue 15%, and net margin went from 15% to 17% (average 12%).\n- **It's broad.** 10 of 11 sectors grew earnings. The equal-weight S&P 500 was up 16% this year against 13% for the normal one.\n- **NVIDIA isn't expensive to him:** revenue +106%, and price-to-sales fell from 25 to 18.\n- **The economy is fine:** 4% unemployment, 3.5% inflation, retail spending +5%. Rate cuts would add fuel.\n\n## His plan\n- Invest half your monthly budget and keep the other half aside.\n- When a stock you want is 20%+ below its 52-week high, invest 150% of the budget.\n- Trim 10%, 20%, 30% when a position is up 50%, 100%, 150%.\n- His odds: 54% of days are up, 75% of years, 90% of decades, and every 20-year period so far.\n\n**Watch for.** The end is a pitch for his Patreon academy (\"three spots left\"), his stock app and a free guide. \"There is no way to lose\" over 20 years is US history, not a law.\n\n**How the call aged.** Since Sep 9 the S&P 500 is up 2.3% and the NASDAQ 100 4.9%. The equal-weight index, his proof of a broad rally, is down 0.7%. The rate cuts he hoped would add fuel went the other way: the Fed raised rates on Sep 16, and the 10-year yield rose from 4.84% to 5.24%.\n\n**Aswath check.** A P/E of 20 means an earnings yield of 5%. The 10-year Treasury now pays about 5.2%, so stocks earn barely more than a riskfree bond. A P/E is only \"average\" next to rates, and that's why Aswath uses the implied equity risk premium (L04, L15), not P/E history. Also, a 17% net margin against a 12% average is a peak to normalize (L08), even for the whole market."},{"id":"OjnEASpI2S8","channel":"David Carbutt","date":"2026-09-08","videoMin":18,"title":"Dan Ives says Palantir hits $1 trillion in 2–3 years. The case and the pushback","checked":"2026-10-09","charts":true,"md":"**The claim.** Wedbush analyst Dan Ives says Palantir is \"involved\" in 70–80% of all AI use cases and will be worth $1T within two or three years, roughly double today's $350–450B. Carbutt has covered Palantir since 2022 and finds the argument less mad the longer he looks.\n\n## Ives' case\n- Don't judge it as a software stock on a crazy multiple. It's a share of a $3–4T AI build-out, where ~30–40% goes to software and Palantir takes a big slice. It's not winner-takes-all.\n- **US commercial revenue +149%** to $764M a quarter, up ~380% in two years. It's ~45% of sales but 80–90% of the valuation.\n- **US government +90%** to $809M. AI projects jump the queue even in a shutdown.\n- **Sales efficiency:** about 70 salespeople, and Karp says only ~7 really sell. A normal company that size would need thousands.\n- Customers spend 57% more than a year ago (net dollar retention 157%). 220 deals over $1M in one quarter.\n- **Cash:** revenue $1.9B (+93%), free cash flow $1.22B for the quarter at a 63% margin, $3.4B over 12 months, $9.2B of cash and no debt. Ives expects $7–8B of free cash flow in a few years.\n- What \"70–80% involved\" means: Palantir is the live map of a company's data that any AI model plugs into. Being involved isn't the same as getting paid, and the number comes from Ives' own team's checks.\n\n## The pushback (CNBC's Mike Santoli)\n| | |\n|---|---|\n| Free cash flow yield on Ives' future $8B | ~1.6% |\n| Microsoft's yield today, on cash it already makes | about the same |\n| P/E | ~140–160 |\n\nPalantir and Robinhood have traded almost in step for two years, so part of the price is excitement, not the business. Ives' answer is \"think long term, like early Amazon.\" That's fair, and it's also what was said about many stocks that never grew into their prices.\n\n**Risks Ives names.** Politics: local votes against data centers and regulation before the midterms. Investor patience on free cash flow across AI, especially in 2027. A build-out that only settles in 2028–29. And AI models eating software, which is the risk to the whole thesis. The last minutes are an ad for Carbutt's agency and his Palantir course.\n\n**How the call aged.** Since Sep 8: Palantir +22.8% (about $209 a share), Microsoft +8.3%, Robinhood −7.1%, S&P 500 +1.8%. Halfway to the trillion in one month, on price alone.\n\n**Aswath check.** Santoli did the right math. Turn the price into the cash flows it requires (L22). At about half a trillion, a 1.6% yield on cash flows years away means you are paying for growth after that too. Aswath's test: how fast must free cash flow grow for 10 years to justify this, and is that \"possible, plausible, probable\" (L02, L20)?"},{"id":"sqxz4IDrKi0","channel":"Felix & Friends (Goat Academy)","date":"2026-09-07","videoMin":31,"title":"Gold going home, Norway trimming, banks building a digital dollar","checked":"2026-10-09","charts":false,"md":"**The claim.** Five headlines are one story: the money system is being quietly reset. Trump is leaning on the Fed to cut by Sep 16, countries are bringing their gold home, steady buyers are stepping back from US debt, and the big banks are building a new digital dollar. Felix says not to panic, but to stop treating cash and the S&P 500 as \"safe\".\n\n## The five pieces\n- **The Fed:** Trump told the Fed to cut rates or he'll start a trade war with deficit countries, and to \"be patriots\". The market expects a hike on Sep 16.\n- **Gold leaving:** the Netherlands moved 86 tons out of North America, France finished pulling 129 tons out of New York, Germany ~300 tons. In 1971 the Dutch asked for their gold, Paul Volcker told them they were \"rocking the boat\", and a month later Nixon closed the gold window. A decade of inflation followed.\n- **Debt buyers stepping back:** Norway's $2.3T oil fund proposed cutting ~$80B of US Treasuries. Japan and the Gulf states are pulling back too. Fewer lenders means higher rates on everything.\n- **The digital dollar:** on Sep 1, 21 big banks (Goldman, Citi, Bank of America, UBS and others) formed a company to launch a dollar stablecoin in 2027 under the GENIUS Act. JPMorgan is building its own. Whoever builds the rails decides how money moves.\n- **Japan:** the yen scare that wiped about $1T off US stocks in 40 minutes was \"the first tremor\".\n\n## What he does\n- Keep a 3–6 month emergency fund, in savings or short-term Treasuries. Beyond that, cash is \"an ice cube in the tropics\".\n- Hold some gold, but not 100%.\n- Buy businesses with pricing power. Visa and Mastercard, as the president did, because a new card network can't reach 300 million people. He also bought railway stocks.\n- Know your index fund: 10 stocks are ~40% of the S&P 500 and gave 72% of this year's gains.\n\n**Watch for.** It's the same funnel as his other videos: a free report, the \"index fund trap\" live training and a trial of his app. \"Buffett's company sold its S&P index fund\" refers to two small S&P 500 fund positions Berkshire sold in late 2024, a tiny slice of its portfolio. The gold moves and the stablecoin are real news. Calling them one coordinated \"reset\" is his interpretation.\n\n**How the call aged.** The Fed **raised** rates on Sep 16 despite Trump's pressure, so the \"printer answers to politicians\" part didn't happen this time. Since Sep 4: gold −5.8%, Visa +2.8%, Mastercard +1.7%, railways Union Pacific −3.9% and CSX −4.4%, S&P 500 +1.2%.\n\n**Aswath check.** Pricing power is a claim you can check. It shows as stable or rising margins when costs jump, and a return on capital well above the cost of capital (L10, L20). Visa's would show in its 2021–2023 margins. A stablecoin consortium is a story for the banks, and Aswath would ask which line of the bank's valuation it actually changes (L02)."},{"id":"YoLM9EatW2s","channel":"BWB - Business With Brian","date":"2026-09-06","videoMin":31,"title":"Who owns the AI bottleneck? A one-number test points to memory","checked":"2026-10-09","charts":true,"md":"**The claim.** NVIDIA's falling margin means someone else is taking its money. NVIDIA's own footnote says who: its supply commitments jumped from $119B to $279B, \"primarily memory\". Brian's test for who owns a real bottleneck: compare gross margin over the last four quarters with the four before. If it rose, the company owns something scarce. If it fell while revenue boomed, it's just busy.\n\n## Why margin, not revenue\n- In a boom everyone's revenue rises. Margin only rises when you have the power to keep the extra money.\n- He learned it as a buyer at Target and Amazon: with most suppliers he had leverage. With Nintendo or Xbox he took the allocation and the price he was given.\n- NVIDIA's 75% margin, guided to 72–73%, is just back where it was two years ago. Its costs nearly doubled to $63B.\n\n## The test, on his names\n| Company | Gross margin change | Revenue | Verdict |\n|---|---|---|---|\n| SanDisk (SNDK) | +41.4 points (26% → 85%) | nearly tripled | Scarce |\n| Micron (MU) | +35.4 points (37.7% → 84.6%) | – | Scarce |\n| Constellation Energy (CEG) | +24.5 points | – | Scarce: licensed reactors that already run |\n| Vertiv (VRT) | +4.3 points | +26% | Passes, barely |\n| GE Vernova (GEV) | +2.2 points | – | Long order book, little pricing power |\n| nVent (NVT) | −2.2 points | +46% | Busy, not scarce |\n\n- Of 24 companies in the AI chain, 13 passed, and all 24 make more gross profit than two years ago.\n- Micron has signed supply deals to 2030 for about a quarter of revenue. Its CEO says key customers get only 50–67% of what they need.\n- Micron trades at ~6× next year's earnings. That price only works if earnings fall ~60% below forecasts and stay there, so the market is calling a peak. Memory margins last peaked at 59% in 2018 and turned to losses within five years.\n- All of them sit at the 94th–98th percentile of their own valuation history. SanDisk has no history to compare against, which he calls \"a missing instrument, not a green light\".\n\n**Risks he names.** China: CXMT, a state-backed memory maker, raised $8.6B and may start ~9 wafers for every 10 Micron starts, all in ordinary memory, the product that built Micron's margin. Apple testing CXMT would give it credibility, and senators are pushing back. Memory stocks already fell 30–50% between June and August. The middle of the video is a sponsor segment for a tiny copper explorer.\n\n**How the call aged.** Since Sep 4: Micron +1.2%, SanDisk −9.1%, Constellation −0.3%, Vertiv −13.5%, GE Vernova +6.7%. nVent, the one that failed his test, is up 7.3%. S&P 500 +1.2%. Too early to grade.\n\n**Aswath check.** Brian's test is about the margin you'd put into a valuation, and it's exactly the problem in L08: an 85% gross margin with no precedent, against a 2018 peak of 59% followed by losses. Normalize it before you value Micron or SanDisk. Then check what the price assumes (L22). At 6× earnings, the market is already pricing in the fade."},{"id":"y3cim4d4iWo","channel":"New Money","date":"2026-09-06","videoMin":83,"title":"Phil Town on Salesforce, Berkshire's Google buy, and why he'd skip the index fund now","checked":"2026-10-09","charts":true,"md":"**The claim.** Brandon interviews Phil Town (Rule #1 investing). A beaten-down stock is almost always cheap for a reason. The skill is judging how long the problem lasts. If it's one to three years, a patient small investor can buy what fund managers can't hold. Phil's team just did that with Salesforce.\n\n## Salesforce and the \"SaaSpocalypse\"\n- Wall Street sold software stocks on fear that AI replaces them. Phil's view: Salesforce *is* the company's record of its customers, and AI can't replace that. It can only change how Salesforce charges.\n- AI should also cut Salesforce's own costs, so margins expand rather than shrink. The fund bought cheap, and one manager made millions in a day when earnings came out.\n- Why Wall Street sells anyway: a fund manager who lags for a year loses the pension money, and so their job. Problems lasting longer than a year are where you have the edge.\n\n## His method, the \"4 Ms\"\n| M | What he checks |\n|---|---|\n| Meaning | Simple enough to understand, predictable numbers |\n| Moat | Revenue, earnings and free cash flow growing for years |\n| Management | Low debt, high return on invested capital |\n| Margin of safety | A price that works even in the bad case, often half of the public value. Private companies sell for ~7× earnings, public ones ~16–17×. |\n\n- One person owns each company. The rest of the team tries to kill the idea, Munger-style: \"how would this kill me?\"\n- A lesson from bankruptcy court: their valuation, matching an expert who used Damodaran's methods, won the case, but lawyers' fees ate the $200M. Since then they avoid companies with much debt.\n- They read the big investors' quarterly filings (13Fs) for ideas from about 60 investors they trust, then check return on capital, cash flow and debt first.\n\n## Berkshire, Google and the market\n- Berkshire added 45% to its Google stake (~$30B, its 4th-largest). Michael Burry said he's done buying Berkshire.\n- Phil: \"Not a Buffett purchase.\" Google earns about 4–5% on its price, while Apple was bought at about 11%. He thinks Greg Abel is under pressure to put ~$380B of cash to work, and that Google's $100B of data centers could need write-offs. He expects Google \"back around $150 at some point.\"\n- He wouldn't tell anyone to park money in an index fund today. The long-run P/E (Shiller CAPE) has always been followed by a crash at this level, possibly with 10–15 flat years after, like his $600 that became $400 in the 1970s.\n- He worries about a debt spiral at $40T of debt and $1.2T a year of interest. Own businesses that grow in any currency.\n- While waiting, they sell options to earn cash, as Buffett did while buying the Burlington Northern railroad.\n\n**Watch for.** The interview promotes their free Sep 18–20 workshop and a paid webinar. The options returns quoted come from students who wrote in. The last ~10 minutes are about Phil's horse farm.\n\n**How the call aged.** Since Sep 4: Salesforce −11.6% (about $229), Google +3.9% (about $352, far from $150), Berkshire +1.9%, S&P 500 +1.2%. The Salesforce rebound hasn't lasted so far.\n\n**Aswath check.** Phil names Damodaran as \"the best\" on valuation. The key question, how long the problem lasts, is the growth and margin path in a DCF (L11, L20). \"Half the public price\" is pricing, not value (L22). Try it on Salesforce: if AI changes how it gets paid, which input moves, revenue growth or margin, and by how much?"},{"id":"_wkLQuIW8CY","channel":"Felix & Friends (Goat Academy)","date":"2026-09-05","videoMin":20,"title":"Four ways to own gold, and why Felix sold his gold fund","checked":"2026-10-09","charts":false,"md":"**The claim.** Felix still owns gold. What he's stopped buying is \"gold\": funds that track the price but aren't metal you control. If you want gold as insurance, buying it from the institutions you're insuring against is \"a lifeboat bolted to the ship\".\n\n## The four ways in\n| Way | What you really own | His verdict |\n|---|---|---|\n| **Gold fund (GLD, $152B)** | A share of a trust that holds bars at a custodian | Fine for price exposure, wrong as insurance. He's out. |\n| **The metal** (coins, bars) | Metal with no counterparty | The foundation |\n| **Miners** (e.g. the GDX basket) | A business that digs gold | Leverage both ways, a smaller slice |\n| **Royalty and streaming companies** | A cut of many mines' output | Miner economics with less mine risk |\n\n## Why he left the gold fund\n- **You can't get the metal.** Only a few big banks can swap shares for bars, in blocks of 100,000 shares, about $40M.\n- **Your share shrinks.** The 0.40% yearly fee is paid by selling gold: one share held 0.1 oz in 2004 and about 0.09 oz now, and it keeps falling. It's in the prospectus.\n- **The custody chain.** The custodian can pass bars to sub-custodians, and the fund's ability to check them is \"limited\".\n- **Paper vs metal:** the futures exchange (COMEX) has ~14.5M oz ready for delivery (−23% in a year) against ~40M oz of open claims.\n\n## How he'd own it\n- **Metal:** buy from big dealers, since bigger pieces have smaller markups. Store it \"allocated\", meaning numbered bars in your name and off the storage company's books. Central banks buy bars, not fund units.\n- **Miners:** costs are mostly fixed, so a 20% gold move can double profits, or wipe them out. Strikes, floods and management add risk.\n- **Royalties:** they pay for a mine up front for 1–5% of revenue forever, or the right to buy ~20% of output at a fixed low price. Franco-Nevada has ~40 employees, a ~$50B market value and no debt, and keeps 70+ cents of each revenue dollar against ~40 for a miner. But a royalty on a closed mine pays nothing, and they rarely trade cheap.\n- **Size:** 5–15% of a portfolio, mostly metal, with miners and royalties on top. \"At 90% you've joined a cult.\"\n\n**Watch for.** His app (free trial) and free report are pitched throughout.\n\n**How the call aged.** Since Sep 4: gold −5.8%, GLD −5.5%, the miners (GDX) −10.1%, Franco-Nevada −8.0%. The leverage he warned about worked on the way down.\n\n**Aswath check.** Royalty companies are the one part of gold you *can* value, because they have cash flows. Franco-Nevada is a DCF on mine output, gold price and reinvestment in new deals (L10). Gold itself can only be priced. Aswath calls it insurance against a crisis, which matches Felix's 5–15% sizing."},{"id":"csv55UtVMZM","channel":"Ticker Symbol: YOU","date":"2026-09-05","videoMin":24,"title":"The five-layer AI map, and the stocks he owns in each layer","checked":"2026-10-09","charts":true,"md":"**The claim.** Wall Street assumes $7.6T of AI spending through 2031, with growth slowing to 4% a year. NVIDIA and Broadcom's numbers say it's accelerating: the five biggest cloud companies alone plan $800B this year and $1.3T next, about 30% more than Goldman's estimate for the whole world. He uses Jensen Huang's \"five-layer cake\" to map where the money goes, and buys the two or three leaders in each layer.\n\n## The two earnings reports\n| | NVIDIA | Broadcom |\n|---|---|---|\n| Quarterly revenue | $96.2B (+106%) | $29.6B (+86%) |\n| AI revenue growth | +117% (data center $89B) | +221% |\n| AI revenue added in a year | +$48B | +$11.5B |\n| Next quarter guide (AI) | +94% | +236% |\n\nPercentages measure speed and dollars measure size. They don't really compete: Google, Meta, Anthropic and OpenAI buy both GPUs and custom chips.\n\n## The five layers\n1. **Energy:** AI is priced per gigawatt, $25–40B per GW of NVIDIA gear. The grid adds 86 GW this year on paper, but 90% is solar, wind and batteries, so always-on power is *shrinking*, with 5+ years of waiting to connect. Owners win: **Constellation (CEG)**, **Vistra (VST)**, **GE Vernova (GEV)**.\n2. **Chips:** **NVIDIA** (Vera Rubin is ramping, and this is its first ever full-year forecast, +70%) and **Broadcom** (six custom-chip customers, aiming for $115B of AI revenue next year and $230B the year after). **TSMC** makes both kinds.\n3. **Infrastructure:** networking and power inside the building. He buys **Coherent (COHR)**, **Lumentum (LITE)** and **Fabrinet (FN)**, and is starting **Powell Industries (POWL)**, which has a backlog up 69% and only four analysts covering it. He also names Arista and Vertiv.\n4. **Models:** the frontier labs are private. OpenAI and Anthropic have filed to go public.\n5. **Applications:** the money is here. **Meta** (AI ads +27%, 12% more per ad) and **Google**.\n\n**Risks he names.** Few: co-packaged optics could cut laser demand, though he thinks ports grow faster. The AI labs still burn cash. A sponsor segment for an AI app builder runs early on.\n\n**How the call aged.** Since Sep 4, his twelve buys average +8.6% against +1.2% for the S&P 500. Best: Lumentum +25.2%, Fabrinet +19.4%, Meta +16.5%. NVIDIA (−0.5%) and Constellation (−0.3%) are flat.\n\n**Aswath check.** \"Wall Street underestimates the market\" is a claim about total spending. It doesn't say what any one company is worth. When every supplier is priced to win a bigger market, check the total: add up the revenue all their prices assume and compare it to the $1.3T that's actually being spent (L02). And growth paid for with customers' borrowed money is growth you should fade (L20)."},{"id":"RNyx2zZiObE","channel":"David Carbutt","date":"2026-09-03","videoMin":18,"title":"The $35B chip lease behind Anthropic, and the promise Broadcom made to get it done","checked":"2026-10-09","charts":false,"md":"**The claim.** AI chips are being financed like airplanes. A special-purpose company borrowed $35B to buy Google TPU racks and rent them to Anthropic, so the debt isn't on Anthropic's books before its stock-market listing. The deal only worked because Broadcom promised what the chips will be worth later. That promise is now worrying Broadcom's own lenders.\n\n## How the deal is built\n| Layer | Size | Interest | Who's really at risk |\n|---|---|---|---|\n| Senior notes (bank) | $6B | – | Backed by Broadcom's promise |\n| Senior notes | $24B | 5.75% | Backed by Broadcom's promise |\n| Junior notes | $4.5B | 8.5% | No backstop, paid last |\n| Equity (Apollo's Atlas SP) | $0.8B | – | Owns the vehicle |\n\n- Same chips, same renter, same day, yet the unprotected lenders charged ~3 points more. Senior lenders are really betting on Broadcom, not Anthropic.\n- If Anthropic stops paying, the chips are sold or Broadcom takes over the lease. Broadcom's exposure is capped at **$29B**.\n- It's a platform: Broadcom's AI financing vehicle aims at 20+ GW through 2028, for Anthropic and OpenAI. Bank of America models up to ~$370B of senior debt by 2029. A next deal of $60B+ (maybe $100B with junior money) is in talks.\n- NVIDIA's version is a target: $500B+ from six firms (Apollo, BlackRock, Blackstone, Brookfield, Goldman, KKR), with value support of up to 25%, case by case.\n- Why lenders like it: calling AI compute \"infrastructure\" with contracted rent brings in pension and insurance money, the money that buys toll roads.\n\n## Four problems underneath\n1. **Hidden debt:** US accounting only books these promises when a loss is likely, so they sit in footnotes. JPMorgan calls it \"phantom leverage\", and Bloomberg counts ~$70B at the big AI firms. Meta's off-balance-sheet promises are near $628B.\n2. **Used chips:** the backstop only costs Broadcom if Anthropic stops paying *and* the chips are worth less than the debt. There's almost no market for used AI chips, unlike 20-year-old jets.\n3. **Conflicts:** Broadcom co-designs the chips with Google, Google owns part of Anthropic, and Morgan Stanley advised and sold the debt.\n4. **Rivals:** Google took an option on $12.2B of Marvell shares, which grows with every chip it buys from Marvell.\n\nMarkets already reacted. The cost of insuring Broadcom's debt jumped more than Oracle's. Bank of America downgraded its bonds, and Moody's and S&P count the promise like debt. The stock was ~25% below its June high despite +48% revenue. The last minutes are an ad for his agency and courses.\n\n**How the call aged.** No buy call. Since Sep 3: Broadcom +1.2%, Apollo −11.8%, Blackstone −17.0% (the private-credit lenders fell hard), Marvell +31.8%, S&P 500 +0.8%.\n\n**Aswath check.** These guarantees are exactly the \"all debt\" step in L13. Aswath counts leases and similar promises as debt, and S&P does the same here. Add an expected cost for the $29B backstop before you value Broadcom's equity. It also changes Broadcom's cost of debt and its debt weight (L06, L07)."},{"id":"nNlvhJj86pw","channel":"Felix & Friends (Goat Academy)","date":"2026-09-02","videoMin":25,"title":"Japan's bond yields hit a record. Felix says the dollar is next, and gold isn't ready","checked":"2026-10-09","charts":false,"md":"**The claim.** Japan's 30-year bond yield jumped to 4.18%, the highest ever. The \"widow maker\" trade, betting against Japanese bonds, finally paid off. Felix sees Japan as about ten years ahead of the US on the same road: too much debt, a central bank buying it with new money, and the currency paying the price. And it's happening during the biggest bubble since 2000.\n\n## His chain of events\n- **Japan:** debt about 200% of the economy. The Bank of Japan kept rates down by buying bonds, and the yen bled. Now yields are breaking out, and Japanese stocks lost $200B+ in a day, led by tech.\n- **Everywhere:** global yields are the highest since 2000. The US 30-year touched 5.3% (highest since 2007), the UK's is the highest since 1998, and Australia's a 15-year high. The FT called it a global bond sell-off.\n- **The US bill:** $40T of debt, with interest now costing more than the military. Borrowing to pay interest is \"a Ponzi scheme\". The exits are growth, default or inflation, and he expects inflation.\n- **Money printing:** world money supply is $150T, +50% since 2020. A 1971 dollar buys 12 cents of today's goods.\n- **The AI bubble:** AI companies borrowed $410B this year, betting on falling rates, and rates are rising. In 2000 the \"can't lose\" internet kings were Cisco, Yahoo and AOL. The NASDAQ fell 78% and took 15 years to recover, so $100K at 55 becomes $22K.\n- **His guess at the \"script\":** tough talk from Fed chair Warsh (hike odds 36% → 70% in three days), then an Iran deal, cheaper oil, rate cuts and a rally. He says it's a guess.\n\n## Why \"gold isn't ready\"\n- Far more paper gold (futures, swaps, fund units) trades than there is metal to deliver. If everyone asks for metal at once, there isn't enough.\n- Many \"gold\" funds only track the price, so check what yours actually holds.\n\n**Watch for.** This video pitches a free 2-hour live training (\"survive the bubble\"), his app and a report. His figures shift between videos: the 1971 dollar is worth 12 cents here and 7 cents in another.\n\n**How the call aged.** Since Sep 2: Japan's Nikkei is **up** 7.3%, not crashing. The yen is flat. The US 30-year yield kept rising, from 5.27% to 5.60%. The NASDAQ is up 4.4%, gold −4.5%. The Fed hiked on Sep 16, and oil is flat at about $92, so his Iran-deal script hasn't happened.\n\n**Aswath check.** Aswath would point out that Japan's own government bond isn't riskfree, because Japan can default (L03). Rising long-term rates raise every discount rate. The \"bubble\" call is a market-level judgment, and Aswath's tool for it is the implied equity risk premium: is it low versus history and versus rates (L04, L15)?"},{"id":"3fc56wCjDK8","channel":"David Carbutt","date":"2026-09-01","videoMin":23,"title":"Free AI models are catching up faster. Why that may help NVIDIA and AMD","checked":"2026-10-09","charts":true,"md":"**The claim.** In January 2025, the free DeepSeek model wiped $589B off NVIDIA in a day on the fear that cheap models kill chip demand. The opposite happened. Free models now catch the best paid ones within months *and* do real work, which makes AI cheap enough for millions of new jobs. That means more chips, not fewer. Carbutt owns a \"reasonable amount\" of AMD and a little NVIDIA.\n\n## Open models are closing the gap faster\n| Era | Free model | Time to catch the best paid one |\n|---|---|---|\n| Scaling | Llama 2 70B | ~14 months |\n| Reasoning | DeepSeek R1 | 8.5 months |\n| Agents | Kimi K2.6 | 4.5 months |\n\n- These are SemiAnalysis' own tests, not the labs' self-reported scores. Open models have never taken the lead, though. Big jumps still come from closed labs.\n- The change that matters: GLM 5.3 and Kimi K3 now do real coding and agent work, the work that took Anthropic past $65B a year.\n\n## Jevons paradox\n- In 1865, more efficient steam engines made Britain burn *more* coal, because coal power became worth using in many more places.\n- Same with AI. At a tenth of the price, it's worth using for cheap customer service, small-business paperwork, agents running all day, and models inside devices.\n- Proof: Fireworks, one provider of mostly open models, runs 40T+ tokens a day, about double OpenAI's whole API.\n- AMD raised its server-CPU market forecast from ~$60B to $120B+, then $200B by 2030, as agents push the CPU-to-GPU ratio from 1:8 toward 1:1. NVIDIA sees a new $200B CPU market. NVIDIA grew 106% with China at almost zero.\n- AMD targets non-GAAP earnings per share of $20+ in 3–5 years, from $4.17 in 2025. He quotes $2.68 (a different measure) to get \"sevenfold\". On the same measure it's about fivefold.\n\n**Risks he names.** Jevons isn't a law, and there may be a ceiling on how much AI the world wants. More demand at lower prices can mean less profit, since NVIDIA's margins depend on customers having few alternatives. The big forecasts come from the sellers. NVIDIA's CUDA software lead may keep AMD out. And if adoption flattens, the industry is stuck with years of pre-ordered equipment. A sponsor slot for a budgeting app sits in the middle.\n\n**How the call aged.** Since Sep 1: AMD +32.3%, NVIDIA +5.4%, S&P 500 +2.4%. A good month for his bigger holding.\n\n**Aswath check.** Jevons is about volume. A valuation also needs price and margin (L08). If AMD earns $20 a share in five years, what is that worth today after the risk it doesn't (L14)? Its rise since Sep 1 already prices in part of that path."},{"id":"OVC6HpNo8yM","channel":"Felix & Friends (Goat Academy)","date":"2026-08-31","videoMin":33,"title":"Bonds explained: the switch under every price you pay","checked":"2026-10-09","charts":false,"md":"**The claim.** The bond market (~$160T) is bigger than the stock market and quietly sets the price of everything else. The biggest borrower on Earth is now stuck: the US will most likely inflate its debt away, and savers pay for that. Learn two numbers, the riskfree rate and the spread, and you'll see trouble coming before stock investors do.\n\n## Bonds in plain English\n- A bond is a loan. You're the lender, and you get interest plus your money back at the end.\n- **Price and yield move opposite ways.** If new bonds pay 5%, your old 2% bond has to sell for less. When fear sends everyone into safe bonds, prices rise and yields fall.\n- **The riskfree rate:** what the US government pays is the floor every investment must beat. When it rises, everything risky gets repriced lower, even on a day with no news about your companies.\n- **The spread:** what shaky borrowers pay on top. When it widens, say from 7% to 9% against a 5% Treasury, lenders smell trouble. It has warned of most crises weeks or months ahead.\n\n## Why the US is \"trapped\"\n- Debt passed $40T, $1T added in five months. Interest now costs more than the military, and only Social Security is bigger.\n- Borrowing to pay interest makes more debt and more interest. Much of it is short-term, so it rolls over at today's rates.\n- The exits are growth (too big to outgrow), default (unthinkable) or inflation, \"the quiet door\". A 1971 dollar buys 12 cents of goods today.\n- **Japan is ten years ahead:** debt ~200% of its economy (US ~120%). Betting against its bonds was the \"widow maker\", because the Bank of Japan bought them, at peak more than half. The yen paid the price.\n\n## What he does\n- Don't treat cash as safe. The number stays the same while what it buys shrinks.\n- Gold is fire insurance, not a lottery ticket. Central banks have bought 1,000+ tons a year since 2022.\n- Watch yields and spreads.\n- A Berkshire director's warning: the obvious internet winners were Cisco, Yahoo and AOL. Two vanished and one never recovered.\n\n**Watch for.** It's a funnel for a free live training (\"survive the bubble\", no replay) and his app. \"$17,000 of debt per American\" is far off: $40T is roughly $118,000 per person.\n\n**How the call aged.** Since Aug 31: the 10-year yield rose from 4.76% to 5.24%, so the riskfree rate kept climbing. The junk-bond fund (HYG, −3.2%) fell no more than a Treasury fund (IEF, −3.6%), so spreads haven't widened and there's no fear signal yet. Gold −5.9%, S&P 500 +1.6%.\n\n**Aswath check.** This is Aswath's riskfree rate and default spread, almost word for word (L03, L06). One correction from Aswath: a government bond is only riskfree in its own currency and only if the government can't default. That's why he subtracts a default spread for many countries. The \"spread as early warning\" is Aswath's idea too: lenders reprice risk faster than stock prices do."},{"id":"f_BmT1yaSQY","channel":"Ticker Symbol: YOU","date":"2026-08-31","videoMin":23,"title":"CoreWeave, Nebius or IREN? Comparing the AI \"neoclouds\"","checked":"2026-10-09","charts":true,"md":"**The claim.** NVIDIA's latest quarter showed AI spending spreading beyond the tech giants. Sales to AI clouds, industry and enterprise grew 138%, faster than to the hyperscalers (102%), for the first time. The \"neoclouds\" that rent out NVIDIA chips are set to almost triple capacity this year, from ~3 GW to 8 GW. He compares the three listed ones and would pick IREN if he could own only one.\n\n## NVIDIA's quarter, briefly\n- Revenue $96.2B (+106%), with growth accelerating four quarters in a row: 62%, 73%, 85%, 106%. Operating margin 66%, against 34% for Alphabet and ~17% for AMD.\n- About 15% of its earnings growth came from $7.8B of gains on stakes in other AI companies.\n- Supply commitments jumped to $279B, mostly memory. He reads that as memory makers selling everything they can make.\n\n## The three neoclouds\n| | CoreWeave (CRWV) | Nebius (NBIS) | IREN |\n|---|---|---|---|\n| Quarterly revenue | $2.6B (+112%) | $0.58B (+454%) | $137M (AI $70.5M) |\n| Backlog | $104B | $37.5B | $16.6B |\n| Active / contracted power | 1.5 / 4.2 GW | ~0.8–1 / 5 GW | ~0.3 / 5+ GW |\n| Net debt | ~$46B | ~$2B | ~$1.9B |\n| Interest as % of revenue | ~25% | ~20% | ~18% |\n| Value / year-end run rate | 4.9× | 7.4× | 4.0× |\n| Big customers | OpenAI, Microsoft, Meta ($21B) | Microsoft ($17.4B), Meta (up to $27B) | Microsoft ($9.7B), NVIDIA ($3.4B) |\n\n- **CoreWeave:** the biggest and first to get new NVIDIA chips. NVIDIA will buy any unsold capacity through 2032, and it invested $2B at $87 a share, above today's ~$84. But interest turned a $49M operating loss into a $626M net loss. *His pick for newer investors or anyone near retirement.*\n- **Nebius:** customers prepay 50–60% of equipment, $9B+ this year. It's the most expensive of the three and is also raising money by selling shares (dilution).\n- **IREN:** a former Bitcoin miner that already owns land and power. Its AI revenue doubled in a quarter. A $684M loss came mostly from writing off Bitcoin gear. *His pick for the most upside*, and he thinks the execution risk is priced in.\n\n**Risks he names.** CoreWeave's debt, Nebius' price and dilution, and whether IREN can turn contracted power into revenue. The numbers come from his own table across different fiscal calendars. A sponsor slot for a dictation app runs in the middle.\n\n**How the call aged.** Since Aug 31: IREN −5.2%, CoreWeave −3.3%, Nebius +7.1%, NVIDIA +3.8%, S&P 500 +1.6%. His top pick is behind so far.\n\n**Aswath check.** He compares enterprise value to revenue, which is the right move for a company in debt. But price-to-run-rate is still pricing (L22). The real test is the return on all that capital: how much does a megawatt earn after interest and replacing chips every few years (L10, L19)? For CoreWeave, interest at 25% of revenue makes the cost of debt (L06) the whole story."},{"id":"ai-01","channel":"Overview","date":null,"videoMin":null,"title":"The short answer: sell a result first, build software second","checked":"2026-10-22","charts":false,"md":"**The short answer.** Start with an AI-powered service for one boring Dutch industry, sold as a fixed monthly package. Build software only after that service has shown you exactly what to automate. Your SaaS idea comes back in year 2, grown out of the service.\n\n## Why this and not SaaS first\n- **Small Dutch firms barely use AI yet.** 4–7% of construction and hospitality firms do, against 54% in tech.\n- **Their staff are scarce and expensive.** An hour of staff time costs €47.90, the third highest in the EU. A service that saves 15 hours a month is worth about €700 to a firm.\n- **Hormozi backs it, with a warning.** He calls AI implementation for small businesses \"an enormous opportunity\", but says most AI businesses lack basic business sense, and that software is a hard game for people who aren't software people.\n- **Building got cheap; customers didn't.** 81 of the 187 Starter Story founders in your library built with AI coding or no-code tools. The scarce part was distribution.\n\n## The path in four phases\n1. **Discover, months 1–2.** 20 owner interviews, through your graduation project if you can, to find one weekly task. Go on when 6 of 10 owners name the same task, with hours attached.\n2. **Pilot, months 2–4.** Three firms free for 60 days, done by hand, every edge case logged. Go on when a pilot client pays €300 or more a month.\n3. **Paid service, months 4–12.** €500–1,500 a month per client; automate one step at a time. Go on when about 10 clients run on the same steps, under 1.5 hours each.\n4. **Software, year 2 onward.** Turn the workflow those clients share into a tool for the industry. Later, buying a firm becomes an option.\n\n## How these notes are arranged\n- **Evidence**, parts 2–5: what Hormozi says, what 187 founders built, the Dutch market, the rules that shape how you sell.\n- **Options**, parts 6–8: six ways to make money with AI scored, Dutch niches ranked, three worked offers.\n- **Plan**, parts 9–12: the money, your time, the path and its risks, your first 30 days.\n\nYour first 30 days are also the pieces on this branch, so you can tick them off and time them like anything else.\n\n## Where this comes from\nVideo quotes come from the transcripts in your YouTube library: every AI passage in 558 Alex Hormozi and 299 Leila Hormozi videos, 187 Starter Story case studies and Greg Isenberg's episodes. Web figures come from search-result extracts, because the network settings blocked opening the pages themselves. Each part links its own sources; check a page before you rely on its number.\n\nAlso read for this, without a quote of their own: [How I Would Build a Business in 2026](https://www.youtube.com/watch?v=i7bLRKwKSms), [If You Want To Create Wealth In 2026 (4 Paths)](https://www.youtube.com/watch?v=sL16tsGafcQ), [AI Is Making Your Thinking Worse (Leila)](https://www.youtube.com/watch?v=DVtuTp3ykcA), [5 Businesses I'd Start If I Was 22](https://www.youtube.com/watch?v=cG8r7OT75lA) and [The SaaSpocalypse Is Getting Worse](https://www.youtube.com/watch?v=KzYfh-9hKmc).\n\n**Do this next.** Read part 12, Your first 30 days. Then start the branch's first piece: pick two niches where you can get introductions.","shelf":"ai","n":1},{"id":"Nd9rdmDtZ3A","channel":"Leila Hormozi","date":null,"videoMin":10,"title":"Stop dabbling: why most would-be entrepreneurs never make money","checked":null,"charts":false,"md":"**The idea.** Leila calls it being a \"wantrepreneur\": someone dabbling in business without seeing the skills they're missing. The tell is over-consuming and over-thinking. You plan, build and polish, but never ship or sell. You don't need more information. You need imperfect action.\n\n## What it looks like\n- An idea, then building something (a product, a campaign), then never actually selling it.\n- Her own example: five or six months of weekends building an online fitness course, \"Queen Transformation\". She never launched it.\n- The root is fear of failing, dressed up as \"it isn't ready yet\".\n\n## Four ways she got out\n1. **Picture the worst case.** Hers: quit the job, lose her clients, run low on money, move back in with her dad at 23 and rebuild. Not that bad. What actually hurts is judging yourself for failing.\n2. **Make the goal learning, not winning.** If the goal is to learn, failing still counts. Set the big goals once you're in the game.\n3. **Set low expectations.** A woman six months into wholesaling made $7,000 a month and felt like a failure, because she'd expected $20,000 and compared herself to people with years of sales experience. She had been a waitress.\n4. **Call it an experiment.** Six to twelve months, then look at what you learned. The worst case is going back to what you did before.\n\n**A note for this shelf.** Reading is consuming too. Every read here ends with something to try, and a read only counts once you've done the try.\n\n**Try it this week.** Write your worst case for starting a small service on the side, in four lines like hers. Then write the experiment: what you'll try, for how long, and what you want to learn from it.","shelf":"business","n":1},{"id":"atomic-habits-1","channel":"Atomic Habits","date":null,"videoMin":null,"title":"Tiny gains compound: forget goals, build systems","checked":null,"charts":false,"md":"**The argument.** Big results don't come from one big change. They come from small habits repeated until they compound. Clear rebuilt his life this way after a serious injury in high school: small, boring routines first, results years later.\n\n## Chapter 1: the surprising power of atomic habits\n- British Cycling had been mediocre for a century. In 2003 its new coach, Dave Brailsford, went after \"the aggregation of marginal gains\": 1% better at everything, from saddle comfort to pillows. Within about a decade British riders were winning Olympic golds and the Tour de France.\n- The maths of 1%: 1% better every day for a year is about 37 times better. 1% worse every day ends near zero. Habits are the compound interest of self-improvement.\n- Your current results matter less than your direction. Ask whether today's habits put you on a path you'd want in 10 years.\n- **The plateau of latent potential.** An ice cube in a cold room doesn't melt as it warms from 25°F to 31°F. At 32°F it does. Early effort looks wasted, but it's stored, not lost. Most people quit in this \"valley of disappointment\".\n- **Goals versus systems.** Goals are the results you want; systems are what you do every day. Winners and losers share the same goals, so goals can't be what separates them. A goal is a moment; a system keeps going. In his words: you don't rise to the level of your goals, you fall to the level of your systems.\n\n**The idea worth keeping.** Judge yourself by the system, not the scoreboard. For your FIRE number that means: what you invest every month matters more than where the total stands today.\n\n**Try it this week.** Pick one goal in the app and write down the system behind it in one line: what you'll do, how often. That line, done daily, is the real goal.","shelf":"books","n":1,"part":"Intro–Ch. 1","by":"James Clear"},{"id":"ai-02","channel":"Evidence","date":null,"videoMin":null,"title":"What Hormozi says about making money with AI","checked":"2026-10-22","charts":false,"md":"**The idea.** Hormozi backs AI-run services for small businesses and warns first-time founders off software. His test for any use of AI: \"Though I am using AI, am I making more money?\" These are the eleven points from 558 Alex Hormozi and 299 Leila Hormozi transcripts that bear on your question.\n\n## Eleven points\n1. **Small-business AI is the opening; custom work isn't.** \"AI implementation for Main Street is an enormous opportunity\", but \"being the custom guy is tough\": \"all things to all people is nothing to no one.\" Pick one industry and one problem that is the same in every firm. [81 Minutes of Money Making Advice](https://www.youtube.com/watch?v=U_s0ekwPK5g)\n2. **Choose the problem by numbers.** \"Value created times ease of implementation\", where value is the number of potential customers × gross profit per customer. Get the insight from your own industry experience or an insider partner. [81 Minutes of Money Making Advice](https://www.youtube.com/watch?v=U_s0ekwPK5g)\n3. **Charge the old price.** People still pay the old labour price (the example: $2,000 a month) while AI delivers it for $50. That gap is the margin, and \"one person now can bring millions in revenue\". [How to Win With AI in 2026](https://www.youtube.com/watch?v=9q5ojtkqsBs)\n4. **Sell the outcome, hide the tool.** \"The fact that I'm using AI is irrelevant. You just sell the outcome.\" Clients want it faster, cheaper, better and less risky. \"Don't say we're an AI design firm. Just be a design firm.\" [How to Use AI in Your Business in 2026](https://www.youtube.com/watch?v=fr78adfAnuA), [4 Ways To Get Ahead](https://www.youtube.com/watch?v=s7QA1TJKlbQ)\n5. **Most AI use earns nothing.** AI doesn't cancel the other kinds of leverage: capital, media, people, better decisions. \"The only thing more efficient than automation is elimination.\" Token bills rise whether or not revenue does. [Why AI won't make you rich in 2026](https://www.youtube.com/watch?v=WttZ6b-KUP4), [Social Media Strategy 2027](https://www.youtube.com/watch?v=ZTSI3DDP_4A)\n6. **AI-first means data-first.** \"You have to be a data first company. Because AI works with data.\" The fix for a people-heavy firm: redesign the workflow, cut headcount about 50%, double the margin. [Watch This If You Have a Service Business](https://www.youtube.com/watch?v=jqo0lVveh98)\n7. **Software is a hard game for non-software people.** More than 10% churn a year means \"you're just a service business\". Competitors copy you fast. Product-market fit means people \"buy, use, tell\". \"You're either service or you're tech. Period.\" [Starting a software company is a TERRIBLE idea](https://www.youtube.com/watch?v=pw1PcHfYP2w)\n8. **Know the niche before you sell to it.** Leila met a founder building \"AI for gyms\" with no gym background and no AI background. Investors look for founders who lived the problem. Expect about 5 years before it really works. [4 Simple Businesses (Leila)](https://www.youtube.com/watch?v=b6j4EGvcXBw), [10 Minute Millionaire](https://www.youtube.com/watch?v=VgEvIIpDYG8)\n9. **Proof and brand are the moat now.** An AI avatar \"can never have done something in the real world.\" Business buyers want proof, so document client results. \"In the world of AI, your brand is your moat.\" [14 Years of Marketing Advice](https://www.youtube.com/watch?v=JDR-R--4HhM), [26 Harsh Lessons](https://www.youtube.com/watch?v=YONIUpk-kAs)\n10. **Start expensive, with few clients.** \"Sell extremely expensive stuff to a select few or super cheap to everyone. The middle is where people die.\" Pick buyers who have money, feel the pain and are easy to reach. [If I Started A Business in 2026](https://www.youtube.com/watch?v=uWdIgftpvBI)\n11. **Hormozi's own AI software was paid per result.** Allen used AI to work leads and was paid per appointment that showed up. Leila says it cost about $2M in development. [I Built 4 Businesses In A Row](https://www.youtube.com/watch?v=0mqqbuM9sAk), [From Minimum Wage to $100M (Leila)](https://www.youtube.com/watch?v=EmaL_7j0uWk)\n\n## The \"perfect business\" test\nHormozi scores any idea on five things: sticky (customers keep paying), high margin, a growing market, simple to run, and hard to copy. Part 6 uses it to score your options. From Skool's data, the same video adds that over 20% of members leave in month 1, about 10% around month 3, and churn falls to about 2% a month after month 6. [What Makes The Perfect Business](https://www.youtube.com/watch?v=3fsJFUvA6Ts)\n\n## His website\nFrom search results; the site itself wouldn't load during the research.\n- **Free:** *$100M Money Models*, which the videos say is free to read online; free courses on offers and leads; a scaling roadmap at acquisition.com/roadmap.\n- **Paid:** [ACQ AI](https://ai.acquisition.com/), an AI business advisor trained on Hormozi's consulting work, and [ACQ Vantage](https://vantage.acquisition.com/), for founders above $1M a year. Neither is for you yet.\n\n**Try it this week.** Take point 2 literally. For each of two industries you know someone in, write three numbers: how many firms there are, what a solved problem is worth to one firm a month, and how easy it would be to deliver (1–5).","shelf":"ai","n":2},{"id":"LVM89ik-7Kw","channel":"Alex Hormozi","date":null,"videoMin":11,"title":"Not sure what to sell? Start with a service you half-know already","checked":null,"charts":false,"md":"**The idea.** There are only seven kinds of things anyone sells, each in a physical and a digital form. With little money, you'll almost always start by selling your time as a service. Pick the problem you can solve best with what you already know, then shape how you deliver it.\n\n## The seven things you can sell\n| What | Physical | Digital |\n|---|---|---|\n| Products | water bottles | a PDF |\n| Services | mowing a lawn, fixing a car | making ads, buying media |\n| Access | leasing a building | a content library (Netflix) |\n| Attention | a billboard | eyeballs on Facebook or Google |\n| Risk | insuring a building | cyber insurance, a paid guarantee (AppleCare) |\n| Money | cash, loans | digital money |\n| Endorsement | your logo on a shirt, for a cut | a paid check mark |\n\nA business can mix them. A concert sells access, drinks, shirts and the recording.\n\n## Picking yours\n- **You know more than you think.** What your parents did, odd jobs, the people you grew up around. His mom is an eye surgeon, so he knows a lot about eyes.\n- **With about $100, sell your time.** Physical products and software usually need money up front. A service doesn't.\n- **The sweet spot:** the person you can give the most value to, for the least cost to you.\n\n## Then shape it: the delivery cube\n1. **Group size:** one-to-one, small group, or one-to-many.\n2. **Who does the work:** they do it with your guide, you do it with them, or you do it for them. Done-for-you is easiest to sell and hardest to deliver.\n3. **Support:** chat, email, phone, video call. More scalable usually means less valuable.\n4. **Format:** live or recorded, in person or online, video, audio or text. Live and in person feels most valuable and scales least.\n5. **Speed:** hours open, days a week, how fast you answer.\n6. **The 10x and one-tenth test:** what would make it worth ten times the price? What could you strip out to deliver the same value at a tenth of it?\n\n**Try it this week.** List three things you already know from home, jobs or study. For each, name one person with a painful problem you could help one-to-one. Run the 10x test on the best one. Ties to P02 (a starving crowd) and P07 (the value equation).","shelf":"business","n":2},{"id":"atomic-habits-2","channel":"Atomic Habits","date":null,"videoMin":null,"title":"Identity first, and the four steps of every habit","checked":null,"charts":false,"md":"**The argument.** Lasting change starts with who you believe you are, not with what you want to get. And every habit, good or bad, runs on the same four-step loop, which gives you four places to change it.\n\n## Chapter 2: how your habits shape your identity\n- Behaviour changes at three layers: outcomes (what you get), processes (what you do) and identity (what you believe about yourself). Most people start with outcomes. Clear says start with identity.\n- Two people refuse a cigarette. One says \"No thanks, I'm trying to quit.\" The other says \"No thanks, I'm not a smoker.\" The second has changed something deeper.\n- **Every action is a vote** for the kind of person you want to become. You don't need every vote, just a majority. Small wins are the evidence that slowly changes what you believe about yourself.\n- Two steps: decide who you want to be, then prove it to yourself with small wins.\n\n## Chapter 3: how to build better habits in 4 simple steps\n- A habit is a behaviour repeated often enough to become automatic. The brain learns what's worth repeating by its results.\n- **The habit loop:** cue (notices a chance of reward) → craving (wants the change) → response (the habit itself) → reward (satisfies the craving, and teaches the brain to repeat it).\n- That gives **the Four Laws** for building a habit: make it obvious, make it attractive, make it easy, make it satisfying. Breaking a bad habit uses the opposites: invisible, unattractive, difficult, unsatisfying. The next four notes take one law each.\n\n**The idea worth keeping.** The identity lines on your goals (\"I'm becoming someone who reads every day\") aren't decoration. They're Clear's chapter 2, and every logged session is a vote for them.\n\n**Try it this week.** Your Buddha goal still has no identity line. Write one in the app, then cast one small vote for it each day.","shelf":"books","n":2,"part":"Ch. 2–3","by":"James Clear"},{"id":"ai-03","channel":"Evidence","date":null,"videoMin":null,"title":"What 187 founders built, and how they found customers","checked":"2026-10-22","charts":false,"md":"**The idea.** Most founders on Starter Story sell apps and small software, and they grew through content and social channels, not sales. LinkedIn and cold outreach, the channels that reach Dutch business owners, drove only 10 of the 187 cases.\n\nHow I counted: I sorted the 187 long case studies in your library by what they sell, read the monthly revenue from the titles (126 state one), and counted the growth channels each transcript keeps coming back to.\n\n## What they sell\n| What they sell | Cases | Median revenue in the title | Main growth channels |\n| --- | --- | --- | --- |\n| Mobile apps | 79 | $30k a month | Influencers and creator videos, TikTok, paid ads |\n| Websites and content | 33 | $40k a month | Google search, newsletters, Reddit |\n| SaaS and web tools | 32 | $25k a month | Google search, Reddit, X |\n| Services and agencies | 19 | $83k a month (10 state a figure) | X, newsletters, referrals |\n| Other, incl. 4 physical products | 24 | $77k a month (11 state a figure) | X, Instagram |\n\n## How they grew\nCases that keep coming back to each channel (one case can name several):\n\n| Channel | Cases |\n| --- | --- |\n| X (Twitter) | 29 |\n| Google search | 26 |\n| TikTok | 25 |\n| Influencers and creator videos | 25 |\n| Reddit | 21 |\n| Paid ads | 14 |\n| YouTube | 11 |\n| Instagram | 11 |\n| Newsletter or email list | 11 |\n| Partnerships and affiliates | 6 |\n| **LinkedIn** | **6** |\n| **Cold outreach** | **4** |\n| Word of mouth | 3 |\n| App Store search | 2 |\n\nThese founders sell to consumers and online buyers, so they grow through content and social media. Selling to Dutch firms runs on calls, visits, LinkedIn and referrals, which this data barely covers.\n\n## What the cases add to Hormozi\n- **These are winners picked for a show.** One episode follows a designer who built 72 apps in 60 days and earned $0. Two customer conversations a day and daily LinkedIn posts then brought $6,500 in 60 days. [He built 100 apps and made $0](https://www.youtube.com/watch?v=AoE1yX9ogCM)\n- **Building got cheap; customers didn't.** 81 of the 187 mention AI coding or no-code tools (Cursor, Claude Code, Lovable, Bubble). The scarce part is distribution.\n- **Boring holds up.** Packager makes about $60k a month from one task its founder used to do by hand in an IT job. It charged $25 a month during the beta and grew through Reddit and expert partners. [Most Boring SaaS](https://www.youtube.com/watch?v=LRX8TWC2hTM)\n- **AI costs surprise people.** Chris Raroque's AI app cost 10× the estimate ($40 instead of $3 for 20 light users), because every tool call is a paid request. Routing simple requests to cheaper models cut it by 80%. [My AI App Cost 10x More](https://www.youtube.com/watch?v=-jitDTcEWio)\n- **AI agencies stall; monthly packages last.** Greg Isenberg's guest calls AI automation agencies \"a tar pit\": one-off projects and hard sales, so most pivot within 12–18 months. A productized service with a fixed monthly deliverable is the better business. [6 Best AI Agency Niches](https://www.youtube.com/watch?v=6FSih5a5aIA)\n- **The safe sequence: service first, software second.** Isenberg's \"leveraged agency\": do one boring task by hand for 3–6 months and write down every edge case. Then have AI agents follow those steps, keep the price, and aim to lift margins from about 40% to 80%. [$12.5K/mo AI Agent Business](https://www.youtube.com/watch?v=jEUHvkhUD_w)\n\n**Try it this week.** Before you build anything, have two conversations with business owners. Ask what took too long last week. Write down their words, not your idea.","shelf":"ai","n":3},{"id":"EZLQzR-_83A","channel":"Alex Hormozi","date":null,"videoMin":12,"title":"Sell one thing, and let people choose how to pay for it","checked":null,"charts":false,"md":"**The idea.** From zero to $1M, sell one product to one kind of customer through one channel. Don't build a cheap, medium and premium menu. A confused mind doesn't buy, and whoever is selling won't know what to push. Make one offer that solves the whole problem, and flex the payment terms instead.\n\n## Why one thing\n- Many offers make the business messy. \"If your employees don't understand all the things you sell, your customers for sure don't.\"\n- 0 to $1M: one product, one avatar (one kind of customer), one channel. Add a second product line only around $1–3M, on the way to $10M: one thing up front, one for later.\n- With three tiers the seller has to choose, and usually can't. With one thing, there's one thing to convince people of.\n\n## Flex the payment, not the product\n- People look at the monthly cost, not the total they're signing up for.\n- His example, a six-month programme: pay in full,
