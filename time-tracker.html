 in two parts, in three (about 20% more in total), or monthly.\n- The question stops being \"which one do you want?\" and becomes \"how would you like to pay?\" More ways to pay means more people buy.\n- **\"The bigger the head, the longer the tail.\"** A big payment up front and a small monthly after ($5,000 down, then $99 a month) keeps people far longer than $99 a month alone. The up-front cash also covers ads, commission and onboarding.\n\n**Watch for.** He aims this at owners under about $3M who aren't strong operators. Charging more for spreading the payments is common, but say it plainly to the customer.\n\n**Try it this week.** Write your service as one sentence: who it's for, the problem it solves, and in how long. Then write three ways to pay for it. If you catch yourself writing a second service, cut it. Ties to P07 and P08.","shelf":"business","n":3},{"id":"atomic-habits-3","channel":"Atomic Habits","date":null,"videoMin":null,"title":"Make it obvious: awareness, a time and place, and the room around you","checked":null,"charts":false,"md":"**The argument.** The first law. A habit starts with a cue, so make the cues for good habits impossible to miss and the cues for bad ones hard to see.\n\n## Chapter 4: the man who didn't look right\n- With enough practice the brain spots patterns without thinking. That's why habits slip out of awareness, the bad ones included.\n- Japanese train operators point at each signal and call it out loud. This \"pointing and calling\" cuts mistakes by up to 85%.\n- **The Habits Scorecard:** list what you do on a normal day, from waking up on, and mark each habit good (+), bad (−) or neutral (=). Don't judge; just notice.\n\n## Chapter 5: the best way to start a new habit\n- **Implementation intention:** \"I will [habit] at [time] in [place].\" In one exercise study, 91% of people who wrote this down exercised at least weekly, against about 35–38% of those who didn't.\n- **Habit stacking:** \"After [a habit I already have], I will [the new habit].\" Your existing routine becomes the cue.\n\n## Chapter 6: motivation is overrated; environment often matters more\n- In a hospital cafeteria, putting bottled water by the tills and in more fridges raised water sales by about a quarter and cut soda sales by about a tenth. Nobody was persuaded; the room changed.\n- Put the cue for a good habit where you'll see it: the book on your pillow, the guitar in the middle of the room.\n- One space, one use: if the bed is for sleep, the desk for work, each place cues one thing.\n\n## Chapter 7: the secret to self-control\n- Many US soldiers used heroin in Vietnam, yet only about 5% relapsed within a year of coming home. Their surroundings changed, and so did the cues.\n- People with \"great self-control\" mostly just spend less time near temptation. Remove the cue: the phone in another room beats willpower.\n\n**Try it this week.** Give one piece in the app a \"+ when\" in this exact form: \"after [existing habit], at [time], in [place]\". For example: \"After breakfast, 7:30, at my desk: 20 minutes of Atomic Habits.\"","shelf":"books","n":3,"part":"Ch. 4–7","by":"James Clear"},{"id":"ai-04","channel":"Evidence","date":null,"videoMin":null,"title":"The Dutch market: where the gap is","checked":"2026-10-22","charts":false,"md":"**The idea.** The gap is in ordinary small firms. Tech companies already use AI; builders, installers and restaurants mostly don't, while their staff are scarce and among the most expensive in Europe.\n\n## Who uses AI already\n| Sector | Firms with 2+ staff, 2025 | Micro firms with 2–9 staff, 2025 |\n| --- | --- | --- |\n| Information and communication | 54% | 50.4% |\n| Construction | 7% | 4.6% |\n| Hospitality (horeca) | 6% | 4.2% |\n| All sectors | about 1 in 6 | — |\n\nThe CBS figures are provisional. In 2024, 59% of firms with 500+ staff used AI, against about 18% of firms with 10–19. [CBS](https://www.cbs.nl/nl-nl/nieuws/2025/50/bedrijven-gebruiken-ai-vaakst-voor-marketing-of-verkoop), [CBS micro firms](https://www.cbs.nl/nl-nl/longread/rapportages/2026/gebruik-van-ai-technologie-door-nederlandse-microbedrijven?onepage=true), [CBS 2024](https://longreads.cbs.nl/the-netherlands-in-numbers-2025/how-many-companies-in-the-netherlands-are-using-ai)\n\n## Ten numbers, and why each matters to you\n- **€47.90 for an hour of staff time** (EU average €34.90), the third highest in the EU in 2025. [Eurostat figures via BCCI](https://www.infobusiness.bcci.bg/bulgaria-has-lowest-labour-costs-in-eu-in-2025-but-highest-annual-increase.html) *For you:* a service that saves 15 hours a month is worth about €700 to a firm. That's your pricing anchor.\n- **95 vacancies per 100 unemployed** in Q2 2026; the peak was 142 in 2022. [CBS](https://www.cbs.nl/nl-nl/nieuws/2026/31/werkloosheid-gedaald-in-tweede-kwartaal-2026) *For you:* \"you can't hire, so automate\" still lands.\n- **About 29,400 open vacancies at installers** in mid-2025, with over 60% of firms hiring. [Wij Techniek](https://trendfiles.wij-techniek.nl/wp-content/uploads/Uitkomsten-bedrijvenenquete-Wij-Techniek-2025.pdf) *For you:* Techniek Nederland says capacity, not demand, now limits the sector, and it is turning to AI. [Outlook](https://trendfiles.wij-techniek.nl/wp-content/uploads/economische-vooruitzichten-2027-en-verder-techniek-nederland.pdf)\n- **1,654,300 SMEs** in Q1 2026, about 81% of them one-person firms. [Staat van het mkb](https://www.eur.nl/en/media/2026-09-ecexezkdestaatvhnederlandsemkb2026-1509) *For you:* about 300,000 firms have staff. Those are your buyers.\n- **Half of entrepreneurs don't know the AI Act,** 7% know it well, and 3 in 10 use ChatGPT or Copilot (KVK, 651 surveyed, June 2025). [KVK](https://www.kvk.nl/pers/kvk-onderzoek-ondernemers-zetten-nauwelijks-stappen-rond-europese-ai-wetgeving/) *For you:* self-employed people said they don't know where to start.\n- **Over 500,000 small firms are selling or plan to:** 12% are selling, 23% plan to within 5 years. [Kleinbedrijf Index, Feb 2026](https://www.onl.nl/wp-content/uploads/2026/02/KB-index_Editie-19_Februari-2026.pdf) *For you:* serve an industry now; buying a firm later becomes an option (part 6).\n- **Data leaks from AI are rising.** The Dutch privacy regulator (AP) reports fast-rising breach reports from staff pasting data into chatbots, more in 2025 than in 2024. [accountant.nl](https://www.accountant.nl/nieuws/2025/12/ap-slaat-alarm-over-datalekken-door-ai/) *For you:* a privacy-safe setup is part of what you sell.\n- **A 56% wage premium** for workers with AI skills in the same job, worldwide, 2025. [PwC](https://www.pwc.com/gx/en/services/ai/ai-jobs-barometer.html) *For you:* the same skill pays off on your Career branch.\n- **1,296 Dutch AI startups** and Europe's highest AI talent density, but only 21.2% grow into scale-ups, against 31.1% EU-wide. [Dealroom](https://dealroom.co/lists/ai-startups-netherlands/), [TNO](https://www.tno.nl/en/newsroom/2026/02/state-dutch-tech-2026/) *For you:* building AI tech is crowded; applying it in ordinary firms isn't.\n- **A Dutch-language model is coming.** GPT-NL is in pilots with its first organisations; a public version is planned for late 2026. [Dutch IT Channel](https://www.dutchitchannel.nl/news/725960/nederlands-taalmodel-gpt-nl-bij-eerste-gebruikers-getest) *For you:* Dutch-language, EU-hosted AI is becoming a selling point.\n\n**Try it this week.** Ask one person you know who works at a small firm (5–50 staff) a single question: what job there is still done by hand every week, and how long it takes.","shelf":"ai","n":4},{"id":"iR0QEbdWRN8","channel":"Leila Hormozi","date":null,"videoMin":20,"title":"Which business skills to learn first: Leila's tier list","checked":null,"charts":false,"md":"**The idea.** When you're new, the skills that matter most are selling, building the offer and communicating. Finance, negotiation and deal-making can wait. Learn to sell by doing it yourself: the calls are where you learn who your customer is.\n\n## Her ranking, for a new business\n| Tier | Skill | Why |\n|---|---|---|\n| S | Sales | The founder is the first and best salesperson. Calls show you who it's for, and who it isn't. |\n| S | Offer | What you give, what it costs, how they pay. Get it right and everything else is easier. |\n| S | Communication | She moved it up mid-video: listening and seeing it from their side is how you find the offer. |\n| A | Product | Solve one problem very well, and expect to change it 5–10 times. Word of mouth is the test. |\n| A | Marketing | Pick one channel where your customers already are, and get it working well. |\n| B | Managing people | Onboard well: give context, then the skills the job needs. |\n| B | Hiring | Recruiting is marketing, aimed at employees. |\n| C | Finance | Learn to read a profit-and-loss statement; pay a firm to make it. |\n| D | Selling your company | Irrelevant until you have something people buy. |\n| Last | Negotiation | Later. Start by asking what the other side wants. |\n\n## Two examples she gives\n- **Selling without \"selling\":** she was told she was just signing people up for a gym. Be honest about what you offer and who it's for.\n- **An offer that changed everything:** Gym Launch went from $10,000 up front for 16 weeks to $16,000, paid $1,000 a week out of the money the programme was making the gym. Higher price, lower risk for the customer, better results.\n\nOnce a business is bigger, every skill moves to the top tier, because you need a team that's good at all of them.\n\n**Try it this week.** Count the times you've talked someone into something: a job, tutoring, a club. If it's under ten, selling is your first skill to practise. The next two reads are how. Ties to P04 (ask about their life, not your idea).","shelf":"business","n":4},{"id":"atomic-habits-4","channel":"Atomic Habits","date":null,"videoMin":null,"title":"Make it attractive: wanting, belonging, and reframing the craving","checked":null,"charts":false,"md":"**The argument.** The second law. We act because we expect a reward, so make the habits you need look like something you want, and surround yourself with people for whom they're normal.\n\n## Chapter 8: how to make a habit irresistible\n- Gulls will peck at an exaggerated fake beak over a real one, and junk food works the same way: an exaggerated version of what we're wired to want.\n- Dopamine rises when we *expect* a reward, not only when we get it. Wanting drives action more than liking does.\n- **Temptation bundling:** pair something you need to do with something you want to do. One student rigged his exercise bike so Netflix only played while he pedalled.\n- Stack it: \"After [current habit], I'll do [habit I need]. After [habit I need], I'll do [habit I want].\"\n\n## Chapter 9: the role of family and friends in shaping your habits\n- László Polgár set out to show that genius is trained, and raised three daughters who became chess champions.\n- We copy three groups: **the close** (family, friends), **the many** (the crowd), and **the powerful** (people with status).\n- Join a group where your habit is the normal thing to do. Belonging beats willpower.\n\n## Chapter 10: how to find and fix the causes of your bad habits\n- A craving is a surface version of a deeper need: connection, status, less uncertainty, rest.\n- Feelings come from the story you tell about a habit. Change \"I *have* to study\" to \"I *get* to study\"; read nerves before a talk as excitement.\n- A motivation ritual: do something you enjoy right before a hard habit, and over time the two become linked.\n\n**Compare it with your Buddha goal.** Clear treats craving as fuel, something to steer toward better habits. Buddhist teaching treats craving as the root of suffering, something to see clearly and let go of. Where do they agree, and where not? It's a good question for your map.\n\n**Try it this week.** Bundle one need with one want: Atomic Habits only on your walk, or your favourite drink only while you do the FIRE cost breakdown.","shelf":"books","n":4,"part":"Ch. 8–10","by":"James Clear"},{"id":"ai-05","channel":"Evidence","date":null,"videoMin":null,"title":"The Dutch rules that shape how you sell","checked":"2026-10-22","charts":false,"md":"**The idea.** The biggest difference from the American videos: cold email to Dutch businesses isn't allowed without consent. Phoning a BV is. Everything else is manageable if you set it up right from the start.\n\n## Finding clients\n- **Cold email** (Telecommunicatiewet art. 11.7). Commercial email needs prior consent, also to businesses and to info@ addresses, since 1 October 2009. Existing customers may be emailed about similar services if they could opt out. [Law & More](https://lawandmore.nl/zakelijke-e-mails-of-spam-wat-bedrijven-wel-en-niet-mogen-doen/), [ACM](https://www.acm.nl/nl/telecom/zakelijk-abonnement-voor-bellen-en-internet/spam) *What you do:* don't copy US cold-email playbooks or buy email lists. Use the phone, visits, LinkedIn, referrals, trade associations and content; email after a first contact.\n- **Cold calling.** Since 2021 calls need opt-in for people, including sole traders (eenmanszaak) and partnerships (VOF). A BV, NV or stichting isn't covered. [Fieldfisher](https://www.fieldfisher.com/en/insights/new-rules-for-telemarketing-in-the-netherlands) *What you do:* check the legal form in the KVK register before you call. Calling a BV is allowed.\n\n## Using AI for clients\n- **AI literacy** (AI Act art. 4). Since 2 February 2025, firms that use AI must take measures to build their staff's AI literacy. The 2026 Omnibus softened the wording but kept the duty. [KI-Campus](https://ki-campus.org/en/blog/eu-ai-act-ai-omnibus-recalibrates-article-4-ai-literacy-remains-mandatory) *What you do:* it's a real reason for firms to pay for practical AI training. Sell the results; mention the duty.\n- **High-risk AI** (AI Act). AI that screens or ranks job candidates or staff is high-risk. The Omnibus moved those duties to 2 December 2027 (stand-alone systems) and 2 August 2028 (built into products). [Cuatrecasas](https://www.cuatrecasas.com/en/spain/labor-and-employment/art/digital-omnibus-on-ai-how-does-it-impact-employment-relations) *What you do:* don't make candidate scoring your first product. Writing job ads is fine.\n- **Chatbot transparency** (AI Act). From August 2026 a chatbot must make clear that it is an AI. [LegalNews](https://legalnews.be/innovation-ai/het-gebruik-van-ai-chatbots-door-zorgaanbieders-hoe-datalekken-te-voorkomen-akd/) *What you do:* label every chat or voice agent you set up.\n- **Privacy** (AVG/GDPR). Client data in an AI tool needs a data-processing agreement (verwerkersovereenkomst). The AP wants clear rules on what staff may paste into chatbots. [accountant.nl](https://www.accountant.nl/nieuws/2025/12/ap-slaat-alarm-over-datalekken-door-ai/) *What you do:* use business plans that don't train on client data, EU hosting where you can, and a one-page AI policy for each client. Sell it as a feature.\n\n## Your own business\n- **Fake self-employment** (Wet DBA). Enforced again since 2025. In 2026 there are no default fines, but back taxes are possible. [Knab](https://bieb.knab.nl/ondernemen/handhaving-wet-dba-dit-betekent-het-voor-jou) *What you do:* sell a defined monthly deliverable to several clients, not hours to one client under their direction.\n- **Starting.** Register an eenmanszaak at the KVK: about €85 one-off in 2026 (sources differ). [Finom](https://finom.co/nl-nl/blog/kosten-kvk-inschrijving/) *What you do:* do it when the first client says yes, not before.\n- **VAT** (the KOR scheme). Under the KOR you charge no BTW up to €20,000 turnover a year, but you can't reclaim BTW on your costs. *What you do:* business clients reclaim BTW anyway, so for B2B the KOR mostly costs you the BTW back on your laptop and software. Ask an adviser before you choose.\n- **Income tax, 2026.** Box 1: 35.75% up to €38,883, 37.56% up to €78,426, 49.5% above. A 12.7% SME profit exemption with no hours test. The €1,200 self-employed and €2,123 starter deductions need 1,225 hours a year. [KVK](https://www.kvk.nl/geldzaken/belastingtarieven-2026/), [Rabobank](https://www.rabobank.nl/bedrijven/eigen-bedrijf-starten/belasting/zelfstandigenaftrek-en-startersaftrek-zo-zit-dat) *What you do:* you won't reach 1,225 hours while studying, so plan without those deductions. A BV (19% corporate tax up to €200,000) only pays off much later.\n- **Student finance.** Higher-education students can earn without a cap next to student finance, and a business doesn't affect it; income-based allowances like zorgtoeslag can. [Onderneming.nl](https://www.onderneming.nl/bedrijf-starten/starten/ondernemen-als-student/) *What you do:* check DUO and your allowances once profit grows.\n- **R&D tax break** (WBSO). A self-employed R&D deduction of €15,979, plus €7,996 for starters, but it needs 500 R&D hours and 1,225 hours in total. [RVO](https://rvo.nl/wbso) *What you do:* only relevant later, if you build real software full-time.\n- **Training subsidy** (SLIM). SMEs can get 60% of training costs back, up to €24,999 per application. The 2026 rounds are closed. [KHN](https://khn.nl/nieuws/de-slim-subsidie-vanaf-19-augustus-kun-je-m-weer-aanvragen) *What you do:* your clients may get your training subsidised in 2027. Check the 2027 round dates.\n\n**Try it this week.** Look up three firms you might approach in the KVK register and note each one's legal form. A BV you may phone; an eenmanszaak you reach through an introduction.","shelf":"ai","n":5},{"id":"w7g08dVTwaE","channel":"Alex Hormozi","date":null,"videoMin":16,"title":"Your first five customers in ten steps: free first, then step the price up","checked":null,"charts":false,"md":"**The idea.** You already know enough people to start. Message them one by one, like a human, a hundred a day. Don't sell to them; ask who they know. Take your first five on for free in return for feedback and a review. Then raise the price in steps until you're full.\n\n## The ten steps\n1. **Make three lists:** every email contact, every social account you can message, every phone contact. It's more than you think.\n2. **Pick one platform:** whichever has the most of them.\n3. **Make it personal.** Thirty seconds on their profile: a new baby, a new job, a move. Just show you're not blasting everyone.\n4. **Reach out to 100 a day.** The first message is the hard one; the second takes two minutes.\n5. **When they reply, use ACA:** acknowledge (\"you have two kids\"), compliment (\"you must be a super mum, working full time with two kids\"), ask a question that leads to what you do (\"how do you find time to eat well and work out?\").\n6. **Ask for their friends, not their money.** \"Do you know anyone looking for X? I'm opening a few spots.\" It's a favour, not a pitch.\n7. **Make it free, honestly.** Five free case studies, if they (1) actually use it, (2) give feedback, (3) leave a review if it's earned. If someone won't take it even free, ask why. Those are hidden costs you can remove, and later charge more for.\n8. **Go back to the top of the list.** Referrals bring free leads. \"Reach out to 3,000 people with a free thing and you'll get five.\"\n9. **Start charging once people refer you.** The next five pay 80% less than full price, then 60, 40, 20, full price, and above it once you're worth more.\n10. **Keep them warm.** Check in, share results and reviews, until people start asking you.\n\n## Why free first\n- You need reps, and you aren't good yet. You get good by doing more.\n- It isn't really free: they pay with time, effort and the review. (When Buffett offered to work for Ben Graham for free, Graham said he was overpriced.)\n- When the spots fill, the scarcity is real. You can tell a free client someone is now paying full price for their spot.\n\n**Watch for.** Half the video promotes the launch of his book $100M Leads; these steps are its warm-outreach method. Free works for a service you can deliver to five people. Don't run it for months.\n\n**Try it this week.** Make the three lists and count them. Write your one-line offer in his template: \"I help [who] get [dream outcome] in [time] without [effort or sacrifice].\" Send the first 20 personal messages. Ties to P06 (commitment) and P10 (do things that don't scale).","shelf":"business","n":5},{"id":"atomic-habits-5","channel":"Atomic Habits","date":null,"videoMin":null,"title":"Make it easy: repetitions, less friction, and the two-minute rule","checked":null,"charts":false,"md":"**The argument.** The third law. People do what takes the least effort. Make good habits so easy you can't say no, and make bad ones hard.\n\n## Chapter 11: walk slowly, but never backward\n- A photography teacher split his class: one half graded on quantity, the other on making one perfect photo. The quantity group took the best photos; they learned by doing.\n- **Motion versus action:** planning and researching feel productive but produce nothing. Action does. Motion can be a polite way to procrastinate.\n- A habit forms by repetition, not by time. The question isn't \"how many days?\" but \"how many times?\"\n\n## Chapter 12: the law of least effort\n- Every bit of friction between you and a habit cuts the chance you'll do it.\n- Remove steps for good habits and add steps for bad ones.\n- Prepare the space for next time: lay out your gym clothes, reset the room after you use it.\n\n## Chapter 13: how to stop procrastinating by using the two-minute rule\n- Some small choices set the course for the next few hours: what you do when you walk in the door decides the evening. Clear calls them decisive moments.\n- **The two-minute rule:** scale a new habit down until it takes two minutes. \"Read before bed\" becomes \"read one page\".\n- Master showing up first. A habit has to exist before it can be improved. Then build it up step by step.\n\n## Chapter 14: how to make good habits inevitable and bad habits impossible\n- Victor Hugo locked away his clothes so he couldn't go out until his book was finished: a commitment device.\n- **One-time choices** pay off forever: unsubscribe, delete the app, buy the better mattress. Automation is the strongest form.\n\n**The idea worth keeping.** The automatic monthly transfer in your FIRE plan is exactly chapter 14. You make one choice once, and it saves every month after.\n\n**Try it this week.** Scale one stuck piece down to two minutes. \"Read 10 job ads\" becomes \"open one job ad\". Start its timer anyway.","shelf":"books","n":5,"part":"Ch. 11–14","by":"James Clear"},{"id":"ai-06","channel":"Options","date":null,"videoMin":null,"title":"Six ways to make money with AI, scored","checked":"2026-10-22","charts":false,"md":"**The idea.** A monthly AI-powered service for one industry scores best: recurring revenue, high margins, a growing market, and a first euro within weeks. Your SaaS idea scores well on margin and simplicity but badly on time and copying, so it works best as step two.\n\n## The scores\nScores run from 1 (weak) to 5 (strong). The first five columns are Hormozi's \"perfect business\" tests from part 2; the last two are about your situation.\n\n| Option | Sticky | Margin | Growing market | Simple to run | Hard to copy | Fits 14 min a weekday | First euro | Verdict |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| **Productized AI service** | 4 | 4 | 5 | 3 | 3 | 3 | weeks | **Start here** |\n| AI training for teams | 2 | 5 | 4 | 4 | 2 | 2 | weeks | Add-on and lead source |\n| Freelance AI building | 1 | 4 | 5 | 3 | 2 | 1 | weeks | Fallback only |\n| Vertical micro-SaaS | 4 | 3 | 4 | 5 | 2 | 2 | months | Year 2, grown from the service |\n| Consumer AI apps | 2 | 3 | 4 | 4 | 1 | 2 | a lottery | Skip for now |\n| Content about your niche | 3 | 5 | 4 | 5 | 4 | 3 | 6–12 months | Run alongside, small |\n\nWhat each one is: a **productized service** delivers a fixed result to firms in one industry every month; **training** means half-day workshops for SME teams; **freelance building** means one AI agent per project, at €3,000–15,000; **vertical micro-SaaS** is software for one industry; **content** means building an audience around your niche.\n\n## Why the scores\n- **Service, sticky 4:** a monthly deliverable keeps billing; projects end. **Simple 3:** you are in the delivery until it is automated.\n- **Service, hard to copy 3:** anyone can buy the same AI. What competitors can't copy is your notes on every client's edge cases, your relationships and your results.\n- **Training, sticky 2:** one-off days, so it's a door-opener into the monthly service. **Fits your time 2:** you deliver it live, in office hours.\n- **Freelance building, sticky 1:** project work is what Cody Schneider calls \"a tar pit\". Agent builds in the Netherlands run €3,000–15,000 each ([Informatec Digital](https://informatecdigital.com/nl/guia-completa-sobre-el-coste-y-la-implementacion-de-la-ia-agentica-para-empresas/)), and freelance AI consultants average €120 an hour ([Knab](https://bieb.knab.nl/wat-verdient-een-ai-specialist-zzp-bekijk-uurtarief-en-winst)). Good money, but every month starts at zero.\n- **Micro-SaaS, margin 3:** AI products run at roughly 50% gross margin, against 75–85% for classic SaaS, because every request costs inference. [SaaStr](https://www.saastr.com/have-ai-gross-margins-really-turned-the-corner/)\n- **Micro-SaaS, hard to copy 2:** AI coding lets anyone clone a tool in days, and investors marked down per-seat software in the 2026 \"SaaSpocalypse\". [Betterment](https://www.betterment.com/advisors/resources/ai-software-stocks-market-news-may-2026)\n- **Consumer apps:** in the Starter Story data (part 3) they grow through influencers and paid ads, which favours studios with budgets.\n- **Content:** builds the proof and brand Hormozi calls the moat, but pays late. Fifteen minutes a day documenting your client work is enough.\n\n## Two paths for later\n- **Buy a firm and run it with AI** (an \"AI roll-up\"). Over 500,000 small Dutch firms are for sale or soon will be. Isenberg's way in is to serve one industry first, then buy from an owner who already trusts you. It needs capital and experience, so years 3–5. [AI Roll Ups](https://www.youtube.com/watch?v=ZT4mpjx0JnE)\n- **AI skills in a job.** Companies now hire \"forward-deployed engineers\" and AI implementers: people who find the work worth automating, test it and roll it out inside the systems the company already uses. The same skill feeds your Career branch, with the 56% wage premium from part 4. [FDE explained](https://www.youtube.com/watch?v=zXysLUTLjw4)\n\n**Try it this week.** Score your own SaaS idea on the same seven columns. If \"hard to copy\" or \"fits your time\" comes out at 1 or 2, write down which service would teach you what to build.","shelf":"ai","n":6},{"id":"UR9dO1jZemE","channel":"Alex Hormozi","date":null,"videoMin":8,"title":"The rule of 100: a hundred reach-outs a day before you judge the results","checked":null,"charts":false,"md":"**The idea.** If you're not getting customers every week, you're almost certainly not doing enough volume. His rule: 100 reach-outs a day, or $100 a day on ads, every day, for 90 days. Skill comes from volume, not the other way round.\n\n## The loop\n- A master needs less volume for the same result. But the only way to become one is volume.\n- You'll be bad at first and hope to break even. Volume builds skill, skill gets more from each message, you start to like it, and you do more.\n- Most people reach out once a week \"when motivated\", or spend $100 once and call it a test.\n\n## Two ways to start\n| | Outreach | Paid ads |\n|---|---|---|\n| What | you message people yourself | you pay a platform to show them |\n| Rough response | about 1% reply | about 1% click |\n| Costs you | time | money |\n\n- With no budget, it's outreach. You're selling your time anyway.\n- Once you have the skill, teach it. Others will be half as good, but ten people at half as good beat you alone.\n\n**Try it this week.** Track one number: reach-outs per day. Aim for 100, spread across the three lists from the last read. Don't judge the results until you've done it daily for a few weeks; his number is 90 days. Ties to P10.","shelf":"business","n":6},{"id":"atomic-habits-6","channel":"Atomic Habits","date":null,"videoMin":null,"title":"Make it satisfying: reward it now, track it, never miss twice","checked":null,"charts":false,"md":"**The argument.** The fourth law. We repeat what feels good *right now*. Good habits pay off later and bad ones pay off immediately, so add a small reward today.\n\n## Chapter 15: the cardinal rule of behaviour change\n- In Karachi, a researcher handed out a soap that smelled nice and lathered well. Handwashing went up, and child diarrhoea and pneumonia fell by about half. The pleasant soap made the habit satisfying.\n- **The cardinal rule:** what is immediately rewarded is repeated; what is immediately punished is avoided.\n- Our brains evolved for instant payoffs. Good habits need a small reward in the moment, one that fits the identity you're building.\n\n## Chapter 16: how to stick with good habits every day\n- A young stockbroker kept two jars and moved a paper clip from one to the other after every sales call. Seeing progress kept him going.\n- **Habit tracking** is a reminder, a small reward and an honest record, all at once. \"Don't break the chain.\"\n- **Never miss twice.** Missing once is an accident; missing twice starts a new habit. On a bad day, do a smaller version.\n- Watch out: once a number becomes the target, it stops being a good measure. Track what really matters, not just what's easy to count.\n\n## Chapter 17: how an accountability partner can change everything\n- Make a bad habit cost you something right away and in public.\n- **A habit contract:** write down what you'll do and what happens if you don't, and have one or two people sign it.\n\n**The idea worth keeping.** The seven dots on each goal and the \"Missed yesterday — don't miss twice\" line are chapter 16 built into your app. A filled dot is your paper clip.\n\n**Try it this week.** Keep one goal's dots unbroken for seven days. On the hard day, do two minutes: it still counts.","shelf":"books","n":6,"part":"Ch. 15–17","by":"James Clear"},{"id":"ai-07","channel":"Options","date":null,"videoMin":null,"title":"Dutch niches, ranked","checked":"2026-10-22","charts":false,"md":"**The idea.** The two best first niches are installation firms (desperate for capacity, almost no AI yet) and export-minded SMEs (a direct fit with your International Business degree). Accountancy firms are a strong third. Hormozi's rule for picking: number of potential customers × gross profit per customer × ease of delivery.\n\n## The two top picks\n**Installers and technical services** (heating, heat pumps, solar, electrical). *Top pick if you can reach 3–5 owners.*\n- **The pain:** about 29,400 open vacancies; over 60% of firms hiring; capacity, not demand, limits growth.\n- **AI use now:** construction 4.6–7%.\n- **Competition:** generic field-service software; few AI services built for them.\n- **What you'd deliver each month:** lead response within an hour, quote follow-ups, review requests and replies, job ads.\n\n**Export-minded SMEs** (webshops and manufacturers selling to Germany, Belgium and France). *Top pick for your degree; check the pain in interviews.*\n- **The pain:** Germany takes just over a fifth of Dutch goods exports (€655bn in 2025). [CBS](https://www.cbs.nl/nl-nl/nieuws/2026/42/export-groeit-met-bijna-5-procent-in-augustus)\n- **AI use now:** varies.\n- **Competition:** translation agencies, DeepL, the marketplaces' own tools.\n- **What you'd deliver each month:** product listings, quotes and customer replies in German and French, checked by a person.\n\n## A strong third\n**Accountancy and bookkeeping firms.** *Also the classic roll-up target.*\n- **The pain:** 31,845 firms (Q2 2026); private equity is buying the big ones; staff are scarce. [Accountancy Vanmorgen](https://www.accountancyvanmorgen.nl/2026/06/10/partner-fiscount-drang-om-eigen-kantoor-te-starten-onverminderd-sterk/)\n- **AI use now:** rising, through their software.\n- **Competition:** Exact, Twinfield and the other packages are adding AI themselves.\n- **What you'd deliver each month:** chasing missing documents, client emails, month-end prep for the messiest clients.\n\n## Medium\n- **Estate agents (makelaars).** Funda is raising listing prices (the cheapest package to €231 from €110 for NVM members) and selling its own AI styler. [NL Times](https://nltimes.nl/2026/06/19/housing-site-funda-launching-new-website-ai-tool-attract-buyers-cooling-market) Funda and Realworks build AI in. You'd deliver listing texts in Dutch and English, social posts and buyer follow-up. *Squeezed by the platforms.*\n- **Recruitment and staffing agencies.** Hiring is still hard: 95 vacancies per 100 unemployed. Many HR-tech tools already. You'd deliver job ads, candidate outreach and interview summaries. *Never rank candidates: that's high-risk under the AI Act.*\n\n## Weak, or skip\n- **Hospitality (horeca).** Staff shortages and thin margins; AI use 4.2–6%. AI phone receptionists already cost €23–300 a month. [Beancount](https://beancount.io/nl/blog/2026/07/16/ai-phone-agents-receptionist-small-business-guide) *Weak: low budgets, commoditised tools.*\n- **GP and physio practices.** 36% of GP practices already use AI voice reporting, up from 14% a year before. [Bright, citing Nivel](https://www.bright.nl/nieuws/2122941/honderden-nederlandse-huisartsen-gebruiken-ai.html) Specialist Dutch vendors link into patient records. *Skip: validated, but regulated and taken.*\n\n## What to check in your interviews\n- Who has the pain *and* the budget: firms with 5–50 staff, not one-person businesses.\n- One task that recurs every week in every firm, done the same way. Hormozi's \"inch wide and a mile deep\".\n- What it costs them now, in hours or lost jobs. At €47.90 an hour, 15 hours a month is worth about €700.\n- Whether you can get introductions: family, a part-time job, your thesis company, a trade association.\n\n**Try it this week.** For each of the top three niches, write down who you already know there, even at one remove. The niche with the most names is your first pick, whatever the ranking says.","shelf":"ai","n":7},{"id":"pxVeOkOVr2w","channel":"Alex Hormozi","date":null,"videoMin":19,"title":"The offer is king: believable, worth it in a few words, and \"free\" used on purpose","checked":null,"charts":false,"md":"**The idea.** With a good enough offer you don't need to sell hard or write great ads. Great offers are believable, say their value in a few words, and are built so the business still makes money, often by using \"free\" on purpose.\n\n## Three famous offers\n- Domino's: at your door in 30 minutes or it's free.\n- 10 CDs for a penny (with a membership behind it).\n- FedEx: when it absolutely has to be there overnight.\n\n## What they share\n1. **Believable.** A marketer once advertised \"send me $1 and I'll send you $1,000\" and got zero replies. Give a reason why: \"we're overstocked, everything's half off.\"\n2. **Valuable in a few words.** \"30 minutes or it's free.\" If someone can't repeat your offer in a sentence or two, it isn't clear enough.\n3. **A business behind it.** Free brings the most leads at the lowest cost, but you have to know how it pays.\n\n## Seven ways to use \"free\" (his gym examples)\n| Way | How it works |\n|---|---|\n| Free bonus | Something big free when they buy the smaller thing (all past courses free with a monthly membership) |\n| Limited free | A basic free trial, then the full version with a guarantee |\n| Free with a penalty | Free, but missed sessions cost money, so they actually show up |\n| Free with a deposit | Put money down; get it back, or credited, if they hit the goal |\n| Free forever | Give the service away and earn on something else (one clinic made about 95% of its revenue on supplements) |\n| Giveaway | A prize related to your offer; everyone who enters is a lead |\n| Free with commitment | First month free if they sign up for longer |\n\n**Watch for.** It's aimed at gym owners, and several of these need careful, honest wording. Tell people clearly before you bill them: he says about 30% of trial users who get billed without being sold call to cancel.\n\n**Try it this week.** Write your offer in one sentence a friend could repeat. Add a reason why (\"I'm taking five people at a lower price to build case studies\"). Pick one way to use free from the table that fits a service. Ties to P07.","shelf":"business","n":7},{"id":"atomic-habits-7","channel":"Atomic Habits","date":null,"videoMin":null,"title":"Beyond the basics: talent, boredom, and keeping habits honest","checked":null,"charts":false,"md":"**The argument.** Habits work best in areas that suit you. The real enemy is boredom, not failure, and even good habits need regular review so they don't harden into autopilot.\n\n## Chapter 18: the truth about talent\n- Michael Phelps and runner Hicham El Guerrouj differ in height by several inches but have legs of about the same length. Each body suits its sport.\n- Genes don't decide your destiny, but they decide where you have an edge. Choose habits that fit your nature.\n- To find where you have an edge, ask: what feels like fun to me but work to others? What makes me lose track of time? Where do I get better returns than most?\n- Explore first, then focus. If you can't be the best at one thing, combine two skills few people have together.\n\n## Chapter 19: the Goldilocks rule\n- Steve Martin spent about 18 years on comedy: roughly ten learning, four refining, four as a star.\n- **The Goldilocks rule:** motivation peaks on tasks just past your current ability, not too easy and not too hard.\n- The bigger threat is boredom. Professionals stick to the schedule; amateurs wait until they feel like it. Learn to love doing the same thing again.\n\n## Chapter 20: the downside of creating good habits\n- Habits free your attention, but on autopilot you stop noticing mistakes. Mastery is habits plus deliberate practice.\n- The Lakers under Pat Riley tracked every player's numbers and aimed for small yearly gains on their career best.\n- **Reflect and review:** Clear writes a yearly review (what went well, what didn't, what I learned) and checks his life against his values.\n- Hold your identity loosely. \"I'm an athlete\" can break when your sport ends; \"I'm someone who's mentally tough\" can last.\n\n## Conclusion: the secret to results that last\nOne coin doesn't make you rich, and one push-up doesn't make you strong, but enough of them do. Keep looking for the next 1%.\n\n**Try it this week.** Open the app's Review tab on Sunday and answer three questions: what went well, what didn't, what did I learn? That's Clear's review, done weekly.","shelf":"books","n":7,"part":"Ch. 18–20","by":"James Clear"},{"id":"ai-08","channel":"Options","date":null,"videoMin":null,"title":"Your offer: three worked examples","checked":"2026-10-22","charts":false,"md":"**The idea.** Price each offer at about half the value it creates, name one measurable result, and back it with a guarantee. These are starting drafts: your interviews set the real task and price.\n\n## Installers: \"No lead left waiting\"\n- **Every month they get:** every web and phone enquiry answered within 15 minutes; quote follow-ups on day 2 and day 7; a review request after every job; a monthly report.\n- **Your AI behind it:** website and phone intake, follow-up messages, review requests.\n- **Value to them:** one extra job a month at about €900 profit covers the fee.\n- **Price:** €750 a month; the first 3 clients free for 60 days.\n- **Guarantee:** if no extra job comes in within the first 60 days, the next month is free.\n\n## Export SME: \"Your shop in German in 30 days\"\n- **Every month they get:** up to 100 product listings and all customer emails in German and French, checked by a native-speaking freelancer; a monthly report on orders from those markets.\n- **Your AI behind it:** translation and localisation, tone rules, a glossary per client.\n- **Value to them:** cheaper than a translation agency and a German-speaking employee.\n- **Price:** €900 a month; the first 3 clients at half price.\n- **Guarantee:** listings live within 30 days, or no fee until they are.\n\n## Accountancy firm: \"No more chasing documents\"\n- **Every month they get:** reminders for missing documents drafted and sent, completeness checked, status logged for each client. A person approves before anything goes out.\n- **Your AI behind it:** document intake, a reminder agent, a checklist per client.\n- **Value to them:** 15–20 hours of assistant time a month, €700–950 at €47.90 an hour.\n- **Price:** €600 a month per office.\n- **Guarantee:** if they aren't saving 10 hours a month after 60 days, they cancel without paying that month.\n\n## How to set the price and the deal\n- **Anchor on the labour it replaces.** Hormozi's point: clients still pay the old price. Luke Sophinos (vertical SaaS) starts at about 50% of the value the product can show and adjusts from feedback. [Vertical SaaS guide](https://www.youtube.com/watch?v=IC4MOvYZasU)\n- **Name the outcome, not the AI.** \"No lead left waiting\" sells; \"AI automation\" doesn't.\n- **Offer a premium tier.** Hormozi: have something 10× more expensive available, even if few take it. Here that could be a done-for-you tier that includes running the client's ads.\n- **Charge per result where you can measure it.** Hormozi's Allen was paid per appointment that showed up, and Intercom's support AI charges $0.99 per resolved conversation. [Gleap](https://www.gleap.io/blog/intercom-fin-ai-pricing-2026)\n- **Do the first 3–5 clients free or cheap,** in exchange for feedback, a testimonial and a referral. That's the \"first five customers\" note already on your Business shelf, and Hormozi's student playbook. [Best Student Side Hustle](https://www.youtube.com/watch?v=CGSd00h-6zI)\n\nFor the name and the guarantee, your *$100M Offers* notes on the Bookshelf go deeper: *Make it stronger: scarcity, urgency, bonuses, guarantees and a good name*.\n\n**Try it this week.** Write your own one-line offer for the niche you lean towards, in this shape: the result as its name, what they get every month, the price, and the guarantee.","shelf":"ai","n":8},{"id":"iFhiK5zORGk","channel":"Alex Hormozi","date":null,"videoMin":11,"title":"Charge more by having less: real scarcity and a waiting list","checked":null,"charts":false,"md":"**The idea.** When demand goes up, cut supply and the price goes up. A charity poker night raised its ticket from $10,000 to $25,000 and sold more. A service can use the same lever: fewer spots, a waiting list, and a price that matches what your keenest buyers would pay.\n\n## The examples\n- The charity night: $10,000 to $25,000 a seat, and more seats sold. The advice came from a high-end jeweller: \"When demand increases, you cut supply.\"\n- Chanel stores get one or two of each bag, with no warning of what's coming. Every bag feels like the last one.\n- A day of his time for five people at $20,000 each leaves money behind if one or two would have paid $200,000. Three people at $100,000 earns $300,000 instead of $100,000, and three are easier to look after than five.\n\n## What to do with it\n- **Marketing moves the demand curve.** Textbooks treat demand as fixed. Telling more people moves the whole curve, so the same supply can carry a higher price.\n- **\"Full\" is your call.** You decide your capacity. Cap it at, say, five clients and offer a waiting list. A waiting list makes people think you must be good.\n- **Let the steam out slowly.** Open a few spots at a time. If you're always available, the pressure, which is your pricing power, never builds.\n- If you've ever felt relief hearing a price (\"I'd have paid way more\"), the seller left money on the table.\n\n**Watch for.** Scarcity only works when it's real. Saying you're full when you aren't is a lie customers can catch. With a new service you really are limited by your hours, so use that honestly.\n\n**Try it this week.** Work out your real capacity for a side service: hours a week divided by hours per client. Write the number down and price for it, not for \"anyone who'll pay\". Ties to P08.","shelf":"business","n":8},{"id":"ai-09","channel":"Plan","date":null,"videoMin":null,"title":"The money: what a service, a SaaS and your FIRE date look like","checked":"2026-10-22","charts":false,"md":"**The idea.** In the base case a €750-a-month service reaches about €6,500 a month after one year and €12,000 after two. A €29-a-month SaaS needs 8 new paying customers every month to reach €3,000 a month by month 24. And every extra €1,000 a month you invest takes years off your FIRE date.\n\n## The service\nMy assumptions, to be replaced by your real numbers:\n- €750 per client per month, €40 of AI tools per client, 3% of clients leaving each month.\n- 8 hours to set up each new client. Delivery takes 3 hours per client a month for the first three months, then 1.5 hours once automated.\n- **Slow:** a new client every 2 months. **Base:** one a month from month 3. **Strong:** one a month from month 2, two a month from month 7.\n\nRevenue a month:\n\n| Case | Month 6 | Month 12 | Month 24 |\n| --- | --- | --- | --- |\n| Slow | €2,120 | €3,885 | €6,581 |\n| Base | €2,868 | €6,564 | €12,209 |\n| Strong | €3,532 | €11,293 | €23,144 |\n\nClients, and the hours a month they ask of you:\n\n| Case | Month 6 | Month 12 | Month 24 |\n| --- | --- | --- | --- |\n| Slow | 3 · 12 h | 5 · 16 h | 9 · 21 h |\n| Base | 4 · 14 h | 9 · 21 h | 16 · 32 h |\n| Strong | 5 · 15 h | 15 · 39 h | 31 · 62 h |\n\nRevenue keeps climbing in every case because clients stay. The limit is your hours, not demand: from about month 9 the base case needs more than the 14–16 hours a month that two daily slots give you (part 10).\n\n## The SaaS, for comparison\nUsing Hormozi's Skool retention: over 20% gone in month 1, about 2% a month after month 6.\n- At €29 a month and about 70% gross margin, a paying customer is worth about €277 in gross profit over 24 months.\n- At Hormozi's 3:1 rule for a fully automated business, you can spend at most about €92 to win each customer.\n- To reach €1,000, €3,000 or €5,000 a month by month 24, you need about 3, 8 or 13 new paying customers every single month.\n- Software for one industry can charge €99–299 a month, so it needs fewer customers, but it needs a sales process. That's what the service builds.\n- Small SaaS businesses sell for roughly 2.5–4× annual revenue. At €5,000 a month that's €150,000–240,000: helpful, but about a tenth of your FIRE number. [Beancount, citing Acquire.com](https://beancount.io/nl/blog/2026/07/11/bootstrapped-saas-valuation-multiples-2026-acquire-com-indie-founders-guide)\n\n## What it does to your FIRE date\nThe same maths as your FIRE plan: 5% real return a year, a €1.5M target, starting from €0.\n\n| Invested a month | Years to €1.5M |\n| --- | --- |\n| €500 | 53 |\n| €1,000 | 40 |\n| €1,500 | 33 |\n| €2,000 | 29 |\n| **€3,000** (€1,000 from a job + €2,000 from the business) | **23** |\n| €4,000 | 19 |\n| €5,000 | 16 |\n\nThe service's gross profit is before tax and living costs, so only part of it gets invested. Even so, €1,000 from a job plus €2,000 from the business gets you to €1.5M in about 23 years instead of 40.\n\n**Try it this week.** Put your own numbers into the base case: the price your interviews suggest, and how many hours one client really takes. Then check how many clients cover €2,000 a month for the FIRE plan.","shelf":"ai","n":9},{"id":"CojS0DwflXc","channel":"Alex Hormozi","date":null,"videoMin":21,"title":"Closing: ask questions, say it back, tell short stories, and don't teach","checked":null,"charts":false,"md":"**The idea.** When you're selling, only three things should come out of your mouth: questions, their own words said back to them, and short stories that show what working with you would be like. Teaching tactics doesn't sell and barely helps. Breaking the belief that keeps them stuck does both.\n\n## The three things\n1. **Questions, mostly.** Why are you here? What are you struggling with? Where are you trying to get to? What have you tried, and how did it go? Why does this matter to you? People only change their mind when they reach the conclusion themselves.\n2. **Say it back.** \"So what I'm hearing is: this is the main problem, this is what you've tried, and this is why it hasn't worked. Does that sound right?\"\n3. **Short stories.** Instead of explaining your method (he calls it technobabble), a quick analogy that breaks the belief. His weight-loss one: you won't give up cake for life, so we find food you like more than what you eat now, and then you'll stick to it.\n\n## Why not teach\n- Early on he gave gym owners advice on the call. They took notes, didn't buy, and didn't use the advice either.\n- A friend's line: everyone benefits from breaking a belief; only about 10% benefit from tactics.\n\n## His rules\n- Don't pitch until you believe they'll say yes. Like a proposal, you ask when you already know the answer.\n- If they ask \"how does it work?\" too early, say you need to understand more first.\n- You can usually tell in the first five to ten minutes. If it's going badly, ask a harder question that challenges their view, and let them argue that there is a way.\n- The real secret is to actually care. A script only copies how someone who cares would talk.\n\n**Try it this week.** Write the questions above for your service, in your own words, plus one short story for the most common reason people don't start. Ties to P04: the Mom Test also runs on questions about their life, not your idea.","shelf":"business","n":9},{"id":"ai-10","channel":"Plan","date":null,"videoMin":null,"title":"Your time: what fits in 14 minutes a day","checked":"2026-10-22","charts":false,"md":"**The idea.** One 14-minute slot every day is about 7 hours a month: enough to learn, send two messages a day and serve one or two clients. Running the Business and Products slots as this one project roughly doubles it, to about 14–16 hours, which covers four or five clients. Beyond that the business needs a weekly block, or the time you'll have after graduating.\n\n## What fits\n| Activity | Time it takes | Fits in 14 minutes a day? |\n| --- | --- | --- |\n| Learn one tool or technique | 15–30 min a step | Yes |\n| Two outreach messages or calls | 10–15 min | Yes |\n| Post one note about your work (proof) | 10 min | Yes |\n| 20 owner interviews | 15–20 hours over 4–6 weeks | No: use your graduation project or weekend blocks |\n| Setting up a new client | about 8 hours | No: one weekend |\n| Delivering for one client, by hand | about 3 hours a month | Just: 1–2 clients |\n| Delivering for one client, automated | about 1.5 hours a month | Yes: 4–5 clients with two slots |\n\n## Three ways to make the time\n- **Use your graduation project.** If your final year includes a thesis or internship, aim it at AI adoption in your chosen niche. Your interviews become research, and the firm you work with can become your first client and case study.\n- **Combine Business and Products into this branch.** They are the same project now; your notes on offers and first customers become the to-do list.\n- **Decide what this is for.** Hormozi's \"stop dabbling\" (your first Business note) applies: eight daily things at 14 minutes each is a fine way to learn, and a slow way to build. After graduating, give the winner a bigger slot.\n\n**Try it this week.** Decide whether this branch takes over the Business and Products slots in your weekday round, and block one weekend morning for interviews.","shelf":"ai","n":10},{"id":"jfW6gL6hKhk","channel":"Alex Hormozi","date":null,"videoMin":23,"title":"Your first $100K in the bank, in six steps","checked":null,"charts":false,"md":"**The idea.** The richest he ever felt wasn't after the big exits. It was the first $100,000 in the bank, because it ended the monthly worry about rent and food. His six steps: cut costs, protect your time, pick a skill people already pay for, learn it by doing, spend on the right things, and don't raise your lifestyle.\n\n## The six steps\n1. **Cut costs so you can take risks.** No eating out, no new clothes, the cheapest housing you can find, a paid-off car. He split a bedroom for $300–400 a month and stayed there while earning about $20,000 a month.\n2. **Save time.** A 9-to-5 still leaves 5–9 am and 5–9 pm. Without a job: four hours promoting, four delivering, four building. Keep \"maker\" time (no meetings) apart from \"manager\" time, because switching kills output. His best habit: the first four to six hours of the day to himself.\n3. **Pick a skill people already pay for.** For businesses: content, outreach, funnels; each could be a business on its own. For consumers: read your own bank statement. His 1-1-1 rule: one product, one kind of customer, one channel until $1M.\n4. **Learning means the same situation and a new behaviour.** Think 10,000 tries, not 10,000 hours. Do lots of reps, study your best 10%, find what they have that the rest don't, and test the differences one at a time. The fastest way is to pay someone good for one-on-one help.\n5. **Spend on three things:** tools, help putting it into practice (courses, tutoring), and attempts (ads, editing software).\n6. **Don't raise your lifestyle.** $100K in the bank, not in revenue. Be rich, don't look rich.\n\n**Watch for.** There's an ad for his book bundle in the middle. His \"cut everything\" is deliberately extreme; the principle is the gap between what you earn and what you spend.\n\n**Try it this week.** You have a note called \"cost breakdown for fire\". Put your monthly costs next to step 1 and find the three biggest you could cut for a year. Then write one skill businesses already pay for that you could learn by doing.","shelf":"business","n":10},{"id":"ai-11","channel":"Plan","date":null,"videoMin":null,"title":"The path, its gates, and the risks","checked":"2026-10-22","charts":false,"md":"**The idea.** Your SaaS idea comes back in year 2, once a paid service has shown you which workflow ten clients share. Each phase pays for the next, and each gate has a number you can check. Missing a gate means changing the niche or the offer, not pushing on.\n\n## Four phases, three gates\n1. **Discover, months 1–2.** 20 owner interviews, through your graduation project if you can; find one weekly task. You are here.\n2. **Pilot, months 2–4.** Three firms free for 60 days, done by hand; log every edge case.\n3. **Paid service, months 4–12.** €500–1,500 a month per client; automate one step at a time.\n4. **Software, year 2 onward.** Turn the shared workflow into a tool for the industry; later, buy a firm.\n\nThe gates between them:\n- **Same pain** (Discover to Pilot): 6 of 10 owners name the same task, with hours attached.\n- **First payment** (Pilot to Paid service): a pilot client pays €300 or more a month.\n- **Same workflow** (Paid service to Software): about 10 clients run on the same steps, under 1.5 hours each.\n\nThe service funds the software, and its clients' edge cases become the product. Each phase is a step on this branch, and each gate is the last piece of its step.\n\n## The risks\nThe biggest risk isn't AI; it's building tools instead of talking to buyers. The second is the big software vendors adding your service as a feature. Both have clear counters.\n- **You build instead of sell.** A Starter Story founder built 72 apps in 60 days and earned $0, until talking to two customers a day. *Handle it:* no new tool until the first client pays. Two conversations a day.\n- **Your service becomes a feature of the client's software.** Funda sells its own AI styler; accounting packages are adding AI. *Handle it:* sell a done-for-you result, not a tool. Work inside the systems clients already use.\n- **Clients do it themselves with ChatGPT.** 3 in 10 entrepreneurs already use ChatGPT or Copilot. *Handle it:* target firms with 5–50 staff and no time. Guarantee a result they can't get alone.\n- **The AI gets something wrong.** Isenberg's rule for AI-run firms: a person approves before anything reaches a client. *Handle it:* a human check on every output, a corrections log, liability limits in your terms.\n- **A privacy breach.** The AP reports rising breaches from staff pasting data into chatbots. *Handle it:* a data-processing agreement, business plans that don't train on data, EU hosting, a one-page AI policy per client.\n- **AI costs eat the margin.** Chris Raroque's app cost 10× the estimate. *Handle it:* use the cheapest model that passes your tests; check the cost per client every month.\n- **Prices fall as everyone adopts AI.** Isenberg: the gap between your costs falling and market prices catching up lasts years, not months. *Handle it:* lock in recurring clients and proof now; move towards software later.\n- **Fake self-employment, or depending on one client.** Wet DBA enforcement since 2025. *Handle it:* monthly deliverables for several clients, never hours for one.\n- **Too little time.** 14 minutes a weekday covers 1–2 clients. *Handle it:* part 10 — your graduation project, combined slots, a weekend block.\n\n## Stop rules, so a bad niche doesn't eat a year\n- After 20 interviews, if fewer than 6 owners name the same weekly task with hours or money attached, switch niche.\n- After 60 days of offering pilots, if nobody accepts even a free pilot, change the offer, not the niche.\n- After 6 months, if no client pays €300 a month or more, stop and put the slot back into your career and FIRE plan.\n\n**Try it this week.** Write the three stop rules where you'll see them, with real dates: 20 interviews by when, 60 days of pilots ending when, and the 6-month check.","shelf":"ai","n":11},{"id":"O1As2zxy0es","channel":"Alex Hormozi","date":null,"videoMin":21,"title":"For later: the four ways to grow a service business","checked":null,"charts":false,"md":"**The idea.** Once one location or one service works, there are four ways to multiply it: open more of your own, franchise, license, or turn it into software. Each trades cash now against value later. Which fits depends on what a new location costs and how easy your service is to copy.\n\n## The four\n| Way | What it is | Fits when | Watch out |\n|---|---|---|---|\n| Your own chain | You open and run more locations | A new one costs less than about six months of a location's profit, and the work is simple to repeat | You carry every cost and every lease |\n| Franchise | Others buy in and run locations under your name and system, paying you a cut of sales | Each location is expensive to open (think McDonald's) | About $750,000 to set up, slow to profit, needs 100+ locations to really pay, and 90–95% never get there |\n| Licensing | You give two of name, system and fee (all three makes it a franchise, which is regulated) | You're new and need cash coming in from day one | Easy to copy; sells for little unless 80%+ of licensees stay each year |\n| Software | The service becomes tech | You already have a strong software co-founder | Costly and slow; needs 80%+ of customers to stay each year to be valued as software |\n\n- His first business, Gym Launch, was licensing: no capital needed and cash from day one.\n- One of his portfolio companies switched from licensing to owning its locations and went from $0.5M to $12M a year in 14 months.\n- \"Don't outsource your software to a third-party team.\" It cost him $2–3M to learn that.\n\n**Why it's here.** Not for now. It's a map of where a service can go, so you can pick a first service that could grow: simple, repeatable, and cheap to open again.\n\n**Try it this week.** Nothing to do yet. Just note which of the four your service could become.","shelf":"business","n":11},{"id":"ai-12","channel":"Plan","date":null,"videoMin":null,"title":"Your first 30 days","checked":"2026-10-22","charts":false,"md":"**The idea.** The first month is for interviews and one free pilot, not for building. Each line below is a piece on this branch: start it from there, time it, and tick it off.\n\n## Week 1\n- Pick two niches from the ranked list (part 7) where you can get introductions.\n- List 30 owners or managers you can reach: family, a job, your school's network, second-degree LinkedIn contacts.\n- Check each firm's legal form in the KVK register before phoning: a BV may be called, a sole trader needs consent.\n- Ask your thesis supervisor whether your graduation project can be on AI adoption in one of the two niches.\n- Reread The Mom Test notes on your Bookshelf before the first interview.\n\n## Weeks 2–3\n- Do 10 interviews per niche. Ask about last week's admin, what it cost in hours or lost jobs, and what they've tried. Don't pitch.\n- Write down every recurring task with its hours and who does it.\n\n## Week 4\n- Choose the one task that at least 6 of 10 owners named, with hours attached.\n- Run it by hand for one firm with off-the-shelf tools (a business AI plan plus Zapier, Make or n8n), and log every edge case.\n- Offer three firms the free 60-day pilot in exchange for feedback, a testimonial and a referral.\n- Register your eenmanszaak at the KVK when the first firm says yes.\n- Log hours and results per client from day one: they become your proof and your price.\n\n## Questions for the interviews\nFrom The Mom Test: ask about their life, not your idea; about specifics in the past, not opinions about the future; and talk less, listen more. Lesson P04 practises the same skill.\n- \"Walk me through last week's admin. What took longest?\"\n- \"What did that cost you, in hours or in jobs you missed?\"\n- \"What have you already tried? What did it cost?\"\n- \"Who else should I talk to?\"\n- \"Is there anything else I should have asked?\"\n\n**Try it this week.** Do Week 1. The first piece, picking two niches, takes one 14-minute slot.","shelf":"ai","n":12},{"id":"zero-to-one-1","channel":"Zero to One","date":null,"videoMin":null,"title":"Zero to one: new things versus copies, and the four lessons of 1999 turned around","checked":null,"charts":false,"md":"**The argument.** Progress comes in two kinds. Going from 1 to n copies what already works and spreads it: globalisation. Going from 0 to 1 makes something new: technology, in the broad sense of any new and better way of doing things. Thiel's opening question is the test for the second kind: what important truth do very few people agree with you on?\n\n## Chapter 1: the challenge of the future\n- Copying is easier than creating, so most effort goes to 1 to n.\n- A world that only copies can't keep growing; it runs out of resources. The future needs new things.\n- A good answer to his question sounds like \"most people believe X, but the truth is the opposite of X.\"\n\n## Chapter 2: party like it's 1999\nAfter the dot-com crash, Silicon Valley learned four lessons. Thiel thinks the opposite of each is closer to right:\n\n| What 2000 taught | What Thiel says |\n|---|---|\n| Make small, step-by-step advances | It's better to risk boldness than triviality |\n| Stay lean and flexible, don't plan | A bad plan is better than no plan |\n| Improve on the competition | Competitive markets destroy profits |\n| Focus on product, not sales | Sales matters just as much as product |\n\n**The idea worth keeping.** Ask of anything you're thinking of building: is this a new thing, or a copy in a new place? Copies can make money (a service often is one), but know which one you're doing.\n\n**Try it on your work.** Write one answer to his question, about anything you know well: your field, your city, your age group. It's hard, and that's the point. This is lesson P01.","shelf":"books","n":101,"part":"Ch. 1–2","by":"Peter Thiel"},{"id":"zero-to-one-2","channel":"Zero to One","date":null,"videoMin":null,"title":"Monopoly, not competition: why the best businesses avoid fights","checked":null,"charts":false,"md":"**The argument.** A business can create a lot of value and still make no money. What matters is how much of the value it keeps. In perfect competition, prices fall until nobody profits. A monopoly, a company so good at its niche that nothing close substitutes for it, keeps the profit and can plan for the long run.\n\n## Chapter 3: all happy companies are different\n- US airlines carry millions of people, yet in his example they made about 37 cents a passenger. Google kept roughly a fifth of its revenue as profit.\n- **Everyone lies about it.** Monopolies play down their dominance (\"we're one small player in a huge market\"). Companies in brutal competition exaggerate how unique they are by defining their market as a tiny intersection: \"the only British food restaurant in Palo Alto\".\n- Profits let a monopoly care about its people and its products; a competitive business can only think about this month.\n\n## Chapter 4: the ideology of competition\n- We're trained to compete: grades, rankings, rivals. Competition feels like proof of value, but it makes people copy each other and lose sight of what matters.\n- Rivals obsess over each other and both lose. PayPal and Elon Musk's X.com fought hard in 1999 and merged in 2000, which saved them both.\n- \"If you can't beat a rival, it may be better to merge.\"\n\n**The idea worth keeping.** Be honest about your market. If you have to squeeze it into a tiny intersection to sound unique, you're in a crowded market wearing a costume.\n\n**Try it on your work.** Describe your idea's market in one plain sentence. Then list three things a customer could use instead. If the list is long, find a smaller group you could serve better than anyone. This feeds P03 (own a tiny market first).","shelf":"books","n":102,"part":"Ch. 3–4","by":"Peter Thiel"},{"id":"zero-to-one-3","channel":"Zero to One","date":null,"videoMin":null,"title":"Last mover advantage: build what lasts, and start with a small market","checked":null,"charts":false,"md":"**The argument.** A business is worth the cash it will make over its whole future. Most of a great company's value sits far ahead, so the real question isn't \"will it grow this year?\" but \"will it still be here in ten years?\" Being first matters less than being the last one standing in your market.\n\n## What makes a monopoly last\n1. **Proprietary technology:** at least ten times better than the closest substitute in some important way. Not a bit better: ten times.\n2. **Network effects:** each new user makes it more useful for everyone. They have to start small; nobody joins an empty network.\n3. **Economies of scale:** it gets cheaper per customer as it grows. Software does; a yoga studio barely does.\n4. **Branding:** real only when there's substance behind it.\n\n## How to build one\n- **Start small and dominate.** Pick a market small enough that you can own most of it. Amazon started with books; PayPal started with eBay's power sellers.\n- **Then widen in circles,** to the next closely related market.\n- **Don't \"disrupt\".** Picking a fight with big incumbents invites them to crush you. Grow where they aren't looking.\n\n**The idea worth keeping.** \"Big market\" is usually a trap for a beginner. A tiny market you can actually own beats a huge one where you're one of a thousand.\n\n**Try it on your work.** For your best idea, write the smallest group of people you could serve better than anyone, specific enough that you could list where they gather. Which of the four would protect you there later? This is P03 and P11.","shelf":"books","n":103,"part":"Ch. 5","by":"Peter Thiel"},{"id":"zero-to-one-4","channel":"Zero to One","date":null,"videoMin":null,"title":"You are not a lottery ticket: make a plan, and follow the power law","checked":null,"charts":false,"md":"**The argument.** You can expect the future to be better or worse, and you can treat it as something you plan (definite) or something that just happens (indefinite). Thiel thinks a culture of indefinite optimism, keeping options open and hoping, leads to diversified mediocrity. Success isn't luck you wait for; it comes from a plan you commit to.\n\n## Chapter 6: four views of the future\n| | Definite | Indefinite |\n|---|---|---|\n| Optimistic | Plan and build a better future | Things will improve, but nobody plans how |\n| Pessimistic | The future is bleak, so prepare | Things will get worse, and we don't know what to do |\n\n- The \"well-rounded\" student who does a bit of everything is the indefinite type: lots of options, no conviction.\n- Treating your life or business as a lottery ticket means never committing to a plan good enough to be wrong about.\n\n## Chapter 7: follow the money\n- **The power law.** A few outcomes dominate everything else. In a good venture fund, the single best investment often returns more than all the others combined.\n- So spread-everywhere thinking fails: you should only invest in, or work on, things that could be that one big winner.\n- The same applies to you: be excellent at one thing rather than average at many.\n\n**The idea worth keeping.** Keeping your options open feels safe but stops you from going deep enough for anything to work. Pick one thing and commit long enough to find out.\n\n**Try it on your work.** Look at your goals and projects. Which one could matter more than all the others combined? Give it the best hours of your week, and say no to one thing to make room.","shelf":"books","n":104,"part":"Ch. 6–7","by":"Peter Thiel"},{"id":"zero-to-one-5","channel":"Zero to One","date":null,"videoMin":null,"title":"Secrets: every great business is built on something others don't see","checked":null,"charts":false,"md":"**The argument.** Every great business rests on a secret: something important and true that most people don't know or don't believe yet. Most people have stopped looking, because they assume everything worth discovering has been found. That makes the hunt less crowded for anyone who keeps looking.\n\n## Why people stopped looking\n- **Incrementalism:** school rewards small, correct steps, not big unknown questions.\n- **Risk aversion:** a secret might be wrong, and being wrong alone feels worse than being wrong with everyone.\n- **Complacency:** the comfortable have no reason to dig.\n- **Flatness:** in a big connected world it's easy to think someone smarter must already have found it.\n\n## Two kinds of secrets\n- **About nature:** things not yet known about the physical world.\n- **About people:** things people don't know about themselves, or hide because they're taboo or unfashionable.\n- Airbnb and Uber both built on secrets that, looking back, seem obvious: spare capacity (rooms, cars) that nobody was matching to demand.\n\n## Where to look\n- Places nobody else is looking, and fields that haven't been studied closely.\n- Once you find one, think hard about who to tell: usually only the people you need to make it happen.\n\n**The idea worth keeping.** \"Everyone would have thought of that\" is not a reason to drop an idea. Check whether they actually have.\n\n**Try it on your work.** Write down one thing you've seen up close (a job, a hobby, your studies) that seems broken and that people around you accept as normal. That's the raw material for the \"secret\" question on your idea board (P12).","shelf":"books","n":105,"part":"Ch. 8","by":"Peter Thiel"},{"id":"zero-to-one-6","channel":"Zero to One","date":null,"videoMin":null,"title":"Foundations and the \"mafia\": get the start right and build a team that fits","checked":null,"charts":false,"md":"**The argument.** Thiel's law: a startup messed up at its foundation cannot be fixed. The first decisions, who you start with, who owns what, how people are paid, are the hardest to undo. Get them right, then build a team so aligned it looks like a tight-knit \"mafia\" (the PayPal founders were later nicknamed the PayPal Mafia).\n\n## Chapter 9: foundations\n- **Choose a co-founder like a marriage partner.** Skills matter, but how well you know each other and work together matters more.\n- **Ownership, possession and control** (who owns the equity, who runs it day to day, who formally governs it) cause trouble when they drift apart.\n- **Small boards work.** Three people is ideal; big boards can't hold anyone to account.\n- **Low cash, more ownership.** A CEO paid a modest salary stays focused on the company's long-term value. Everyone should be paid in a way that rewards building value later, not taking it now.\n\n## Chapter 10: the mechanics of mafia\n- Hire people who'll enjoy working together and stay, not just people with the best CVs.\n- To recruit, explain why your mission is important and why your team is special. Perks don't attract the right people.\n- **Give each person one thing to own.** At PayPal, giving everyone exactly one job and judging them on it removed most internal fights.\n- A strong culture is close to a cult in its conviction, but without the cult's isolation.\n\n**The idea worth keeping.** Even a one-person service has a foundation: who you work with, how you split money, what you promise. Decide those carefully at the start.\n\n**Try it on your work.** If you'd start something with someone, write down now who would own what and who decides when you disagree. If that's awkward to write, it'll be worse to fix later.","shelf":"books","n":106,"part":"Ch. 9–10","by":"Peter Thiel"},{"id":"zero-to-one-7","channel":"Zero to One","date":null,"videoMin":null,"title":"If you build it, will they come? Distribution is half the business","checked":null,"charts":false,"md":"**The argument.** Engineers believe a great product sells itself. It doesn't. Poor sales, not a bad product, is the most common reason businesses fail. Sales is hidden on purpose (nobody wants to feel sold to), so people underrate it. If you can't get your product to people, you don't have a business.\n\n## How products get sold, by price\n| Method | Fits | How it works |\n|---|---|---|\n| Complex sales | Very large deals, few customers | The founder sells personally, over months |\n| Personal sales | Mid-sized deals | A small sales team builds a repeatable process |\n| Marketing and advertising | Cheap products for many people | Ads and brand, where you can't afford a salesperson per customer |\n| Viral | Products people share by using them | Each user brings more users (PayPal paid people to sign up friends) |\n\n- **The gap in the middle:** products too expensive to sell with ads but too cheap for a salesperson to visit. Many businesses die there.\n- **One channel wins.** Like the power law, a single distribution channel usually beats all the others combined. Find it and focus.\n- **Everyone sells.** Founders sell to investors and recruits, employees sell the company to each other. You're always selling something.\n\n**The idea worth keeping.** For a service, the method is almost always personal: you, talking to people. That's not a stopgap. It's the channel.\n\n**Try it on your work.** Write how your first ten customers will hear about you: the actual channel, not \"word of mouth\". Then put a weekly number on it, like the rule of 100 on the Hormozi shelf. This is P09 and P10.","shelf":"books","n":107,"part":"Ch. 11","by":"Peter Thiel"},{"id":"zero-to-one-8","channel":"Zero to One","date":null,"videoMin":null,"title":"Seven questions every business must answer","checked":null,"charts":false,"md":"**The argument.** The last chapters pull the book together. Computers will work best alongside people rather than replacing them. The cleantech bubble shows what happens when businesses can't answer the basic questions. And founders tend to be unusual people, which is both their strength and their risk.\n\n## Chapter 12: man and machine\n- People and computers are good at different things. The big opportunities are in tools that help people do more (PayPal's fraud system flagged suspicious payments and let humans decide), not in replacing them.\n\n## Chapter 13: seeing green, the seven questions\nMost cleantech companies of the 2000s failed because they couldn't answer these:\n1. **Engineering:** is it a breakthrough, not a small improvement?\n2. **Timing:** is now the right time to start?\n3. **Monopoly:** are you starting with a big share of a small market?\n4. **People:** do you have the right team?\n5. **Distribution:** can you actually get it to customers?\n6. **Durability:** will you still be ahead in 10 and 20 years?\n7. **Secret:** have you seen an opportunity others don't?\n\n## Chapter 14 and the end\n- Founders are often extreme in contradictory ways: insider and outsider, admired and attacked. The danger is believing your own myth.\n- The future isn't guaranteed to be better. Whether it is depends on people building new things.\n\n**The idea worth keeping.** You won't get seven yeses. Thiel says to get as many as you can, and to be honest about the ones you can't.\n\n**Try it on your work.** These are the seven questions on your idea board. Open the starred idea in Building products and answer each with yes, not sure or no. A \"not sure\" is a question to go and find out. This is P12.","shelf":"books","n":108,"part":"Ch. 12–14","by":"Peter Thiel"},{"id":"mom-test-1","channel":"The Mom Test","date":null,"videoMin":null,"title":"The Mom Test: three rules for asking about an idea without being lied to","checked":null,"charts":false,"md":"**The argument.** Ask your mum if your business idea is good and she'll say yes, because she loves you. So will most people. It's not their fault: you asked the wrong question. A good question is one even your mum can't lie to you about, because it's about her life and her past, not your idea and her opinions.\n\n## The three rules\n1. **Talk about their life instead of your idea.**\n2. **Ask about specifics in the past, not opinions or guesses about the future.**\n3. **Talk less and listen more.**\n\n## Bad questions and better ones\n| Bad | Why | Better |\n|---|---|---|\n| \"Do you think it's a good idea?\" | Only the market can tell you that | \"How do you deal with this now?\" |\n| \"Would you buy something that did X?\" | People are optimistic about their future selves | \"When did this last happen? Talk me through it.\" |\n| \"How much would you pay for X?\" | A guess about the future | \"What have you already tried? What did it cost?\" |\n| \"What would your dream product do?\" | Fine to ask, but don't build it as told | \"Why do you bother? What happens if you don't?\" |\n\nTwo more good ones: \"Who else should I talk to?\" and \"Is there anything else I should have asked?\"\n\n**The idea worth keeping.** Once you mention your idea, people start being nice instead of truthful. Keep it out of the conversation for as long as you can.\n\n**Try it on your work.** Rewrite three questions you'd normally ask about your idea so they're about the person's last week instead. Then have one real conversation using only those. This is lesson P04.","shelf":"books","n":201,"part":"Ch. 1","by":"Rob Fitzpatrick"},{"id":"mom-test-2","channel":"The Mom Test","date":null,"videoMin":null,"title":"Avoiding bad data: compliments, fluff and feature requests","checked":null,"charts":false,"md":"**The argument.** A conversation can feel great and teach you nothing. Three kinds of bad data cause most of it: compliments, fluff, and ideas. Each feels like progress and isn't. The fix is to spot them and steer back to facts about the person's life.\n\n## The three kinds\n| Bad data | Sounds like | What to do |\n|---|---|---|\n| Compliments | \"That sounds really cool!\" | Deflect it and get back to their situation. A compliment is worth nothing. |\n| Fluff | \"I usually…\", \"I always…
