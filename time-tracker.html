ranchise | Others buy in and run locations under your name and system, paying you a cut of sales | Each location is expensive to open (think McDonald's) | About $750,000 to set up, slow to profit, needs 100+ locations to really pay, and 90–95% never get there |\n| Licensing | You give two of name, system and fee (all three makes it a franchise, which is regulated) | You're new and need cash coming in from day one | Easy to copy; sells for little unless 80%+ of licensees stay each year |\n| Software | The service becomes tech | You already have a strong software co-founder | Costly and slow; needs 80%+ of customers to stay each year to be valued as software |\n\n- His first business, Gym Launch, was licensing: no capital needed and cash from day one.\n- One of his portfolio companies switched from licensing to owning its locations and went from $0.5M to $12M a year in 14 months.\n- \"Don't outsource your software to a third-party team.\" It cost him $2–3M to learn that.\n\n**Why it's here.** Not for now. It's a map of where a service can go, so you can pick a first service that could grow: simple, repeatable, and cheap to open again.\n\n**Try it this week.** Nothing to do yet. Just note which of the four your service could become.","shelf":"business","n":11},{"id":"zero-to-one-1","channel":"Zero to One","date":null,"videoMin":null,"title":"Zero to one: new things versus copies, and the four lessons of 1999 turned around","checked":null,"charts":false,"md":"**The argument.** Progress comes in two kinds. Going from 1 to n copies what already works and spreads it: globalisation. Going from 0 to 1 makes something new: technology, in the broad sense of any new and better way of doing things. Thiel's opening question is the test for the second kind: what important truth do very few people agree with you on?\n\n## Chapter 1: the challenge of the future\n- Copying is easier than creating, so most effort goes to 1 to n.\n- A world that only copies can't keep growing; it runs out of resources. The future needs new things.\n- A good answer to his question sounds like \"most people believe X, but the truth is the opposite of X.\"\n\n## Chapter 2: party like it's 1999\nAfter the dot-com crash, Silicon Valley learned four lessons. Thiel thinks the opposite of each is closer to right:\n\n| What 2000 taught | What Thiel says |\n|---|---|\n| Make small, step-by-step advances | It's better to risk boldness than triviality |\n| Stay lean and flexible, don't plan | A bad plan is better than no plan |\n| Improve on the competition | Competitive markets destroy profits |\n| Focus on product, not sales | Sales matters just as much as product |\n\n**The idea worth keeping.** Ask of anything you're thinking of building: is this a new thing, or a copy in a new place? Copies can make money (a service often is one), but know which one you're doing.\n\n**Try it on your work.** Write one answer to his question, about anything you know well: your field, your city, your age group. It's hard, and that's the point. This is lesson P01.","shelf":"books","n":101,"part":"Ch. 1–2","by":"Peter Thiel"},{"id":"zero-to-one-2","channel":"Zero to One","date":null,"videoMin":null,"title":"Monopoly, not competition: why the best businesses avoid fights","checked":null,"charts":false,"md":"**The argument.** A business can create a lot of value and still make no money. What matters is how much of the value it keeps. In perfect competition, prices fall until nobody profits. A monopoly, a company so good at its niche that nothing close substitutes for it, keeps the profit and can plan for the long run.\n\n## Chapter 3: all happy companies are different\n- US airlines carry millions of people, yet in his example they made about 37 cents a passenger. Google kept roughly a fifth of its revenue as profit.\n- **Everyone lies about it.** Monopolies play down their dominance (\"we're one small player in a huge market\"). Companies in brutal competition exaggerate how unique they are by defining their market as a tiny intersection: \"the only British food restaurant in Palo Alto\".\n- Profits let a monopoly care about its people and its products; a competitive business can only think about this month.\n\n## Chapter 4: the ideology of competition\n- We're trained to compete: grades, rankings, rivals. Competition feels like proof of value, but it makes people copy each other and lose sight of what matters.\n- Rivals obsess over each other and both lose. PayPal and Elon Musk's X.com fought hard in 1999 and merged in 2000, which saved them both.\n- \"If you can't beat a rival, it may be better to merge.\"\n\n**The idea worth keeping.** Be honest about your market. If you have to squeeze it into a tiny intersection to sound unique, you're in a crowded market wearing a costume.\n\n**Try it on your work.** Describe your idea's market in one plain sentence. Then list three things a customer could use instead. If the list is long, find a smaller group you could serve better than anyone. This feeds P03 (own a tiny market first).","shelf":"books","n":102,"part":"Ch. 3–4","by":"Peter Thiel"},{"id":"zero-to-one-3","channel":"Zero to One","date":null,"videoMin":null,"title":"Last mover advantage: build what lasts, and start with a small market","checked":null,"charts":false,"md":"**The argument.** A business is worth the cash it will make over its whole future. Most of a great company's value sits far ahead, so the real question isn't \"will it grow this year?\" but \"will it still be here in ten years?\" Being first matters less than being the last one standing in your market.\n\n## What makes a monopoly last\n1. **Proprietary technology:** at least ten times better than the closest substitute in some important way. Not a bit better: ten times.\n2. **Network effects:** each new user makes it more useful for everyone. They have to start small; nobody joins an empty network.\n3. **Economies of scale:** it gets cheaper per customer as it grows. Software does; a yoga studio barely does.\n4. **Branding:** real only when there's substance behind it.\n\n## How to build one\n- **Start small and dominate.** Pick a market small enough that you can own most of it. Amazon started with books; PayPal started with eBay's power sellers.\n- **Then widen in circles,** to the next closely related market.\n- **Don't \"disrupt\".** Picking a fight with big incumbents invites them to crush you. Grow where they aren't looking.\n\n**The idea worth keeping.** \"Big market\" is usually a trap for a beginner. A tiny market you can actually own beats a huge one where you're one of a thousand.\n\n**Try it on your work.** For your best idea, write the smallest group of people you could serve better than anyone, specific enough that you could list where they gather. Which of the four would protect you there later? This is P03 and P11.","shelf":"books","n":103,"part":"Ch. 5","by":"Peter Thiel"},{"id":"zero-to-one-4","channel":"Zero to One","date":null,"videoMin":null,"title":"You are not a lottery ticket: make a plan, and follow the power law","checked":null,"charts":false,"md":"**The argument.** You can expect the future to be better or worse, and you can treat it as something you plan (definite) or something that just happens (indefinite). Thiel thinks a culture of indefinite optimism, keeping options open and hoping, leads to diversified mediocrity. Success isn't luck you wait for; it comes from a plan you commit to.\n\n## Chapter 6: four views of the future\n| | Definite | Indefinite |\n|---|---|---|\n| Optimistic | Plan and build a better future | Things will improve, but nobody plans how |\n| Pessimistic | The future is bleak, so prepare | Things will get worse, and we don't know what to do |\n\n- The \"well-rounded\" student who does a bit of everything is the indefinite type: lots of options, no conviction.\n- Treating your life or business as a lottery ticket means never committing to a plan good enough to be wrong about.\n\n## Chapter 7: follow the money\n- **The power law.** A few outcomes dominate everything else. In a good venture fund, the single best investment often returns more than all the others combined.\n- So spread-everywhere thinking fails: you should only invest in, or work on, things that could be that one big winner.\n- The same applies to you: be excellent at one thing rather than average at many.\n\n**The idea worth keeping.** Keeping your options open feels safe but stops you from going deep enough for anything to work. Pick one thing and commit long enough to find out.\n\n**Try it on your work.** Look at your goals and projects. Which one could matter more than all the others combined? Give it the best hours of your week, and say no to one thing to make room.","shelf":"books","n":104,"part":"Ch. 6–7","by":"Peter Thiel"},{"id":"zero-to-one-5","channel":"Zero to One","date":null,"videoMin":null,"title":"Secrets: every great business is built on something others don't see","checked":null,"charts":false,"md":"**The argument.** Every great business rests on a secret: something important and true that most people don't know or don't believe yet. Most people have stopped looking, because they assume everything worth discovering has been found. That makes the hunt less crowded for anyone who keeps looking.\n\n## Why people stopped looking\n- **Incrementalism:** school rewards small, correct steps, not big unknown questions.\n- **Risk aversion:** a secret might be wrong, and being wrong alone feels worse than being wrong with everyone.\n- **Complacency:** the comfortable have no reason to dig.\n- **Flatness:** in a big connected world it's easy to think someone smarter must already have found it.\n\n## Two kinds of secrets\n- **About nature:** things not yet known about the physical world.\n- **About people:** things people don't know about themselves, or hide because they're taboo or unfashionable.\n- Airbnb and Uber both built on secrets that, looking back, seem obvious: spare capacity (rooms, cars) that nobody was matching to demand.\n\n## Where to look\n- Places nobody else is looking, and fields that haven't been studied closely.\n- Once you find one, think hard about who to tell: usually only the people you need to make it happen.\n\n**The idea worth keeping.** \"Everyone would have thought of that\" is not a reason to drop an idea. Check whether they actually have.\n\n**Try it on your work.** Write down one thing you've seen up close (a job, a hobby, your studies) that seems broken and that people around you accept as normal. That's the raw material for the \"secret\" question on your idea board (P12).","shelf":"books","n":105,"part":"Ch. 8","by":"Peter Thiel"},{"id":"zero-to-one-6","channel":"Zero to One","date":null,"videoMin":null,"title":"Foundations and the \"mafia\": get the start right and build a team that fits","checked":null,"charts":false,"md":"**The argument.** Thiel's law: a startup messed up at its foundation cannot be fixed. The first decisions, who you start with, who owns what, how people are paid, are the hardest to undo. Get them right, then build a team so aligned it looks like a tight-knit \"mafia\" (the PayPal founders were later nicknamed the PayPal Mafia).\n\n## Chapter 9: foundations\n- **Choose a co-founder like a marriage partner.** Skills matter, but how well you know each other and work together matters more.\n- **Ownership, possession and control** (who owns the equity, who runs it day to day, who formally governs it) cause trouble when they drift apart.\n- **Small boards work.** Three people is ideal; big boards can't hold anyone to account.\n- **Low cash, more ownership.** A CEO paid a modest salary stays focused on the company's long-term value. Everyone should be paid in a way that rewards building value later, not taking it now.\n\n## Chapter 10: the mechanics of mafia\n- Hire people who'll enjoy working together and stay, not just people with the best CVs.\n- To recruit, explain why your mission is important and why your team is special. Perks don't attract the right people.\n- **Give each person one thing to own.** At PayPal, giving everyone exactly one job and judging them on it removed most internal fights.\n- A strong culture is close to a cult in its conviction, but without the cult's isolation.\n\n**The idea worth keeping.** Even a one-person service has a foundation: who you work with, how you split money, what you promise. Decide those carefully at the start.\n\n**Try it on your work.** If you'd start something with someone, write down now who would own what and who decides when you disagree. If that's awkward to write, it'll be worse to fix later.","shelf":"books","n":106,"part":"Ch. 9–10","by":"Peter Thiel"},{"id":"zero-to-one-7","channel":"Zero to One","date":null,"videoMin":null,"title":"If you build it, will they come? Distribution is half the business","checked":null,"charts":false,"md":"**The argument.** Engineers believe a great product sells itself. It doesn't. Poor sales, not a bad product, is the most common reason businesses fail. Sales is hidden on purpose (nobody wants to feel sold to), so people underrate it. If you can't get your product to people, you don't have a business.\n\n## How products get sold, by price\n| Method | Fits | How it works |\n|---|---|---|\n| Complex sales | Very large deals, few customers | The founder sells personally, over months |\n| Personal sales | Mid-sized deals | A small sales team builds a repeatable process |\n| Marketing and advertising | Cheap products for many people | Ads and brand, where you can't afford a salesperson per customer |\n| Viral | Products people share by using them | Each user brings more users (PayPal paid people to sign up friends) |\n\n- **The gap in the middle:** products too expensive to sell with ads but too cheap for a salesperson to visit. Many businesses die there.\n- **One channel wins.** Like the power law, a single distribution channel usually beats all the others combined. Find it and focus.\n- **Everyone sells.** Founders sell to investors and recruits, employees sell the company to each other. You're always selling something.\n\n**The idea worth keeping.** For a service, the method is almost always personal: you, talking to people. That's not a stopgap. It's the channel.\n\n**Try it on your work.** Write how your first ten customers will hear about you: the actual channel, not \"word of mouth\". Then put a weekly number on it, like the rule of 100 on the Hormozi shelf. This is P09 and P10.","shelf":"books","n":107,"part":"Ch. 11","by":"Peter Thiel"},{"id":"zero-to-one-8","channel":"Zero to One","date":null,"videoMin":null,"title":"Seven questions every business must answer","checked":null,"charts":false,"md":"**The argument.** The last chapters pull the book together. Computers will work best alongside people rather than replacing them. The cleantech bubble shows what happens when businesses can't answer the basic questions. And founders tend to be unusual people, which is both their strength and their risk.\n\n## Chapter 12: man and machine\n- People and computers are good at different things. The big opportunities are in tools that help people do more (PayPal's fraud system flagged suspicious payments and let humans decide), not in replacing them.\n\n## Chapter 13: seeing green, the seven questions\nMost cleantech companies of the 2000s failed because they couldn't answer these:\n1. **Engineering:** is it a breakthrough, not a small improvement?\n2. **Timing:** is now the right time to start?\n3. **Monopoly:** are you starting with a big share of a small market?\n4. **People:** do you have the right team?\n5. **Distribution:** can you actually get it to customers?\n6. **Durability:** will you still be ahead in 10 and 20 years?\n7. **Secret:** have you seen an opportunity others don't?\n\n## Chapter 14 and the end\n- Founders are often extreme in contradictory ways: insider and outsider, admired and attacked. The danger is believing your own myth.\n- The future isn't guaranteed to be better. Whether it is depends on people building new things.\n\n**The idea worth keeping.** You won't get seven yeses. Thiel says to get as many as you can, and to be honest about the ones you can't.\n\n**Try it on your work.** These are the seven questions on your idea board. Open the starred idea in Building products and answer each with yes, not sure or no. A \"not sure\" is a question to go and find out. This is P12.","shelf":"books","n":108,"part":"Ch. 12–14","by":"Peter Thiel"},{"id":"mom-test-1","channel":"The Mom Test","date":null,"videoMin":null,"title":"The Mom Test: three rules for asking about an idea without being lied to","checked":null,"charts":false,"md":"**The argument.** Ask your mum if your business idea is good and she'll say yes, because she loves you. So will most people. It's not their fault: you asked the wrong question. A good question is one even your mum can't lie to you about, because it's about her life and her past, not your idea and her opinions.\n\n## The three rules\n1. **Talk about their life instead of your idea.**\n2. **Ask about specifics in the past, not opinions or guesses about the future.**\n3. **Talk less and listen more.**\n\n## Bad questions and better ones\n| Bad | Why | Better |\n|---|---|---|\n| \"Do you think it's a good idea?\" | Only the market can tell you that | \"How do you deal with this now?\" |\n| \"Would you buy something that did X?\" | People are optimistic about their future selves | \"When did this last happen? Talk me through it.\" |\n| \"How much would you pay for X?\" | A guess about the future | \"What have you already tried? What did it cost?\" |\n| \"What would your dream product do?\" | Fine to ask, but don't build it as told | \"Why do you bother? What happens if you don't?\" |\n\nTwo more good ones: \"Who else should I talk to?\" and \"Is there anything else I should have asked?\"\n\n**The idea worth keeping.** Once you mention your idea, people start being nice instead of truthful. Keep it out of the conversation for as long as you can.\n\n**Try it on your work.** Rewrite three questions you'd normally ask about your idea so they're about the person's last week instead. Then have one real conversation using only those. This is lesson P04.","shelf":"books","n":201,"part":"Ch. 1","by":"Rob Fitzpatrick"},{"id":"mom-test-2","channel":"The Mom Test","date":null,"videoMin":null,"title":"Avoiding bad data: compliments, fluff and feature requests","checked":null,"charts":false,"md":"**The argument.** A conversation can feel great and teach you nothing. Three kinds of bad data cause most of it: compliments, fluff, and ideas. Each feels like progress and isn't. The fix is to spot them and steer back to facts about the person's life.\n\n## The three kinds\n| Bad data | Sounds like | What to do |\n|---|---|---|\n| Compliments | \"That sounds really cool!\" | Deflect it and get back to their situation. A compliment is worth nothing. |\n| Fluff | \"I usually…\", \"I always…\", \"I would definitely…\", \"I might…\" | Anchor it to a real event: \"When did that last happen?\" |\n| Ideas and feature requests | \"You should add…\" | Dig under it: \"Why do you want that? What would it let you do?\" |\n\n## Other traps\n- **Pitching.** If you catch yourself selling, stop. It turns the conversation into a test of your pitch, and they'll be polite.\n- **Looking for approval.** If you leave a conversation feeling good, ask what you actually learned. Often it was a compliment.\n- **Bad news is good news.** Learning that your idea doesn't work, before building it, saves you months.\n\n**The idea worth keeping.** \"Would\", \"might\" and \"always\" are warning words. Real facts sound like \"last Tuesday, I…\".\n\n**Try it on your work.** After your next conversation, write down everything you learned and mark each line: fact, compliment, fluff or idea. Throw out all but the facts. This is P05.","shelf":"books","n":202,"part":"Ch. 2","by":"Rob Fitzpatrick"},{"id":"mom-test-3","channel":"The Mom Test","date":null,"videoMin":null,"title":"Ask the scary questions, and keep it casual","checked":null,"charts":false,"md":"**The argument.** The questions that matter most are often the ones you're afraid to ask, because the answer might kill your idea. Ask them anyway, early. And don't turn learning into formal meetings: a casual chat gets more honest answers than an \"interview\".\n\n## Chapter 3: asking important questions\n- **Find the scary questions.** The ones that could prove your idea wrong (\"would anyone actually pay for this?\") are the ones worth asking.\n- **Prepare your three big questions** before every conversation. What do you most need to learn right now? They change as you learn.\n- **Look before you zoom.** Don't jump straight into the detail of one problem. First check that it's a problem they actually care about.\n- **Love bad news.** A clear \"no\" is progress. A vague \"maybe\" is the real waste.\n\n## Chapter 4: keeping it casual\n- If it's a formal \"interview\", people get stiff and polite. If it's a chat about their work or life, they tell you what's really going on.\n- You don't need a meeting. Many good conversations take five minutes, at an event, in a queue, over coffee.\n- Strip out the formality: no \"I'm doing some research\", no survey voice.\n\n**The idea worth keeping.** Write your three questions down before you talk to anyone. Without them, you'll drift into pleasant chat and learn nothing.\n\n**Try it on your work.** Write the scariest question about your idea. Then write how you could ask it casually, as part of a normal conversation about their week. This is P04.","shelf":"books","n":203,"part":"Ch. 3–4","by":"Rob Fitzpatrick"},{"id":"mom-test-4","channel":"The Mom Test","date":null,"videoMin":null,"title":"Commitment and advancement: how to tell if a conversation went anywhere","checked":null,"charts":false,"md":"**The argument.** A meeting where everyone is friendly and nothing is agreed is a failure dressed as a success. Real interest shows up as commitment: the person gives up something they value. And a good conversation ends with a next step that moves you forward.\n\n## The three currencies of commitment\n| Currency | Looks like |\n|---|---|\n| Time | A follow-up meeting with a clear goal; trying the thing; giving detailed feedback |\n| Reputation risk | Introducing you to their boss, a colleague or a customer; a public testimonial |\n| Money | A deposit, a pre-order, a letter of intent, a paid pilot |\n\n## Reading a conversation\n- **Compliments without commitment = zombie lead.** \"Sounds great, keep me posted\" means no.\n- **Every meeting either advances or it doesn't.** Know before you start what next step you're hoping for.\n- **Ask for a commitment.** If they refuse, you've learned something. If you never ask, you learn nothing.\n- **Early customers are the ones who commit early,** often because the problem hurts and they've already tried to solve it themselves.\n\n**The idea worth keeping.** Judge every conversation by one test: did they give up time, reputation or money?\n\n**Try it on your work.** Decide what commitment you'll ask for in your next conversation: a second chat, an intro to someone, a small deposit, a free trial on the conditions in the Hormozi first-five read. Ask for it. This is P06.","shelf":"books","n":204,"part":"Ch. 5","by":"Rob Fitzpatrick"},{"id":"mom-test-5","channel":"The Mom Test","date":null,"videoMin":null,"title":"Finding conversations, choosing your customers, and running the process","checked":null,"charts":false,"md":"**The argument.** Knowing what to ask is useless if you can't find people to ask. The last chapters cover where conversations come from, how to narrow down who you're talking to, and how to keep what you learn instead of losing it.\n\n## Chapter 6: finding conversations\n- **Go to them:** cold messages (low response, fine to start), turning up where they already gather, finding a natural excuse to talk.\n- **Bring them to you:** host a meetup, speak or teach, write about the problem.\n- **Warm introductions:** everyone knows someone. Friends, advisors, your university and your network get you in the door.\n- When you ask for a meeting, he suggests five parts: what you're working on, where you are, where you're stuck, why this person can help, and the ask.\n\n## Chapter 7: choosing your customers\n- **Startups don't starve, they drown:** too many possible customers, so the feedback is a mess.\n- **Narrow down until you know where to find them.** \"Students\" is too broad. \"Final-year students who need an internship\" tells you who and where.\n- Talk to one specific group until the answers repeat.\n\n## Chapter 8: running the process\n- Prepare (your three questions), take notes in their words, and review them right after.\n- If more than one of you is learning, share the notes. Otherwise one person becomes the bottleneck and the others argue from memory.\n\n**The idea worth keeping.** A customer group is only specific enough when you can say where to find them this week.\n\n**Try it on your work.** Write a \"who and where\" for your idea: the specific group, and three places (online or offline) where you could find ten of them this week. This is P03 and P10.","shelf":"books","n":205,"part":"Ch. 6–8","by":"Rob Fitzpatrick"},{"id":"offers-1","channel":"$100M Offers","date":null,"videoMin":null,"title":"The Grand Slam Offer, and why being a commodity keeps you poor","checked":null,"charts":false,"md":"**The argument.** Most businesses sell something that looks just like their competitors', so customers compare on price and everyone races to the bottom. Hormozi's answer is a \"Grand Slam Offer\": an offer so good that people feel stupid saying no. It makes you a category of one, so there's nothing to compare your price against.\n\n## The commodity problem\n- If a customer can line you up next to others and see the same thing, you'll be judged on price.\n- Lowering price to win makes everything worse: less money to deliver well, worse results, cheaper customers.\n- The way out isn't a better ad. It's a different offer.\n\n## What a Grand Slam Offer is\n- It bundles everything the customer needs to get their result: not \"a service\" but the whole outcome, with the obstacles removed.\n- It's so clearly valuable that the price feels small next to it.\n- It can be sold to anyone who has the problem, with less selling skill, because the offer does most of the work.\n\n## The order that matters\nHormozi ranks three things by how much they matter: **the market first, then the offer, then persuasion.** A great offer in a market that doesn't want it fails. A decent offer in a desperate market does fine. Selling skill matters least of the three.\n\n**The idea worth keeping.** If you're competing on price, the problem is the offer, not the price.\n\n**Try it on your work.** Write how a customer would compare you with the alternatives today. If the honest answer is \"on price\", note one thing you could add that nobody else includes. The next notes build on it. This is P07 and P08.","shelf":"books","n":301,"part":"Getting started","by":"Alex Hormozi"},{"id":"offers-2","channel":"$100M Offers","date":null,"videoMin":null,"title":"Find a starving crowd: the four signs of a good market","checked":null,"charts":false,"md":"**The argument.** The best offer and the best salesperson can't save you in the wrong market. Hormozi borrows the classic copywriter's line: if you had a hamburger stand, the one advantage you'd want is a starving crowd. Pick the crowd first.\n\n## The four signs of a good market\n1. **Massive pain.** They don't want it, they need it. \"Nice to have\" doesn't sell.\n2. **Purchasing power.** They can afford to pay. Struggling students with a real problem still can't pay $2,000.\n3. **Easy to target.** You can find them in one place: a group, a platform, an association, a job title.\n4. **Growing.** The market is getting bigger, so you're riding a wave rather than fighting for a shrinking pie.\n\n## The three big markets\nNearly everything people pay for falls under **health, wealth or relationships.** Start inside one, then narrow down.\n\n## Niche down\n- A general offer competes with everyone and sells cheap. The same thing aimed at one specific group can sell for many times more, because it fits them exactly.\n- He walks through narrowing a broad offer step by step, with the price it can carry going up at each step.\n- **Commit.** Hopping between markets resets you to zero each time. Pick one and stay long enough to get good.\n\n**The idea worth keeping.** Check the four signs before you build anything. If one is missing, the business will feel like pushing uphill.\n\n**Try it on your work.** Score your idea's market on the four signs: yes, not sure, no. Then narrow it once: add a job, a situation or a life stage. This is P02.","shelf":"books","n":302,"part":"The market","by":"Alex Hormozi"},{"id":"offers-3","channel":"$100M Offers","date":null,"videoMin":null,"title":"Charge what it's worth: why higher prices can be better for everyone","checked":null,"charts":false,"md":"**The argument.** Being the cheapest isn't a strategy; there's always someone willing to go broke faster than you. Hormozi argues for premium prices, not out of greed but because a higher price makes it possible to deliver much better results.\n\n## The virtuous cycle of price\n- **A higher price means more money to deliver with:** more time per client, better support, better people.\n- **Customers who pay more are more committed,** so they do the work and get better results.\n- **Better results** mean better reviews and referrals, which bring better customers who can pay more.\n- Cheap prices run the cycle backwards: less to deliver with, less committed customers, worse results.\n\n## What he means in practice\n- **Price is an issue only when the value isn't clear.** If they say it's too expensive, they don't yet see enough value.\n- **Don't discount to close.** Add value instead, or change how they pay (see the \"sell one thing\" read on the Hormozi shelf).\n\n**The idea worth keeping.** Your price is part of your offer. A low price says \"this probably won't change much for you\".\n\n**Try it on your work.** Write the price you were planning to charge, then double it. What would you have to add so the doubled price feels fair? Often the answer is more support, faster results or a guarantee. This is P08.","shelf":"books","n":303,"part":"Pricing","by":"Alex Hormozi"},{"id":"offers-4","channel":"$100M Offers","date":null,"videoMin":null,"title":"The value equation: four levers that make an offer worth paying for","checked":null,"charts":false,"md":"**The argument.** Value isn't a feeling. Hormozi breaks it into four parts. Two you push up, two you push down, and an offer is worth more the further you move each one.\n\n## The equation\n**Value = (Dream outcome × Perceived likelihood of success) ÷ (Time to get there × Effort and sacrifice)**\n\n| Lever | Direction | Means |\n|---|---|---|\n| Dream outcome | Up | What they really want, in their words (not \"fitness\" but \"fit into my wedding dress\") |\n| Perceived likelihood | Up | How sure they are it'll work for them: proof, reviews, guarantees, your track record |\n| Time delay | Down | How soon they see a result, including a quick first win |\n| Effort and sacrifice | Down | How little they have to do or give up |\n\n## What it shows\n- Most businesses only push the dream outcome (\"lose 20 kg!\"). The bottom half is where the cheap, big wins are.\n- **Making it faster and easier often costs you little and adds a lot of value.** Done-for-you is valuable mainly because it drives effort to almost zero.\n- **A quick first win** (a result in the first week) increases both perceived likelihood and how fast it feels.\n- The same core service can be worth very different prices depending on these four.\n\n**The idea worth keeping.** If you want to charge more, look at the bottom of the equation first: faster and easier.\n\n**Try it on your work.** For your service, write one change for each of the four levers. Circle the one that costs you least. This is P07.","shelf":"books","n":304,"part":"Value","by":"Alex Hormozi"},{"id":"offers-5","channel":"$100M Offers","date":null,"videoMin":null,"title":"Build the offer: list every problem, solve each one, then trim and stack","checked":null,"charts":false,"md":"**The argument.** A Grand Slam Offer isn't one clever idea. It's a method: list every obstacle between the customer and their dream outcome, turn each into a solution, choose how to deliver each one, then keep the solutions that are worth the most and cost you the least.\n\n## The five steps\n1. **Name the dream outcome,** in the customer's words.\n2. **List every problem** they'll hit on the way: before, during and after. Think through each step they'd take, and what could make them quit or doubt.\n3. **Turn each problem into a solution.** Reword it: \"I don't have time to cook\" becomes \"how to eat well with ten minutes a day\".\n4. **Choose how to deliver each solution,** with the delivery cube from the \"what to sell\" read on the Hormozi shelf: one-to-one or group, done for them or with them, live or recorded, and how fast.\n5. **Trim and stack.** Cut what's costly to you and not worth much to them. Keep what's cheap for you and valuable to them. Stack what's left into one offer.\n\n## Why it works\n- You end up solving problems competitors don't even mention, so you stop being comparable.\n- Each solution raises one of the four levers in the value equation.\n- The list of problems is also your sales script: every objection already has an answer built in.\n\n**The idea worth keeping.** The best offers are a long list of small problems solved, not one big promise.\n\n**Try it on your work.** Write ten problems your customer hits on the way to the result. Turn three into solutions you could deliver cheaply. That's the start of your offer. This is P07.","shelf":"books","n":305,"part":"Building the offer","by":"Alex Hormozi"},{"id":"offers-6","channel":"$100M Offers","date":null,"videoMin":null,"title":"Make it stronger: scarcity, urgency, bonuses, guarantees and a good name","checked":null,"charts":false,"md":"**The argument.** Once the core offer is built, five things make more people say yes now instead of \"later\". Each works only when it's honest.\n\n## The five\n| | What it is | Example |\n|---|---|---|\n| Scarcity | A real limit on how many can get it | Only five clients a month; a cap on new members |\n| Urgency | A real limit on when they can get it | A group starting on a set date; a price or bonus that ends |\n| Bonuses | Extra pieces that each answer an objection | \"I don't know where to start\" gets a step-by-step plan, named, with its value shown |\n| Guarantees | Taking risk off the buyer | Money back; keep working with them until they hit the result; pay only on results |\n| Naming | A name that says who it's for and what it does | Who it's for, the result, the time frame, plus a container word like \"challenge\" or \"programme\" |\n\n## Notes on each\n- **Bonuses beat discounts.** A discount says the thing is worth less. A bonus adds value and keeps the price.\n- **Guarantees come in kinds:** unconditional (no questions), conditional (if you do the work and don't get the result), even an \"anti-guarantee\" (all sales final, said honestly with a reason).\n- **Scarcity and urgency must be true.** Fake ones get found out and cost you trust.\n- His name formula has five parts (he spells it MAGIC): a reason for the offer, who it's for, the goal, the time, and a container word.\n\n**The idea worth keeping.** Remove the buyer's risk and give them a real reason to act now. Both are honest ways to sell more.\n\n**Try it on your work.** Give your offer a name with his five parts, one guarantee you could actually keep, and one bonus that answers the most common \"but…\". This is P07 and P08.","shelf":"books","n":306,"part":"Making it stronger","by":"Alex Hormozi"}]}</script>

  var VAL_CURRICULUM={goal_id:"goal_invest",title:"Damodaran valuation — laddered curriculum",lessons:[
    {"id": "L01", "order": 1, "rung": "Decide", "stage_name": "Routing", "concept": "Route by company type before valuing", "task": "Four companies, four routes: KO, JPMorgan, NVIDIA, Intel. Route each (mature, financial, young/high-growth, declining) and name the one thing the route changes in the model. Then judge: what would it cost to route Intel as mature instead? Check D-43/D-44.", "estimateMin": 30, "doctrine_ref": ["D-43", "D-44", "D-29"], "read": ["doctrine/stages/stage-00-routing.md"], "example": null, "co": "KO", "call": "INTC"},
    {"id": "L02", "order": 2, "rung": "Decide", "stage_name": "Story", "concept": "Narrative before numbers", "task": "Tell KO’s story in two sentences — what it sells, to whom, where it’s heading. Run it through his 3P test: possible, plausible, probable? Then judge: which one number in a KO valuation does this story pin down most? Check D-01.", "estimateMin": 30, "doctrine_ref": ["D-01"], "read": ["doctrine/D-01-story.md"], "example": null, "co": "KO", "call": "TSLA"},
    {"id": "L03", "order": 3, "rung": "Decide", "stage_name": "Currency & riskfree rate", "concept": "Currency choice, riskfree rate, non-default-free governments", "task": "KO reports in dollars and sells in 200 countries. Pick the currency and the riskfree rate for a KO valuation, and say what you’d do in a currency whose government isn’t default-free. Judge: which choice could move the value more — the currency or the rate? Check D-02–D-04.", "estimateMin": 30, "doctrine_ref": ["D-02", "D-03", "D-04"], "read": ["doctrine/stages/stage-02-currency-and-riskfree-rate.md"], "example": null, "co": "KO"},
    {"id": "L04", "order": 4, "rung": "Decide", "stage_name": "Equity risk premium", "concept": "Mature ERP, implied vs historical, country risk, company exposure", "task": "Give KO an equity risk premium: the mature-market number, implied or historical, plus country risk. Decide whether KO’s country risk comes from Atlanta or from where it sells. Then judge: which of these inputs would you fight hardest to get right, and why? Check D-05–D-08.", "estimateMin": 30, "doctrine_ref": ["D-05", "D-06", "D-07", "D-08"], "read": ["doctrine/stages/stage-03-equity-risk-premium.md"], "example": null, "co": "KO"},
    {"id": "L05", "order": 5, "rung": "Decide", "stage_name": "Relative risk", "concept": "Bottom-up beta, business mix, levering, when regressions are OK", "task": "Build KO a bottom-up beta: its businesses, their unlevered betas, its debt. Then look up KO’s regression beta and decide which you’d trust — and name the one situation where the regression would be defensible. Check D-09–D-12.", "estimateMin": 30, "doctrine_ref": ["D-09", "D-10", "D-11", "D-12"], "read": ["doctrine/stages/stage-04-relative-risk.md"], "example": null, "co": "KO"},
    {"id": "L06", "order": 6, "rung": "Decide", "stage_name": "Cost of debt", "concept": "Synthetic rating, country default burden, leases as debt", "task": "KO has a bond rating; pretend it doesn’t. Get a cost of debt from a synthetic rating (interest coverage), add its leases to debt, and decide whether a country default burden applies. Judge: does the rating or the leases move KO’s cost of capital more? Check D-13–D-15.", "estimateMin": 30, "doctrine_ref": ["D-13", "D-14", "D-15"], "read": ["doctrine/stages/stage-05-cost-of-debt.md"], "example": null, "co": "KO"},
    {"id": "L07", "order": 7, "rung": "Decide", "stage_name": "Cost of capital", "concept": "Market-value weights, one company-wide number", "task": "Weight KO’s equity and debt: book or market values? Decide, then put the cost of capital together. Judge: would one company-wide number be wrong for a company with very different businesses — and is KO one of those? Check D-16–D-18.", "estimateMin": 30, "doctrine_ref": ["D-16", "D-17", "D-18"], "read": ["doctrine/stages/stage-06-cost-of-capital.md"], "example": null, "co": "KO"},
    {"id": "L08", "order": 8, "rung": "Decide", "stage_name": "Base-year earnings", "concept": "Normalizing, R&D as capex, one-off charges, negative earnings", "task": "Take KO’s reported operating income and clean it: one-off charges, anything to capitalise (R&D, leases), anything to normalise. Judge: which cleanup moves KO’s base year most — and which would matter more for a company with negative earnings? Check D-19–D-22.", "estimateMin": 30, "doctrine_ref": ["D-19", "D-20", "D-21", "D-22"], "read": ["doctrine/stages/stage-07-base-year-earnings.md"], "example": null, "co": "KO"},
    {"id": "L09", "order": 9, "rung": "Decide", "stage_name": "Tax rate", "concept": "Effective vs marginal, convergence, NOLs", "task": "KO’s effective tax rate versus the marginal rate: pick which to use now and which at the end, and say how they converge. What would a tax loss carried forward do to the first few years? Judge: does the tax path or the base-year cleanup move KO’s value more? Check D-23–D-25.", "estimateMin": 30, "doctrine_ref": ["D-23", "D-24", "D-25"], "read": ["doctrine/stages/stage-08-tax-rate.md"], "example": null, "co": "KO"},
    {"id": "L10", "order": 10, "rung": "Decide", "stage_name": "Reinvestment", "concept": "Net capex, working capital, acquisitions, sales-to-capital", "task": "Build KO’s reinvestment from net capex, working capital and acquisitions. Then do it the other way, from sales-to-capital. Decide which fits KO — and when you’d switch, with NVIDIA in mind. Check D-26–D-29.", "estimateMin": 30, "doctrine_ref": ["D-26", "D-27", "D-28", "D-29"], "read": ["doctrine/stages/stage-09-reinvestment.md"], "example": null, "co": "KO", "call": "NVDA"},
    {"id": "L11", "order": 11, "rung": "Decide", "stage_name": "Growth", "concept": "Fundamental growth, analyst forecasts, growth fade", "task": "Derive KO’s growth from reinvestment rate × return on capital. Compare it with what analysts forecast and decide which goes in the model — and why the other isn’t an input. Judge: how fast should KO’s growth fade, and what decides that? Check D-30–D-32.", "estimateMin": 30, "doctrine_ref": ["D-30", "D-31", "D-32"], "read": ["doctrine/stages/stage-10-growth.md"], "example": null, "co": "KO"},
    {"id": "L12", "order": 12, "rung": "Decide", "stage_name": "Terminal value", "concept": "Growth cap, ROIC convergence, terminal share", "task": "Set KO’s terminal growth and terminal return on capital under his two caps (growth ≤ riskfree; return on capital → cost of capital). Judge: what share of KO’s value sits in the terminal value — and why that number deserves most of your care? Check D-33–D-35.", "estimateMin": 30, "doctrine_ref": ["D-33", "D-34", "D-35"], "read": ["doctrine/stages/stage-11-terminal-value.md"], "example": null, "co": "KO", "call": "NVDA"},
    {"id": "L13", "order": 13, "rung": "Decide", "stage_name": "Loose ends", "concept": "Cash, cross-holdings, all debt, options, control", "task": "From operating value to equity: KO’s cash, cross-holdings, all of its debt, employee options, control. Decide how each enters, then judge which loose end moves KO’s value per share most. Check D-36–D-40.", "estimateMin": 30, "doctrine_ref": ["D-36", "D-37", "D-38", "D-39", "D-40"], "read": ["doctrine/stages/stage-12-loose-ends.md"], "example": null, "co": "KO"},
    {"id": "L14", "order": 14, "rung": "Decide", "stage_name": "Value per share", "concept": "Simulation over point estimate; value vs price", "task": "Turn your KO inputs into a value per share — then into a range, not a point. Decide which three inputs drive the spread. Compare with KO’s price and name the game you’re playing: valuing, or pricing? Check D-41–D-42.", "estimateMin": 30, "doctrine_ref": ["D-41", "D-42"], "read": ["doctrine/stages/stage-13-value-per-share.md"], "example": null, "co": "KO"},
    {"id": "L15", "order": 15, "rung": "Defend", "stage_name": "Equity risk premium", "concept": "Why implied ERP beats historical", "task": "Defend his implied ERP against the historical average, out loud, as if to a sceptic: what breaks in your KO valuation if you use the average instead? Only then check D-06.", "estimateMin": 30, "doctrine_ref": ["D-06"], "read": ["doctrine/D-06-implied-vs-historical.md"], "example": null, "co": "KO"},
    {"id": "L16", "order": 16, "rung": "Defend", "stage_name": "Relative risk", "concept": "Why bottom-up beta, not regression", "task": "Tesla: an auto company or a software company? His own call hinged on it. Defend a bottom-up beta for each story against Tesla’s regression beta, and name the one case where the regression wins. Check D-09, D-12.", "estimateMin": 30, "doctrine_ref": ["D-09", "D-12"], "read": ["doctrine/D-09-bottom-up-beta.md", "doctrine/D-12-regression-betas.md"], "example": null, "co": "TSLA", "call": "TSLA"},
    {"id": "L17", "order": 17, "rung": "Defend", "stage_name": "Consistency", "concept": "Paired parameters that self-cancel", "task": "Value KO in dollars, then in euros: which inputs move together and cancel (currency, default spread, riskfree vs terminal growth)? Defend the claim that choosing inconsistently is the only real error — and find the one pair that does not cancel, and why it’s surfaced. Check the README table.", "estimateMin": 30, "doctrine_ref": ["D-02", "D-04", "D-07", "D-33"], "read": ["doctrine/README.md (the 'paired parameters that self-cancel' table)"], "example": null, "co": "KO"},
    {"id": "L18", "order": 18, "rung": "Defend", "stage_name": "Where valuations fail", "concept": "Effort vs failure: shift from discount rates to cash flows", "task": "He says ~80% of the effort goes on discount rates while valuations fail on cash flows and growth. Take his NVIDIA story: which inputs would you spend your hour on? Then judge what that changes about the 14 KO inputs you just did. Check D-19, D-35.", "estimateMin": 30, "doctrine_ref": ["D-19", "D-35"], "read": ["doctrine/README.md ('where the effort belongs')"], "example": null, "co": "NVDA", "call": "NVDA"},
    {"id": "L19", "order": 19, "rung": "Defend", "stage_name": "Reinvestment", "concept": "Sales-to-capital for growth companies", "task": "His NVIDIA model moves sales-to-capital toward 1.15. Defend revenue-driven reinvestment for a young/high-growth firm against capex-minus-depreciation, using a real sector figure from his dataset. Check D-29.", "estimateMin": 30, "doctrine_ref": ["D-29"], "read": ["doctrine/D-29-sales-to-capital.md"], "example": "a sector dataset in damodaran_source_files (e.g. cfspr21.xlsx) — find his sales-to-capital column", "co": "NVDA", "call": "NVDA"},
    {"id": "L20", "order": 20, "rung": "Defend", "stage_name": "Growth", "concept": "Growth is earned, not forecast", "task": "Growth is earned: reinvestment rate × return on capital. Defend that against plugging in an analyst’s growth number — why is the analyst number circular? Try both on NVIDIA and compare what each implies it must reinvest. Check D-30, D-31.", "estimateMin": 30, "doctrine_ref": ["D-30", "D-31"], "read": ["doctrine/D-30-fundamental-growth.md", "doctrine/D-31-analyst-forecasts.md"], "example": null, "co": "NVDA", "call": "NVDA"},
    {"id": "L21", "order": 21, "rung": "Defend", "stage_name": "Terminal value", "concept": "Why terminal discipline matters most", "task": "Terminal value is usually most of the value. Defend the growth cap and the return-on-capital convergence as what keeps it honest — with his NVIDIA call, where a 10× revenue story still has to settle somewhere. Check D-33–D-35.", "estimateMin": 30, "doctrine_ref": ["D-33", "D-34", "D-35"], "read": ["doctrine/D-33-terminal-growth-cap.md", "doctrine/D-34-terminal-return-on-capital.md", "doctrine/D-35-terminal-value-share.md"], "example": null, "co": "NVDA", "call": "NVDA"},

    {"id": "L28", "order": 28, "rung": "Compare", "stage_name": "Compare", "concept": "How the route changes the model", "task": "Put two of his DCFs side by side. List the concrete ways the young-growth model differs from the mature one (sales-to-capital, negative earnings, longer high-growth). Tie each difference to a routing decision.", "estimateMin": 45, "doctrine_ref": ["D-29", "D-43", "D-44"], "read": ["doctrine/stages/stage-00-routing.md"], "example": "two of his models: a mature company vs a young/high-growth one (e.g. Paytm)"},

    {"id": "L30", "order": 30, "rung": "Compare", "stage_name": "Sensitivity", "concept": "Which inputs actually move value", "task": "Flip inputs one at a time (beta, margin, growth, terminal ROC) and record how much value moves. Confirm his claim that cash-flow/growth inputs dominate discount-rate inputs.", "estimateMin": 45, "doctrine_ref": ["D-35"], "read": ["doctrine/D-35-terminal-value-share.md"], "example": "lab: re-run value.py flipping one input at a time", "co": "KO"},

  var THIEL_Q=[["eng","Engineering","clearly better, not a bit better?"],["time","Timing","why now?"],["mono","Monopoly","a big share of a small market?"],["people","People","the skills or team to build it?"],["dist","Distribution","a way to reach customers, not just build?"],["dur","Durability","still yours in 10 years?"],["secret","Secret","something others don’t see?"]];
  var PROD_CURRICULUM={goal_id:"goal_build",key:"prod",title:"Building products",azTitle:"Building products, A → Z",
    rungs:["Find","Test","Offer","Reach","Keep","Decide"],
    rungDesc:["which market — and where to start small","find out if people really want it, before you build","make it worth paying for, and price it","get it to the first 100 people","what stops others copying it","score your ideas, pick one, set a kill rule"],
    blurb:"One real question on one of your own ideas per sitting — the one you’ve starred on the idea board. Each lesson says which chapter of Zero to One, The Mom Test or $100M Offers to read if you want more; the idea in the lesson is enough for the sitting.",
    allDone:"now pick one idea and test it. 🚀",
    lessons:[
    {id:"P01",order:1,rung:"Find",stage_name:"New or copy?",concept:"Zero to one, or one to n",estimateMin:30,
      teach:"Thiel splits progress in two. Going from 0 to 1 means making something new. Going from 1 to n means copying what already works into more places. Copying is easier to start but crowded, because everyone else can copy too. His test question: what important truth do very few people agree with you on? Most solo founders’ first products are 1 to n — a known product, done better for a narrow group. That can work, as long as you know which one you’re doing.",
      task:"Is {idea} a 0-to-1 or a 1-to-n idea? Answer Thiel’s question for its area in one sentence. Judge: if it’s 1 to n, what do you do that the ones you copy don’t? If you can’t name it, that’s the first gap. Try it this week: find the three closest products to {idea} and write what each one gets wrong.",
      read:["Zero to One, ch. 1 (The Challenge of the Future)"]},
    {id:"P02",order:2,rung:"Find",stage_name:"A starving crowd",concept:"The market matters more than the offer",estimateMin:30,
      teach:"Hormozi ranks it: the market matters more than the offer, and the offer more than how well you sell. A good market passes four tests — people are in real pain (not a nice-to-have), they can pay, you can find them in one place, and the market is growing. Miss one and it fails: unemployed people have the pain but not the money; newspaper buyers can pay but the market is shrinking. If you know a market from your own life, start there — you already know its pain.",
      task:"Score {idea}’s market on the four tests: pain, money, easy to find, growing. Do the same for one other market you could serve with the same skills. Judge: which one passes all four? Try it this week: write down where the people in the better market gather — a subreddit, a group, a newsletter.",
      read:["$100M Offers, the “starving crowd” chapter"],
      watch:[{t:"Alex Hormozi · The Key To Finding a Profitable Market",u:"https://www.youtube.com/watch?v=LqC-oXjatmA",w:"the four tests, with the resume-coach and seniors-dating examples"}]},
    {id:"P03",order:3,rung:"Find",stage_name:"Start small",concept:"Own a tiny market first",estimateMin:30,
      teach:"Thiel: competition eats profits, so a new company should start by owning a small market, and only then grow. Amazon started with books, PayPal with eBay’s power sellers, Facebook with one college. “We only need 1% of a huge market” is a trap — you start in a fight with everyone. The Mom Test adds the practical check: if the people you talk to don’t share the same problem, your group is still too broad.",
      task:"Write {idea}’s smallest real market in one sentence: who, doing what, where. Roughly how many of them are there, and how would you reach the first 100? Judge: is it small enough that you’d be their obvious choice, but big enough to matter? Try it this week: message three people in that group.",
      read:["Zero to One, ch. 3 and ch. 5 (“start small and monopolize”)","The Mom Test, ch. 7 (Choosing your customers)"]},
    {id:"P04",order:4,rung:"Test",stage_name:"The Mom Test",concept:"Ask about their life, not your idea",estimateMin:30,
      teach:"Ask your mom if your idea is good and she’ll say yes, because she loves you — and everyone else is polite too. The fix has three rules: talk about their life, not your idea; ask about specific things that already happened, not opinions about the future; talk less and listen. Bad: “Would you use this?”, “How much would you pay?”. Good: “Walk me through the last time this happened”, “What have you tried?”, “What did it cost you?”. Fastlane’s founders ran 20 of these calls a week and found their product in what people already did.",
      task:"Write three bad questions and three good ones for {idea}, then rewrite each bad one into a good one. Judge: which good question is most likely to show you you’re wrong? Try it this week: ask it to two real people, and add them to “talked to” on the idea board.",
      read:["The Mom Test, ch. 1 (The Mom Test)"],
      watch:[{t:"Starter Story · How This SaaS Hit $69K/Month In Just 2 Months",u:"https://www.youtube.com/watch?v=BA_fC95p43c",w:"2,000 customer calls using the Mom Test — and how they narrowed an all-in-one tool to one job"}]},
    {id:"P05",order:5,rung:"Test",stage_name:"Bad data",concept:"Compliments, fluff and feature requests",estimateMin:30,
      teach:"Three things feel like progress and aren’t. Compliments (“that’s cool”) — deflect them. Fluff: “I usually”, “I would”, “I might” — anchor it by asking for the last real time it happened. Feature requests — dig under them by asking why they want it. If you left a conversation feeling great but learned no fact about their life, it was a pitch, not a test.",
      task:"Take three reactions you’ve had to {idea} — or typical ones: “Nice!”, “I’d use that”, “It should have X”. Sort each into compliment, fluff or idea, and write the follow-up question that turns it into a fact. Judge: what’s the one fact about your customer you still don’t know? Try it this week: get that fact from one person.",
      read:["The Mom Test, ch. 2 (Avoiding bad data)"]},
    {id:"P06",order:6,rung:"Test",stage_name:"Commitment",concept:"Time, reputation, money",estimateMin:30,
      teach:"A conversation only counts if it ends with a commitment, because a commitment is how people tell you the truth. It comes in three currencies: time (a follow-up, trying the beta), reputation (an introduction, a public testimonial), money (a pre-order, a deposit). “That went well” with no next step is a zombie lead. Cleo built a waitlist from LinkedIn posts and sold its paid beta only to that list — about $30K a month within days, before any public launch.",
      task:"For {idea}, write the commitment you’ll ask for at each stage: after a first chat, after a demo, and before you build the full product. Judge: what’s the smallest money commitment that would really prove demand? Try it this week: ask one person for it.",
      read:["The Mom Test, ch. 5 (Commitment and advancement)"],
      watch:[{t:"Starter Story · How My App Hit $60K/Month in 2 Months",u:"https://www.youtube.com/watch?v=XifgHi9R5Rc",w:"waitlist first, a paid beta for the list, no public launch"}]},
    {id:"P07",order:7,rung:"Offer",stage_name:"The value equation",concept:"What makes an offer worth paying for",estimateMin:30,
      teach:"Hormozi: value = (the dream outcome × how likely they believe they’ll get it) ÷ (how long it takes × how much effort it costs them). Liposuction and a $5 weight-loss ebook promise the same outcome; the price gap is the other three parts — a doctor with 10,000 surgeries behind him beats one with a single surgery. Making bigger promises is easy. The bottom half is harder and worth more: getting people the result faster and with less effort.",
      task:"Write {idea}’s four parts, one line each. Judge: which part is weakest, and what one concrete change would cut the time or the effort for the customer? Try it this week: make that change in a mock-up or in how you pitch it.",
      read:["$100M Offers, the “value equation” chapter"],
      watch:[{t:"Alex Hormozi · This ONE Equation Will Make You RICH",u:"https://www.youtube.com/watch?v=5MHQr-Z17Hc",w:"the four parts, with the liposuction and 10,000-surgeries examples"}]},
    {id:"P08",order:8,rung:"Offer",stage_name:"Price",concept:"Charge what it’s worth",estimateMin:30,
      teach:"If you sell what everyone sells, you compete on price and lose. Make an offer people can’t compare, then charge for the value. Hormozi’s math: at a 20% profit margin, raising the price 20% doubles your profit. When he tripled the price at his gym, a third of the members left and revenue still doubled. A higher price also pays for better results, which is what keeps customers.",
      task:"Set a price for {idea} and defend it with the value equation, not with your costs. Compare it with what the customer pays today for their workaround — their time counts. Judge: are you underpricing out of fear? Try it this week: say the price in your next conversation, or put it on a page, and watch the reaction.",
      read:["$100M Offers, the “commodity problem” and pricing chapters"],
      watch:[{t:"Alex Hormozi · How To Raise Your Prices",u:"https://www.youtube.com/watch?v=Gy-RmpRif-I",w:"the margin math, and the letter he actually sent"}]},
    {id:"P09",order:9,rung:"Reach",stage_name:"Distribution",concept:"If you build it, they won’t just come",estimateMin:30,
      teach:"Thiel: poor sales, not a poor product, is the most common reason companies fail. A customer has to be worth more over their lifetime than it costs to get them, and the trap is the middle — too cheap to sell person to person, too small for ads to pay. Greg Isenberg adds that distribution isn’t posting: it’s knowing where your customers’ attention already lives and the words they use for their problem — before you build.",
      task:"Make a distribution map for {idea}: 20 places its customers already pay attention — subreddits, creators, newsletters, groups, search terms, tools they pay for. Pick one channel for the first 100 users. Judge: what will one customer cost you there, and what will they pay you in a year? Try it this week: post or reply once in that channel.",
      read:["Zero to One, ch. 11 (If You Build It, Will They Come?)"],
      watch:[{t:"Greg Isenberg · “Learn AI” Is Bad Advice. Learn This Instead",u:"https://www.youtube.com/watch?v=jJIOA4GroBw",w:"the distribution map and the 48-hour loop"}]},
    {id:"P10",order:10,rung:"Reach",stage_name:"The first 100",concept:"Do things that don’t scale",estimateMin:30,
      teach:"The first 100 users come by hand. Super Demo, now at $250K a month, talked to 100+ founders before building. Then three steps: catch the people already searching (comparison pages, free tools), do things that don’t scale (the founder made free demos for founders who asked on Reddit — in public, so others saw them), and show up wherever your users already are. Launch early: speed is the one advantage a small founder has.",
      task:"Write {idea}’s first-100 plan: who is already searching for a solution, one thing that doesn’t scale you’d do for each early user, and where you’ll show up. Judge: which step gets you the first 10, and how fast? Try it this week: do the unscalable thing for one person.",
      read:["Zero to One, ch. 11 (the sales methods)"],
      watch:[{t:"Starter Story · How This $250K/Month SaaS Got Its First 100 Users",u:"https://www.youtube.com/watch?v=l4WEqPX52Cg",w:"his three-step playbook"}]},
    {id:"P11",order:11,rung:"Keep",stage_name:"Moats",concept:"What keeps it yours",estimateMin:30,
      teach:"Thiel’s four things that keep a business yours: technology at least 10 times better at something important, network effects (each user makes it better for the others), economies of scale (cheaper the bigger you get), and brand. Hormozi adds: if anyone can start your business tomorrow, the price falls — the best moats are things only you know how to do. A small product rarely has one on day one; the question is which one it could build.",
      task:"Which of the four could {idea} have in five years — honestly? Name it, and what you’d have to do from day one to build it. Judge: if a funded competitor copied {idea} next month, what would they still not have? Try it this week: write that answer as your one-line pitch.",
      read:["Zero to One, ch. 5 (Last Mover Advantage)"],
      watch:[{t:"Alex Hormozi · What Makes The Perfect Business (5 Things)",u:"https://www.youtube.com/watch?v=3fsJFUvA6Ts",w:"the fifth thing, “unique”: capital, know-how and brand as moats"}]},
    {id:"P12",order:12,rung:"Decide",stage_name:"The seven questions",concept:"Score it, pick one, set a kill rule",estimateMin:30,
      teach:"Thiel’s seven questions for any new business: engineering (clearly better, not a bit better), timing (why now), monopoly (a big share of a small market), people (the right team or skills), distribution (a way to deliver, not just build), durability (defensible 10–20 years out), and a secret (something others don’t see). He blames the cleantech bust on companies that failed most of them. You don’t need seven yeses — but every “no” is a risk you’re choosing.",
      task:"Score every idea on your idea board on the seven questions. Pick the one to test next, and write the result that would make you drop it — for example, fewer than 3 of 10 people commit. Judge: is your favourite also the best-scoring one? If not, why? Try it this week: run its test.",
      read:["Zero to One, ch. 13 (Seeing Green)"]}
  ]};

  var ASWATH_TAKES=[{"tk":"INTC","when":"2024","v":"Undervalued","vc":"good","did":"bought","preSplit":false,"hook":null,"title":"Dealing with Decline: Intel, Walgreens and Starbucks put to the test!","url":"https://www.youtube.com/watch?v=g3VT_cclr4U","date":"2024","value":"~$23.70","price":"$18.89","story":"Intel as a company <b>in decline</b> (his D-44 route) &mdash; but decline is a <em>process</em>, not a death sentence. The bar to clear the price is low: even at just 3% revenue growth and a 25% margin (below what Intel earned last decade), he gets ~$23.70/share, above the ~$18.89 price. &ldquo;I&rsquo;m not asking for much.&rdquo;","action":"He <b>bought Intel at $18.89</b>: &ldquo;the odds are in my favour.&rdquo; A fallen tech superstar, but the core business is still healthy even as NVIDIA takes share.","note":"2024. A worked example of valuing <em>decline</em> honestly &mdash; a low, defensible bar that the price still failed to clear.","drivers":[["Revenue growth","~3%"],["Operating margin","~25% (below its own history)"]]},{"tk":"NVDA","when":"Jun 2023","v":"Overvalued","vc":"bad","did":"sold half","preSplit":true,"hook":null,"title":"AI Winners, Losers and Wannabes: Valuing AI's Boost to NVIDIA's Value!","url":"https://www.youtube.com/watch?v=2N0IDShsTyc","date":"June 2023","value":"~$240","price":"$410","story":"An <em>opportunistic growth company</em> that keeps getting ahead of the crowd into profitable niches &mdash; gaming, then crypto, now AI chips and automotive. His story had revenues rising roughly tenfold over the decade (~$26bn &rarr; ~$266bn), led by AI chips (its ~75% share fading toward 60% as rivals arrive) and auto chips (~3% &rarr; ~15%); premium operating margins edging up toward a 40% target; and its heavy up-front reinvestment finally paying off as efficiency climbs toward the industry norm.","action":"As a value investor he judged the stock overvalued (his simulation put only a ~5% chance it was worth the price) &mdash; so he <b>sold half</b> his position to bank the profit, and held the other half not as a value bet but as an <em>option</em> on NVIDIA&rsquo;s proven knack for surprising to the upside. &ldquo;I split the difference.&rdquo;","note":"Dated June 2023 and <b>before NVIDIA&rsquo;s 10-for-1 split</b> (June 2024) &mdash; so his $240 is about <b>$24 split-adjusted</b>, and the $410 price he faced is ~$41 today. Read this as a worked example of his <em>method and story</em> &mdash; not his raw per-share number.","drivers":[["Revenue in 10 yrs","~$266bn (10&times;)"],["Target op. margin","40% (R&amp;D-adj.)"],["Sales-to-capital","&rarr; 1.15"],["Cost of capital","12.2%"]]},{"tk":"META","when":"Feb 2022","v":"Undervalued","vc":"good","did":"held","preSplit":false,"hook":null,"title":"Facebook/Meta, Lesson 3: Tell me a story","url":"https://www.youtube.com/watch?v=tDqTHFBKwsY","date":"February 2022","value":"~$346","price":"$220","story":"The market feared Facebook&rsquo;s golden age was over; his story was milder &mdash; growth slows and operating margins <em>drift</em> down from ~44% to ~40% (not collapse). At those inputs the value came out ~$346 against a $220 price.","action":"He had <b>already bought Facebook</b> after the Cambridge-Analytica sell-off, and this valuation reinforced the call &mdash; the market was pricing in a margin collapse he didn&rsquo;t believe.","note":"February 2022. A clean example of a <em>numbers-vs-fear</em> story: modest, defensible margin erosion &mdash; not the collapse the price implied.","drivers":[["Operating margin","44% &rarr; 40%"],["Growth","slowing, not stalling"]]},{"tk":"TSLA","when":"Feb 2020","v":"Overvalued","vc":"bad","did":"sold","preSplit":true,"hook":null,"title":"A Do-it-Yourself (DIY) Valuation of Tesla: Of Investment Regret and Disagreement!","url":"https://www.youtube.com/watch?v=BVc6CfAjAbM","date":"February 2020","value":"~$430","price":"$640","story":"It comes down to <em>which company you think Tesla is.</em> Value it as a very good <b>auto</b> company (top-quartile auto margins, an auto cost of capital) and it&rsquo;s worth only ~$106&ndash;330; to justify $700+ you must give a revolutionary <em>manufacturer</em> software-company margins, which gets you ~$2,105. His own story: an auto company reaching ~$125bn of revenue by 2030 (5&times; today), with a 10% chance of failure.","action":"He&rsquo;d bought Tesla in June 2019 as undervalued and <b>sold it here</b> as overvalued &mdash; and didn&rsquo;t regret it even as it ran on to $900: &ldquo;I bought Tesla because I thought it was undervalued; I sold because I thought it was overvalued. I have to play the game I came to play.&rdquo;","note":"February 2020, and <b>before Tesla&rsquo;s two splits</b> (5-for-1 Aug 2020 and 3-for-1 Aug 2022 = 15&times; in total) &mdash; so his $430 is about <b>$29 split-adjusted</b>. A worked example of his &lsquo;which company is it?&rsquo; method; weigh the reasoning, not the raw per-share number.","drivers":[["Revenue by 2030","~$125bn (5&times;)"],["Margins","top-quartile auto"],["Chance of failure","10%"],["Cost of capital","auto-company"]]},{"tk":"AAPL","when":"Aug 2018","v":"Overvalued","vc":"bad","did":"sold","preSplit":false,"hook":"a cash machine he trades around its value","title":"Apple and Amazon at a Trillion: A Follow up on Uncertainty and Catalysts","url":"https://www.youtube.com/watch?v=efE_MJdOzSI","date":"August 2018","value":null,"price":null,"story":"Apple is a <b>cash machine</b> &mdash; a mature, hugely profitable business he feels <em>certain</em> about (unlike Amazon, his &lsquo;disruption machine&rsquo; whose future he can&rsquo;t pin down). Certainty cuts both ways: a known business has less hidden upside, so when the price runs ahead of that steady cash generation, he steps aside and waits for the next dip.","action":"He <b>sold his stake</b> here, finding it overvalued &mdash; part of a deliberate pattern: &ldquo;I&rsquo;ve bought Apple four times in the last seven years, and sold ll,"note":"2018, and <b>before Alphabet&rsquo;s 20-for-1 split</b> (July 2022) &mdash; so his ~$957 is about <b>$48 split-adjusted</b>. Weigh the story (a maturing ad business, moon-shots worth little), not the raw number.","drivers":null}];
