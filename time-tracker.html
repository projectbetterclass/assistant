\", \"I would definitely…\", \"I might…\" | Anchor it to a real event: \"When did that last happen?\" |\n| Ideas and feature requests | \"You should add…\" | Dig under it: \"Why do you want that? What would it let you do?\" |\n\n## Other traps\n- **Pitching.** If you catch yourself selling, stop. It turns the conversation into a test of your pitch, and they'll be polite.\n- **Looking for approval.** If you leave a conversation feeling good, ask what you actually learned. Often it was a compliment.\n- **Bad news is good news.** Learning that your idea doesn't work, before building it, saves you months.\n\n**The idea worth keeping.** \"Would\", \"might\" and \"always\" are warning words. Real facts sound like \"last Tuesday, I…\".\n\n**Try it on your work.** After your next conversation, write down everything you learned and mark each line: fact, compliment, fluff or idea. Throw out all but the facts. This is P05.","shelf":"books","n":202,"part":"Ch. 2","by":"Rob Fitzpatrick"},{"id":"mom-test-3","channel":"The Mom Test","date":null,"videoMin":null,"title":"Ask the scary questions, and keep it casual","checked":null,"charts":false,"md":"**The argument.** The questions that matter most are often the ones you're afraid to ask, because the answer might kill your idea. Ask them anyway, early. And don't turn learning into formal meetings: a casual chat gets more honest answers than an \"interview\".\n\n## Chapter 3: asking important questions\n- **Find the scary questions.** The ones that could prove your idea wrong (\"would anyone actually pay for this?\") are the ones worth asking.\n- **Prepare your three big questions** before every conversation. What do you most need to learn right now? They change as you learn.\n- **Look before you zoom.** Don't jump straight into the detail of one problem. First check that it's a problem they actually care about.\n- **Love bad news.** A clear \"no\" is progress. A vague \"maybe\" is the real waste.\n\n## Chapter 4: keeping it casual\n- If it's a formal \"interview\", people get stiff and polite. If it's a chat about their work or life, they tell you what's really going on.\n- You don't need a meeting. Many good conversations take five minutes, at an event, in a queue, over coffee.\n- Strip out the formality: no \"I'm doing some research\", no survey voice.\n\n**The idea worth keeping.** Write your three questions down before you talk to anyone. Without them, you'll drift into pleasant chat and learn nothing.\n\n**Try it on your work.** Write the scariest question about your idea. Then write how you could ask it casually, as part of a normal conversation about their week. This is P04.","shelf":"books","n":203,"part":"Ch. 3–4","by":"Rob Fitzpatrick"},{"id":"mom-test-4","channel":"The Mom Test","date":null,"videoMin":null,"title":"Commitment and advancement: how to tell if a conversation went anywhere","checked":null,"charts":false,"md":"**The argument.** A meeting where everyone is friendly and nothing is agreed is a failure dressed as a success. Real interest shows up as commitment: the person gives up something they value. And a good conversation ends with a next step that moves you forward.\n\n## The three currencies of commitment\n| Currency | Looks like |\n|---|---|\n| Time | A follow-up meeting with a clear goal; trying the thing; giving detailed feedback |\n| Reputation risk | Introducing you to their boss, a colleague or a customer; a public testimonial |\n| Money | A deposit, a pre-order, a letter of intent, a paid pilot |\n\n## Reading a conversation\n- **Compliments without commitment = zombie lead.** \"Sounds great, keep me posted\" means no.\n- **Every meeting either advances or it doesn't.** Know before you start what next step you're hoping for.\n- **Ask for a commitment.** If they refuse, you've learned something. If you never ask, you learn nothing.\n- **Early customers are the ones who commit early,** often because the problem hurts and they've already tried to solve it themselves.\n\n**The idea worth keeping.** Judge every conversation by one test: did they give up time, reputation or money?\n\n**Try it on your work.** Decide what commitment you'll ask for in your next conversation: a second chat, an intro to someone, a small deposit, a free trial on the conditions in the Hormozi first-five read. Ask for it. This is P06.","shelf":"books","n":204,"part":"Ch. 5","by":"Rob Fitzpatrick"},{"id":"mom-test-5","channel":"The Mom Test","date":null,"videoMin":null,"title":"Finding conversations, choosing your customers, and running the process","checked":null,"charts":false,"md":"**The argument.** Knowing what to ask is useless if you can't find people to ask. The last chapters cover where conversations come from, how to narrow down who you're talking to, and how to keep what you learn instead of losing it.\n\n## Chapter 6: finding conversations\n- **Go to them:** cold messages (low response, fine to start), turning up where they already gather, finding a natural excuse to talk.\n- **Bring them to you:** host a meetup, speak or teach, write about the problem.\n- **Warm introductions:** everyone knows someone. Friends, advisors, your university and your network get you in the door.\n- When you ask for a meeting, he suggests five parts: what you're working on, where you are, where you're stuck, why this person can help, and the ask.\n\n## Chapter 7: choosing your customers\n- **Startups don't starve, they drown:** too many possible customers, so the feedback is a mess.\n- **Narrow down until you know where to find them.** \"Students\" is too broad. \"Final-year students who need an internship\" tells you who and where.\n- Talk to one specific group until the answers repeat.\n\n## Chapter 8: running the process\n- Prepare (your three questions), take notes in their words, and review them right after.\n- If more than one of you is learning, share the notes. Otherwise one person becomes the bottleneck and the others argue from memory.\n\n**The idea worth keeping.** A customer group is only specific enough when you can say where to find them this week.\n\n**Try it on your work.** Write a \"who and where\" for your idea: the specific group, and three places (online or offline) where you could find ten of them this week. This is P03 and P10.","shelf":"books","n":205,"part":"Ch. 6–8","by":"Rob Fitzpatrick"},{"id":"offers-1","channel":"$100M Offers","date":null,"videoMin":null,"title":"The Grand Slam Offer, and why being a commodity keeps you poor","checked":null,"charts":false,"md":"**The argument.** Most businesses sell something that looks just like their competitors', so customers compare on price and everyone races to the bottom. Hormozi's answer is a \"Grand Slam Offer\": an offer so good that people feel stupid saying no. It makes you a category of one, so there's nothing to compare your price against.\n\n## The commodity problem\n- If a customer can line you up next to others and see the same thing, you'll be judged on price.\n- Lowering price to win makes everything worse: less money to deliver well, worse results, cheaper customers.\n- The way out isn't a better ad. It's a different offer.\n\n## What a Grand Slam Offer is\n- It bundles everything the customer needs to get their result: not \"a service\" but the whole outcome, with the obstacles removed.\n- It's so clearly valuable that the price feels small next to it.\n- It can be sold to anyone who has the problem, with less selling skill, because the offer does most of the work.\n\n## The order that matters\nHormozi ranks three things by how much they matter: **the market first, then the offer, then persuasion.** A great offer in a market that doesn't want it fails. A decent offer in a desperate market does fine. Selling skill matters least of the three.\n\n**The idea worth keeping.** If you're competing on price, the problem is the offer, not the price.\n\n**Try it on your work.** Write how a customer would compare you with the alternatives today. If the honest answer is \"on price\", note one thing you could add that nobody else includes. The next notes build on it. This is P07 and P08.","shelf":"books","n":301,"part":"Getting started","by":"Alex Hormozi"},{"id":"offers-2","channel":"$100M Offers","date":null,"videoMin":null,"title":"Find a starving crowd: the four signs of a good market","checked":null,"charts":false,"md":"**The argument.** The best offer and the best salesperson can't save you in the wrong market. Hormozi borrows the classic copywriter's line: if you had a hamburger stand, the one advantage you'd want is a starving crowd. Pick the crowd first.\n\n## The four signs of a good market\n1. **Massive pain.** They don't want it, they need it. \"Nice to have\" doesn't sell.\n2. **Purchasing power.** They can afford to pay. Struggling students with a real problem still can't pay $2,000.\n3. **Easy to target.** You can find them in one place: a group, a platform, an association, a job title.\n4. **Growing.** The market is getting bigger, so you're riding a wave rather than fighting for a shrinking pie.\n\n## The three big markets\nNearly everything people pay for falls under **health, wealth or relationships.** Start inside one, then narrow down.\n\n## Niche down\n- A general offer competes with everyone and sells cheap. The same thing aimed at one specific group can sell for many times more, because it fits them exactly.\n- He walks through narrowing a broad offer step by step, with the price it can carry going up at each step.\n- **Commit.** Hopping between markets resets you to zero each time. Pick one and stay long enough to get good.\n\n**The idea worth keeping.** Check the four signs before you build anything. If one is missing, the business will feel like pushing uphill.\n\n**Try it on your work.** Score your idea's market on the four signs: yes, not sure, no. Then narrow it once: add a job, a situation or a life stage. This is P02.","shelf":"books","n":302,"part":"The market","by":"Alex Hormozi"},{"id":"offers-3","channel":"$100M Offers","date":null,"videoMin":null,"title":"Charge what it's worth: why higher prices can be better for everyone","checked":null,"charts":false,"md":"**The argument.** Being the cheapest isn't a strategy; there's always someone willing to go broke faster than you. Hormozi argues for premium prices, not out of greed but because a higher price makes it possible to deliver much better results.\n\n## The virtuous cycle of price\n- **A higher price means more money to deliver with:** more time per client, better support, better people.\n- **Customers who pay more are more committed,** so they do the work and get better results.\n- **Better results** mean better reviews and referrals, which bring better customers who can pay more.\n- Cheap prices run the cycle backwards: less to deliver with, less committed customers, worse results.\n\n## What he means in practice\n- **Price is an issue only when the value isn't clear.** If they say it's too expensive, they don't yet see enough value.\n- **Don't discount to close.** Add value instead, or change how they pay (see the \"sell one thing\" read on the Hormozi shelf).\n\n**The idea worth keeping.** Your price is part of your offer. A low price says \"this probably won't change much for you\".\n\n**Try it on your work.** Write the price you were planning to charge, then double it. What would you have to add so the doubled price feels fair? Often the answer is more support, faster results or a guarantee. This is P08.","shelf":"books","n":303,"part":"Pricing","by":"Alex Hormozi"},{"id":"offers-4","channel":"$100M Offers","date":null,"videoMin":null,"title":"The value equation: four levers that make an offer worth paying for","checked":null,"charts":false,"md":"**The argument.** Value isn't a feeling. Hormozi breaks it into four parts. Two you push up, two you push down, and an offer is worth more the further you move each one.\n\n## The equation\n**Value = (Dream outcome × Perceived likelihood of success) ÷ (Time to get there × Effort and sacrifice)**\n\n| Lever | Direction | Means |\n|---|---|---|\n| Dream outcome | Up | What they really want, in their words (not \"fitness\" but \"fit into my wedding dress\") |\n| Perceived likelihood | Up | How sure they are it'll work for them: proof, reviews, guarantees, your track record |\n| Time delay | Down | How soon they see a result, including a quick first win |\n| Effort and sacrifice | Down | How little they have to do or give up |\n\n## What it shows\n- Most businesses only push the dream outcome (\"lose 20 kg!\"). The bottom half is where the cheap, big wins are.\n- **Making it faster and easier often costs you little and adds a lot of value.** Done-for-you is valuable mainly because it drives effort to almost zero.\n- **A quick first win** (a result in the first week) increases both perceived likelihood and how fast it feels.\n- The same core service can be worth very different prices depending on these four.\n\n**The idea worth keeping.** If you want to charge more, look at the bottom of the equation first: faster and easier.\n\n**Try it on your work.** For your service, write one change for each of the four levers. Circle the one that costs you least. This is P07.","shelf":"books","n":304,"part":"Value","by":"Alex Hormozi"},{"id":"offers-5","channel":"$100M Offers","date":null,"videoMin":null,"title":"Build the offer: list every problem, solve each one, then trim and stack","checked":null,"charts":false,"md":"**The argument.** A Grand Slam Offer isn't one clever idea. It's a method: list every obstacle between the customer and their dream outcome, turn each into a solution, choose how to deliver each one, then keep the solutions that are worth the most and cost you the least.\n\n## The five steps\n1. **Name the dream outcome,** in the customer's words.\n2. **List every problem** they'll hit on the way: before, during and after. Think through each step they'd take, and what could make them quit or doubt.\n3. **Turn each problem into a solution.** Reword it: \"I don't have time to cook\" becomes \"how to eat well with ten minutes a day\".\n4. **Choose how to deliver each solution,** with the delivery cube from the \"what to sell\" read on the Hormozi shelf: one-to-one or group, done for them or with them, live or recorded, and how fast.\n5. **Trim and stack.** Cut what's costly to you and not worth much to them. Keep what's cheap for you and valuable to them. Stack what's left into one offer.\n\n## Why it works\n- You end up solving problems competitors don't even mention, so you stop being comparable.\n- Each solution raises one of the four levers in the value equation.\n- The list of problems is also your sales script: every objection already has an answer built in.\n\n**The idea worth keeping.** The best offers are a long list of small problems solved, not one big promise.\n\n**Try it on your work.** Write ten problems your customer hits on the way to the result. Turn three into solutions you could deliver cheaply. That's the start of your offer. This is P07.","shelf":"books","n":305,"part":"Building the offer","by":"Alex Hormozi"},{"id":"offers-6","channel":"$100M Offers","date":null,"videoMin":null,"title":"Make it stronger: scarcity, urgency, bonuses, guarantees and a good name","checked":null,"charts":false,"md":"**The argument.** Once the core offer is built, five things make more people say yes now instead of \"later\". Each works only when it's honest.\n\n## The five\n| | What it is | Example |\n|---|---|---|\n| Scarcity | A real limit on how many can get it | Only five clients a month; a cap on new members |\n| Urgency | A real limit on when they can get it | A group starting on a set date; a price or bonus that ends |\n| Bonuses | Extra pieces that each answer an objection | \"I don't know where to start\" gets a step-by-step plan, named, with its value shown |\n| Guarantees | Taking risk off the buyer | Money back; keep working with them until they hit the result; pay only on results |\n| Naming | A name that says who it's for and what it does | Who it's for, the result, the time frame, plus a container word like \"challenge\" or \"programme\" |\n\n## Notes on each\n- **Bonuses beat discounts.** A discount says the thing is worth less. A bonus adds value and keeps the price.\n- **Guarantees come in kinds:** unconditional (no questions), conditional (if you do the work and don't get the result), even an \"anti-guarantee\" (all sales final, said honestly with a reason).\n- **Scarcity and urgency must be true.** Fake ones get found out and cost you trust.\n- His name formula has five parts (he spells it MAGIC): a reason for the offer, who it's for, the goal, the time, and a container word.\n\n**The idea worth keeping.** Remove the buyer's risk and give them a real reason to act now. Both are honest ways to sell more.\n\n**Try it on your work.** Give your offer a name with his five parts, one guarantee you could actually keep, and one bonus that answers the most common \"but…\". This is P07 and P08.","shelf":"books","n":306,"part":"Making it stronger","by":"Alex Hormozi"}]}</script>

(function(){

  var REV_CO={KO:"PEP",NVDA:"AMD",TSLA:"BYD",JPM:"WFC",INTC:"IBM"};   // the revisit is the same question on a new company (Aswath: a company every week)

  var VAL_RUNGS=["Decide","Defend","Run","Compare","Judge","Produce"];   // six rungs of doing — higher-order from day one; remembering and understanding come free on the way

  var VAL_CURRICULUM={goal_id:"goal_invest",title:"Damodaran valuation — laddered curriculum",lessons:[
    {"id": "L01", "order": 1, "rung": "Decide", "stage_name": "Routing", "concept": "Route by company type before valuing", "task": "Four companies, four routes: KO, JPMorgan, NVIDIA, Intel. Route each (mature, financial, young/high-growth, declining) and name the one thing the route changes in the model. Then judge: what would it cost to route Intel as mature instead? Check D-43/D-44.", "estimateMin": 30, "doctrine_ref": ["D-43", "D-44", "D-29"], "read": ["doctrine/stages/stage-00-routing.md"], "example": null, "co": "KO", "call": "INTC"},
    {"id": "L02", "order": 2, "rung": "Decide", "stage_name": "Story", "concept": "Narrative before numbers", "task": "Tell KO’s story in two sentences — what it sells, to whom, where it’s heading. Run it through his 3P test: possible, plausible, probable? Then judge: which one number in a KO valuation does this story pin down most? Check D-01.", "estimateMin": 30, "doctrine_ref": ["D-01"], "read": ["doctrine/D-01-story.md"], "example": null, "co": "KO", "call": "TSLA"},
    {"id": "L03", "order": 3, "rung": "Decide", "stage_name": "Currency & riskfree rate", "concept": "Currency choice, riskfree rate, non-default-free governments", "task": "KO reports in dollars and sells in 200 countries. Pick the currency and the riskfree rate for a KO valuation, and say what you’d do in a currency whose government isn’t default-free. Judge: which choice could move the value more — the currency or the rate? Check D-02–D-04.", "estimateMin": 30, "doctrine_ref": ["D-02", "D-03", "D-04"], "read": ["doctrine/stages/stage-02-currency-and-riskfree-rate.md"], "example": null, "co": "KO"},
    {"id": "L04", "order": 4, "rung": "Decide", "stage_name": "Equity risk premium", "concept": "Mature ERP, implied vs historical, country risk, company exposure", "task": "Give KO an equity risk premium: the mature-market number, implied or historical, plus country risk. Decide whether KO’s country risk comes from Atlanta or from where it sells. Then judge: which of these inputs would you fight hardest to get right, and why? Check D-05–D-08.", "estimateMin": 30, "doctrine_ref": ["D-05", "D-06", "D-07", "D-08"], "read": ["doctrine/stages/stage-03-equity-risk-premium.md"], "example": null, "co": "KO"},
    {"id": "L05", "order": 5, "rung": "Decide", "stage_name": "Relative risk", "concept": "Bottom-up beta, business mix, levering, when regressions are OK", "task": "Build KO a bottom-up beta: its businesses, their unlevered betas, its debt. Then look up KO’s regression beta and decide which you’d trust — and name the one situation where the regression would be defensible. Check D-09–D-12.", "estimateMin": 30, "doctrine_ref": ["D-09", "D-10", "D-11", "D-12"], "read": ["doctrine/stages/stage-04-relative-risk.md"], "example": null, "co": "KO"},
    {"id": "L06", "order": 6, "rung": "Decide", "stage_name": "Cost of debt", "concept": "Synthetic rating, country default burden, leases as debt", "task": "KO has a bond rating; pretend it doesn’t. Get a cost of debt from a synthetic rating (interest coverage), add its leases to debt, and decide whether a country default burden applies. Judge: does the rating or the leases move KO’s cost of capital more? Check D-13–D-15.", "estimateMin": 30, "doctrine_ref": ["D-13", "D-14", "D-15"], "read": ["doctrine/stages/stage-05-cost-of-debt.md"], "example": null, "co": "KO"},
    {"id": "L07", "order": 7, "rung": "Decide", "stage_name": "Cost of capital", "concept": "Market-value weights, one company-wide number", "task": "Weight KO’s equity and debt: book or market values? Decide, then put the cost of capital together. Judge: would one company-wide number be wrong for a company with very different businesses — and is KO one of those? Check D-16–D-18.", "estimateMin": 30, "doctrine_ref": ["D-16", "D-17", "D-18"], "read": ["doctrine/stages/stage-06-cost-of-capital.md"], "example": null, "co": "KO"},
    {"id": "L08", "order": 8, "rung": "Decide", "stage_name": "Base-year earnings", "concept": "Normalizing, R&D as capex, one-off charges, negative earnings", "task": "Take KO’s reported operating income and clean it: one-off charges, anything to capitalise (R&D, leases), anything to normalise. Judge: which cleanup moves KO’s base year most — and which would matter more for a company with negative earnings? Check D-19–D-22.", "estimateMin": 30, "doctrine_ref": ["D-19", "D-20", "D-21", "D-22"], "read": ["doctrine/stages/stage-07-base-year-earnings.md"], "example": null, "co": "KO"},
    {"id": "L09", "order": 9, "rung": "Decide", "stage_name": "Tax rate", "concept": "Effective vs marginal, convergence, NOLs", "task": "KO’s effective tax rate versus the marginal rate: pick which to use now and which at the end, and say how they converge. What would a tax loss carried forward do to the first few years? Judge: does the tax path or the base-year cleanup move KO’s value more? Check D-23–D-25.", "estimateMin": 30, "doctrine_ref": ["D-23", "D-24", "D-25"], "read": ["doctrine/stages/stage-08-tax-rate.md"], "example": null, "co": "KO"},

    {"id": "L11", "order": 11, "rung": "Decide", "stage_name": "Growth", "concept": "Fundamental growth, analyst forecasts, growth fade", "task": "Derive KO’s growth from reinvestment rate × return on capital. Compare it with what analysts forecast and decide which goes in the model — and why the other isn’t an input. Judge: how fast should KO’s growth fade, and what decides that? Check D-30–D-32.", "estimateMin": 30, "doctrine_ref": ["D-30", "D-31", "D-32"], "read": ["doctrine/stages/stage-10-growth.md"], "example": null, "co": "KO"},
    {"id": "L12", "order": 12, "rung": "Decide", "stage_name": "Terminal value", "concept": "Growth cap, ROIC convergence, terminal share", "task": "Set KO’s terminal growth and terminal return on capital under his two caps (growth ≤ riskfree; return on capital → cost of capital). Judge: what share of KO’s value sits in the terminal value — and why that number deserves most of your care? Check D-33–D-35.", "estimateMin": 30, "doctrine_ref": ["D-33", "D-34", "D-35"], "read": ["doctrine/stages/stage-11-terminal-value.md"], "example": null, "co": "KO", "call": "NVDA"},
    {"id": "L13", "order": 13, "rung": "Decide", "stage_name": "Loose ends", "concept": "Cash, cross-holdings, all debt, options, control", "task": "From operating value to equity: KO’s cash, cross-holdings, all of its debt, employee options, control. Decide how each enters, then judge which loose end moves KO’s value per share most. Check D-36–D-40.", "estimateMin": 30, "doctrine_ref": ["D-36", "D-37", "D-38", "D-39", "D-40"], "read": ["doctrine/stages/stage-12-loose-ends.md"], "example": null, "co": "KO"},
    {"id": "L14", "order": 14, "rung": "Decide", "stage_name": "Value per share", "concept": "Simulation over point estimate; value vs price", "task": "Turn your KO inputs into a value per share — then into a range, not a point. Decide which three inputs drive the spread. Compare with KO’s price and name the game you’re playing: valuing, or pricing? Check D-41–D-42.", "estimateMin": 30, "doctrine_ref": ["D-41", "D-42"], "read": ["doctrine/stages/stage-13-value-per-share.md"], "example": null, "co": "KO"},
    {"id": "L15", "order": 15, "rung": "Defend", "stage_name": "Equity risk premium", "concept": "Why implied ERP beats historical", "task": "Defend his implied ERP against the historical average, out loud, as if to a sceptic: what breaks in your KO valuation if you use the average instead? Only then check D-06.", "estimateMin": 30, "doctrine_ref": ["D-06"], "read": ["doctrine/D-06-implied-vs-historical.md"], "example": null, "co": "KO"},
    {"id": "L16", "order": 16, "rung": "Defend", "stage_name": "Relative risk", "concept": "Why bottom-up beta, not regression", "task": "Tesla: an auto company or a software company? His own call hinged on it. Defend a bottom-up beta for each story against Tesla’s regression beta, and name the one case where the regression wins. Check D-09, D-12.", "estimateMin": 30, "doctrine_ref": ["D-09", "D-12"], "read": ["doctrine/D-09-bottom-up-beta.md", "doctrine/D-12-regression-betas.md"], "example": null, "co": "TSLA", "call": "TSLA"},
    {"id": "L17", "order": 17, "rung": "Defend", "stage_name": "Consistency", "concept": "Paired parameters that self-cancel", "task": "Value KO in dollars, then in euros: which inputs move together and cancel (currency, default spread, riskfree vs terminal growth)? Defend the claim that choosing inconsistently is the only real error — and find the one pair that does not cancel, and why it’s surfaced. Check the README table.", "estimateMin": 30, "doctrine_ref": ["D-02", "D-04", "D-07", "D-33"], "read": ["doctrine/README.md (the 'paired parameters that self-cancel' table)"], "example": null, "co": "KO"},
    {"id": "L18", "order": 18, "rung": "Defend", "stage_name": "Where valuations fail", "concept": "Effort vs failure: shift from discount rates to cash flows", "task": "He says ~80% of the effort goes on discount rates while valuations fail on cash flows and growth. Take his NVIDIA story: which inputs would you spend your hour on? Then judge what that changes about the 14 KO inputs you just did. Check D-19, D-35.", "estimateMin": 30, "doctrine_ref": ["D-19", "D-35"], "read": ["doctrine/README.md ('where the effort belongs')"], "example": null, "co": "NVDA", "call": "NVDA"},
    {"id": "L19", "order": 19, "rung": "Defend", "stage_name": "Reinvestment", "concept": "Sales-to-capital for growth companies", "task": "His NVIDIA model moves sales-to-capital toward 1.15. Defend revenue-driven reinvestment for a young/high-growth firm against capex-minus-depreciation, using a real sector figure from his dataset. Check D-29.", "estimateMin": 30, "doctrine_ref": ["D-29"], "read": ["doctrine/D-29-sales-to-capital.md"], "example": "a sector dataset in damodaran_source_files (e.g. cfspr21.xlsx) — find his sales-to-capital column", "co": "NVDA", "call": "NVDA"},
    {"id": "L20", "order": 20, "rung": "Defend", "stage_name": "Growth", "concept": "Growth is earned, not forecast", "task": "Growth is earned: reinvestment rate × return on capital. Defend that against plugging in an analyst’s growth number — why is the analyst number circular? Try both on NVIDIA and compare what each implies it must reinvest. Check D-30, D-31.", "estimateMin": 30, "doctrine_ref": ["D-30", "D-31"], "read": ["doctrine/D-30-fundamental-growth.md", "doctrine/D-31-analyst-forecasts.md"], "example": null, "co": "NVDA", "call": "NVDA"},
    {"id": "L21", "order": 21, "rung": "Defend", "stage_name": "Terminal value", "concept": "Why terminal discipline matters most", "task": "Terminal value is usually most of the value. Defend the growth cap and the return-on-capital convergence as what keeps it honest — with his NVIDIA call, where a 10× revenue story still has to settle somewhere. Check D-33–D-35.", "estimateMin": 30, "doctrine_ref": ["D-33", "D-34", "D-35"], "read": ["doctrine/D-33-terminal-growth-cap.md", "doctrine/D-34-terminal-return-on-capital.md", "doctrine/D-35-terminal-value-share.md"], "example": null, "co": "NVDA", "call": "NVDA"},

    {"id": "L23", "order": 23, "rung": "Run", "stage_name": "Full run", "concept": "Read a whole valuation against its doctrine", "task": "Run the agent on a stable company (e.g. KO). For each flagged judgment, open the cited doctrine card and confirm you understand why that value was chosen. Note any you'd choose differently.", "estimateMin": 60, "doctrine_ref": ["D-01", "D-42"], "read": [], "example": "lab: py value.py KO --show-judgments", "co": "KO"},
    {"id": "L24", "order": 24, "rung": "Run", "stage_name": "Discount rate", "concept": "Build a cost of capital end-to-end", "task": "For one company, work out riskfree, ERP, bottom-up beta, cost of debt and market-value-weighted WACC by hand. Check each against his sector figure. Each number: computed or chosen (with a reason).", "estimateMin": 60, "doctrine_ref": ["D-03", "D-05", "D-06", "D-09", "D-13", "D-16"], "read": ["doctrine/stages/stage-02-currency-and-riskfree-rate.md", "doctrine/stages/stage-06-cost-of-capital.md"], "example": "cross-check against his industry cost-of-capital data (wacc)", "co": "KO"},
    {"id": "L25", "order": 25, "rung": "Run", "stage_name": "Cash flows", "concept": "Earnings, tax and reinvestment (where valuations fail)", "task": "For your company: normalize base-year earnings, pick a tax path, and build reinvestment (net capex, working capital, or sales-to-capital). Compare your structure to how he did it in a real model.", "estimateMin": 75, "doctrine_ref": ["D-19", "D-20", "D-23", "D-26", "D-27", "D-29"], "read": ["doctrine/stages/stage-07-base-year-earnings.md", "doctrine/stages/stage-09-reinvestment.md"], "example": "a completed DCF in damodaran_source_files (see INDEX.md), e.g. Paytm2021.xlsx", "co": "KO"},
    {"id": "L26", "order": 26, "rung": "Run", "stage_name": "Growth & terminal", "concept": "Grow it and close it out", "task": "Extend your company's cash flows with fundamental growth and a disciplined terminal value (growth <= riskfree, ROIC -> cost of capital). What share of value is terminal? Is that defensible?", "estimateMin": 60, "doctrine_ref": ["D-30", "D-32", "D-33", "D-34", "D-35"], "read": ["doctrine/stages/stage-10-growth.md", "doctrine/stages/stage-11-terminal-value.md"], "example": null, "co": "KO"},
    {"id": "L27", "order": 27, "rung": "Run", "stage_name": "Study a model", "concept": "Trace a finished DCF to the doctrine", "task": "Open one of his real DCF spreadsheets. Trace every major input (story, growth, reinvestment, terminal) back to the doctrine stage it belongs to. Where did he make a JUDGMENT vs a computation?", "estimateMin": 60, "doctrine_ref": ["D-01", "D-29", "D-30", "D-33"], "read": [], "example": "open a company DCF from damodaran_source_files (e.g. Paytm2021.xlsx)"},
    {"id": "L28", "order": 28, "rung": "Compare", "stage_name": "Compare", "concept": "How the route changes the model", "task": "Put two of his DCFs side by side. List the concrete ways the young-growth model differs from the mature one (sales-to-capital, negative earnings, longer high-growth). Tie each difference to a routing decision.", "estimateMin": 45, "doctrine_ref": ["D-29", "D-43", "D-44"], "read": ["doctrine/stages/stage-00-routing.md"], "example": "two of his models: a mature company vs a young/high-growth one (e.g. Paytm)"},
    {"id": "L29", "order": 29, "rung": "Compare", "stage_name": "Convergence paths", "concept": "Disputed constants become paths", "task": "In a real model, trace the three convergences: effective->marginal tax, high->terminal growth, excess->competitive returns. Why is 'it's a path, not a constant' the resolution each time?", "estimateMin": 40, "doctrine_ref": ["D-24", "D-32", "D-34"], "read": ["doctrine/README.md ('disputed constants become paths')"], "example": "any of his multi-year DCF models"},
    {"id": "L30", "order": 30, "rung": "Compare", "stage_name": "Sensitivity", "concept": "Which inputs actually move value", "task": "Flip inputs one at a time (beta, margin, growth, terminal ROC) and record how much value moves. Confirm his claim that cash-flow/growth inputs dominate discount-rate inputs.", "estimateMin": 45, "doctrine_ref": ["D-35"], "read": ["doctrine/D-35-terminal-value-share.md"], "example": "lab: re-run value.py flipping one input at a time", "co": "KO"},

    {"id": "L32", "order": 32, "rung": "Judge", "stage_name": "Verdict", "concept": "Cheap or dear — and can you defend it", "task": "For a company you've valued, deliver a value-vs-price verdict. State the 2-3 assumptions the verdict hangs on, and what would have to be true for the market to be right instead of you.", "estimateMin": 30, "doctrine_ref": ["D-42", "D-45", "D-49"], "read": ["doctrine/D-42-value-vs-price.md"], "example": null},

  /* Building products — the same sittings as the valuation ladder, but "an idea a week" instead of "a company a week":
     every lesson runs on the idea you've starred on the idea board ({idea} in a task). Sources: Zero to One (Thiel),
     The Mom Test (Fitzpatrick), $100M Offers (Hormozi) — summarised in my words, with the chapter to read — and videos
     from the youtube-digest library. Only done-flags, revisits and the idea board are ever saved into app-state. */
  var THIEL_Q=[["eng","Engineering","clearly better, not a bit better?"],["time","Timing","why now?"],["mono","Monopoly","a big share of a small market?"],["people","People","the skills or team to build it?"],["dist","Distribution","a way to reach customers, not just build?"],["dur","Durability","still yours in 10 years?"],["secret","Secret","something others don’t see?"]];
  var PROD_CURRICULUM={goal_id:"goal_build",key:"prod",title:"Building products",azTitle:"Building products, A → Z",
    rungs:["Find","Test","Offer","Reach","Keep","Decide"],
    rungDesc:["which market — and where to start small","find out if people really want it, before you build","make it worth paying for, and price it","get it to the first 100 people","what stops others copying it","score your ideas, pick one, set a kill rule"],
    blurb:"One real question on one of your own ideas per sitting — the one you’ve starred on the idea board. Each lesson says which chapter of Zero to One, The Mom Test or $100M Offers to read if you want more; the idea in the lesson is enough for the sitting.",
    allDone:"now pick one idea and test it. 🚀",
    lessons:[
    {id:"P01",order:1,rung:"Find",stage_name:"New or copy?",concept:"Zero to one, or one to n",estimateMin:30,
      teach:"Thiel splits progress in two. Going from 0 to 1 means making something new. Going from 1 to n means copying what already works into more places. Copying is easier to start but crowded, because everyone else can copy too. His test question: what important truth do very few people agree with you on? Most solo founders’ first products are 1 to n — a known product, done better for a narrow group. That can work, as long as you know which one you’re doing.",
      task:"Is {idea} a 0-to-1 or a 1-to-n idea? Answer Thiel’s question for its area in one sentence. Judge: if it’s 1 to n, what do you do that the ones you copy don’t? If you can’t name it, that’s the first gap. Try it this week: find the three closest products to {idea} and write what each one gets wrong.",
      read:["Zero to One, ch. 1 (The Challenge of the Future)"]},
    {id:"P02",order:2,rung:"Find",stage_name:"A starving crowd",concept:"The market matters more than the offer",estimateMin:30,
      teach:"Hormozi ranks it: the market matters more than the offer, and the offer more than how well you sell. A good market passes four tests — people are in real pain (not a nice-to-have), they can pay, you can find them in one place, and the market is growing. Miss one and it fails: unemployed people have the pain but not the money; newspaper buyers can pay but the market is shrinking. If you know a market from your own life, start there — you already know its pain.",
      task:"Score {idea}’s market on the four tests: pain, money, easy to find, growing. Do the same for one other market you could serve with the same skills. Judge: which one passes all four? Try it this week: write down where the people in the better market gather — a subreddit, a group, a newsletter.",
      read:["$100M Offers, the “starving crowd” chapter"],
      watch:[{t:"Alex Hormozi · The Key To Finding a Profitable Market",u:"https://www.youtube.com/watch?v=LqC-oXjatmA",w:"the four tests, with the resume-coach and seniors-dating examples"}]},
    {id:"P03",order:3,rung:"Find",stage_name:"Start small",concept:"Own a tiny market first",estimateMin:30,
      teach:"Thiel: competition eats profits, so a new company should start by owning a small market, and only then grow. Amazon started with books, PayPal with eBay’s power sellers, Facebook with one college. “We only need 1% of a huge market” is a trap — you start in a fight with everyone. The Mom Test adds the practical check: if the people you talk to don’t share the same problem, your group is still too broad.",
      task:"Write {idea}’s smallest real market in one sentence: who, doing what, where. Roughly how many of them are there, and how would you reach the first 100? Judge: is it small enough that you’d be their obvious choice, but big enough to matter? Try it this week: message three people in that group.",
      read:["Zero to One, ch. 3 and ch. 5 (“start small and monopolize”)","The Mom Test, ch. 7 (Choosing your customers)"]},
    {id:"P04",order:4,rung:"Test",stage_name:"The Mom Test",concept:"Ask about their life, not your idea",estimateMin:30,
      teach:"Ask your mom if your idea is good and she’ll say yes, because she loves you — and everyone else is polite too. The fix has three rules: talk about their life, not your idea; ask about specific things that already happened, not opinions about the future; talk less and listen. Bad: “Would you use this?”, “How much would you pay?”. Good: “Walk me through the last time this happened”, “What have you tried?”, “What did it cost you?”. Fastlane’s founders ran 20 of these calls a week and found their product in what people already did.",
      task:"Write three bad questions and three good ones for {idea}, then rewrite each bad one into a good one. Judge: which good question is most likely to show you you’re wrong? Try it this week: ask it to two real people, and add them to “talked to” on the idea board.",
      read:["The Mom Test, ch. 1 (The Mom Test)"],
      watch:[{t:"Starter Story · How This SaaS Hit $69K/Month In Just 2 Months",u:"https://www.youtube.com/watch?v=BA_fC95p43c",w:"2,000 customer calls using the Mom Test — and how they narrowed an all-in-one tool to one job"}]},
    {id:"P05",order:5,rung:"Test",stage_name:"Bad data",concept:"Compliments, fluff and feature requests",estimateMin:30,
      teach:"Three things feel like progress and aren’t. Compliments (“that’s cool”) — deflect them. Fluff: “I usually”, “I would”, “I might” — anchor it by asking for the last real time it happened. Feature requests — dig under them by asking why they want it. If you left a conversation feeling great but learned no fact about their life, it was a pitch, not a test.",
      task:"Take three reactions you’ve had to {idea} — or typical ones: “Nice!”, “I’d use that”, “It should have X”. Sort each into compliment, fluff or idea, and write the follow-up question that turns it into a fact. Judge: what’s the one fact about your customer you still don’t know? Try it this week: get that fact from one person.",
      read:["The Mom Test, ch. 2 (Avoiding bad data)"]},
    {id:"P06",order:6,rung:"Test",stage_name:"Commitment",concept:"Time, reputation, money",estimateMin:30,
      teach:"A conversation only counts if it ends with a commitment, because a commitment is how people tell you the truth. It comes in three currencies: time (a follow-up, trying the beta), reputation (an introduction, a public testimonial), money (a pre-order, a deposit). “That went well” with no next step is a zombie lead. Cleo built a waitlist from LinkedIn posts and sold its paid beta only to that list — about $30K a month within days, before any public launch.",
      task:"For {idea}, write the commitment you’ll ask for at each stage: after a first chat, after a demo, and before you build the full product. Judge: what’s the smallest money commitment that would really prove demand? Try it this week: ask one person for it.",
      read:["The Mom Test, ch. 5 (Commitment and advancement)"],
      watch:[{t:"Starter Story · How My App Hit $60K/Month in 2 Months",u:"https://www.youtube.com/watch?v=XifgHi9R5Rc",w:"waitlist first, a paid beta for the list, no public launch"}]},
    {id:"P07",order:7,rung:"Offer",stage_name:"The value equation",concept:"What makes an offer worth paying for",estimateMin:30,
      teach:"Hormozi: value = (the dream outcome × how likely they believe they’ll get it) ÷ (how long it takes × how much effort it costs them). Liposuction and a $5 weight-loss ebook promise the same outcome; the price gap is the other three parts — a doctor with 10,000 surgeries behind him beats one with a single surgery. Making bigger promises is easy. The bottom half is harder and worth more: getting people the result faster and with less effort.",
      task:"Write {idea}’s four parts, one line each. Judge: which part is weakest, and what one concrete change would cut the time or the effort for the customer? Try it this week: make that change in a mock-up or in how you pitch it.",
      read:["$100M Offers, the “value equation” chapter"],
      watch:[{t:"Alex Hormozi · This ONE Equation Will Make You RICH",u:"https://www.youtube.com/watch?v=5MHQr-Z17Hc",w:"the four parts, with the liposuction and 10,000-surgeries examples"}]},
    {id:"P08",order:8,rung:"Offer",stage_name:"Price",concept:"Charge what it’s worth",estimateMin:30,
      teach:"If you sell what everyone sells, you compete on price and lose. Make an offer people can’t compare, then charge for the value. Hormozi’s math: at a 20% profit margin, raising the price 20% doubles your profit. When he tripled the price at his gym, a third of the members left and revenue still doubled. A higher price also pays for better results, which is what keeps customers.",
      task:"Set a price for {idea} and defend it with the value equation, not with your costs. Compare it with what the customer pays today for their workaround — their time counts. Judge: are you underpricing out of fear? Try it this week: say the price in your next conversation, or put it on a page, and watch the reaction.",
      read:["$100M Offers, the “commodity problem” and pricing chapters"],
      watch:[{t:"Alex Hormozi · How To Raise Your Prices",u:"https://www.youtube.com/watch?v=Gy-RmpRif-I",w:"the margin math, and the letter he actually sent"}]},
    {id:"P09",order:9,rung:"Reach",stage_name:"Distribution",concept:"If you build it, they won’t just come",estimateMin:30,
      teach:"Thiel: poor sales, not a poor product, is the most common reason companies fail. A customer has to be worth more over their lifetime than it costs to get them, and the trap is the middle — too cheap to sell person to person, too small for ads to pay. Greg Isenberg adds that distribution isn’t posting: it’s knowing where your customers’ attention already lives and the words they use for their problem — before you build.",
      task:"Make a distribution map for {idea}: 20 places its customers already pay attention — subreddits, creators, newsletters, groups, search terms, tools they pay for. Pick one channel for the first 100 users. Judge: what will one customer cost you there, and what will they pay you in a year? Try it this week: post or reply once in that channel.",
      read:["Zero to One, ch. 11 (If You Build It, Will They Come?)"],
      watch:[{t:"Greg Isenberg · “Learn AI” Is Bad Advice. Learn This Instead",u:"https://www.youtube.com/watch?v=jJIOA4GroBw",w:"the distribution map and the 48-hour loop"}]},
    {id:"P10",order:10,rung:"Reach",stage_name:"The first 100",concept:"Do things that don’t scale",estimateMin:30,
      teach:"The first 100 users come by hand. Super Demo, now at $250K a month, talked to 100+ founders before building. Then three steps: catch the people already searching (comparison pages, free tools), do things that don’t scale (the founder made free demos for founders who asked on Reddit — in public, so others saw them), and show up wherever your users already are. Launch early: speed is the one advantage a small founder has.",
      task:"Write {idea}’s first-100 plan: who is already searching for a solution, one thing that doesn’t scale you’d do for each early user, and where you’ll show up. Judge: which step gets you the first 10, and how fast? Try it this week: do the unscalable thing for one person.",
      read:["Zero to One, ch. 11 (the sales methods)"],
      watch:[{t:"Starter Story · How This $250K/Month SaaS Got Its First 100 Users",u:"https://www.youtube.com/watch?v=l4WEqPX52Cg",w:"his three-step playbook"}]},
    {id:"P11",order:11,rung:"Keep",stage_name:"Moats",concept:"What keeps it yours",estimateMin:30,
      teach:"Thiel’s four things that keep a business yours: technology at least 10 times better at something important, network effects (each user makes it better for the others), economies of scale (cheaper the bigger you get), and brand. Hormozi adds: if anyone can start your business tomorrow, the price falls — the best moats are things only you know how to do. A small product rarely has one on day one; the question is which one it could build.",
      task:"Which of the four could {idea} have in five years — honestly? Name it, and what you’d have to do from day one to build it. Judge: if a funded competitor copied {idea} next month, what would they still not have? Try it this week: write that answer as your one-line pitch.",
      read:["Zero to One, ch. 5 (Last Mover Advantage)"],
      watch:[{t:"Alex Hormozi · What Makes The Perfect Business (5 Things)",u:"https://www.youtube.com/watch?v=3fsJFUvA6Ts",w:"the fifth thing, “unique”: capital, know-how and brand as moats"}]},
    {id:"P12",order:12,rung:"Decide",stage_name:"The seven questions",concept:"Score it, pick one, set a kill rule",estimateMin:30,
      teach:"Thiel’s seven questions for any new business: engineering (clearly better, not a bit better), timing (why now), monopoly (a big share of a small market), people (the right team or skills), distribution (a way to deliver, not just build), durability (defensible 10–20 years out), and a secret (something others don’t see). He blames the cleantech bust on companies that failed most of them. You don’t need seven yeses — but every “no” is a risk you’re choosing.",
      task:"Score every idea on your idea board on the seven questions. Pick the one to test next, and write the result that would make you drop it — for example, fewer than 3 of 10 people commit. Judge: is your favourite also the best-scoring one? If not, why? Try it this week: run its test.",
      read:["Zero to One, ch. 13 (Seeing Green)"]}
  ]};

  var OPT_CURRICULUM={"goal_id":"goal_opt","key":"opt","title":"Options with Henry","azTitle":"Options with Henry, A → Z","rungs":["Learn","Sell","Manage","Spread","Long","Plan"],"rungDesc":["what an option is, how to read the chain, the Greeks Henry uses","get paid to wait: cash-secured puts, covered calls, the wheel","exit rules, and rolling for a credit","define the risk: credit spreads, debit spreads, iron condors","buy time instead of shares: LEAPS, the poor man’s covered call, earnings","size it, plan 50 paper trades, judge the claims"],"blurb":"One options question on a real ticker per sitting, written in my words from the Invest with Henry videos in your library. Paper trade only: Henry’s rules are concrete, the income figures are Henry’s own claims, and your Options branch asks for 50 paper trades before real money.","allDone":"now paper trade your plan. 📈","revWord":"another ticker","refNote":"The idea opens in step 2 of the sitting — guess first. The videos are Henry’s, for when you want more; the income figures in them are Henry’s own claims.","lessons":[
    {"id":"H01","order":1,"rung":"Learn","stage_name":"What an option is","concept":"A right for the buyer, a duty for the seller","estimateMin":30,"teach":"One contract covers 100 shares. A call is the right to buy at the strike price until expiry; a put is the right to sell at it. The buyer pays the premium for that right and can lose at most the premium. The seller collects the premium and takes on the duty: to buy the shares (a sold put) or hand them over (a sold call) if the buyer exercises. That gives four positions: buy a call (you think it rises), buy a put (you think it falls), sell a put (you’re fine owning it lower) and sell a call (you’re fine selling it higher). Henry builds almost everything on the two selling ones, because the seller is paid up front and time works for the seller. A bought call breaks even at strike plus premium; a sold put at strike minus premium.","task":"On AAPL’s option chain (your broker or Yahoo Finance), take the call and the put nearest today’s price, about a month out. For each of the four positions write what you pay or collect for one contract (premium × 100), the break-even, and the most you can lose. Judge: if you think AAPL drifts sideways for a month, which of the four would you pick, and why?","co":"AAPL","rev":"MSFT","after":[],"watch":[{"t":"Invest with Henry · Options Trading for Beginners FULL FREE COURSE (4 Hours)","u":"https://www.youtube.com/watch?v=SXd-v1z5AY8","w":"the opening hour: calls, puts, strike, expiry and premium"}],"track":"opt"},
    {"id":"H02","order":2,"rung":"Learn","stage_name":"Reading the chain","concept":"Strike, expiry, bid–ask, volume and open interest","estimateMin":30,"teach":"The chain lists every strike for each expiry, calls on one side and puts on the other. In the money means it would have value if exercised now: a call with its strike below the stock price, a put with its strike above it. Henry’s three checks before any trade are volume, open interest and the bid–ask spread. A tight spread (cents on a liquid name) means you get filled near a fair price; a wide one costs you on the way in and again on the way out. Henry prefers the monthly expiry, the third Friday, because it keeps managing simple; weeklies work but need watching. Enter with a limit order around the middle of bid and ask.","task":"Open SPY and a small company you know, same monthly expiry. For a strike near the price, write bid, ask, volume and open interest, and work out the spread as a share of the middle price. Judge: above what spread would you skip a trade, and does the small company pass?","co":"SPY","rev":"QQQ","after":[],"watch":[{"t":"Invest with Henry · How I Pick Stocks to Sell Puts for $8,000/Month in Passive Income","u":"https://www.youtube.com/watch?v=05MfiNo99T4","w":"the open interest, volume and bid–ask check, on a live chain"}],"track":"opt"},
    {"id":"H03","order":3,"rung":"Learn","stage_name":"Delta, theta and IV","concept":"The three Greeks Henry actually uses","estimateMin":30,"teach":"Delta says how much the option moves for a $1 move in the stock, and roughly the chance it ends in the money: 0.30 is about 30%. That’s a model’s estimate, not a promise, but it’s the gauge Henry picks strikes by. Theta is time decay: what the option loses per day, which the seller collects. It speeds up in the last weeks and is biggest near the money, where the chance of assignment is biggest too. Implied volatility (IV) is the move the market expects. High IV means richer premiums, so selling pays more; low IV means cheap options, which favours buying. Before earnings IV rises, and after the report it collapses: the IV crush. Gamma and vega exist, but for selling around 30 delta and 30 days out, Henry barely uses them.","task":"Find SPY’s 30-delta put about 30 days out and write its premium, theta and IV. Do the same on TSLA. Work out each premium as a % of its strike. Judge: why does TSLA pay so much more for the same delta, and what are you being paid to accept?","co":"SPY","rev":"QQQ","after":[],"watch":[{"t":"Invest with Henry · Option Trading Greeks Explained Beginners | Before You Trade MUST KNOW!","u":"https://www.youtube.com/watch?v=yRTUVGOQmwE","w":"delta as a risk gauge, theta, vega"},{"t":"Invest with Henry · Option Trading Volatility Strategies To Make Easy Money","u":"https://www.youtube.com/watch?v=L4q9k4J4t9c","w":"when high IV favours selling and low IV favours buying"}],"track":"opt"},
    {"id":"H04","order":4,"rung":"Sell","stage_name":"Selling a cash-secured put","concept":"Get paid to wait for a price you’d buy at","estimateMin":30,"teach":"You sell a put on a stock you’d be happy to own, and keep the cash for 100 shares at the strike. Henry’s defaults: about 30 delta (20–30 when you start), about 30 days out, a strike 5–10% below the price and under support. Your return is the premium divided by the cash you set aside; your break-even is strike minus premium. At 30 delta you keep the premium roughly seven times in ten. The other times you buy the shares, and to Henry owning is not losing. But the maximum loss is real: strike minus premium if the stock collapses. The research Henry quotes is the honest anchor: selling one-month puts on S&P 500 stocks earned about what holding the index did (7.1% against 7.3% a year over ten years) with smaller swings. That’s good, and nowhere near the 50–100% a year a weekly premium seems to promise when you multiply it up.","task":"Paper-sell one KO put at about 30 delta, 30 days out. Write the strike, premium, cash set aside, break-even and return on that cash. Then KO closes 15% lower at expiry: what do you own, at what price, and what is it worth? Judge: is KO a company you’d really hold for a year at that strike?","co":"KO","rev":"PEP","after":["H01","H03"],"watch":[{"t":"Invest with Henry · Selling Put Options for Beginners FULL FREE COURSE (2+ Hours)","u":"https://www.youtube.com/watch?v=BfZjRQ6k49E","w":"strikes 5–10% below the price, and why 30 delta"},{"t":"Invest with Henry · Why Selling Puts is the Best Trading Strategy for Beginners (PROVEN)","u":"https://www.youtube.com/watch?v=FaeloW8e0-I","w":"the research: about the index’s return, with smaller drops"}],"track":"opt"},
    {"id":"H05","order":5,"rung":"Sell","stage_name":"Choosing the stock and the strike","concept":"A company you’d own, a strike under support, a size you can carry","estimateMin":30,"teach":"Henry starts with the business: real revenue and earnings, a sensible price (P/E, or price-to-sales for growth companies), something you’d hold anyway, and no assets without earnings, like crypto. Then the strike: under a support level the stock has bounced from, around 30 delta, with the break-even below support, so an assignment still lands at a price you like. Henry checks volume and the spread, and around earnings goes further out of the money or skips the week. Then size: Henry won’t sell new puts on a stock that’s already about 10% of the portfolio. This is where your investing course meets this one: a sold put is a limit order you get paid for, so the company still has to be worth owning.","task":"Shortlist three US companies you’d own. For each, note the last clear support level, the 30-delta put strike a month out, the next earnings date and the cash one put ties up. Judge: which one fits your trading money, and which would you drop first?","co":"MSFT","rev":"AAPL","after":["H02","H03"],"watch":[{"t":"Invest with Henry · The Best Stocks For The Wheel Strategy","u":"https://www.youtube.com/watch?v=u7q-xPaRvoQ","w":"fundamentals first: revenue, earnings, P/E and P/S"},{"t":"Invest with Henry · The Only 2 Indicators I Use to Make $60,673/month Options Trading","u":"https://www.youtube.com/watch?v=3uqr_tf8fr8","w":"support levels and Bollinger Bands for picking strikes"}],"track":"opt"},
    {"id":"H06","order":6,"rung":"Sell","stage_name":"Covered calls","concept":"Rent out shares you already own","estimateMin":30,"teach":"Own 100 shares, sell a call above what you paid, keep the premium. Henry’s default is the same: about 30 delta, about 30 days. The price is the cap: above the strike the gains are the buyer’s. Being called away isn’t a loss if the strike is above your cost; you keep the premium plus the gain. (Henry’s worry about the tax on that sale is an American one; a Dutch private investor’s gains normally sit in box 3, see H17.) Early assignment is rare, because an option with time left is worth more sold than exercised; the risk rises in the last days, deep in the money. Henry’s list of mistakes leads with FOMO: paying to roll up when the stock runs. If it runs and you want to keep the shares, roll up and out, adding time.","task":"Say you own 100 KO at today’s price. Paper-sell a 30-delta call about 30 days out: write the premium, the most you can make if called away, and the price above which you’d have done better without the call. Judge: KO jumps 10% in a week. Let the shares go, or roll?","co":"KO","rev":"PEP","after":["H01","H03"],"watch":[{"t":"Invest with Henry · 11 Years of Covered Calls Advice in 29 Minutes","u":"https://www.youtube.com/watch?v=1U9IUZbaYdM","w":"why early assignment is rare, with a deep in-the-money example"},{"t":"Invest with Henry · Stop Selling Covered Calls Like This (Beginner Mistakes)","u":"https://www.youtube.com/watch?v=TShirzRDBWU","w":"assignment, FOMO and support levels"}],"track":"opt"},
    {"id":"H07","order":7,"rung":"Sell","stage_name":"The wheel","concept":"Puts until assigned, calls until called away, repeat","estimateMin":30,"teach":"The wheel joins the last three lessons: sell puts until you’re assigned, sell covered calls on those shares until they’re called away, start again. Its rule is that you’re never afraid of assignment, which only holds for companies you want. Henry runs it monthly, about 30 delta, 30–40 days out. The weak spot is a hard fall: calls above your cost then pay almost nothing, so you wait. Henry says it plainly: if it drops 20%, you wait and hope it recovers. Henry’s own SPY example earns about 1% a month, 12–15% a year; more only by mixing in spreads. That’s the realistic range, not the headline numbers. One Dutch catch: EU retail investors usually can’t buy US ETFs like SPY (they have no EU key information document), so whether a SPY put assignment works depends on your broker. Wheel a US stock instead.","task":"Run one wheel on paper on KO: the put you’d sell now and, if assigned, the call you’d sell the month after. Write both premiums and what the shares cost you net. Judge: KO falls 20% right after assignment. What do you do for the next three months?","co":"KO","rev":"PEP","after":["H03"],"watch":[{"t":"Invest with Henry · The Wheel Strategy For Beginners 2026 MASTERCLASS (2+ Hours)","u":"https://www.youtube.com/watch?v=leI79Bjzd5k","w":"the full cycle and its rules"},{"t":"Invest with Henry · Why You Shouldn't Run the Wheel Strategy (This is what to do instead).","u":"https://www.youtube.com/watch?v=O8QsM6gy47k","w":"monthly expiries, 30 delta, and when 40–50 delta makes sense"}],"track":"opt"},
    {"id":"H08","order":8,"rung":"Manage","stage_name":"Exits","concept":"Decide how you get out before you get in","estimateMin":30,"teach":"Henry’s exits differ by trade. A sold put on a stock you like: hold to expiry, take the shares if assigned, roll at most once. A bought option or LEAPS: take profit at 30–50% with a limit order placed the day you buy, and cut at minus 50%; sooner if the stock breaks support or the story changes, which Henry calls admitting defeat. A credit spread: close it if the price reaches your short strike. Write the rules down before you enter, because every rule is easy at the start and hard when the trade is red.","task":"Write exit rules for three paper trades: your KO put, your KO covered call, and a call you’d buy on AAPL. For each: when you take profit, when you cut, and what you do at expiry. Judge: which rule will you be most tempted to break?","co":"AAPL","rev":"MSFT","after":["H04","H06"],"watch":[{"t":"Invest with Henry · Never Hold Options Too Long — My Exit Strategy","u":"https://www.youtube.com/watch?v=FxWzFhA8By4","w":"the 50% rule, and rolling only once"},{"t":"Invest with Henry · How to Enter and Exit Options Positions & Manage Risk (ULTIMATE GUIDE)","u":"https://www.youtube.com/watch?v=LBLv_254OP8","w":"managing a 30-delta put from entry to exit"}],"track":"opt"},
    {"id":"H09","order":9,"rung":"Manage","stage_name":"Rolling for a credit","concept":"Add time, move the strike your way, get paid for it","estimateMin":30,"teach":"Rolling is closing one option and opening another in the same order; most brokers have a roll button that sends it as one spread. Sold puts roll down and out, covered calls up and out. Henry’s rule of thumb, the “DOG” roll: a few dollars down, about 30 days out, and only for a net credit. Time plus volatility is premium, so rolls pay better on higher-IV stocks. The traps: rolling too early or too late, chasing a falling stock down again and again, and paying a debit to roll up out of FOMO. Henry prefers to roll a put once, then take the shares or close. A roll doesn’t remove the risk; it buys time.","task":"Your paper KO put is in the money with a week left. Find a roll: new strike, new expiry, net credit or debit. Compare three choices: roll, let it assign, close for a loss. Judge: which one do your exit rules from H08 pick?","co":"KO","rev":"PEP","after":["H04","H07"],"watch":[{"t":"Invest with Henry · Rolling Options Masterclass: How to Roll Every Single Options Trading Strategy","u":"https://www.youtube.com/watch?v=jn0w_Ue65uA","w":"up and out, down and out, for a credit"},{"t":"Invest with Henry · Stop Rolling Options Like This (Costly Beginner Mistakes)","u":"https://www.youtube.com/watch?v=QG9F2JbthC8","w":"rolling too early, too late, or when you should close"}],"track":"opt"},
    {"id":"H10","order":10,"rung":"Spread","stage_name":"Put credit spreads","concept":"Sell a put with a floor under it","estimateMin":30,"teach":"Sell a put and buy a lower one with the same expiry. You collect the difference in premium, and your loss is capped at the width minus that credit. Henry uses $5 widths ($1 on small accounts), with the short strike under support at about 15–20 delta. It needs far less cash than a cash-secured put, which is why it suits small accounts. The return on risk looks big, 20–50% in a few weeks, because what you risk is bigger than what you win: one full loss can wipe out several winners. Henry closes when the price reaches the short strike, and sizes each spread at 1–3% of the portfolio, 5% at most. Henry lost heavily on one $200,000 spread, which was about 5% of a $4M portfolio.","task":"Paper a $5-wide SPY put credit spread with the short strike near 15–20 delta, about 30 days out. Write the credit, the max loss, the break-even, and the chance of a full win from delta. Judge: how many full wins pay for one max loss, and is that worth it?","co":"SPY","rev":"QQQ","after":["H08","H09"],"watch":[{"t":"Invest with Henry · How to Manage Losing Put Credit Spread","u":"https://www.youtube.com/watch?v=KaCXI5HCXB8","w":"$5 widths, sizing, and managing a losing spread"},{"t":"Invest with Henry · Put Credit Spread and Puts Explained by a PRO","u":"https://www.youtube.com/watch?v=_x8yfPAAgYI","w":"short strikes under support, and spreading strikes out"}],"track":"opt"},
    {"id":"H11","order":11,"rung":"Spread","stage_name":"Call credit and debit spreads","concept":"Bearish income, or a cheaper bullish bet","estimateMin":30,"teach":"A call credit spread is the mirror image: sell a call above resistance, buy a higher one, collect a credit. Henry keeps those around 12–15 delta. A bull call (debit) spread buys a call and sells a higher one, so it costs less than the call alone but caps the upside. Break-even is the long strike plus what you paid; the most you can make is the width minus that. Henry uses these when a move is expected soon, often earnings, 1–2 weeks out, and says plainly that selling suits Henry better than buying.","task":"AAPL, same expiry about a month out: compare buying one call near the money with a $5-wide bull call spread. Write the cost, break-even, max profit and max loss of each. Judge: AAPL ends 3% higher. Which did better, and why?","co":"AAPL","rev":"MSFT","after":["H08"],"watch":[{"t":"Invest with Henry · Bull Call Spreads Are Better Than Calls","u":"https://www.youtube.com/watch?v=xBnyH5dJBuI","w":"break-even and max profit, worked through"},{"t":"Invest with Henry · Make Money When Stocks Crash (Call Credit Spreads for Beginners)","u":"https://www.youtube.com/watch?v=--7laF-OZQw","w":"12–15 delta call credit spreads"}],"track":"opt"},
    {"id":"H12","order":12,"rung":"Spread","stage_name":"Iron condors","concept":"Get paid for a stock that goes nowhere","estimateMin":30,"teach":"An iron condor is a put credit spread plus a call credit spread. You win if the price stays between the two short strikes until expiry, and the max loss is one side’s width minus the total credit, because only one side can lose. Henry’s setup: short strikes around 12–24 delta, $3–5 wings, about 30 days, never through earnings. Close or adjust a side when the price reaches its short strike. Henry keeps condors at 5–10% of the portfolio altogether; 15% is already risky.","task":"Build a QQQ iron condor on paper: about 30 days out, short strikes near 15 delta, $5 wings. Write the credit, the max loss, the range you need, and the events before expiry (earnings of the biggest holdings, a Fed meeting). Judge: which single event could break it?","co":"QQQ","rev":"SPY","after":["H08","H09"],"watch":[{"t":"Invest with Henry · How to Trade Iron Condors (Theta Options Strategy)","u":"https://www.youtube.com/watch?v=1WPMpVhewds","w":"why no earnings, and the max-loss maths"},{"t":"Invest with Henry · How to Grow Small Accounts FAST (Iron Condor FULL Guide)","u":"https://www.youtube.com/watch?v=GMLZ-xk8Sp8","w":"12-delta shorts, and sizing at 5–15%"}],"track":"opt"},
    {"id":"H13","order":13,"rung":"Long","stage_name":"LEAPS","concept":"A long-dated call instead of 100 shares","estimateMin":30,"teach":"A LEAPS is a call with a year or more to run. Henry buys around 0.7 delta, deep in the money, 9–12 months out or longer. It moves about 70 cents for each $1 in the stock, for a fraction of what 100 shares cost, and time decay stays small until the last months. Henry’s list of mistakes: cheap low-delta “LEAPS” (a 10-delta is a lottery ticket), calling a three-month option a LEAPS, buying when IV is pumped up before earnings or hype, and buying too many. Exits: take profit at 30–50%, cut at minus 50% or when support breaks. Delta grows as it wins, so trim to keep the exposure you meant to have.","task":"Compare 100 MSFT shares with one 0.7-delta call 12 months out: the cost, the break-even at expiry, and the gain or loss if MSFT moves 10% up or 10% down in a month. Judge: what’s the worst case for each a year from now?","co":"MSFT","rev":"AAPL","after":["H11"],"watch":[{"t":"Invest with Henry · I Wish I Knew This Before Trading LEAPS","u":"https://www.youtube.com/watch?v=J9ohf_y6Qi4","w":"0.7 delta, and taking profit at 30–50%"},{"t":"Invest with Henry · How I’d Invest With $1,000 Using LEAPS Options (Complete Guide)","u":"https://www.youtube.com/watch?v=CdAoVqJ1lWc","w":"delta management and the IV crush"}],"track":"opt"},
    {"id":"H14","order":14,"rung":"Long","stage_name":"The poor man’s covered call","concept":"Sell monthly calls against a LEAPS","estimateMin":30,"teach":"Swap the 100 shares of a covered call for a LEAPS: buy a 0.7-delta call 9–12 months out, then sell 30-delta calls about 30 days out against it, just like Henry’s usual covered calls. Henry’s NVDA example tied up about 85% less capital than shares would. The risks change, though. If the stock jumps past your short call, you manage both legs: roll the short call up and out, or close both. If it falls, the LEAPS loses faster than shares would, with no dividend and its own time decay. Some brokers can’t roll it as one order, so you close one leg and open the next.","task":"Design one on MSFT on paper: the LEAPS you’d buy, the call you’d sell this month, the capital tied up, and the month’s premium as a % of it. Then two scenarios: MSFT +15% in a month, and MSFT −15%. Judge: which hurts more, and what would you do?","co":"MSFT","rev":"AAPL","after":["H11"],"watch":[{"t":"Invest with Henry · My #1 Strategy to Grow a Small Portfolio (The Poor Man's Covered Call)","u":"https://www.youtube.com/watch?v=wIUYaUyjwf8","w":"0.7-delta LEAPS with 30-delta short calls"},{"t":"Invest with Henry · Poor Man's Covered Call Strategy On Robinhood (Free 30-Minute Course With Examples!)","u":"https://www.youtube.com/watch?v=1jZQ_y0q6xE","w":"managing and rolling both legs"}],"track":"opt"},
    {"id":"H15","order":15,"rung":"Long","stage_name":"Earnings and IV crush","concept":"Why the stock can rise and your option still fall","estimateMin":30,"teach":"Before earnings, implied volatility climbs, because a big move is coming. After the report it collapses, so an option bought just before can lose value even when the stock moves your way. Henry’s answers: don’t buy out-of-the-money calls into earnings; sell instead (a covered call, or a put further out of the money that you’d be happy to be assigned on); keep iron condors away from earnings; give LEAPS enough time that one report doesn’t matter. Henry also says research shows buying in-the-money calls before earnings works. The videos don’t show that research, so treat it as unproven.","task":"Look up NVDA’s next earnings date. Compare the IV of an option expiring just after it with one a month later, and price the at-the-money straddle just after earnings: that’s the move the market expects. Judge: NVDA rises 3% on the report. What happens to a call you bought the day before?","co":"NVDA","rev":"AMD","after":["H11","H12"],"watch":[{"t":"Invest with Henry · Nvidia Stock (NVDA) Shareholders MUST DO THIS After Earnings!","u":"https://www.youtube.com/watch?v=6lfcSLiyjho","w":"what an IV crush looks like on the chain"},{"t":"Invest with Henry · PLTR Option Earnings Warning","u":"https://www.youtube.com/watch?v=6pyIvuT532Y","w":"what Henry would and wouldn’t do into earnings"}],"track":"opt"},
    {"id":"H16","order":16,"rung":"Plan","stage_name":"Position sizing","concept":"Small enough that one loss can’t sink you","estimateMin":30,"teach":"Henry sizes most trades at 2–5% of the portfolio, spreads at 1–3% and never above 5%, and iron condors at 5–10% together, and stops adding to one stock at about 10%. For a sold put, size by what you’d lose in a crash, not by the margin your broker asks for. Henry argues a tiny account can take bigger bets; that holds for learning money, not for money you need. Your Trading branch already has the rule that matters most: decide your trading money (an amount you can afford to lose, kept apart from your FIRE investments) and risk at most 1% of it on one trade.","task":"With your trading money from the Trading branch, write the most you’d lose on one trade, the most in one stock, and the most in spreads and condors together. Then check each paper trade from this course against those limits, starting with a SPY spread. Judge: which ones would you have to shrink?","co":"SPY","rev":"QQQ","after":["H13","H15"],"watch":[{"t":"Invest with Henry · Option Trading Volatility Strategies To Make Easy Money","u":"https://www.youtube.com/watch?v=L4q9k4J4t9c","w":"2–5% per position, and why size depends on the account"},{"t":"Invest with Henry · Options vs. Stocks: Which is Safer? (Risk Management Explained)","u":"https://www.youtube.com/watch?v=X9ibF2v1RKA","w":"options as a way to control risk, with a collar"}],"track":"opt"},
    {"id":"H17","order":17,"rung":"Plan","stage_name":"Your paper-trading plan","concept":"Fifty journaled trades before real money, Dutch rules included","estimateMin":30,"teach":"Pull the course into one plan: the strategies you’ll paper trade (start with cash-secured puts and covered calls), Henry’s defaults (30 delta, 30 days, rolls only for a credit, the 50% rule on bought options), your size and exit rules, and a journal: why in, why out, what you learned. Your Options branch already asks for 50 paper trades and a review of win rate against average win and average loss. Two Dutch checks before real money. First, whether your broker offers US options at your level, and what happens on assignment (US ETFs like SPY usually can’t be bought by EU retail investors). Second, tax: a private investor’s options normally fall in box 3 (in 2026, 36% on a fixed return of 7.78% for other assets), but very active trading can count as box 1. Check with the Belastingdienst or an adviser.","task":"Write your one-page plan as if you start with KO puts next month: strategies, defaults, size limits, exit and roll rules, and what you log per trade. Ask your broker in writing how US option assignment works for you. Judge: what result after 50 paper trades would make you stop instead of going live?","co":"KO","rev":"PEP","after":["H14"],"watch":[{"t":"Invest with Henry · 12 Years Of Brutal Options Trading Advice In One Course","u":"https://www.youtube.com/watch?v=hiEv_Ra3thg","w":"the whole playbook in one course, from the Greeks to the wheel"}],"track":"opt"},
    {"id":"H18","order":18,"rung":"Plan","stage_name":"Judging Henry","concept":"Keep the method, discount the marketing","estimateMin":30,"teach":"Henry’s rules are concrete and conservative: cash-secured, about 30 delta, about 30 days, roll for a credit, small sizes. Keep those. Discount the headlines. A weekly 2% multiplied up to 96% a year assumes no losing weeks and no fall in the shares you get assigned. The income figures come from Henry’s own portfolio, and the channel sells a paid Discord and coaching. Henry is also open about losses, like that $200,000 spread. The research Henry cites, put-selling earning about what the index earns with smaller drops, is the fairest expectation. Your FIRE plan assumes 5% a year above inflation; an options plan that needs far more than that needs luck.","task":"Pick one headline from Henry’s titles (say, $8,000 a month selling puts) and rebuild it on SPY: the capital it needs at 2% a month, and what happens to that year if, one month, the market drops 20% and you’re assigned. Judge: what return would you write into your FIRE plan for options, and why?","co":"SPY","rev":"QQQ","after":["H13"],"watch":[{"t":"Invest with Henry · My One Easy Trick to Sell Puts for Passive Income","u":"https://www.youtube.com/watch?v=5BVlq4sTqt8","w":"small, steady returns, and never a losing month as the goal"},{"t":"Invest with Henry · How to Make $10,000/mo Selling Put Options (Ultimate Guide)","u":"https://www.youtube.com/watch?v=L56cWBsbaco","w":"how a weekly 2% becomes “96% a year”"}],"track":"opt"}]};

  var ASWATH_TAKES=[{"tk":"INTC","when":"2024","v":"Undervalued","vc":"good","did":"bought","preSplit":false,"hook":null,"title":"Dealing with Decline: Intel, Walgreens and Starbucks put to the test!","url":"https://www.youtube.com/watch?v=g3VT_cclr4U","date":"2024","value":"~$23.70","price":"$18.89","story":"Intel as a company <b>in decline</b> (his D-44 route) &mdash; but decline is a <em>process</em>, not a death sentence. The bar to clear the price is low: even at just 3% revenue growth and a 25% margin (below what Intel earned last decade), he gets ~$23.70/share, above the ~$18.89 price. &ldquo;I&rsquo;m not asking for much.&rdquo;","action":"He <b>bought Intel at $18.89</b>: &ldquo;the odds are in my favour.&rdquo; A fallen tech superstar, but the core business is still healthy even as NVIDIA takes share.","note":"2024. A worked example of valuing <em>decline</em> honestly &mdash; a low, defensible bar that the price still failed to clear.","drivers":[["Revenue growth","~3%"],["Operating margin","~25% (below its own history)"]]},{"tk":"NVDA","when":"Jun 2023","v":"Overvalued","vc":"bad","did":"sold half","preSplit":true,"hook":null,"title":"AI Winners, Losers and Wannabes: Valuing AI's Boost to NVIDIA's Value!","url":"https://www.youtube.com/watch?v=2N0IDShsTyc","date":"June 2023","value":"~$240","price":"$410","story":"An <em>opportunistic growth company</em> that keeps getting ahead of the crowd into profitable niches &mdash; gaming, then crypto, now AI chips and automotive. His story had revenues rising roughly tenfold over the decade (~$26bn &rarr; ~$266bn), led by AI chips (its ~75% share fading toward 60% as rivals arrive) and auto chips (~3% &rarr; ~15%); premium operating margins edging up toward a 40% target; and its heavy up-front reinvestment finally paying off as efficiency climbs toward the industry norm.","action":"As a value investor he judged the stock overvalued (his simulation put only a ~5% chance it was worth the price) &mdash; so he <b>sol
