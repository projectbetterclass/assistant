  /* ---------- helpers ---------- */
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  function pad(n){return (n<10?"0":"")+n;}
  function findTask(id){for(var i=0;i<state.tasks.length;i++)if(state.tasks[i].id===id)return state.tasks[i];return null;}
  function runningStart(t){var r=null;(t.sessions||[]).forEach(function(se){if(se.end==null)r=se.start;});return r;}
  function closedSec(t){var s=0;(t.sessions||[]).forEach(function(se){if(se.end!=null)s+=(se.end-se.start)/1000;});return s;}
  function taskSec(t){var n=Date.now(),s=0;(t.sessions||[]).forEach(function(se){s+=((se.end||n)-se.start)/1000;});return s;}
  function fmtClock(sec){sec=Math.max(0,Math.floor(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h>0?h+":"+pad(m)+":"+pad(s):pad(m)+":"+pad(s);}
  function fmtDur(sec){sec=Math.max(0,Math.floor(sec));var h=Math.floor(sec/3600),m=Math.round(sec%3600/60);if(h>0){if(m===60){h++;m=0;}return m>0?h+"h "+m+"m":h+"h";}if(m>0)return m+"m";return sec>0?"<1m":"0m";}
  function dayKey(ms){var d=new Date(ms);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
  function keyToDate(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
  function shiftDay(k,d){var x=keyToDate(k);x.setDate(x.getDate()+d);return dayKey(x.getTime());}
  function dayLabel(k){var t=dayKey(Date.now());if(k===t)return "Today";if(k===shiftDay(t,-1))return "Yesterday";return keyToDate(k).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});}
  function hhmm(ms){return new Date(ms).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});}
  function catColor(c){if(!c)return "var(--faint)";var h=0;for(var i=0;i<c.length;i++)h=(h*31+c.charCodeAt(i))>>>0;return CAT_COLORS[h%CAT_COLORS.length];}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
  function ensureViewport(){if(!document.querySelector("meta[name=viewport]")){var m=document.createElement("meta");m.name="viewport";m.content="width=device-width, initial-scale=1, viewport-fit=cover";(document.head||document.documentElement).appendChild(m);}}

  /* ---------- mutations ---------- */
  function closeRunning(t){(t.sessions||[]).forEach(function(se){if(se.end==null)se.end=Date.now();});}
  function startTask(id){commit(function(){var a=findTask(state.activeId);if(a)closeRunning(a);var t=findTask(id);if(!t)return;t.sessions=t.sessions||[];t.sessions.push({start:Date.now(),end:null});t.done=false;state.activeId=id;});}
  function stopTask(){commit(function(){var t=findTask(state.activeId);if(t)closeRunning(t);state.activeId=null;});}
  /* pause: the stretch ends (marked "pause"), the task stays on the Now card with Continue; anything started meanwhile is the in-between */
  function lastSession(t){var l=null;(t.sessions||[]).forEach(function(se){if(!l||se.start>l.start)l=se;});return l;}
  function pausedTask(){var p=state.paused;if(!p)return null;var t=findTask(p.id);return (t&&!t.done&&state.activeId!==t.id)?t:null;}
  function pauseTask(){commit(function(){var t=findTask(state.activeId);if(!t)return;var now=Date.now();(t.sessions||[]).forEach(function(se){if(se.end==null){se.end=now;se.pause=true;}});state.paused={id:t.id,at:now};state.activeId=null;});}
  function clearPause(){var p=state.paused;if(!p)return;var t=findTask(p.id),l=t&&lastSession(t);if(l&&l.pause)delete l.pause;delete state.paused;}   // ended without continuing: just a normal stop
  function continueTask(){var t=pausedTask();if(!t)return;var other=state.activeId&&findTask(state.activeId);startTask(t.id);if(other)toast("Stopped ‘"+other.name+"’ · back to ‘"+t.name+"’");}
  function quickStart(name,cat){name=(name||"").trim();if(!name)return;commit(function(){var a=findTask(state.activeId);if(a)closeRunning(a);var t={id:uid(),name:name,category:(cat||"").trim(),estimateMin:null,planned:false,done:false,createdAt:Date.now(),sessions:[{start:Date.now(),end:null}]};state.tasks.push(t);state.activeId=t.id;});}
  function addPlanned(name,cat,est){name=(name||"").trim();if(!name)return;ui.addOpen=false;commit(function(){state.tasks.push({id:uid(),name:name,category:(cat||"").trim(),estimateMin:est>0?est:null,planned:true,done:false,createdAt:Date.now(),sessions:[]});});}
  function addLater(name){name=(name||"").trim();if(!name)return;commit(function(){state.tasks.push({id:uid(),name:name,category:"",estimateMin:null,planned:false,later:true,done:false,createdAt:Date.now(),sessions:[]});});}
  function addGoal(name,deadline,identity,parentId){name=(name||"").trim();if(!name)return;ui.goalOpen=false;if(parentId)ui.branchOpen[parentId]=false;commit(function(){state.goals=state.goals||[];var g={id:uid(),name:name,deadline:deadline||null,identity:(identity||"").trim(),createdAt:Date.now()};if(parentId&&findGoal(parentId))g.parentId=parentId;state.goals.push(g);});}
  function deleteGoal(id){if(ui.goalId===id)openGoalPage(null);commit(function(){var gone=findGoal(id),up=gone&&gone.parentId;state.goals=(state.goals||[]).filter(function(g){return g.id!==id;});state.goals.forEach(function(g){if(g.parentId===id){if(up)g.parentId=up;else delete g.parentId;}});/* its branches move up a level */state.tasks.forEach(function(t){if(t.goalId===id){t.goalId=null;t.daily=false;}});});}
  function addAction(gid,sid,text,cue){text=(text||"").trim();if(!text)return;ui.actionOpen[sid||gid]=false;commit(function(){state.tasks.push({id:uid(),name:text,category:"",estimateMin:null,planned:false,daily:true,goalId:gid,stepId:sid||null,depth:null,cue:(cue||"").trim(),done:false,createdAt:Date.now(),sessions:[]});});}
  function addStep(gid,name){name=(name||"").trim();if(!name)return;ui.stepAddOpen[gid]=false;commit(function(){var g=findGoal(gid);if(!g)return;g.steps=g.steps||[];g.steps.push({id:uid(),name:name,done:false,createdAt:Date.now()});});}
  function deleteStep(gid,sid){commit(function(){var g=findGoal(gid);if(!g)return;g.steps=(g.steps||[]).filter(function(s){return s.id!==sid;});state.tasks.forEach(function(t){if(t.goalId===gid&&t.stepId===sid)t.stepId=null;});});}
  function toggleStepDone(gid,sid){commit(function(){var g=findGoal(gid);if(!g)return;(g.steps||[]).forEach(function(s){if(s.id===sid)s.done=!s.done;});});}
  function saveNote(gid,text){ui.noteOpen[gid]=false;commit(function(){var g=(state.goals||[]).filter(function(x){return x.id===gid;})[0];if(g)g.notes=(text||"").replace(/[ \t\r\n]+$/,"");});}
  function cycleDepth(id){commit(function(){var t=findTask(id);if(!t)return;t.depth=t.depth==="deep"?"shallow":(t.depth==="shallow"?null:"deep");});}
  function setDepth(id,d){commit(function(){var t=findTask(id);if(!t)return;t.depth=(t.depth===d?null:d);});}
  function togglePin(id){commit(function(){var t=findTask(id);if(t)t.pinned=!t.pinned;});}
  function setCue(id,text){ui.cueOpen[id]=false;commit(function(){var t=findTask(id);if(t)t.cue=(text||"").trim();});}
  function setIdentity(gid,text){ui.idOpen[gid]=false;commit(function(){var g=(state.goals||[]).filter(function(x){return x.id===gid;})[0];if(g)g.identity=(text||"").trim();});}
  function findGoal(id){return (state.goals||[]).filter(function(x){return x.id===id;})[0];}
  function enableProgression(gid){commit(function(){var g=findGoal(gid);if(g&&!g.progression)g.progression={ladder:BLOOM.map(function(x){return x.k;}),reps:[]};});}
  function logRep(gid,rung,grade,note){ui.repOpen[gid]=false;commit(function(){var g=findGoal(gid);if(!g||!g.progression)return;g.progression.reps=g.progression.reps||[];g.progression.reps.push({t:Date.now(),rung:parseInt(rung,10)||0,grade:grade||"nailed",note:(note||"").trim()});});}
  function progLevel(reps,ladderLen){var level=0,clean=0,best=0;reps.slice().sort(function(a,b){return a.t-b.t;}).forEach(function(r){if(r.grade==="nailed"){if(r.rung>best)best=r.rung;if(r.rung>=level){clean++;if(clean>=2&&level<ladderLen-1){level++;clean=0;}}}});if(level>best)best=level;return {level:level,clean:clean,best:best};}
  function shortDate(ms){return new Date(ms).toLocaleDateString(undefined,{month:"short",day:"numeric"});}
  function toggleDone(id){commit(function(){var t=findTask(id);if(!t)return;if(!t.done){if(state.activeId===id){closeRunning(t);state.activeId=null;}t.done=true;}else t.done=false;});}
  function deleteTask(id){commit(function(){if(state.activeId===id)state.activeId=null;state.tasks=state.tasks.filter(function(t){return t.id!==id;});});}

  /* ---------- two-tap delete ----------
     window.confirm() is silently blocked inside the claude.ai sandbox (it always answered "no"), so nothing could be deleted.
     First tap arms the button ("Delete?"), a second tap within 4s deletes. Painted in place, so a half-typed field is never wiped. */
  var armTimer;
  function armed(key,msg){
    clearTimeout(armTimer);
    if(ui.armed===key){ui.armed=null;return true;}
    ui.armed=key;paintArmed();if(msg)toast(msg);
    armTimer=setTimeout(function(){ui.armed=null;paintArmed();},4000);
    return false;
  }
  function paintArmed(){
    root.querySelectorAll("[data-arm]").forEach(function(el){
      var on=el.getAttribute("data-arm")===ui.armed;
      el.classList.toggle("armed",on);
      if(el.hasAttribute("data-on"))el.textContent=el.getAttribute(on?"data-on":"data-off");
      if(el.title)el.setAttribute("aria-label",on?"Tap again to delete":el.title);
    });
  }
  function xBtn(action,id,label,extra){   // the red "Delete?" is an overlay (CSS ::after): the button keeps its size, nothing shifts under your finger
    var k=action+":"+id,on=ui.armed===k;
    return '<button class="icon-btn danger'+(on?' armed':'')+'" type="button" data-action="'+action+'" data-id="'+id+'"'+(extra||'')+
      ' data-arm="'+esc(k)+'" title="'+esc(label)+'" aria-label="'+(on?'Tap again to delete':esc(label))+'">&#215;</button>';
  }

  /* ---------- export ---------- */
  function exportCsv(){
    var rows=[["task","category","planned","estimate_min","date","start","end","duration_min"]];
    state.tasks.forEach(function(t){(t.sessions||[]).forEach(function(se){if(se.end==null)return;rows.push([t.name,t.category||"",t.planned?"yes":"no",t.estimateMin||"",dayKey(se.start),new Date(se.start).toLocaleTimeString(),new Date(se.end).toLocaleTimeString(),Math.round((se.end-se.start)/60000)]);});});
    if(rows.length<2){toast("No completed sessions yet");return;}
    var csv=rows.map(function(r){return r.map(function(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",");}).join("\n");
    Promise.resolve(window.claude&&window.claude.use?window.claude.use("downloads"):null).then(function(dl){
      if(!dl){toast("Export isn't available here");return;}
      dl.save({filename:"time-log-"+dayKey(Date.now())+".csv",data:csv}).then(function(){toast("CSV saved");},function(err){if(err&&err.code==="declined")return;toast("Couldn't save the file");});
    },function(){toast("Export isn't available here");});
  }

  /* ---------- live tick ---------- */
  function tick(){
    var now=Date.now();
    document.querySelectorAll("[data-run-start]").forEach(function(el){
      var base=+el.getAttribute("data-run-base")||0, start=+el.getAttribute("data-run-start");
      var sec=base+Math.max(0,(now-start)/1000);
      el.textContent=el.getAttribute("data-run-fmt")==="clock"?fmtClock(sec):fmtDur(sec);
    });
    var sb=document.getElementById("ses-bar"),st=state.activeId&&findTask(state.activeId);
    if(sb&&isLessonTask(st)&&ui.ses){var ssec=lessonSecToday(st),si=sesStageAt(ssec),mk=document.getElementById("ses-mark"),sg=document.getElementById("ses-sug");
      if(mk)mk.style.left=Math.min(ssec/60/curTarget()*100,100).toFixed(1)+"%";
      sb.querySelectorAll(".ses-seg").forEach(function(el,i){el.classList.toggle("is-now",i===si);});
      if(sg)sg.textContent=(si!==ui.ses.stage)?"Suggested now: "+sesStages()[si][1]:"";}
    var rb=document.getElementById("rev-mark");
    if(rb&&st&&ui.ses&&ui.ses.rev){var rsec=Math.max(0,(now-(runningStart(st)||now))/1000),rl=document.getElementById("rev-left");
      rb.style.left=Math.min(rsec/(REV_MIN*60)*100,100).toFixed(1)+"%";
      if(rl)rl.textContent=rsec>=REV_MIN*60?"time's up — grade it":fmtClock(REV_MIN*60-rsec)+" left";}
    var d=document.getElementById("live-diff");
    if(d&&state.activeId){var t=findTask(state.activeId);if(t&&t.estimateMin){var diff=taskSec(t)-t.estimateMin*60;d.textContent=(diff>=0?"over by "+fmtDur(diff):fmtDur(-diff)+" left");d.className="diff "+(diff>0?"is-over":"is-under");}}
  }

  /* ---------- home: the single "what now?" screen ---------- */
  /* today's round: every daily thing, its minutes today against today's target, and one button to start it */
  function homeRound(){
    var L=roundThings(),wd=weekdayMin();if(!L.length||!wd)return "";
    var run=state.activeId&&findTask(state.activeId),done=0;
    var tiles=L.map(function(g){
      var T=thingTarget(g),m=thingMinToday(g),ok=m>=T,on=!!(run&&treeIds(g).indexOf(run.goalId)>=0);if(ok)done++;
      return '<div class="rt'+(ok?' is-done':'')+(on?' is-on':'')+'"><button class="rt-n" data-action="goal-open" data-id="'+g.id+'" type="button">'+esc(roundLabel(g))+'</button>'+
        (on?'<button class="rt-go is-stop" data-action="stop" type="button" aria-label="'+esc('Stop '+roundLabel(g))+'">■</button>'
          :'<button class="rt-go" data-action="round-start" data-id="'+g.id+'" type="button" aria-label="'+esc('Start '+roundLabel(g))+'">▶</button>')+
        '<span class="rt-m">'+(ok?'✓ ':'')+m+' / '+T+'<span class="rt-u"> min</span></span><span class="rt-bar"><i style="width:'+Math.min(100,Math.round(m/T*100))+'%"></i></span></div>';}).join("");
    var opts=[10,14,15,20,25,30].map(function(v){return '<option value="'+v+'"'+(v===wd?' selected':'')+'>'+v+'</option>';}).join(""),
      sel='<select class="round-sel" data-action="round-min" aria-label="Minutes on each thing, on weekdays">'+opts+'</select>';
    return '<section class="card round"><div class="round-head"><span class="round-eye">Today’s round</span><span class="round-n"><b>'+done+'</b> of '+L.length+' done</span></div>'+
      '<div class="round-sub">'+(isWeekday()?'Weekdays: '+sel+' min on each.':'Weekend: '+DAILY_MIN+' min for lessons, the usual for reading, '+sel+' for the rest.')+'</div>'+
      '<div class="round-grid">'+tiles+'</div></section>';
  }
  function homeNext(){
    var pick=null,goals=state.goals||[],i,j,k;
    for(i=0;i<goals.length&&!pick;i++){
      var g=goals[i],c=currFor(g);
      if(c){var plan=todayPlan(g),dn=currDone(g);for(var q=0;q<plan.length&&!pick;q++){if(dn[plan[q]]||revFor(g,plan[q]))continue;var L=lessonById(plan[q]);pick={type:"lesson",gid:g.id,lid:L.id,goal:g.name,label:L.concept,rung:L.rung,track:c.key==="prod"?c.title:"",when:(g.curr&&g.curr.when)||"",min:lessonLeftMin(g,L),tid:lessonTid(g.id,L.id),cont:lessonLoggedMin(g.id,L.id)>0};}}
    }
    if(!pick){
      var today=dayKey(Date.now());
      for(j=0;j<goals.length&&!pick;j++){
        var acts=goalActions(goals[j].id);
        for(k=0;k<acts.length;k++){
          var t=acts[k];if(t.done)continue;
          var doneToday=(t.sessions||[]).some(function(se){return dayKey(se.start)===today;});
          if(!doneToday){pick={type:"action",gid:goals[j].id,goal:goals[j].name,label:t.name,tid:t.id};break;}
        }
      }
    }
    if(!pick)return "";
    if(state.activeId===pick.tid)return "";               // it's the running hero already
    if(!state.activeId&&state.paused&&state.paused.id===pick.tid)return "";   // …or the paused card
    var start=pick.type==="lesson"
      ?'<button class="btn btn-primary btn-sm" data-action="cur-start" data-id="'+pick.gid+'" data-lid="'+pick.lid+'" type="button">'+(pick.cont?'Continue':'Start')+' · ~'+pick.min+'m</button>'
      :(pick.tid==="act_journal"?'<button class="btn btn-primary btn-sm" data-action="dec-open" data-id="'+pick.gid+'" type="button">Log a decision</button>'
        :'<button class="btn btn-primary btn-sm" data-action="start" data-id="'+pick.tid+'" type="button">Start</button>');
    var eye=pick.type==="lesson"?'Today’s '+curTarget()+' min · '+esc(shortName(pick.goal))+' · '+esc(pick.rung)+(pick.when?' · '+esc(pick.when):''):esc(pick.goal);
    return '<div class="home-next">'+
      '<div class="home-next-eye">Next up · '+eye+'</div>'+
      '<div class="home-next-row"><div class="home-next-label">'+esc(pick.label)+'</div>'+start+'</div>'+
      '<button class="home-next-more" data-action="goal-open" data-id="'+pick.gid+'" type="button">Open '+esc(shortName(pick.goal))+' →</button>'+
    '</div>';
  }
  function homeGlance(){

  function lastUsed(t){var m=t.createdAt||0;(t.sessions||[]).forEach(function(se){if(se.start>m)m=se.start;});return m;}
  function recentQuick(){
    var seen={},pins=[],rest=[];
    state.tasks.filter(function(t){
      if(t.done||t.daily)return false;                    // goal actions live in Goals; skip finished
      if(state.paused&&state.paused.id===t.id)return false; // paused: it has its own Continue
      if(t.pinned)return true;                             // anything pinned surfaces here
      return !t.planned&&!t.later&&(t.sessions||[]).length; // otherwise only recent ad-hoc
    })
      .sort(function(a,b){return lastUsed(b)-lastUsed(a);})
      .forEach(function(t){var k=(t.name||"").toLowerCase();if(!k||seen[k])return;seen[k]=1;(t.pinned?pins:rest).push(t);});
    return pins.concat(rest).slice(0,8);
  }

        '<div class="now-head"><span class="live-pill"><span class="bl"></span>Running</span>'+chip(t.category)+(t.goalId?'<span class="chip chip-goal">'+esc(goalName(t.goalId))+'</span>':"")+
          '<button class="now-pin'+(t.pinned?" is-on":"")+'" type="button" data-action="toggle-pin" data-id="'+t.id+'" aria-pressed="'+(t.pinned?"true":"false")+'" title="'+(t.pinned?"Pinned to quick-start — tap to unpin":"Pin to quick-start")+'">'+(t.pinned?"★ Pinned":"☆ Pin")+'</button>'+
        '</div>'+

        '<div class="now-clock" data-run-start="'+runningStart(t)+'" data-run-base="'+closedSec(t)+'" data-run-fmt="clock">'+fmtClock(taskSec(t))+'</div>'+

  function startOfToday(){var d=new Date();d.setHours(0,0,0,0);return d.getTime();}

  function goalActions(gid){return state.tasks.filter(function(t){return t.goalId===gid&&t.daily;});}
  function goalStreak(gid){   // gid: one goal id, or a list (a main goal and its branches)
    var set={},ids=Array.isArray(gid)?gid:[gid];
    state.tasks.forEach(function(t){if(ids.indexOf(t.goalId)<0)return;(t.sessions||[]).forEach(function(se){set[dayKey(se.start)]=1;});});
    var todayDone=!!set[dayKey(startOfToday())],yestDone=!!set[dayKey(startOfToday()-86400000)];
    var start=todayDone?startOfToday():(yestDone?startOfToday()-86400000:null),streak=0;

  }
  function goalStats(gid){   // gid: one goal id, or a list (a main goal and its branches)
    var now=Date.now(),wk=last7Start(),tday=startOfToday(),weekSec=0,todaySec=0,total=0,days={},ids=Array.isArray(gid)?gid:[gid];
    state.tasks.forEach(function(t){if(ids.indexOf(t.goalId)<0)return;(t.sessions||[]).forEach(function(se){
      var end=se.end==null?now:se.end,dur=(end-se.start)/1000;total+=dur;

  function renderProgression(g){

  /* ---------- valuation curriculum (laddered lessons) ---------- */
  function valCurrFor(g){return g&&VAL_CURRICULUM.goal_id===g.id?VAL_CURRICULUM:null;}   // the investing goal: Aswath's calls, the decision log, the articles
  function currFor(g){if(!g)return null;for(var i=0;i<CURRICULA.length;i++)if(CURRICULA[i].goal_id===g.id)return CURRICULA[i];return null;}   // any goal with a lesson track
  function currOfLesson(l){for(var i=0;i<CURRICULA.length;i++)if(CURRICULA[i].lessons.indexOf(l)>=0)return CURRICULA[i];return VAL_CURRICULUM;}
  function currGoals(){return (state.goals||[]).filter(currFor);}
  function isProd(l){return !!l&&l.track==="prod";}
  function ladderNames(g){var p=g.progression;return (valCurrFor(g)&&p&&p.ladder.length===VAL_RUNGS.length)?VAL_RUNGS:p.ladder;}
  function ladderDescs(g){return ladderNames(g)===VAL_RUNGS?VAL_RUNG_DESC:BLOOM.map(function(x){return x.d;});}
  function isLessonTask(t){return !!t&&String(t.id).indexOf("lesson_")===0;}
  function lessonOfTask(t){var m=String(t&&t.id||"").match(/^lesson_(.+)_([A-Z]\d+)$/);if(!m)return null;var g=findGoal(m[1]),l=lessonById(m[2]);return (g&&l)?{g:g,l:l}:null;}
  function lessonCo(l){if(isProd(l)){var fi=focusIdea();return fi?fi.name:"your idea";}return l.co||l.call||"the company";}
  function lessonTask(l){return String(l.task||"").replace(/\{idea\}/g,lessonCo(l));}   // a product lesson runs on the starred idea
  function lessonN(l){return l.id;}
  function lessonRungIdx(l){var i=currOfLesson(l).rungs.indexOf(l.rung);return i<0?0:i;}
  function currDone(g){return (g.curr&&g.curr.done)||{};}
  function currentLesson(g){
    var c=currFor(g);if(!c)return null;
    for(var i=0;i<c.lessons.length;i++){if(lessonOpen(g,c.lessons[i].id))return {lesson:c.lessons[i],idx:i};}
    return null;
  }
  /* ---------- spaced revisits: a nailed lesson comes back once after 10 days, a shaky one after 3 — 5 minutes, a new company, no notes ---------- */
  function revSched(g){return (g&&g.curr&&g.curr.rev)||{};}
  function revFor(g,lid){return revSched(g)[lid]||null;}
  function lessonOpen(g,lid){return !currDone(g)[lid]&&!revFor(g,lid);}   // still to do as a full sitting; a pending revisit waits for its day instead
  function revCo(l){if(l.rev)return l.rev;if(isProd(l)){var fi=focusIdea(),o=prodIdeas().filter(function(x){return !fi||x.id!==fi.id;})[0];return o?o.name:"a different idea of yours";}return REV_CO[lessonCo(l)]||"a new company";}
  function revDays(r){return Math.ceil((r.due-Date.now())/86400000);}   // days until due; 0 or less = due now
  function revAgo(r){return Math.max(0,Math.round((Date.now()-r.set)/86400000));}
  function revList(g){var s=revSched(g),out=[];Object.keys(s).forEach(function(lid){var l=lessonById(lid);if(l)out.push({l:l,r:s[lid],days:revDays(s[lid])});});out.sort(function(a,b){return a.r.due-b.r.due;});return out;}
  function revDue(g){return revList(g).filter(function(x){return x.days<=0;});}
  function revRunning(gid,lid){var t=state.activeId&&findTask(state.activeId);if(!isLessonTask(t)||!ui.ses||!ui.ses.rev||ui.ses.tid!==t.id)return false;return lid?t.id===lessonTid(gid,lid):(gid?t.goalId===gid:true);}
  function setRevisit(g,lid,grade,fromRev){   // inside commit(): what comes back, and when
    g.curr=g.curr||{};var rev=g.curr.rev=g.curr.rev||{},cur=rev[lid],now=Date.now();
    if(grade==="nailed"){
      var passed=g.curr.revPassed=g.curr.revPassed||{};
      if((fromRev&&cur&&cur.kind==="nailed")||passed[lid]){delete rev[lid];passed[lid]=passed[lid]||now;return;}   // still there after 10 days: it's yours
      rev[lid]={due:now+REV_DAYS.nailed*86400000,kind:"nailed",set:now};
    } else rev[lid]={due:now+REV_DAYS.shaky*86400000,kind:"shaky",set:now};
  }
  function startRevisit(gid,lid){
    var g=findGoal(gid),l=lessonById(lid);if(!g||!l)return;
    var tid=lessonTid(gid,lid);
    commit(function(){
      var gg=findGoal(gid);if(!gg)return;
      if(ui.ses&&!(ui.ses.tid===tid&&ui.ses.rev))sesWrite(null);   // some other half-done sitting: file its notes first
      var t=findTask(tid);
      if(!t){t={id:tid,name:"📘 "+lessonN(l)+" · "+l.concept,category:"",estimateMin:l.estimateMin||null,planned:false,daily:false,goalId:gid,stepId:null,depth:"deep",cue:"",done:false,createdAt:Date.now(),sessions:[]};state.tasks.push(t);}
      var act=findTask(state.activeId);if(act)closeRunning(act);
      t.sessions=t.sessions||[];t.sessions.push({start:Date.now(),end:null});state.activeId=tid;
      if(!ui.ses)ui.ses={tid:tid,at:Date.now(),rev:true,co:revCo(l),stage:0,primed:false,d:{guess:"",qs:"",answer:"",confuse:"",old:[]}};

    });
  }
  function finishRevisit(gid,lid,grade){
    var g=findGoal(gid),l=lessonById(lid);if(!g||!l)return;
    var tid=lessonTid(gid,lid),rung=lessonRungIdx(l),r=revFor(g,lid),keeps=grade==="nailed"&&((r&&r.kind==="nailed")||!!((g.curr&&g.curr.revPassed)||{})[lid]);
    commit(function(){
      var gg=findGoal(gid);if(!gg)return;var t=findTask(tid),s=ui.ses,co=(s&&s.co)||revCo(l);
      if(t){t.study=t.study||[];t.study.push({at:Date.now(),rev:true,co:co,answer:(s&&s.d&&s.d.answer)||"",grade:grade});}
      if(s&&s.tid===tid){ui.ses=null;saveSes();}
      if(state.activeId===tid){if(t)closeRunning(t);state.activeId=null;}
      if(state.paused&&state.paused.id===tid)clearPause();
      if(gg.progression){gg.progression.reps=gg.progression.reps||[];gg.progression.reps.push({t:Date.now(),rung:rung,grade:grade,note:lessonN(l)+" revisit · "+co});}
      gg.curr=gg.curr||{};gg.curr.done=gg.curr.done||{};
      if(grade==="nailed"){gg.curr.done[l.id]=true;if(t)t.done=true;}
      else {delete gg.curr.done[l.id];if(t)t.done=false;}   // faded: not yours yet — honest count
      setRevisit(gg,l.id,grade,true);
    });
    toast(grade==="nailed"?(keeps?"Still there after 10 days — it’s yours ✓":"Nailed without the notes — one more check in 10 days"):"Faded — it comes back in 3 days, without the notes");
  }
  function withoutNotes(g){   // the learning metric: lessons you can do without the notes, of those graded (minutes are the showing-up metric)
    var done=currDone(g),graded={},nailed=0,pre="lesson_"+g.id+"_",c=g.curr||{};
    state.tasks.forEach(function(t){if(String(t.id).indexOf(pre)!==0)return;var lid=t.id.slice(pre.length);if(lessonById(lid)&&(t.study||[]).some(function(s){return s.grade;}))graded[lid]=1;});
    [done,c.rev||{},c.revPassed||{}].forEach(function(m){Object.keys(m).forEach(function(k){if(m[k]&&lessonById(k))graded[k]=1;});});   // every grade leaves one of these behind, sitting or not
    Object.keys(graded).forEach(function(k){if(done[k])nailed++;});
    return {graded:Object.keys(graded).length,nailed:nailed,passed:Object.keys((g.curr&&g.curr.revPassed)||{}).length};
  }
  /* each lesson gets its own timer task, so time and history stay per lesson even when you pick out of order */
  function lessonById(lid){for(var c=0;c<CURRICULA.length;c++){var ls=CURRICULA[c].lessons;for(var i=0;i<ls.length;i++)if(ls[i].id===lid)return ls[i];}return null;}
  function inCurr(g,lid){var c=currFor(g),l=lessonById(lid);return !!(c&&l&&c.lessons.indexOf(l)>=0);}
  function lessonTid(gid,lid){return "lesson_"+gid+"_"+lid;}
  function lessonLoggedMin(gid,lid){var t=findTask(lessonTid(gid,lid));return t?Math.floor(taskSec(t)/60):0;}
  function lessonLeftMin(g,l){if(currDone(g)[l.id])return 0;return Math.max(5,(l.estimateMin||15)-lessonLoggedMin(g.id,l.id));}
  /* today's ~30 min: today's own pick if you made one; otherwise yesterday's unfinished picks, topped up with the next lessons in line */
  function todayPlan(g){
    if(!currFor(g))return [];
    var t=g.curr&&g.curr.today,mine=function(id){return inCurr(g,id);};
    if(t&&t.day===dayKey(Date.now()))return (t.ids||[]).filter(mine);
    return suggestPlan(g,((t&&t.ids)||[]).filter(function(id){return mine(id)&&lessonOpen(g,id);}));
  }
  function suggestPlan(g,ids){
    var ls=currFor(g).lessons,total=0;ids=ids.slice();
    ids.forEach(function(id){total+=lessonLeftMin(g,lessonById(id));});
    for(var i=0,T=curTarget();i<ls.length&&total<T;i++){
      var l=ls[i];if(!lessonOpen(g,l.id)||ids.indexOf(l.id)>=0)continue;
      var m=lessonLeftMin(g,l);
      if(ids.length&&total+m>T+10)break;          // don't overshoot the day by much
      ids.push(l.id);total+=m;
    }
    return ids;
  }
  function saveToday(gid,ids){commit(function(){var g=findGoal(gid);if(!g)return;g.curr=g.curr||{};g.curr.today={day:dayKey(Date.now()),ids:ids};});}
  function toggleToday(gid,lid){var g=findGoal(gid);if(!g||!lessonById(lid))return;var ids=todayPlan(g),i=ids.indexOf(lid);if(i>=0)ids.splice(i,1);else ids.push(lid);saveToday(gid,ids);}
  function curMinToday(gid){
    var key=dayKey(Date.now()),now=Date.now(),s=0,pre="lesson_"+gid+"_";
    state.tasks.forEach(function(t){if(String(t.id).indexOf(pre)!==0)return;(t.sessions||[]).forEach(function(se){if(dayKey(se.start)===key)s+=((se.end||now)-se.start)/1000;});});
    return Math.floor(s/60);
  }
  function startLesson(gid,lid){
    var g=findGoal(gid);if(!g)return;
    var l=lid?lessonById(lid):(currentLesson(g)||{}).lesson;if(!l)return;
    var tid=lessonTid(gid,l.id),plan=todayPlan(g);
    if(plan.indexOf(l.id)<0)plan.push(l.id);            // starting a lesson makes it part of today
    commit(function(){
      var gg=findGoal(gid);if(!gg)return;
      gg.curr=gg.curr||{};gg.curr.today={day:dayKey(Date.now()),ids:plan};
      if(ui.ses&&ui.ses.tid!==tid)sesWrite(null);          // another lesson's half-done sitting: keep its notes, don't lose them
      var t=findTask(tid);
      if(!t){t={id:tid,name:"📘 "+lessonN(l)+" · "+l.concept,category:"",estimateMin:l.estimateMin||null,planned:false,daily:false,goalId:gid,stepId:null,depth:"deep",cue:"",done:false,createdAt:Date.now(),sessions:[]};state.tasks.push(t);}
      t.done=false;

  function finishLesson(gid,lid,grade){
    var g=findGoal(gid);if(!g)return;
    var l=lid?lessonById(lid):(currentLesson(g)||{}).lesson;if(!l)return;
    var rung=lessonRungIdx(l),tid=lessonTid(gid,l.id),plan=todayPlan(g);
    if(plan.indexOf(l.id)<0)plan.push(l.id);            // grading counts as today's work — and pins today's pick, so it can't refill
    commit(function(){
      var gg=findGoal(gid);if(!gg)return;
      gg.curr=gg.curr||{};gg.curr.today={day:dayKey(Date.now()),ids:plan};
      var t=findTask(tid);
      sesWrite(grade,tid);                                   // what you guessed, asked, answered and still find confusing
      if(state.activeId===tid){if(t)closeRunning(t);state.activeId=null;}
      if(state.paused&&state.paused.id===tid)clearPause();   // grading ends a paused lesson
      if(gg.progression){gg.progression.reps=gg.progression.reps||[];gg.progression.reps.push({t:Date.now(),rung:rung,grade:grade,note:lessonN(l)+" · "+l.concept});}

  }
  /* ---------- the guided 30 minutes: prime → encode → retrieve → reflect (Justin Sung's order), on the running lesson ---------- */
  function sesFor(t){   // the draft for this lesson task; a fresh one if the lesson changed — pre-filled with last night's prime

      ui.ses={tid:t.id,at:Date.now(),stage:0,primed:hit,d:{guess:hit?pr.guess:"",qs:"",answer:"",confuse:"",old:[]}};saveSes();}

  function mdHtml(md){
    var lines=(md||"").split("\n"),out=[],i=0;

      if(/^##\s/.test(ln)){out.push('<h3 class="rd-h">'+artInline(ln.replace(/^##\s+/,""))+'</h3>');i++;continue;}
      if(/^\|/.test(ln)){
        var rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i]);i++;}
        var head=cells(rows[0]),body=rows.slice(1).filter(function(r){return !/^\|[\s:|-]+$/.test(r.trim());});
        out.push('<div class="rd-tw"><table class="rd-t'+(head.length>=6?' rd-t-wide':'')+'"><thead><tr>'+head.map(function(c){return '<th>'+artInline(c)+'</th>';}).join("")+'</tr></thead><tbody>'+

        continue;

        var ol=/^\d/.test(ln),re=ol?/^\d+\.\s/:/^-\s/,items=[];

  /* ---------- the tech tree: a track's rungs as tiers, every lesson with what it teaches and what it costs, lines for what builds on what ---------- */
  function roman(i){return ["I","II","III","IV","V","VI","VII","VIII","IX","X"][i]||String(i+1);}   // a function, not a var: the first render can come before this line runs

  function lessonFrom(c,l){

  function costAmt(s){   // euros and cents: "12,50", "12.50", "€ 1.000" (Dutch thousands) and "1000" all read right

    else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,"");

  function buildGradePrompt(finding,diff,ref,source){
    var L=[];
    L.push("You are a skeptical senior engineer checking whether a code change actually resolves ONE specific finding. Be adversarial and specific: your job is to catch what is missing or wrong, not to praise. Ground every point in the diff below — if the diff does not show something, say you cannot tell rather than assuming it. Judge the CHANGE against the FINDING, never who wrote it. Do not be agreeable.");
    L.push("THE FINDING (what was supposed to be addressed):");
    L.push(finding);
    L.push("THE CHANGE"+(ref?(" ("+ref+")"):"")+(source==="github"?" [fetched from GitHub]":" [pasted by the user]")+":");
    L.push(diff);
    L.push("You cannot run anything, so never claim tests pass or that it works — instead give the concrete checks the USER should run to confirm (specific commands or behaviours). Prefer 'partial' or 'no' unless the diff clearly shows the finding resolved.");
    L.push('Return ONLY JSON: {"addresses":"yes|partial|no","covers":["what it genuinely does, grounded in the diff"],"gaps":["what it does NOT cover or leaves open"],"risks":["anything it might break or introduce"],"confirm":["a specific check the user runs to verify"],"summary":"one honest sentence"}. Omit a list only if truly empty.');
    return L.join("\n");

  function normalizeVerdict(res){
    if(!res||typeof res!=="object")return null;
    function arr(x){var o=[];if(Array.isArray(x))x.slice(0,6).forEach(function(v){v=String((v&&(v.text||v.item))||v||"").trim();if(v)o.push(v.slice(0,240));});return o;}

    a=(a.indexOf("partial")>=0||a.indexOf("part")>=0)?"partial":(a.indexOf("yes")>=0?"yes":(a.indexOf("no")>=0?"no":"partial"));
    var v={addresses:a,covers:arr(res.covers||res.covered),gaps:arr(res.gaps||res.missing||res.open||res.not_covered),risks:arr(res.risks||res.watch),confirm:arr(res.confirm||res.checks||res.verify),summary:String(res.summary||"").trim().slice(0,240)};
    if(!(v.covers.length||v.gaps.length||v.risks.length||v.confirm.length||v.summary))return null;
    return v;

    '</section>';
  }
  function captureRow(t){
    var running=state.activeId===t.id, sec=taskSec(t);
    var sub=sec>=1?fmtDur(sec)+" logged so far":"Not started yet";
    var btn=running?'<button class="btn btn-stop btn-sm" data-action="stop">Stop</button>':'<button class="btn btn-primary btn-sm" data-action="start" data-id="'+t.id+'">'+(sec>0?"Resume":"Start")+'</button>';
    return '<div class="card task-row">'+
      '<div class="tr-main">'+
        '<div class="tr-name">'+esc(t.name)+(running?'<span class="mini-run">running</span>':"")+'</div>'+
        '<div class="tr-sub">'+esc(sub)+'</div>'+
      '</div>'+
      '<div class="tr-actions">'+btn+pinBtn(t)+
        '<button class="icon-btn" data-action="done" data-id="'+t.id+'" title="Mark done" aria-label="Mark done">&#10003;</button>'+
        xBtn("delete",t.id,"Delete")+
      '</div>'+
    '</div>';
  }

  function renderPlanned(){
    var planned=state.tasks.filter(function(t){return t.planned;});
    planned.sort(function(a,b){return (a.done?1:0)-(b.done?1:0)||b.createdAt-a.createdAt;});
    var form= ui.addOpen? '<form class="planned-form" data-action="add-planned" autocomplete="off">'+
        '<input id="p-name" class="field" placeholder="Task name" aria-label="Task name">'+
        '<input id="p-est" class="field field-est" type="number" min="1" inputmode="numeric" placeholder="Est. min" aria-label="Estimate in minutes">'+
        '<input id="p-cat" class="field field-cat" placeholder="Category" list="cats2" aria-label="Category">'+
        '<datalist id="cats2">'+usedCats().map(function(c){return '<option value="'+esc(c)+'">';}).join("")+'</datalist>'+
        '<button class="btn btn-primary" type="submit">Add planned task</button>'+
      '</form>' : "";
    var rows= planned.length? '<div class="task-list plan-grid">'+planned.map(plannedRow).join("")+'</div>'
      : (ui.addOpen?"":'<div class="card empty">No planned tasks yet. Add one with an estimate to see how your guess compares to reality.</div>');
    return '<section class="sec">'+
      '<div class="sec-head"><h2>Planned tasks</h2><button class="btn btn-ghost btn-sm" data-action="toggle-add" type="button">'+(ui.addOpen?"Close":"+ New")+'</button></div>'+
      form+rows+
    '</section>';
  }
  function plannedRow(t){
    var running=state.activeId===t.id;
    var sec=taskSec(t), est=t.estimateMin;
    var sub,fillW=0,over=false;
    if(est){
      var estSec=est*60, diff=sec-estSec; over=sec>estSec;
      fillW=Math.min(sec/estSec,1)*100;
      if(sec<1) sub="Estimate "+fmtDur(estSec)+" · not started";
      else sub=fmtDur(sec)+" of "+fmtDur(estSec)+" · "+(Math.abs(diff)<30?"on estimate":(diff>0?"over by "+fmtDur(diff):fmtDur(-diff)+" left"));
    } else {
      sub=sec<1?"No estimate":"No estimate · "+fmtDur(sec)+" logged";
    }
    var bar=est?'<div class="bar"><div class="bar-fill '+(over?"is-over":"")+'" style="width:'+fillW.toFixed(0)+'%"></div></div>':"";
    var btn=running?'<button class="btn btn-stop btn-sm" data-action="stop">Stop</button>':'<button class="btn btn-primary btn-sm" data-action="start" data-id="'+t.id+'">'+(sec>0?"Resume":"Start")+'</button>';
    return '<div class="card task-row'+(t.done?" is-done":"")+'">'+
      '<div class="tr-main">'+
        '<div class="tr-name">'+esc(t.name)+chip(t.category)+(running?'<span class="mini-run">running</span>':"")+'</div>'+
        '<div class="tr-sub">'+esc(sub)+'</div>'+bar+
      '</div>'+
      '<div class="tr-actions">'+btn+pinBtn(t)+
        '<button class="icon-btn" data-action="done" data-id="'+t.id+'" title="'+(t.done?"Reopen":"Mark done")+'" aria-label="Mark done">'+(t.done?"&#8635;":"&#10003;")+'</button>'+
        xBtn("delete",t.id,"Delete")+
      '</div>'+
    '</div>';
  }

  function tlGap(isPause,html,at){
    return '<div class="tl-row tl-gap'+(isPause?' is-pause':'')+'"><div class="tl-time">'+(at?'<span class="tl-start">'+hhmm(at)+'</span><span>now</span>':'')+'</div><div class="tl-body">'+html+'</div></div>';
  }
  function pausedGap(t,se){   // seconds since this task's previous stretch, when that one ended with Pause
    var b=null;(t.sessions||[]).forEach(function(x){if(x!==se&&x.end!=null&&x.end<=se.start&&(!b||x.end>b.end))b=x;});
    return b&&b.pause?(se.start-b.end)/1000:null;
  }
  function renderReview(){
    var key=ui.date, now=Date.now(), isToday=key===dayKey(now);
    var entries=[];
    state.tasks.forEach(function(t){(t.sessions||[]).forEach(function(se){if(dayKey(se.start)===key)entries.push({t:t,se:se});});});
    entries.sort(function(a,b){return a.se.start-b.se.start;});
    var reviewHead='<div class="review-head">'+
      '<div class="daynav">'+
        '<button class="icon-btn" data-action="prev-day" aria-label="Previous day">&#8249;</button>'+
        '<div class="day-label">'+esc(dayLabel(key))+'</div>'+
        '<button class="icon-btn" data-action="next-day" aria-label="Next day"'+(isToday?" disabled":"")+'>&#8250;</button>'+
      '</div>'+
      (isToday?'':'<button class="btn btn-ghost btn-sm" data-action="today" type="button">Jump to today</button>')+
    '</div>';
    if(!entries.length){
      var hasAny=state.tasks.some(function(t){return (t.sessions||[]).some(function(se){return se.end!=null;});});
      var exp=hasAny?'<div class="review-foot" style="margin-top:14px"><span></span><button class="btn btn-ghost btn-sm" data-action="export" type="button">Export CSV</button></div>':"";
      return '<section class="sec review">'+reviewHead+
        '<div class="empty">Nothing tracked '+(isToday?"yet today":"on this day")+'.'+(isToday?' Start a timer on the Now tab to begin.':'')+'</div>'+
        exp+
      '</section>';
    }
    var total=0,plannedSec=0,byCat={},runBase=0,runStart=null;
    entries.forEach(function(e){
      var end=e.se.end==null?now:e.se.end, dur=(end-e.se.start)/1000;
      total+=dur; if(e.t.planned)plannedSec+=dur;
      var k=e.t.category||"";byCat[k]=(byCat[k]||0)+dur;
      if(e.se.end==null){runStart=e.se.start;} else {runBase+=dur;}
    });
    var closedTotal=total-(runStart?(now-runStart)/1000:0);
    var unplannedSec=total-plannedSec;
    var pPct=total>0?(plannedSec/total*100):0;

    var totalCell=runStart?'<div class="t-v" data-run-base="'+closedTotal.toFixed(0)+'" data-run-start="'+runStart+'" data-run-fmt="dur">'+fmtDur(total)+'</div>':'<div class="t-v">'+fmtDur(total)+'</div>';
    var tiles='<div class="tiles">'+
      '<div class="card tile"><div class="t-k">Total tracked</div>'+totalCell+'<div class="t-sub">'+entries.length+' session'+(entries.length===1?"":"s")+'</div></div>'+
      '<div class="card tile"><div class="t-k">Planned</div><div class="t-v">'+fmtDur(plannedSec)+'</div><div class="t-sub">'+Math.round(pPct)+'% of your time</div></div>'+
      '<div class="card tile"><div class="t-k">Unplanned</div><div class="t-v">'+fmtDur(unplannedSec)+'</div><div class="t-sub">'+(100-Math.round(pPct))+'% of your time</div></div>'+
    '</div>';
    if(total>0)tiles+='<div class="split" title="Planned vs unplanned"><i style="width:'+pPct+'%;background:var(--accent)"></i><i style="width:'+(100-pPct)+'%;background:var(--faint)"></i></div>';

    // toward goals
    var byGoal={},noGoal=0;
    entries.forEach(function(e){var dur=((e.se.end==null?now:e.se.end)-e.se.start)/1000;if(e.t.goalId){byGoal[e.t.goalId]=(byGoal[e.t.goalId]||0)+dur;}else noGoal+=dur;});
    var gkeys=Object.keys(byGoal).sort(function(a,b){return byGoal[b]-byGoal[a];});
    var gb="";
    if(gkeys.length){
      var grows=gkeys.map(function(k){var sec=byGoal[k],w=total>0?sec/total*100:0;
        return '<div class="gb-row"><div class="gb-name"><span class="cdot"></span><span class="gb-nm">'+esc(goalName(k)||"Goal")+'</span></div><div class="gb-time">'+fmtDur(sec)+' · '+Math.round(w)+'%</div></div>';}).join("");
      if(noGoal>0.9)grows+='<div class="gb-row"><div class="gb-name is-none"><span class="cdot"></span><span class="gb-nm">Not tied to a goal</span></div><div class="gb-time">'+fmtDur(noGoal)+' · '+Math.round(noGoal/total*100)+'%</div></div>';
      gb='<div class="actions-head" style="margin:2px 2px 8px">Toward your goals</div><div class="card breakdown">'+grows+'</div>';
    }

    // deep work scoreboard
    var hasDeep=state.tasks.some(function(t){return t.depth==="deep";});
    var deepCard="";
    if(hasDeep){
      var deepTodaySec=0,deepRunStart=null,deepRunBase=0;
      entries.forEach(function(e){if(e.t.depth!=="deep")return;var end=e.se.end==null?now:e.se.end,dur=(end-e.se.start)/1000;deepTodaySec+=dur;if(e.se.end==null){deepRunStart=e.se.start;}else{deepRunBase+=dur;}});
      var deepWeekSec=0,wk7=startOfToday()-6*86400000;
      state.tasks.forEach(function(t){if(t.depth!=="deep")return;(t.sessions||[]).forEach(function(se){if(se.start>=wk7){var end=se.end==null?now:se.end;deepWeekSec+=(end-se.start)/1000;}});});
      var dpct=Math.min(deepTodaySec/(DEEP_TARGET_MIN*60),1)*100;
      var dv=deepRunStart?'<div class="deep-v" data-run-base="'+deepRunBase.toFixed(0)+'" data-run-start="'+deepRunStart+'" data-run-fmt="dur">'+fmtDur(deepTodaySec)+'</div>':'<div class="deep-v">'+fmtDur(deepTodaySec)+'</div>';
      deepCard='<div class="card deep-card"><div class="deep-top"><span class="deep-k">Deep work'+(isToday?" today":"")+'</span><span class="deep-week">'+fmtDur(deepWeekSec)+' this week</span></div>'+dv+
        '<div class="deep-bar"><div class="deep-fill" style="width:'+dpct.toFixed(0)+'%"></div></div>'+
        '<div class="deep-sub">Target '+fmtDur(DEEP_TARGET_MIN*60)+' focused'+(isToday?" today":"")+' · even pros rarely sustain more than ~4h of deep work a day.</div></div>';
    }

    // breakdown
    var cats=Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a];});
    var bd="";
    if(cats.length){
      bd='<div class="card breakdown">'+cats.map(function(k){
        var sec=byCat[k],w=total>0?sec/total*100:0,col=catColor(k);
        return '<div class="bd-row">'+
          '<div class="bd-label"><span class="cdot" style="background:'+col+'"></span><span class="bd-name">'+esc(k||"Uncategorized")+'</span></div>'+
          '<div class="bd-time">'+fmtDur(sec)+' · '+Math.round(w)+'%</div>'+
          '<div class="bd-track"><div class="bd-fill" style="width:'+w.toFixed(0)+'%;background:'+col+'"></div></div>'+
        '</div>';
      }).join("")+'</div>';
    }

    // timeline — with the in-between spelled out: gaps between stretches, pauses, and where you picked a task back up
    var tl="";
    if(entries.length){
      var GAP_MIN=120,prev=null,pzt=(isToday&&!state.activeId)?pausedTask():null;
      tl='<div class="card timeline">'+entries.map(function(e){
        var live=e.se.end==null, end=live?now:e.se.end, dur=(end-e.se.start)/1000;
        var gapRow="";
        if(prev&&prev.se.end!=null){
          var gap=(e.se.start-prev.se.end)/1000, pzGap=!!prev.se.pause&&prev.t.id===e.t.id;
          if(gap>=GAP_MIN)gapRow=tlGap(pzGap,pzGap?pauseSvg()+'Paused '+fmtDur(gap)+' · nothing else tracked':fmtDur(gap)+' not tracked');
        }
        prev=e;
        var cont=pausedGap(e.t,e.se);
        var tags=(e.se.pause?' · <span class="tl-tag">'+pauseSvg()+'paused</span>':'')+(cont!=null?' · <span class="tl-tag is-cont">'+playSvg()+'continued after '+fmtDur(cont)+'</span>':'');
        var extra="";
        if(e.t.planned&&e.t.estimateMin){var d=taskSec(e.t)-e.t.estimateMin*60;extra=' <span class="'+(d>0?"is-over":"is-under")+'">'+(d>0?"+"+fmtDur(d)+" vs est":fmtDur(-d)+" under")+'</span>';}
        var durCell=(live?'<span data-run-start="'+e.se.start+'" data-run-base="0" data-run-fmt="dur">'+fmtDur(dur)+'</span> · running':fmtDur(dur)+extra)+tags;
        return gapRow+'<div class="tl-row">'+
          '<div class="tl-time"><span class="tl-start">'+hhmm(e.se.start)+'</span><span>'+(live?"now":hhmm(end))+'</span></div>'+
          '<div class="tl-body"><div class="tl-name">'+esc(e.t.name)+chip(e.t.category)+'</div><div class="tl-dur">'+durCell+'</div></div>'+
        '</div>';
      }).join("")+
      (pzt?tlGap(true,pauseSvg()+esc(pzt.name)+' paused · '+pausedSince()+' so far',state.paused.at):'')+
      '</div>';
    } else {
      tl='<div class="card empty">Nothing tracked '+(isToday?"yet today":"on this day")+'. '+(isToday?"Start a timer above to begin.":"")+'</div>';
    }

    return '<section class="sec review">'+
      '<div class="review-head">'+
        '<div class="daynav">'+
          '<button class="icon-btn" data-action="prev-day" aria-label="Previous day">&#8249;</button>'+
          '<div class="day-label">'+esc(dayLabel(key))+'</div>'+
          '<button class="icon-btn" data-action="next-day" aria-label="Next day"'+(isToday?" disabled":"")+'>&#8250;</button>'+
        '</div>'+
        (isToday?'':'<button class="btn btn-ghost btn-sm" data-action="today" type="button">Jump to today</button>')+
      '</div>'+
      tiles+'<div class="rv-cols"><div class="rv-a">'+deepCard+gb+bd+'</div><div class="rv-b">'+tl+'</div></div>'+
      '<div class="review-foot"><span></span><button class="btn btn-ghost btn-sm" data-action="export" type="button">Export CSV</button></div>'+
    '</section>';
  }

  /* ---------- inline icons ---------- */
  function backSvg(){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>';}
  function chevronSvg(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>';}
  function goalIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="3.4"></circle></svg>';}
  function projIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="7" height="7" rx="1.6"></rect><rect x="13.5" y="4.5" width="7" height="7" rx="1.6"></rect><rect x="3.5" y="14.5" width="7" height="5" rx="1.6"></rect><rect x="13.5" y="14.5" width="7" height="5" rx="1.6"></rect></svg>';}
  function reviewIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16"></path><path d="M7 19v-6"></path><path d="M12 19V6"></path><path d="M17 19v-9"></path></svg>';}
  function handoffSvg(){return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h13"></path><path d="M13 6l6 6-6 6"></path></svg>';}
  function clockSvg(){return '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg>';}
  function playSvg(){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5.5v13a1 1 0 0 0 1.53.85l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 7 5.5Z"></path></svg>';}
  function sparkSvg(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.7 5.6L19 9l-5.3 1.4L12 16l-1.7-5.6L5 9l5.3-1.4L12 2z"></path></svg>';}
  function logSvg(){return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>';}
  function pauseSvg(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"></rect><rect x="14" y="5" width="4" height="14" rx="1.2"></rect></svg>';}
  function stopSvg(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>';}
})();
</script>
