<style id="app-style">
:root{
  --bg:#eaeef2;
  --surface:#ffffff;
  --surface-2:#f3f6f9;
  --ink:#17202b;
  --muted:#59636f;
  --faint:#93a0ac;
  --line:#dde3ea;
  --line-strong:#cfd7e0;
  --accent:#4c5fd5;
  --accent-ink:#ffffff;
  --accent-soft:#e9ebfb;
  --good:#2f9e44;
  --good-soft:#e6f4ea;
  --warn:#d98207;
  --warn-soft:#fbeed8;
  --bad:#dc4a4f;
  --bad-soft:#fbe7e8;
  /* branch identity in a goal's split bar (validated categorical order; light steps, checked on the white card) */
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --shadow:0 1px 2px rgba(23,32,43,.05),0 8px 28px -18px rgba(23,32,43,.28);
  --radius:15px;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme:dark){
    --bg:#0e1319;
    --surface:#161d26;
    --surface-2:#1e2732;
    --ink:#e8edf3;
    --muted:#9aa6b3;
    --faint:#69747f;
    --line:#28313d;
    --line-strong:#333f4d;
    --accent:#8091ff;
    --accent-ink:#0e1319;
    --accent-soft:#232a4a;
    --good:#54c775;
    --good-soft:#182a1f;
    --warn:#e7a53a;
    --warn-soft:#2e2515;
    --bad:#ff6f74;
    --bad-soft:#301a1c;
    --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1319;
  --surface:#161d26;
  --surface-2:#1e2732;
  --ink:#e8edf3;
  --muted:#9aa6b3;
  --faint:#69747f;
  --line:#28313d;
  --line-strong:#333f4d;
  --accent:#8091ff;
  --accent-ink:#0e1319;
  --accent-soft:#232a4a;
  --good:#54c775;
  --good-soft:#182a1f;
  --warn:#e7a53a;
  --warn-soft:#2e2515;
  --bad:#ff6f74;
  --bad-soft:#301a1c;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
#root,.wrap{max-width:780px;margin:0 auto;padding:20px 18px 64px;}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:600;text-wrap:balance;letter-spacing:-.01em}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 22px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand svg{flex:none;color:var(--accent)}
.brand h1{font-size:clamp(20px,5.4vw,26px);line-height:1.05}
.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.chip-sync{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  font-size:12.5px;font-weight:500;padding:7px 11px;border-radius:999px;line-height:1}
.chip-sync .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.chip-sync.is-sync .dot{background:var(--good)}
.chip-sync.is-local .dot{background:var(--warn)}
.chip-sync.is-error .dot{background:var(--bad)}
.chip-sync.is-check .dot{background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);font-size:16px;line-height:1;transition:background .15s,color .15s,border-color .15s}
.icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.icon-btn.danger:hover{color:var(--bad);border-color:var(--bad)}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn[data-arm]{position:relative}
.icon-btn.armed{z-index:2;background:var(--bad);border-color:var(--bad);color:#fff}
.icon-btn.armed:hover{color:#fff;border-color:var(--bad)}
.icon-btn.armed::after{content:"Delete?";position:absolute;top:-1px;right:-1px;bottom:-1px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;min-width:83px;padding:0 12px;
  border-radius:10px;background:var(--bad);color:#fff;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 4px 14px -4px rgba(0,0,0,.45)}
.tr-actions:has(.icon-btn.armed)>:not(.armed){visibility:hidden}   /* armed row: just "Delete?", same layout */

/* cards + sections */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.sec{margin-top:26px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 12px}
.sec-head h2{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

/* NOW card */
.now{padding:20px}
.now-idle .now-idle-label{font-family:var(--font-display);font-size:19px;margin-bottom:14px}
.quick{display:flex;flex-wrap:wrap;gap:9px}
.field{flex:1 1 100%;min-width:0;padding:13px 14px;border:1px solid var(--line-strong);border-radius:11px;background:var(--surface-2);
  color:var(--ink);font-family:inherit;font-size:16px;transition:border-color .15s,box-shadow .15s}
.field::placeholder{color:var(--faint)}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field-cat{flex:1 1 46%}
.field-est{flex:1 1 30%}
.quick .btn-primary{flex:1 1 46%}
.hint{margin:12px 2px 0;color:var(--muted);font-size:13.5px;line-height:1.5}
.recents{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
.recents-lbl{font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-right:1px}
.rchip{display:inline-flex;align-items:stretch;max-width:100%;border:1px solid var(--line-strong);background:var(--surface-2);
  border-radius:999px;transition:border-color .15s,background .15s}
.rchip:hover{border-color:var(--accent)}
.rchip.is-pinned{border-color:var(--accent);background:var(--accent-soft)}
.rchip-go{display:inline-flex;align-items:center;gap:7px;min-width:0;border:none;background:transparent;color:var(--ink);
  font-family:inherit;font-size:13.5px;font-weight:500;line-height:1;padding:0 3px 0 13px;min-height:40px;border-radius:999px 0 0 999px}
.rchip.is-pinned .rchip-go{color:var(--accent)}
.rchip-go .cdot{width:8px;height:8px;border-radius:50%;flex:none}
.rchip-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rchip-pin{display:inline-flex;align-items:center;border:none;background:transparent;color:var(--faint);font-size:14px;line-height:1;
  padding:0 11px 0 5px;min-height:40px;border-radius:0 999px 999px 0}
.rchip-pin:hover{color:var(--accent)}
.rchip.is-pinned .rchip-pin{color:var(--accent)}
.now-pin{margin-left:auto;flex:none;border:1px solid var(--line-strong);background:transparent;color:var(--faint);
  font-family:inherit;font-size:12px;font-weight:600;line-height:1;padding:6px 11px;border-radius:999px}
.now-pin:hover{color:var(--accent);border-color:var(--accent)}
.now-pin.is-on{color:var(--accent);border-color:transparent;background:var(--accent-soft)}
.icon-btn.pin.is-on{color:var(--accent);border-color:var(--accent)}
.now-swipe-hint{margin-top:12px;text-align:center;font-size:12px;color:var(--faint)}
.now-active{touch-action:pan-y;transition:transform .22s cubic-bezier(.2,.7,.3,1)}
.now-active.swiping{transition:none}
.now-active.swipe-armed{border-color:var(--bad)}

.now-active{position:relative;overflow:hidden;border-color:var(--accent);background:
  linear-gradient(180deg,var(--accent-soft),transparent 62%),var(--surface)}
.now-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.live-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent)}
.live-pill .bl{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.5s ease-in-out infinite}
.now-name{font-family:var(--font-display);font-size:clamp(21px,5.6vw,27px);line-height:1.15;margin:2px 0 4px}
.now-clock{font-family:var(--font-mono);font-size:clamp(44px,15vw,68px);font-weight:500;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;margin:6px 0 4px}
.now-est{color:var(--muted);font-size:14px;margin-bottom:16px}
.now-est b{color:var(--ink);font-weight:600}
.diff{font-weight:600}
.diff.is-under{color:var(--good)}
.diff.is-over{color:var(--bad)}
.now-btns{display:flex;gap:10px;margin-top:6px}
/* paused: the task waits on the Now card with Continue; what you do meanwhile is the in-between */
.now-paused{position:relative;overflow:hidden;border-color:var(--warn);background:linear-gradient(180deg,var(--warn-soft),transparent 62%),var(--surface)}
.now-paused .live-pill{color:var(--warn)}
.now-paused .now-clock{color:var(--muted)}
.now-pausefor b{color:var(--warn);font-weight:600}
.pause-strip{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:11px;background:var(--surface)}
.pause-strip-t{flex:1;min-width:0;font-size:13px;line-height:1.4;color:var(--muted)}
.pause-strip-t b{color:var(--ink);font-weight:600}
.pause-strip .btn{flex:none}

/* buttons */
.btn{border:1px solid transparent;border-radius:11px;padding:12px 18px;font-size:15px;font-weight:600;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;transition:transform .06s,filter .15s,background .15s}
.btn:active{transform:translateY(1px)}
.btn svg{flex:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-stop{background:var(--bad);color:#fff}
.btn-stop:hover{filter:brightness(1.05)}
.btn-lg{flex:1;min-height:54px;font-size:16px}
.btn-ghost{background:transparent;border-color:var(--line-strong);color:var(--muted)}
.btn-ghost:hover{color:var(--ink);border-color:var(--faint)}
.btn-sm{min-height:38px;padding:8px 14px;font-size:13.5px;border-radius:9px}

/* planned form */
.planned-form{display:flex;flex-wrap:wrap;gap:8px;padding:14px;margin-bottom:12px;background:var(--surface-2);
  border:1px dashed var(--line-strong);border-radius:13px}
.planned-form .field{background:var(--surface)}
.planned-form .btn{flex:1 1 100%}
.capture-form{display:flex;gap:9px;padding:13px;margin-bottom:12px;align-items:center}
.capture-form .field{flex:1}
.capture-form .btn{flex:none}
@media (max-width:460px){.capture-form{flex-wrap:wrap}.capture-form .btn{flex:1 1 100%}}

/* goals */
.goal-list{display:flex;flex-direction:column;gap:12px}
.goal-card{padding:16px 16px 14px}
.goal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.goal-name{font-family:var(--font-display);font-size:18px;font-weight:600;line-height:1.2}
.goal-meta{margin-top:6px}
.goal-stat{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:13px 0 2px;font-size:13px;color:var(--muted)}
.goal-stat b{color:var(--ink);font-weight:600;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:block}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.actions-head{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;margin:15px 0 2px}
.action-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.action-row:first-child{border-top:0}
.action-main{flex:1;min-width:0}
.action-name{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.action-sub{font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.action-empty{font-size:13px;color:var(--muted);padding:9px 0 2px}
.action-add{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.action-add .field{flex:1 1 140px}
.action-add .btn{flex:1 1 100%}
.act-add-btn{margin-top:11px}
.goal-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.step{margin-top:12px;padding:12px 13px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.step-head{display:flex;align-items:center;gap:10px}
.step-check{flex:none;width:24px;height:24px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--accent-ink);font-size:14px;line-height:1;display:inline-grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.step-check.on{background:var(--accent);border-color:var(--accent)}
.step-name{flex:1;min-width:0;font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.25}
.step-name.is-done{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.step-actions{margin-top:2px}
.step .action-row{padding:8px 0}
.ai-loading{margin-top:10px;display:flex;align-items:center;gap:8px;color:var(--accent);font-size:13.5px;font-weight:600}
.ai-loading svg{animation:pulse 1.2s ease-in-out infinite}
.proposal{margin-top:12px;padding:14px;background:var(--surface-2);border:1px solid var(--accent);border-radius:12px}
.prop-title{display:flex;align-items:center;gap:7px;color:var(--accent);font-size:12.5px;font-weight:600;margin-bottom:11px;line-height:1.4}
.prop-step{margin-bottom:11px}
.prop-step-h{display:flex;align-items:flex-start;gap:9px;font-size:14.5px;line-height:1.35}
.prop-sub{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;color:var(--muted);margin:5px 0 0 22px;line-height:1.35}
.prop-ladder{margin-top:4px;border-top:1px solid var(--line);padding-top:11px}
.prop-rung{display:flex;gap:9px;font-size:13px;color:var(--muted);margin:5px 0 0 22px;line-height:1.35}
.prop-rung-n{color:var(--accent);font-weight:600;font-family:var(--font-mono);flex:none}
.proposal input[type=checkbox]{width:16px;height:16px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.prop-btns{display:flex;gap:8px;margin-top:12px}
.proj-repo{display:inline-block;margin-top:5px;font-family:var(--font-mono);font-size:12.5px;color:var(--accent);text-decoration:none;word-break:break-all}
.proj-repo:hover{text-decoration:underline}
.proj-upd{font-size:11.5px;color:var(--faint);margin-top:10px}
.proj-body{margin:2px 0 10px}
.proj-row{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.proj-row:first-child{border-top:0}
.proj-k{flex:none;width:64px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;padding-top:3px}
.proj-v{flex:1;min-width:0;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.proj-edit{display:flex;flex-direction:column;gap:7px;margin:4px 0 2px}
.dbtn.on-good{background:var(--good);border-color:var(--good);color:#fff}
.dbtn.on-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.proj-chat{margin-top:13px;padding:12px 13px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.adv-sec{margin-top:11px}
.adv-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;margin-bottom:4px}
.adv-item{display:flex;align-items:flex-start;gap:9px;padding:5px 0;font-size:13.5px;line-height:1.45}
.adv-dot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:6px}
.adv-next{background:var(--accent)}
.adv-missing{background:var(--warn)}
.adv-research{background:var(--good)}
.adv-risks{background:var(--bad)}
.adv-txt{flex:1;min-width:0}
.adv-cap{flex:none;align-self:center;border:1px solid var(--line-strong);background:transparent;color:var(--muted);font-family:inherit;font-size:11px;font-weight:600;line-height:1;padding:5px 9px;border-radius:99px;white-space:nowrap;cursor:pointer;transition:color .15s,border-color .15s}
.adv-cap:hover{color:var(--accent);border-color:var(--accent)}
.adv-when{font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint)}
.adv-hint{font-size:11.5px;color:var(--faint);margin-top:9px;font-style:italic}
/* collapsed project row (the "which project pulls me today?" board) */
.proj-mini{padding:13px 15px;cursor:pointer;transition:border-color .15s,background .15s}
.proj-mini:hover{border-color:var(--line-strong)}
.proj-mini-head{display:flex;align-items:center;gap:10px;min-width:0}
.proj-mini-dot{width:9px;height:9px;border-radius:50%;flex:none}
.proj-mini-name{flex:1;min-width:0;font-family:var(--font-display);font-size:16px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-mini-chev{flex:none;color:var(--faint);display:inline-flex;align-items:center}
.proj-mini-chev svg{transition:transform .15s}
.proj-mini-chev.open svg{transform:rotate(90deg)}
.proj-mini-next{font-size:13px;color:var(--muted);line-height:1.45;margin:6px 0 0 19px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.proj-mini-next.is-empty{color:var(--faint);font-style:italic}
.goal-name.proj-open-name{display:flex;align-items:center;gap:8px;cursor:pointer}
.goal-name.proj-open-name .proj-mini-chev{color:var(--faint)}
.proj-chat-h{display:flex;align-items:center;gap:7px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;margin-bottom:10px}
.pc-log{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.pc-msg{font-size:13.5px;line-height:1.5;padding:9px 11px;border-radius:11px;white-space:pre-wrap;word-break:break-word}
.pc-u{background:var(--accent-soft);color:var(--ink);align-self:flex-end;border-bottom-right-radius:3px;max-width:88%}
.pc-a{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:3px;max-width:92%}
.pc-form{display:flex;gap:8px}
.pc-form .field{flex:1}
.pc-form .btn{flex:none}
@media (max-width:460px){.pc-form{flex-wrap:wrap}.pc-form .btn{flex:1 1 100%}}
.proj-gh{margin-top:13px;padding:12px 13px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.proj-log{margin-top:13px;padding:12px 13px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.plog-list{margin-top:2px}
.plog-row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.45}
.plog-list .plog-row:first-child{border-top:0}
.plog-date{flex:none;font-family:var(--font-mono);font-size:11.5px;color:var(--faint);padding-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.plog-txt{flex:1;min-width:0;word-break:break-word}
.icon-btn.plog-del{width:26px;height:26px;flex:none;font-size:13px}
.plog-form{display:flex;gap:8px;margin-top:11px}
.plog-form .field{flex:1}
.plog-form .btn{flex:none}
@media (max-width:460px){.plog-form{flex-wrap:wrap}.plog-form .btn{flex:1 1 100%}}
.goal-form{display:flex;flex-wrap:wrap;gap:8px;padding:14px;margin-bottom:12px;background:var(--surface-2);
  border:1px dashed var(--line-strong);border-radius:13px}
.goal-form .field{flex:1 1 100%;background:var(--surface)}
.goal-form .field-est{flex:1 1 40%}
.goal-form .btn{flex:1 1 100%}
.chip-goal{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.gb-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.gb-row:first-child{border-top:0}
.gb-name{font-size:14px;display:flex;align-items:center;gap:9px;min-width:0}
.gb-name .cdot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.gb-name.is-none .cdot{background:var(--faint)}
.gb-nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb-time{font-family:var(--font-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.goal-note{margin-top:13px;padding:12px 13px;background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;font-size:13.5px;line-height:1.55;color:var(--muted)}
.goal-note .note-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;margin-bottom:6px}
.goal-note .note-body{white-space:pre-wrap;word-break:break-word}
.note-edit{margin-top:12px}
.note-area{width:100%;min-height:104px;resize:vertical;line-height:1.5;font-size:14px;background:var(--surface-2);font-family:inherit}
.note-btns{display:flex;gap:8px;margin-top:8px}
.note-add-btn{margin-top:12px}
/* deep/shallow + streak + cue + identity */
.depth-tog{display:flex;align-items:center;gap:7px;margin:2px 0 16px;flex-wrap:wrap}
.depth-lbl{font-size:12px;color:var(--muted);margin-right:2px}
.dbtn{border:1px solid var(--line-strong);background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;
  padding:7px 14px;border-radius:99px;line-height:1;font-family:inherit}
.dbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dbtn.on-sh{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.depth-pill{border:1px dashed var(--line-strong);background:transparent;color:var(--faint);font-family:var(--font-sans);
  font-size:11px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:99px;line-height:1.3}
.depth-pill.deep{border-style:solid;border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.depth-pill.shallow{border-style:solid;border-color:var(--line);background:var(--surface-2);color:var(--muted)}
.cue-btn{border:none;background:transparent;color:var(--accent);font-size:12px;font-weight:600;padding:0;font-family:inherit;cursor:pointer}
.cue-btn.tiny{font-size:11px;margin-left:6px;color:var(--faint)}
.cue-edit,.id-edit{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.cue-edit .field,.id-edit .field{flex:1 1 100%}
.streak{font-family:var(--font-sans);font-size:12.5px;font-weight:600;color:var(--accent)}
.streak.warn{color:var(--warn)}
.streak.bad{color:var(--bad)}
.goal-identity{font-family:var(--font-display);font-style:italic;font-size:15px;color:var(--muted);margin:1px 0 4px;cursor:pointer;line-height:1.35}
.id-add{margin:2px 0 4px}
.deep-card{padding:16px 16px 15px;margin-bottom:16px;border-color:var(--accent)}
.deep-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.deep-k{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.deep-week{font-size:12.5px;color:var(--muted);font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.deep-v{font-family:var(--font-mono);font-size:30px;font-weight:500;margin:8px 0 11px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.deep-bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.deep-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .35s}
.deep-sub{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.5}
/* progression / Bloom's ladder */
.prog-add{margin-top:12px}
.prog{margin-top:14px;padding:13px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.prog-head{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;margin-bottom:10px}
.rungs{display:flex;gap:4px;margin-bottom:11px}
.rung{flex:1;height:9px;border-radius:3px;background:var(--surface);border:1px solid var(--line)}
.rung.done{background:var(--accent);border-color:var(--accent);opacity:.5}
.rung.cur{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.prog-now{font-size:14px;margin-bottom:3px}
.prog-now b{font-family:var(--font-display);font-weight:600}
.prog-sub{font-size:12.5px;color:var(--muted);line-height:1.5}
.prog-up{color:var(--good);font-weight:600}
.prog-held{color:var(--warn);font-weight:600}
.rep-log{margin:12px 0 2px;display:flex;flex-direction:column;gap:7px}
.rep-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.rep-dot{width:8px;height:8px;border-radius:50%;flex:none}
.rep-dot.nailed{background:var(--good)}
.rep-dot.shaky{background:var(--warn)}
.rep-dot.lost{background:var(--bad)}
.rep-grade{color:var(--faint);font-size:12px;text-transform:capitalize}
.rep-date{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.rep-form{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.rep-form .field{width:100%}
.rep-lbl{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:-3px}
.rep-btns{display:flex;gap:8px;margin-top:3px}

/* valuation curriculum */
.curr{margin-top:14px;padding:13px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.curr-head{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.curr-count{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--faint);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.curr-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 13px}
.curr-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.curr-badge{font-size:11px;font-weight:600;padding:2px 10px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.curr-pos{font-size:12px;color:var(--muted)}
.curr-time{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.curr-stage{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600}
.curr-concept{font-family:var(--font-display);font-weight:600;font-size:15.5px;margin:2px 0 5px;line-height:1.3}
.curr-task{font-size:13.5px;color:var(--ink);line-height:1.55}
.curr-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.curr-tag{font-family:var(--font-mono);font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.curr-refs-btn{display:block;margin-top:9px;background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:500;cursor:pointer;padding:0}
.curr-refs{margin-top:8px;padding:9px 11px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--muted);line-height:1.5}
.curr-refs ul{margin:3px 0 0;padding-left:18px}
.curr-refs b{color:var(--ink)}
.curr-ex{margin-top:6px}
.curr-note{margin-top:7px;font-size:11.5px;color:var(--faint);font-style:italic}
.curr-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.curr-next{font-size:12px;color:var(--faint);margin-top:9px;padding-left:2px}
.curr-done-all{font-size:13.5px;color:var(--good);font-weight:500;line-height:1.5}

/* task rows */
.task-list{display:flex;flex-direction:column;gap:10px}
.task-row{display:flex;gap:14px;align-items:center;padding:15px 16px}
@media (max-width:460px){   /* phone: a long title gets the full width, its buttons drop to their own line */
  .task-row{flex-wrap:wrap;row-gap:12px}
  .task-row .tr-main{flex:1 1 auto}
  .task-row .tr-actions{margin-left:auto}
}
.tr-main{flex:1;min-width:0}
.tr-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--font-display);font-size:16.5px;font-weight:600}
.tr-sub{color:var(--muted);font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
.tr-actions{display:flex;align-items:center;gap:7px;flex:none}
.bar{height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);margin-top:9px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .35s}
.bar-fill.is-over{background:var(--bad)}
.is-done .tr-name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.mini-run{font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:99px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-sans);font-size:11.5px;font-weight:500;
  color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip .cdot{width:8px;height:8px;border-radius:50%;flex:none}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

/* review */
.review-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 14px}
.daynav{display:flex;align-items:center;gap:8px}
.day-label{font-family:var(--font-display);font-size:18px;font-weight:600;min-width:96px;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tile{padding:14px 14px 15px}
.tile .t-k{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.tile .t-v{font-family:var(--font-mono);font-size:23px;font-weight:500;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .t-sub{font-size:12px;color:var(--muted);margin-top:3px}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:9px;background:var(--surface-2);border:1px solid var(--line)}
.split i{display:block;height:100%}

.breakdown{padding:16px 16px 6px}
.bd-row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.bd-row:first-child{border-top:0}
.bd-label{display:flex;align-items:center;gap:9px;font-size:14px;min-width:0}
.bd-label .cdot{width:10px;height:10px;border-radius:50%;flex:none}
.bd-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-time{font-family:var(--font-mono);font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bd-track{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bd-fill{height:100%;border-radius:99px;transition:width .35s}

.timeline{padding:6px 16px 16px}
.tl-row{display:flex;gap:13px;padding:11px 0;border-top:1px solid var(--line)}
.tl-time{display:flex;flex-direction:column;gap:1px;font-family:var(--font-mono);font-size:12px;line-height:1.25;
  white-space:nowrap;padding-top:2px;font-variant-numeric:tabular-nums;flex:none;width:78px;color:var(--faint)}
.tl-time .tl-start{color:var(--muted)}
.tl-body{flex:1;min-width:0}
.tl-name{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-dur{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.tl-dur .is-over{color:var(--bad);font-weight:600}
.tl-dur .is-under{color:var(--good);font-weight:600}
.tl-row.tl-gap{padding:7px 0;border-top-style:dashed}
.tl-gap .tl-body{font-size:12.5px;line-height:1.4;color:var(--faint);font-style:italic}
.tl-gap.is-pause .tl-body{color:var(--warn);font-style:normal;font-weight:600}
.tl-gap svg,.tl-tag svg{width:10px;height:10px;margin-right:4px;vertical-align:-1px}
.tl-tag{font-family:var(--font-sans);font-size:11.5px;font-weight:600;color:var(--warn);white-space:nowrap}
.tl-tag.is-cont{color:var(--accent)}

.review-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding:0 2px}
.foot-note{color:var(--faint);font-size:12.5px;line-height:1.5;margin-top:30px;text-align:center;padding:0 8px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);
  font-size:13.5px;font-weight:500;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:460px){
  .tiles{grid-template-columns:1fr 1fr}
  .tile.tile-wide{grid-column:1/-1}
  .tl-time{width:70px}
  .field-cat,.quick .btn-primary{flex:1 1 100%}
}

/* ---- one-screen home + bottom tab nav ---- */
.view{animation:viewin .18s ease}
@keyframes viewin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.home{display:flex;flex-direction:column;gap:16px}
.home-next{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
.home-next-eye{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:600;margin-bottom:9px}
.home-next-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.home-next-label{flex:1 1 auto;min-width:0;font-family:var(--font-display);font-size:16.5px;font-weight:600;line-height:1.25}
.home-next-row .btn{flex:none}
.home-next-more{margin-top:11px;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;padding:0;cursor:pointer}
.home-next-more:hover{color:var(--accent)}
.home-glance{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:13px 15px;
  font-size:13.5px;color:var(--muted);font-family:inherit;cursor:pointer;text-align:left;transition:border-color .15s}
.home-glance:hover{border-color:var(--line-strong)}
.home-glance b{color:var(--ink);font-family:var(--font-mono);font-weight:600}
.home-glance-go{flex:none;color:var(--accent);font-weight:600;font-size:12.5px}
/* today's round: every daily thing at its minutes for today */
.round{padding:14px 15px 15px}
.round-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.round-eye{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:600}
.round-n{font-size:12.5px;color:var(--muted)}
.round-n b{font-family:var(--font-mono);color:var(--ink);font-weight:600}
.round-sub{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted);margin:5px 0 11px}
.round-sel{border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);color:var(--ink);font-family:var(--font-mono);font-size:16px;padding:3px 6px}
.round-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rt{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 8px;padding:8px 8px 10px 11px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);min-width:0}
.rt-n{min-width:0;border:none;background:transparent;padding:0;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-n:hover{color:var(--accent)}
.rt-go{flex:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-size:12px;line-height:1;display:inline-grid;place-items:center;cursor:pointer}
.rt-go.is-stop{background:var(--bad);border-color:var(--bad);color:#fff}
.rt-m{grid-column:1/-1;min-width:0;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-bar{grid-column:1/-1;height:4px;border-radius:99px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.rt-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.rt.is-on{border-color:var(--accent);background:var(--accent-soft)}
.rt.is-done{border-color:var(--good);background:var(--good-soft)}
.rt.is-done .rt-m{color:var(--good);font-weight:600}
.rt.is-done .rt-bar i{background:var(--good)}
@media (max-width:360px){.rt{grid-template-areas:"n n" "m go" "bar bar";padding:8px 7px 9px 10px;gap:6px}.rt-n{grid-area:n}.rt-go{grid-area:go;width:32px;height:32px}.rt-m{grid-area:m}.rt-bar{grid-area:bar}.rt-u{display:none}}   /* a small phone: the name gets the whole width */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;gap:2px;
  background:var(--surface);border-top:1px solid var(--line);
  padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 14px -10px rgba(0,0,0,.35)}
.tab{position:relative;flex:1 1 0;max-width:190px;display:flex;flex-direction:column;align-items:center;gap:4px;
  border:none;background:transparent;color:var(--faint);font-family:var(--font-sans);font-size:11px;font-weight:600;
  padding:6px 4px;border-radius:11px;line-height:1;transition:color .15s,background .15s}
.tab svg{width:22px;height:22px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);background:var(--accent-soft)}
.tab-live{position:absolute;top:5px;right:calc(50% - 17px);width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.5s ease-in-out infinite}
.tab-live.is-paused{background:var(--warn);animation:none}
/* collapsible goal sub-sections */
.gsec{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);overflow:hidden}
.gsec-head{display:flex;align-items:center;gap:9px;width:100%;border:none;background:transparent;
  font-family:inherit;text-align:left;padding:12px 13px;cursor:pointer;color:var(--ink);min-width:0}
.gsec-head:hover{background:var(--surface)}
.gsec-chev{flex:none;color:var(--faint);display:inline-flex;align-items:center}
.gsec-chev svg{transition:transform .15s}
.gsec-chev.open svg{transform:rotate(90deg)}
.gsec-title{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;flex:none}
.gsec-sum{flex:1;min-width:0;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.gsec-body{padding:0 13px 13px}
.gsec-body .curr,.gsec-body .prog{margin-top:0;border:none;background:transparent;padding:0}
.gsec-body .note-edit,.gsec-body .goal-note{margin-top:0}
.gsec-body .goal-note{border:none;background:transparent;padding:0;border-left:0}
/* guided goal shaper */
.gm-tabs{display:flex;gap:6px;margin-bottom:10px}
.gm-tab{flex:1;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;padding:10px 10px;border-radius:11px;line-height:1.2;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.gm-tab:hover{color:var(--ink);border-color:var(--faint)}
.gm-tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.shaper-lead{font-size:13px;color:var(--muted);line-height:1.5;flex:1 1 100%}
.lvl-row{display:flex;flex-wrap:wrap;align-items:center;gap:7px;flex:1 1 100%}
.lvl-lbl{font-size:12px;color:var(--muted);width:100%}
.lvl{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;padding:7px 13px;border-radius:99px;line-height:1;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.lvl:hover{color:var(--ink);border-color:var(--faint)}
.lvl.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.shape-panel .prop-title{flex:1 1 100%;margin-bottom:2px}
.shape-badge{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:8px}
.shape-badge.out{background:var(--good-soft);color:var(--good)}
.shape-why{font-size:12.5px;color:var(--muted);font-style:italic;line-height:1.5;flex:1 1 100%;margin-bottom:2px}
.shape-woop{flex:1 1 100%;margin-top:4px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--ink);line-height:1.5}
.shape-woop b{font-weight:600}
.shape-woop-note{font-size:11px;color:var(--faint);margin-top:5px}
.shape-panel .rep-lbl{flex:1 1 100%}
/* Aswath's method — prominent and open by default on the investing goal */
.asw{margin-top:14px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;background:linear-gradient(180deg,var(--accent-soft),transparent 150px),var(--surface-2);overflow:hidden}
.asw-head{display:flex;align-items:baseline;gap:9px;width:100%;border:none;background:transparent;font-family:inherit;text-align:left;padding:13px 14px 11px;cursor:pointer;color:var(--ink);min-width:0}
.asw-title{flex:none;font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--accent)}
.asw-sub{flex:1;min-width:0;font-size:12px;color:var(--muted)}
.asw-chev{flex:none;align-self:center;color:var(--faint);display:inline-flex}
.asw-chev svg{transition:transform .15s}
.asw-chev.open svg{transform:rotate(90deg)}
.asw-chev.sm svg{width:12px;height:12px}
.asw-body{padding:0 14px 14px}
.asw-quote{margin:0 0 6px;font-family:var(--font-display);font-size:19px;line-height:1.3;color:var(--ink)}
.asw-quote cite{display:block;margin-top:4px;font-family:var(--font-sans);font-style:normal;font-size:11.5px;color:var(--faint)}
.asw-lead{margin:0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.asw-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;margin:14px 0 7px}
.asw-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.asw-step{display:grid;grid-template-columns:18px 50px 1fr auto;gap:0 8px;align-items:baseline;font-size:13px;line-height:1.45}
.asw-n{font-family:var(--font-mono);font-size:11px;color:var(--accent);font-weight:600}
.asw-sk{font-weight:600;color:var(--ink)}
.asw-sq{color:var(--muted)}
.asw-ref{font-family:var(--font-mono);font-size:10px;color:var(--faint);white-space:nowrap}
.asw-calls{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.asw-c+.asw-c{border-top:1px solid var(--line)}
.asw-call{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;font-family:inherit;text-align:left;padding:9px 11px;cursor:pointer;color:var(--ink)}
.asw-call:hover{background:var(--surface-2)}
.asw-id{flex:none;width:56px;display:flex;flex-direction:column;gap:1px}
.asw-tk{font-family:var(--font-mono);font-weight:600;font-size:12.5px}
.asw-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.asw-l1{display:flex;flex-wrap:wrap;align-items:center;gap:3px 7px}
.asw-v{font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:99px;white-space:nowrap}
.asw-v.asw-good{background:var(--good-soft);color:var(--good)}
.asw-v.asw-bad{background:var(--bad-soft);color:var(--bad)}
.asw-v.asw-mid{background:var(--accent-soft);color:var(--accent)}
.asw-did{font-size:12.5px;font-weight:600;color:var(--ink)}
.asw-did::before{content:"\2192\00a0";color:var(--faint);font-weight:400}
.asw-l2{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.asw-ps{font-size:9.5px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.04em;margin-left:6px}
.asw-when{font-family:var(--font-mono);font-size:10.5px;color:var(--faint);white-space:nowrap}
.asw-det{padding:0 12px 13px 77px;font-size:13px;line-height:1.55;color:var(--ink)}
.asw-dh{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;margin:9px 0 3px}
.asw-drv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-top:9px;font-size:12px}
.asw-dk{color:var(--muted)}
.asw-dv{font-family:var(--font-mono);color:var(--ink)}
.asw-dn{margin-top:10px;padding:8px 10px;background:var(--warn-soft);border-radius:8px;font-size:12px;line-height:1.5;color:var(--ink)}
.asw-vid{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:500;color:var(--accent);text-decoration:none}
.asw-vid:hover{text-decoration:underline}
.asw-more{display:block;margin:8px 0 0;border:none;background:transparent;color:var(--accent);font-family:inherit;font-size:12.5px;font-weight:600;padding:2px 0;cursor:pointer}
.asw-note{margin-top:11px;font-size:11.5px;line-height:1.45;color:var(--faint);font-style:italic}
.asw-learn{display:block;width:100%;margin-top:12px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-family:inherit;font-size:13px;font-weight:600;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left}
.asw-learn:hover{background:var(--accent-soft)}
.asw-learn-t{display:block}
.asw-learn-s{display:block;margin-top:2px;font-size:11.5px;font-weight:500;color:var(--muted)}
@media (max-width:460px){.asw-step{grid-template-columns:16px 44px 1fr}.asw-ref{display:none}.asw-det{padding-left:12px}}
/* today's 30 minutes — the daily curriculum pick */
.td{margin-top:14px;padding:13px 14px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.td-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.td-title{font-family:var(--font-display);font-weight:600;font-size:15.5px;color:var(--ink)}
.td-mins{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.td-mins.met{color:var(--good);font-weight:600}
.td-bar{height:6px;border-radius:99px;background:var(--surface);border:1px solid var(--line);overflow:hidden;margin:8px 0 10px}
.td-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s}
.td-list{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.td-list .ls+.ls{border-top:1px solid var(--line)}
.td-az{display:block;width:100%;margin-top:10px;border:none;background:transparent;font-family:inherit;text-align:left;padding:2px 0;cursor:pointer;color:var(--accent);font-size:13px;font-weight:600}
.td-az-s{display:block;margin-top:1px;font-size:11.5px;font-weight:500;color:var(--muted)}
.td-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;font-size:12px;color:var(--muted)}
.td-link{flex:none;border:none;background:transparent;color:var(--accent);font-family:inherit;font-size:12.5px;font-weight:600;padding:0;cursor:pointer;white-space:nowrap}
.td-az-panel{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),transparent 120px),var(--surface-2)}
/* a lesson row — today's plan and the A → Z list */
.ls-row{display:flex;align-items:center;gap:8px;padding:0 10px 0 0}
.ls-main{flex:1;min-width:0;display:flex;align-items:center;gap:9px;border:none;background:transparent;font-family:inherit;text-align:left;padding:9px 0 9px 11px;cursor:pointer;color:var(--ink)}
.ls-st{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-strong);display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#fff;line-height:1}
.ls-st.part{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.ls-st.done{border-color:var(--good);background:var(--good)}
.ls-st.run{border-color:var(--accent);background:var(--accent);animation:pulse 1.5s ease-in-out infinite}
.ls-n{flex:none;width:26px;font-family:var(--font-mono);font-size:11px;color:var(--faint)}
.ls-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ls-c{font-size:13.5px;font-weight:500;line-height:1.3}
.ls-s{font-size:11.5px;color:var(--muted)}
.ls-s b{color:var(--accent);font-weight:600}
.ls.is-done .ls-c{color:var(--muted)}
.ls-row .btn{flex:none}
.ls-today{flex:none;border:1px solid var(--line-strong);background:transparent;color:var(--muted);font-family:inherit;font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:99px;cursor:pointer;white-space:nowrap}
.ls-today:hover{border-color:var(--accent);color:var(--accent)}
.ls-today.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.icon-btn.ls-rm{width:30px;height:30px;font-size:13px;flex:none}
.ls-det{padding:0 12px 13px 36px}
.ls-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.ls-meta .curr-tags{margin-top:0}
/* the curriculum, A → Z */
.cv-back{display:inline-flex;align-items:center;gap:3px;border:none;background:transparent;color:var(--accent);font-family:inherit;font-size:13.5px;font-weight:600;padding:4px 0;cursor:pointer;margin:0 0 6px -3px}
.cv-title{font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1.2;margin:2px 0 6px}
.cv-sub{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.cv-rung{margin-top:20px}
.cv-rh{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin:0 2px 7px}
.cv-rn{font-family:var(--font-mono);font-size:11px;color:var(--accent);font-weight:600}
.cv-rt{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--ink)}
.cv-rung.here .cv-rt::after{content:" \00b7  you are here";text-transform:none;letter-spacing:0;color:var(--accent)}
.cv-rd{font-size:12px;color:var(--muted)}
.cv-rp{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--faint);white-space:nowrap}
.cv-list{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.cv-list .ls+.ls{border-top:1px solid var(--line)}
.curr-call{display:inline-block;margin:6px 0 2px;border:1px solid var(--accent-soft);background:var(--accent-soft);color:var(--accent);font-family:inherit;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;cursor:pointer}
.curr-call:hover{border-color:var(--accent)}
.td-when{display:inline-block;margin:6px 0 8px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);font-family:inherit;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-when.is-empty{color:var(--faint);border-style:dashed}
.td .cue-edit{margin:6px 0 8px}
/* the guided 30 minutes on a running lesson: prime → encode → retrieve → reflect */
.ses{margin:4px 0 14px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ses-pills{display:flex;gap:5px}
.ses-pill{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);background:var(--surface-2);color:var(--faint);font-family:inherit;font-size:11.5px;font-weight:600;padding:6px 2px;border-radius:9px;cursor:pointer;line-height:1.2}
.ses-pill span{font-family:var(--font-mono);font-size:10px;font-weight:500}
.ses-pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ses-pill.done{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.ses-bar{position:relative;display:flex;gap:2px;height:6px;margin:10px 0 3px}
.ses-seg{display:block;height:100%;border-radius:99px;background:var(--line)}
.ses-seg.is-now{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.ses-bar b{position:absolute;top:-4px;width:3px;height:14px;margin-left:-1px;border-radius:2px;background:var(--accent)}
.ses-sug{min-height:16px;font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px}
.ses-q{display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 8px;font-size:13px}
.ses-co{font-family:var(--font-mono);font-size:11px;color:var(--accent)}
.ses-task{font-size:13.5px;line-height:1.5;color:var(--ink);margin:4px 0 8px}
.ses-lbl{display:block;font-size:12px;color:var(--muted);font-weight:500;margin:10px 0 5px}
.ses-ok{color:var(--good);font-weight:600}
.ses-rule{padding:9px 11px;background:var(--accent-soft);border-radius:9px;font-size:13px;line-height:1.5;color:var(--ink);margin-bottom:8px}
.ses-why{font-size:11.5px;color:var(--faint);line-height:1.45;margin-top:7px;font-style:italic}
.ses-why i{font-style:normal;color:var(--muted)}
.ses-area{min-height:88px}
.ses .curr-refs{margin-top:0}
.ses .dec-nav{margin-top:10px}
/* priming card on Home */
.prime{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
.prime .home-next-eye{color:var(--warn)}
.prime.is-primed{border-left-color:var(--good)}
.prime.is-primed .home-next-eye{color:var(--good)}
.prime-q{font-size:13px}
.prime-q .ses-task{margin-bottom:0}
.prime-guess{margin-top:8px;font-family:var(--font-display);font-style:italic;font-size:15px;color:var(--ink);line-height:1.4}
.prime-carry{margin-top:8px;padding:8px 10px;background:var(--warn-soft);border-radius:8px;font-size:12.5px;line-height:1.45;color:var(--ink)}
.prime-form{display:flex;gap:8px;margin-top:10px}
.prime-form .field{flex:1}
.prime-form .btn{flex:none}
/* spaced revisits: 5 minutes, a new company, no notes */
.ses-rev{border-color:var(--warn)}
.ses-rev-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ses-rev-t{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--warn);font-weight:600}
.ses-rev-left{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ses-rev .ses-bar{margin-bottom:10px}
.ses-rev .ses-seg.is-now{background:var(--warn-soft);box-shadow:inset 0 0 0 1px var(--warn)}
.ses-rev .ses-bar b{background:var(--warn)}
.home-next.rev{border-left-color:var(--warn)}
.home-next.rev .home-next-eye{color:var(--warn)}
.rev-why{margin-top:9px;font-size:12.5px;color:var(--muted);line-height:1.45}
.td-rev{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.td-rev-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--warn);font-weight:600;margin-bottom:4px}
.td-rev-h span{text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted)}
.td-rev-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line)}
.td-rev-h+.td-rev-row{border-top:0}
.td-rev-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.td-rev-row .btn{flex:none}
.td-rev-later{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}
.td-metric{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;font-size:12.5px;color:var(--muted);margin:-4px 0 10px}
.td-metric b{color:var(--good);font-family:var(--font-mono);font-weight:600}
.td-metric-s{font-size:11px;color:var(--faint);font-style:italic}
.ls-st.shaky{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.ls-wait{flex:none;font-family:var(--font-mono);font-size:11px;color:var(--faint);white-space:nowrap;padding:0 6px}
/* pieces of a goal: tick them off; blocks fold to one line */
.action-row.is-done .action-name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.icon-btn.is-on{color:var(--good);border-color:var(--good)}
button.step-name{border:none;background:transparent;text-align:left;padding:0;cursor:pointer;color:var(--ink);display:flex;align-items:center;flex-wrap:wrap;gap:3px 8px}
button.step-name:hover .step-nm{color:var(--accent)}
.step-nm{flex:1 1 100%;min-width:0}   /* name on its own line; when · count · chevron on the next */
@media (max-width:460px){   /* phone: a piece's name gets the full width, its Start · ✓ · × drop to their own line */
  .action-row{flex-wrap:wrap;row-gap:6px}
  .action-row .action-main{flex:1 1 100%}
  .action-row .tr-actions{margin-left:auto}
}
.step-count{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--faint)}
.step-count.all{color:var(--good)}
.step-when{font-family:var(--font-sans);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:99px;line-height:1.3}
.step-chev{display:inline-flex;color:var(--faint)}
.step-chev svg{width:12px;height:12px;transition:transform .15s}
.step-chev.open svg{transform:rotate(90deg)}
.step.is-closed{padding:10px 13px}
.step.is-done{opacity:.7}
/* your calls — the decision log, his 4 steps */
.dec{margin-top:14px;padding:13px 14px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.dec-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 9px;margin-bottom:10px}
.dec-title{font-family:var(--font-display);font-weight:600;font-size:15.5px;color:var(--ink)}
.dec-sub{font-size:12px;color:var(--muted)}
.dec-new{width:100%}
.dec-stat{font-size:12px;color:var(--muted);margin:11px 0 8px}
.dec-bad{color:var(--bad)!important}
.dec-muted{color:var(--muted)}
.dec-txt{white-space:pre-wrap;word-break:break-word}
.dec-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:11.5px;color:var(--faint)}
.dec-del{border:none;background:transparent;color:var(--faint);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:0}
.dec-del:hover{color:var(--bad)}
.dec-del.armed{color:var(--bad)}
.dec-wiz{display:flex;flex-direction:column;gap:9px;padding:12px;background:var(--surface);border:1px solid var(--accent);border-radius:11px}
.dec-steps{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.dec-dot{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--faint);border:1px solid var(--line);white-space:nowrap}
.dec-dot.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dec-dot.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dec-x{margin-left:auto;border:none;background:transparent;color:var(--faint);font-family:inherit;font-size:19px;line-height:1;cursor:pointer;padding:0 2px}
.dec-x:hover{color:var(--bad)}
.dec-lead{font-size:13.5px;line-height:1.5;color:var(--ink)}
.dec-ref{font-family:var(--font-mono);font-size:10px;color:var(--faint);margin-left:6px}
.dec-wiz .field{background:var(--surface-2)}
.dec-area{min-height:108px}
.dec-q{font-size:12px;color:var(--muted);font-weight:500}
.dec-pills{display:flex;flex-wrap:wrap;gap:6px}
.dec-pill{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);font-family:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:10px;cursor:pointer;text-align:left}
.dec-pill span{font-size:11px;font-weight:500;color:var(--muted)}
.dec-pill:hover{border-color:var(--accent)}

/* handoff feedback loop */
.adv-ho{color:var(--accent);border-color:var(--accent-soft)}

.ho-badge.ho-bad{background:var(--bad-soft);color:var(--bad)}
.ho-summary{font-size:13.5px;line-height:1.5;color:var(--ink);margin-bottom:8px}
.ho-sec{margin-top:9px}
.ho-sec-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;margin-bottom:4px}

.ho-dot.ho-bad{background:var(--bad)}

/* advisor basis tags ("why I think this") */
.adv-basis{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:99px;margin-left:7px;vertical-align:middle;white-space:nowrap}
.adv-basis.is-grounded{background:var(--good-soft);color:var(--good)}
.adv-basis.is-guess{background:var(--warn-soft);color:var(--warn)}

/* building products: the idea in a sitting, the videos, the idea board */
.ses-teach{padding:10px 12px;margin:6px 0 8px;background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;font-size:13.5px;line-height:1.55;color:var(--ink)}
.curr-refs ul{margin:3px 0 0;padding-left:18px}
.ls-vid{color:var(--accent);font-weight:600;text-decoration:none}

.ideas{margin-top:14px;padding:13px 14px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}

.idea-sum{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;color:var(--muted)}

.idea-sc b.n{color:var(--bad)}
.idea-body{padding:0 11px 12px 39px}
.idea-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;margin:2px 0 6px}
.idea-q{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:5px 10px;padding:7px 0;border-top:1px solid var(--line)}
.idea-q:first-of-type{border-top:0}
.idea-qt{flex:1 1 180px;font-size:12.5px;line-height:1.4;color:var(--muted)}
.idea-qt b{color:var(--ink);font-weight:600}
.idea-ps{display:flex;gap:4px;flex:none}
.idea-p{border:1px solid var(--line-strong);background:transparent;color:var(--muted);font-family:inherit;font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:99px;cursor:pointer;white-space:nowrap}
.idea-p.on-y{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.idea-p.on-u{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.idea-p.on-n{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.idea-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.idea-talked{font-size:12.5px;color:var(--muted)}
.idea-talked b{color:var(--ink);font-family:var(--font-mono)}
.idea-fnote{font-size:12px;font-weight:600;color:var(--warn)}
.idea-add{display:flex;gap:8px;margin-top:10px}
.idea-add .field{flex:1;background:var(--surface)}
.idea-add .btn{flex:none}
@media (max-width:460px){.idea-body{padding-left:11px}}
/* from your channels: the commentary videos as short reads */
.rd-entry{display:block;width:100%;margin-top:12px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);font-family:inherit;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer}
.rd-entry:hover{border-color:var(--accent)}
.rd-entry-t{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--accent)}
.rd-entry-t::after{content:"\2192";margin-left:auto}
.rd-badge{font-size:11px;font-weight:600;color:var(--accent-ink);background:var(--accent);padding:2px 7px;border-radius:99px}
.rd-entry-s{display:block;margin-top:3px;font-size:12px;color:var(--muted);line-height:1.4}
.rd-chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 12px}
.rd-chip{border:1px solid var(--line-strong);background:transparent;color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;cursor:pointer}
.rd-chip span{font-family:var(--font-mono);font-weight:500;color:var(--faint);margin-left:5px}
.rd-chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.rd-list{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.rd-row{display:flex;align-items:flex-start;gap:10px;width:100%;border:none;background:transparent;color:var(--ink);font-family:inherit;text-align:left;padding:12px;cursor:pointer}

.rd-row:hover{background:var(--surface-2)}
.rd-dot{flex:none;width:8px;height:8px;margin-top:7px;border-radius:99px;background:var(--accent)}

.rd-rtxt{min-width:0}
.rd-num{flex:none;min-width:18px;margin-top:1px;font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
.rd-row.is-read .rd-num{color:var(--faint)}
.rd-rt{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
.rd-row.is-read .rd-rt{color:var(--muted);font-weight:500}
.rd-rs{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
.rd-none{padding:18px 12px;font-size:13px;color:var(--muted)}
.rd-meta{margin-top:4px;font-size:11.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.07em}
.rd-title{font-size:24px;line-height:1.2;margin:6px 0}
.rd-sub{font-size:13px;color:var(--muted)}
.rd-sub a{color:var(--accent);font-weight:600;text-decoration:none}
.rd-body{margin-top:16px;font-size:15.5px;line-height:1.6}
.rd-body p{margin:0 0 12px}
.rd-h{font-size:17px;margin:22px 0 8px}
.rd-ul,.rd-ol{margin:0 0 12px;padding-left:20px}
.rd-ul li,.rd-ol li{margin:0 0 7px}
.rd-tw{overflow-x:auto;margin:4px 0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.rd-t{border-collapse:collapse;width:100%;font-size:12.5px;line-height:1.4}
.rd-t th,.rd-t td{padding:7px 9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.rd-t th{font-weight:600;color:var(--muted);background:var(--surface-2)}
.rd-t tr:last-child td{border-bottom:none}
.rd-t td:first-child{font-weight:600;min-width:7em}
.rd-t-wide{min-width:620px}
.rd-t-wide td:first-child{min-width:10em}
.rd-t td{font-variant-numeric:tabular-nums}
.rd-body a{color:var(--accent);font-weight:500;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.rd-l{display:inline;border:none;background:var(--accent-soft);color:var(--accent);font-family:var(--font-mono);font-size:.82em;font-weight:600;padding:1px 5px;border-radius:5px;cursor:pointer}
.rd-foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.rd-readline{font-size:13px;color:var(--good);font-weight:600;margin-bottom:10px}
.rd-link{border:none;background:none;padding:0;color:var(--muted);font-family:inherit;font-size:13px;font-weight:500;text-decoration:underline;cursor:pointer}
.rd-btns{display:flex;flex-wrap:wrap;gap:8px}
.rd-note{margin-top:12px;font-size:11.5px;color:var(--faint)}
/* the tech tree: tiers down a spine on a phone, left to right on a wide screen */
.tt-view .cv-sub{max-width:70ch}
.tt-sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 4px;max-width:760px}
.tt-sum>div{min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}
.tt-sum b{display:block;margin-top:2px;font-family:var(--font-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.tt-k{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.tt-m{display:block;margin-top:1px;font-size:11.5px;line-height:1.35;color:var(--muted)}
.tt{display:flex;flex-direction:column;gap:18px;margin-top:18px;max-width:760px}
.tt-col{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;padding-left:44px}
.tt-col::before{content:"";position:absolute;left:15px;top:16px;bottom:-34px;width:2px;background:var(--line-strong)}
.tt-col:last-child::before{display:none}
.tt-col.is-done::before{background:var(--good)}
.tt-num{position:absolute;left:0;top:0;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-strong);background:var(--surface);color:var(--muted);font-family:var(--font-display);font-size:13px;font-weight:600}
.is-done>.tt-num{background:var(--good);border-color:var(--good);color:var(--surface)}
.is-now>.tt-num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.is-next>.tt-num{border-color:var(--accent);color:var(--accent)}
.tt-node,.tt-side{min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 13px 13px}
.tt-node.is-now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tt-node.is-done{border-color:var(--good)}
.tt-node.is-locked,.tt-node.is-next,.tt-side.is-locked{background:var(--surface-2)}
.tt-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tt-name{min-width:0;font-family:var(--font-display);font-size:16px;font-weight:600;line-height:1.25}
.tt-node.is-locked .tt-name{color:var(--muted)}
.tt-st{flex:none;padding:2px 8px;border:1px solid var(--line);border-radius:99px;background:var(--surface-2);color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tt-node.is-now>.tt-h .tt-st{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tt-node.is-next>.tt-h .tt-st{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tt-node.is-done>.tt-h .tt-st{background:var(--good-soft);border-color:transparent;color:var(--good)}
.tt-when{margin-top:1px;font-size:12px;color:var(--muted)}
.tt-cost{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px;padding:8px 10px;border-radius:9px;background:var(--surface-2)}
.tt-node.is-locked .tt-cost,.tt-node.is-next .tt-cost,.tt-side.is-locked .tt-cost{background:var(--surface)}
.tt-cost>div{min-width:0}
.tt-cost b{display:block;font-size:13.5px;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums}
.tt-cost i{font-weight:400;color:var(--muted)}
.tt-xp{height:6px;margin-top:10px;border-radius:99px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.tt-xp i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.is-done .tt-xp i{background:var(--good)}
.tt-xps{margin-top:4px;font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tt-lbl{margin:11px 0 4px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.tt-teach{margin:0;padding-left:17px;font-size:13px;line-height:1.4}
.tt-teach li{margin:0 0 3px}
.tt-side .tt-teach{margin-top:8px;font-size:12.5px}
.tt-gate{margin-top:9px;padding:7px 9px;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;background:var(--accent-soft);font-size:12.5px;line-height:1.4}
.tt-gate b{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.tt-earn{margin-top:8px;font-size:12.5px;line-height:1.4}
.tt-earn b{margin-right:4px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--good)}
.tt-note{margin-top:7px;font-size:12px;font-style:italic;line-height:1.4;color:var(--muted)}
.tt-go{margin-top:10px;padding:0;border:none;background:transparent;color:var(--accent);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.tt-side{position:relative;margin-left:18px;border-style:dashed;border-color:var(--line-strong);padding:10px 12px 11px}
.tt-side::before{content:"";position:absolute;left:-20px;top:-10px;width:14px;height:26px;border-left:2px solid var(--line-strong);border-bottom:2px solid var(--line-strong);border-bottom-left-radius:8px}
.tt-side .tt-name{font-size:14.5px}
.tt-side .tt-cost{margin-top:8px}
.tt-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tt-skiph{margin:26px 0 8px;font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.tt-skip{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;max-width:760px}
.tt-skipn{min-width:0;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:11px;background:var(--surface-2)}
.tt-skipn .tt-name{display:block;font-size:14px;color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.tt-why{display:block;margin-top:3px;font-size:12.5px;line-height:1.4;color:var(--muted)}
/* a lesson track as a tech tree: tiers are columns, lines show what builds on what; it scrolls sideways inside its box on a phone */
.cv-mode{display:inline-flex;gap:2px;margin:14px 0 2px;padding:3px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-2)}
.cv-mb{padding:7px 14px;border:none;border-radius:7px;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.cv-mb.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(23,32,43,.14)}
.td-tree{margin-top:8px}
.lt-how{margin:10px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.lt-wrap{overflow-x:auto;margin-top:14px;padding:2px 2px 8px}
.lt{--g:32px;position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(150px,1fr));column-gap:var(--g);row-gap:10px;align-items:start;min-width:calc(var(--n) * 150px + (var(--n) - 1) * var(--g))}
.lt-edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.lt-edges path{fill:none;stroke:var(--line-strong);stroke-width:2}
.lt-edges path.done{stroke:var(--good)}
.lt-edges path.hot{stroke:var(--accent);stroke-width:2.5}
.lt-th{position:relative;z-index:1;display:flex;flex-direction:column;gap:3px;min-width:0;padding:42px 0 10px}
.lt-th::before{content:"";position:absolute;left:16px;right:calc(-1 * var(--g) - 16px);top:15px;height:2px;background:var(--line-strong)}
.lt-th.is-last::before{display:none}
.lt-th.is-done::before{background:var(--good)}
.lt-num{position:absolute;left:0;top:0;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-strong);background:var(--surface);color:var(--muted);font-family:var(--font-display);font-size:13px;font-weight:600}
.lt-th.is-done .lt-num{background:var(--good);border-color:var(--good);color:var(--surface)}
.lt-th.is-now .lt-num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lt-rn{font-family:var(--font-display);font-size:16px;font-weight:600;line-height:1.2}
.lt-rd{font-size:12px;line-height:1.35;color:var(--muted)}
.lt-cost{margin-top:3px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lt-cost b{color:var(--ink);font-family:var(--font-mono);font-weight:600}
.lt-bar{display:block;height:5px;margin-top:3px;border-radius:99px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.lt-bar i{display:block;height:100%;border-radius:99px;background:var(--good)}
.lt-ps{font-size:11px;color:var(--faint)}
.lt-n{position:relative;z-index:1;display:flex;flex-direction:column;gap:3px;min-width:0;padding:9px 10px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-family:inherit;text-align:left;cursor:pointer}
.lt-n:hover{border-color:var(--accent)}
.lt-top{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--faint)}
.lt-id{font-weight:600;color:var(--accent)}
.lt-min{margin-left:auto;font-variant-numeric:tabular-nums}
.lt-tag{padding:1px 6px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-family:var(--font-sans);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.lt-t{font-size:13.5px;font-weight:600;line-height:1.25}
.lt-c{font-size:12px;line-height:1.35;color:var(--muted)}
.lt-n.is-done{border-color:var(--good);background:var(--good-soft)}
.lt-n.is-done .lt-tag{background:var(--good);color:var(--surface)}
.lt-n.is-today .lt-tag{background:var(--accent-soft);color:var(--accent)}
.lt-n.is-next{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .br-id{display:block;font-family:var(--font-display);font-style:italic;font-size:13.5px;line-height:1.35;color:var(--muted)}
  .br-sub{font-size:12.5px}
  .gp-kids .branch-add{display:inline-block;width:auto;margin:16px 0 0}
  .gp-kids .branch-form{margin:16px 0 0;max-width:560px}
  /* a goal's page: the doing on the left, the plan and notes on the right */
  .gp .goal-card{padding:24px 28px 24px}
  .goal-name.gp-name{font-size:30px;max-width:32ch}
  .gp .goal-identity{font-size:17px}
  .gp-kids{margin-top:18px;padding:4px 20px 20px}
  .gp-kids .branches{padding-top:26px}
  .gp-cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:0 28px;align-items:start;margin-top:6px}
  .gp-cols.one{grid-template-columns:minmax(0,1fr)}
  .fire:has(.fire-b){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 36px;align-items:start;padding:16px 20px 16px}
  .fire-b .fire-h:first-child{margin-top:8px}
  .gp-cols.one .gp-main:empty{display:none}
  .gp-main,.gp-side{display:block;min-width:0}
  /* projects as a board; an open one takes the full row */
  .proj-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
  .proj-list>.goal-card{grid-column:1/-1}
  /* review: numbers on the left, the day's timeline on the right */
  .rv-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start;margin-top:16px}
  .rv-a,.rv-b{display:block;min-width:0}
  .rv-a>.breakdown{margin-bottom:16px}
  .plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:12px}
  /* the A → Z lists: two rungs side by side */
  .cv-rungs{display:grid;grid-template-columns:1fr 1fr;gap:22px 24px;margin-top:22px;align-items:start}
  .cv-rungs .cv-rung{margin-top:0}
  .cv-title{font-size:30px}
  /* articles: the list in two columns; an article at reading width with its buttons alongside */
  .rd-list{display:grid;grid-template-columns:1fr 1fr;border-bottom:0}
  .rd-row+.rd-row{border-top:0}
  .rd-row{border-bottom:1px solid var(--line)}
  .rd-row:nth-child(odd){border-right:1px solid var(--line)}
  .rd-row:last-child:nth-child(odd){grid-column:1/-1;border-right:0}
  .rd-none{grid-column:1/-1;border-bottom:1px solid var(--line)}
  .rd-art{display:grid;grid-template-columns:minmax(0,720px) 300px;justify-content:center;column-gap:48px;align-items:start}
  .rd-art>*{grid-column:1}
  .rd-art>.rd-foot{grid-column:2;grid-row:2/span 4;position:sticky;top:24px;margin-top:6px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
  .rd-title{font-size:32px}
}

gression":{"ladder":["Remember","Understand","Apply","Analyze","Evaluate","Create"],"reps":[]}}],"activeId":null,"touched":true}</script>

<script id="app-articles" type="application/json">{"items":[{"id":"Rl7S9lJp1Zw","channel":"David Carbutt","date":"2026-09-18","videoMin":12,"title":"Figure's robot cleaned homes it had never seen. Is it ready?","checked":"2026-10-09","charts":true,"md":"**The claim.** Humanoid robots may become the biggest product category ever, because one machine could do useful work for almost every business and family. Figure's new demo is a real step toward a robot you can put to work without rebuilding your home around it.\n\n## What Figure showed\n- One model, Helix 2.5, tidied a living room, made a bed and folded towels in a house it had never been in, with objects it had never seen.\n- Figure says it tested 30 Bay Area homes with no training data from any of them, and it \"succeeded in all of them\".\n- The training data comes from \"Index\": over 90,000 people a week record themselves doing everyday things, 35 minutes of footage every second. A model trained without it \"just didn't work\".\n- Figure claims a scaling law like the one for chatbots: the robot gets steadily better each time that data doubles. It is committing $3.5B to computing power for it.\n- The catch is on screen, not in the pitch: in Figure's own evaluation, **56% of tasks were finished in full.** \"Succeeded in every home\" means it did some of the work in every home.\n\n## Why it could matter\n- **Care:** an elderly parent keeps living at home while a robot changes the bedding and carries the shopping. The WHO expects one in six people to be 60 or older by 2030.\n- **Hospitals:** fetching equipment and restocking cupboards so staff spend more time on patients.\n- **Danger:** contaminated material, damaged buildings, rescues. Stairs, handles and tools are built for the human shape, which is the case for a humanoid.\n\n## The numbers he quotes\n| Forecast | Market size | Robots in use |\n|---|---|---|\n| Goldman Sachs (2024) | $38B by 2035 | – |\n| Morgan Stanley (2025) | ~$5T | ~1 billion |\n\nIn Morgan
